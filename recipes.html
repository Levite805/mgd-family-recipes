ut 1/2\" thick patties. Sauté about 3 minutes per side, or until golden brown on the edges and cooked through.\n\nHow to Make Lemon Aioli Sauce:\n1. In a small bowl, add mayo and stir to remove any lumps. Add 1 tsp lemon zest, 2 Tbsp lemon juice, and pressed garlic clove, and stir to combine.\n\n## Notes\n*You can use a food processor to chop the shrimp, but pulse carefully so it doesn't turn into ground shrimp meat. Use a trigger-release ice cream scoop for easy, clean portioning, and a non-stick pan to keep patties from falling apart. Buy wild-caught shrimp when possible; avoid farm-raised shrimp, especially imported. Nutrition per serving (shrimp cakes only): 258 kcal, 4g carbs, 21g protein, 16g fat. The lemon aioli (based on 8 servings) adds about 96 kcal, 10g fat per serving.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tqxwzhzjkhdcvmj7j7cyu4jdee", "title": "Shrimp, Andouille, and Okra Gumbo", "ainfo": "Shrimp, Andouille, and Okra Gumbo", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large Dutch oven, heat 2 tablespoons oil over medium-high heat. Add sausage and tasso; cook until browned, about 5 minutes. Remove and set aside.", "notes": "# Shrimp, Andouille, and Okra Gumbo\n\nSource: https://www.louisianacookin.com/shrimp-andouille-okra-gumbo/\n\nLouisiana Cookin'. Yields: 15 cups\n\n## Ingredients\n- 3/4 cup plus 2 tablespoons canola oil, divided\n- 1 pound andouille sausage, cut into 1/2-inch pieces\n- 1/4 pound tasso, chopped\n- 3/4 cup all-purpose flour\n- 2 cups chopped yellow onion\n- 1 1/2 cups chopped green bell pepper\n- 1 1/2 cups chopped red bell pepper\n- 1 cup chopped celery\n- 6 cloves garlic, minced\n- 2 tablespoons Cajun seasoning (they used Emeril's Cajun Essence)\n- 1 tablespoon concentrated tomato paste\n- 6 cups chicken stock\n- 1 (14.5-ounce) can diced tomatoes\n- 1 teaspoon chopped fresh thyme\n- 2 bay leaves\n- 1 pound fresh okra, cut into 1/2-inch pieces\n- 1 pound peeled and deveined large fresh shrimp\n- 1 tablespoon filé powder\n- Hot cooked basmati rice\n- Jalapeño Cornbread Sticks (recipe below)\n- Garnish: chopped green onion, hot sauce\n\n## Instructions\n1. In a large Dutch oven, heat 2 tablespoons oil over medium-high heat. Add sausage and tasso; cook until browned, about 5 minutes. Remove and set aside.\n2. Reduce heat to medium-low. Add the remaining 3/4 cup oil to the pan. Sprinkle flour into oil, whisking constantly until combined. Cook, stirring frequently, until the roux turns a mahogany color, 45 minutes to 1 hour.\n3. Add onion, bell peppers, and celery; cook over medium-high heat for 5 minutes. Add garlic; cook 1 minute. Add Cajun seasoning and tomato paste; cook 2 minutes, stirring constantly. Add stock, tomatoes, thyme, and bay leaves; bring to a boil. Return sausage and tasso to the pan; reduce heat and simmer 1 hour, stirring occasionally.\n4. Add okra; cook until tender, about 30 minutes. Add shrimp and filé; cook until shrimp are pink and firm, about 3 minutes.\n5. Serve with hot cooked rice and Jalapeño Cornbread Sticks. Garnish with green onion and hot sauce, if desired.\n\n---\n\n# Jalapeño Cornbread Sticks\n\nYields: 15\n\n## Ingredients\n- 1 tablespoon salted butter, melted\n- 1 cup coarse-ground yellow cornmeal\n- 1/2 cup self-rising flour\n- 1/4 cup chopped green onion\n- 2 tablespoons minced jalapeño\n- 1 tablespoon sugar\n- 1 1/4 teaspoons kosher salt, divided\n- 1/4 teaspoon cayenne pepper\n- 1 cup whole buttermilk\n- 1/3 cup canola oil\n- 1 large egg, beaten\n\n## Instructions\n1. Preheat oven to 425°F.\n2. Brush wells of 3 (5-stick) cast-iron cornstick pans with melted butter. Place pans in the oven for 5 minutes.\n3. In a large bowl, stir together cornmeal, flour, green onion, jalapeño, sugar, 1 teaspoon salt, and cayenne until well combined.\n4. In a small bowl, whisk together buttermilk, oil, and egg. Add to the cornmeal mixture, stirring just until combined.\n5. Remove pans from oven. Sprinkle remaining 1/4 teaspoon salt into the wells. Divide batter among the prepared wells.\n6. Bake until browned, about 19 minutes. Remove from pans immediately.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "rjse7idxvufnfxjfjru4voevxa", "title": "Simple Sourdough Focaccia", "ainfo": "Simple Sourdough Focaccia", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the starter, salt, and water in a large bowl. Stir with a spatula to combine — doesn't need to be uniform. Add the flour and mix again until fully incorporated.", "notes": "# Simple Sourdough Focaccia: A Beginner's Guide\n\nSource: https://alexandracooks.com/2019/03/22/simple-sourdough-focaccia-a-beginners-guide/\n\nBy Alexandra Stafford, Alexandra's Kitchen. Total time: 24 hours 25 minutes | Yield: 1 loaf | Prep: 24 hours | Cook: 25 min | Cuisine: Italian\n\n## Ingredients\n- 50 g - 100 g (1/4 to 1/2 cup) active sourdough starter\n- 10 g (about 2.5 teaspoons) kosher salt\n- 430-440 g water (1.75 cups - 1.75 cups + 2 tablespoons), room temperature\n- 512 g (about 4 cups) bread flour\n- 3 tablespoons extra-virgin olive oil, divided, plus more for drizzling\n- Nice, flaky sea salt, such as Maldon\n\n## Instructions\n1. Place the starter, salt, and water in a large bowl. Stir with a spatula to combine — doesn't need to be uniform. Add the flour and mix again until fully incorporated.\n2. If time permits, perform one \"fold\" 30 minutes after mixing: reach into the bowl, pull the dough up and into the center, turning the bowl in quarter turns, 8 to 10 times.\n3. Drizzle with a splash of olive oil and rub to coat. Cover with a tea towel and let rise at room temperature (70°F/21°C) for 4 to 18 hours, until doubled (varies by season, starter strength, and kitchen temperature — summer ~6 hours, winter up to 18 hours). Do not use an oven with the light on to proof; rely on visual doubling, not time. A straight-sided vessel makes this easier to judge.\n4. When doubled, place 2 tablespoons olive oil into a 9x13-inch pan.\n5. Drizzle the dough with 1 tablespoon olive oil. Gently deflate and release it from the bowl sides. Scoop into the center of the oiled pan. Fold dough envelope-style top to bottom and side to side into a rough rectangle, then turn seam-side down.\n6. Rub the top with oil. Let rise uncovered for 4 to 6 hours, until puffy and nearly doubled.\n7. Heat oven to 425°F. Rub hands lightly with oil and use all ten fingers to press and dimple the dough, stretching it to nearly fit the pan. Sprinkle generously with sea salt. Bake about 25 minutes, until golden all around. Cool on a rack at least 20 minutes before slicing.\n\n## Notes\nNeeds an active sourdough starter (buy one or make from scratch, a 1-2 week process). Chlorine in tap water can affect sourdough — let water sit out 24 hours to dechlorinate, though the author has used tap water directly with no noticeable difference. In humid climates, reduce water to about 430g; if not using bread flour, reduce water slightly. If the dough over-proofs (even triples), it can still turn out well. King Arthur bread flour (12.7% protein) recommended; all-purpose (11.7%) also works but is less reliable in humid climates.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "5rlpgtseut7syxtsqkcrbdffpy", "title": "Slow Cooked Lamb Shanks in Red Wine Sauce", "ainfo": "Slow Cooked Lamb Shanks in Red Wine Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 180°C/350°F (all oven types — fan and standard).", "notes": "# Slow Cooked Lamb Shanks in Red Wine Sauce\n\nSource: https://www.recipetineats.com/slow-cooked-lamb-shanks-in-red-wine-sauce/\n\nBy Nagi Maehashi, RecipeTin Eats. Prep: 20 min | Cook: 3 hr 30 min. Servings: 4. Cuisine: Western.\n\n## Ingredients\n- 4 lamb shanks, around 13 oz / 400g each (see note 1)\n- 1 tsp EACH cooking/kosher salt and pepper\n- 2-3 tbsp olive oil, separated\n- 1 onion, finely diced (brown, yellow or white)\n- 3 garlic cloves, minced\n- 1 cup carrot, peeled, finely diced (see note 2)\n- 1 cup celery, finely diced (see note 2)\n- 2 1/2 cups red wine, full bodied (good value wine, not expensive — see note 3)\n- 800 g / 28 oz can crushed tomatoes\n- 2 tbsp tomato paste\n- 2 cups chicken stock, low sodium (or water)\n- 5 sprigs of thyme (preferably tied together), or 2 tsp dried thyme\n- 2 dried bay leaves (or 4 fresh)\n\nTo Serve:\n- Mashed potato, polenta or pureed cauliflower\n- Fresh thyme leaves, optional garnish\n\n## Instructions\n1. Preheat the oven to 180°C/350°F (all oven types — fan and standard).\n2. Season shanks – Pat the lamb shanks dry and sprinkle with salt and pepper.\n3. Brown – Heat 2 tablespoons of olive oil in a large heavy-based pot over high heat. Sear the lamb shanks in 2 batches until brown all over, about 5 minutes. Remove lamb onto a plate and drain excess fat (if any) from the pot.\n4. Sauté aromatics – Turn the heat down to medium-low. Heat remaining 1 tablespoon of olive oil in the same pot. Add the onion and garlic, cook for 2 minutes. Add carrot and celery. Cook for 5 minutes until onion is translucent and sweet.\n5. Braising liquid – Add the red wine, chicken stock, crushed tomato, tomato paste, thyme and bay leaves. Stir to combine.\n6. Add shanks – Place the lamb shanks into the pot, squeezing them in to fit so they are mostly submerged (see note 1).\n7. Oven, 2 hours covered – Turn stove up, bring liquid to a simmer. Cover, then transfer to the oven for 2 hours (see notes for other cook methods).\n8. Uncovered 30 minutes – Remove lid, then return to the oven for another 30 minutes (2 1/2 hours total). Check to ensure lamb meat is ultra tender — if not, cover and keep cooking. Ideal is tender meat but still just holding onto bone.\n9. Remove lamb onto a plate and keep warm. Pick out and discard bay leaves and thyme.\n10. Sauce – Strain the sauce into a bowl, pressing to extract all sauce out of the veggies (see note 5 for repurposing the veggies). Pour strained sauce back into pot. If needed, bring to a simmer over medium heat and reduce slightly to a syrupy consistency — rarely needed. Taste then add salt and pepper to taste.\n11. Serve the lamb shanks on mashed potato or cauliflower puree with plenty of sauce. Garnish with thyme leaves if desired.\n\n## Notes\nNote 1 (lamb shanks): Sizes vary considerably — make sure you get ones that will fit in your cooking vessel. 4 x 400g/13oz shanks fit snugly in a 26cm/11\" dutch oven. They don't need to be fully submerged, just the meaty end mostly submerged. Use a baking dish covered with a double layer of foil if you lack a large enough pot. Cook time: 350-400g shanks should reach fall-apart tender but still holding onto bone in about 2.5 hrs at 180°C/350°F; can take up to 3 hrs. Shanks reheat well — cooking the day before and reheating improves flavor overnight.\n\nNote 2: Onion, carrot and celery form the flavor base (\"holy trinity\") for the sauce; carrot and celery can be omitted but add extra depth.\n\nNote 3 (wine): Use a good value full-bodied red like cabernet sauvignon, merlot, or shiraz — no need for expensive wine. Pinot is too light. About 99% of the alcohol evaporates during cooking; the sauce does not taste winey. Non-alcoholic substitute: 1 1/2 cups low-sodium beef broth, 1 cup water, plus 1 tbsp Worcestershire sauce.\n\nNote 5 (sauce options): Alternatively blitz the sauce with a stick blender for a thicker sauce (great tossed through pasta); straining gives a glossier, more restaurant-style result. Leftover strained veggies can be blitzed with garlic, onion, canned tomato and water to make a separate pasta/lasagna sauce. If the sauce tastes sour, it may be the canned tomato quality — add a touch of honey or sugar and simmer a few minutes; also make sure the carrot/celery sauté wasn't rushed.\n\nNote 6 (other cook methods): Slow cooker — follow to step 7, then simmer sauce, add shanks and sauce to slow cooker, cook on low 8 hours, then strain/reduce sauce on stove. Pressure cooker — same as slow cooker but cook 40 minutes on high, then release pressure per manufacturer directions. Stove — cook about 2 hours on low, checking at 1 hour then every 30 minutes to ensure enough liquid, turning shanks twice; won't get the browned crust but same flavor.\n\nNote 7: This is the original (2015, improved 2018) recipe; a more elegant \"restaurant\" version with an overnight marinade appears in the author's cookbook.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tk346twpou4na5wwtqkngpirxm", "title": "Slow Cooker Baby Back Ribs", "ainfo": "Slow Cooker Baby Back Ribs", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Season ribs with salt and pepper.", "notes": "# Slow Cooker Baby Back Ribs\n\nSource: https://www.allrecipes.com/recipe/228498/slow-cooker-baby-back-ribs/\n\nSubmitted by norah, Allrecipes. Prep: 10 min | Cook: 4 hrs 15 min | Total: 4 hrs 25 min. Servings: 6.\n\n## Ingredients\n- 3 pounds baby back ribs, trimmed\n- Salt and ground black pepper, to taste\n- 1/2 cup water\n- 1/2 onion, sliced\n- 1 clove garlic, minced\n- 1 (18 ounce) bottle barbeque sauce\n\n## Instructions\n1. Season ribs with salt and pepper.\n2. Pour 1/2 cup water into the slow cooker, then add ribs. Scatter onion and garlic over top. Cover and cook on Low for 8 hours or High for 4 hours.\n3. When the ribs are almost finished, preheat the oven to 375°F (190°C).\n4. Transfer ribs from the slow cooker to a baking sheet; discard onion and garlic. Coat ribs with barbeque sauce.\n5. Bake ribs in the preheated oven until sauce caramelizes and sticks to the meat, 10 to 15 minutes.\n\n## Notes\nStore leftovers in an airtight container or wrapped tightly in foil/storage wrap; keeps up to 4 days in the fridge. Reheat in the microwave or on the stove. Not recommended for freezing after cooking — cook only as much as you'll eat within a few days. Community tips: cutting the rack into 4 pieces before cooking works well; can substitute the water with beer, root beer, or cranberry wine for extra flavor; 8 hours on Low tends to give the most fall-off-the-bone result.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "scskfqzbh3z3htrikiq6wnxjfq", "title": "Slow Cooker Chile Verde", "ainfo": "Slow Cooker Chile Verde", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat oil in a heavy pan.", "notes": "# Slow Cooker Chile Verde\n\nSource: https://www.yourhomebasedmom.com/slow-cooker-chili-verde/\n\nBy Leigh Anne Wilkes, Your Homebased Mom. Prep: 20 min | Cook: 4 hrs | Total: 4 hrs 20 min. Servings: 8. Course: Main Course/Main Dish. Cuisine: Mexican.\n\n## Ingredients\n- 4 lbs boneless pork shoulder or carnitas, cubed\n- 2 tablespoons olive oil\n- 1/2 cup onion, chopped\n- 3 teaspoons garlic, minced\n- 14 oz green enchilada sauce\n- 16 oz salsa verde\n- 4 oz diced green chilies\n- 28 oz canned tomatillos, diced\n- 1/2 tablespoon cumin\n- 1 teaspoon salt (more to taste if needed)\n- 2 tablespoons cornstarch\n- 1 cup juice from the slow cooker\n\n## Instructions\n1. Heat oil in a heavy pan.\n2. Add onion and garlic and cook until onions begin to soften.\n3. Add the cubed pork and brown on all sides (may need to do in batches).\n4. Put the pork and onion mixture into the slow cooker.\n5. Add the salsa verde, enchilada sauce, chilies, and tomatillos.\n6. Add cumin and salt. Stir to combine.\n7. Cover and cook on high for 3 hours or low for 4 hours.\n8. About an hour before done, remove 1 cup of liquid from the slow cooker and whisk together with the cornstarch. Return the mixture to the slow cooker, stir, and let thicken for the remaining hour.\n9. The meat should be tender and pull apart easily when done.\n\n## Notes\nInstant Pot version: sauté the pork, onions, and garlic in the Instant Pot for 2-3 minutes, mix the sauce ingredients and pour over the pork, then cook on manual/high pressure for 25 minutes with a natural release. Serve over rice or rolled into burritos/enchiladas, with flour or corn tortillas, cilantro-lime rice, Monterey Jack cheese, sour cream, and cilantro. Makes a large batch, good for leftovers. Nutrition (per serving): 462 kcal, 17g carbs, 46g protein, 22g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "c5hi23uj6dxs5ztktmjwqamvoa", "title": "Slow Cooker Creamed Corn", "ainfo": "Slow Cooker Creamed Corn", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place corn into a 6-qt slow cooker. Stir in milk, sugar, and pepper until well combined.", "notes": "# Slow Cooker Creamed Corn\n\nSource: https://damndelicious.net/2013/11/24/slow-cooker-creamed-corn/\n\nBy Chungah Rhee, Damn Delicious. Yield: 6 servings. Prep: 10 min | Cook: 3 hrs 15 min | Total: 3 hrs 25 min.\n\n## Ingredients\n- 3 (15.25-ounce) cans whole kernel corn, drained\n- 1 cup whole milk\n- 1 tablespoon sugar\n- 1/4 teaspoon black pepper\n- 8 ounces cream cheese, cubed\n- 1/2 cup unsalted butter, cut into thin slices\n\n## Instructions\n1. Place corn into a 6-qt slow cooker. Stir in milk, sugar, and pepper until well combined.\n2. Without stirring, top with butter and cream cheese. Cover and cook on high heat for 2-3 hours.\n3. Uncover and stir until butter and cream cheese are well combined. Cover and cook on high heat for an additional 15 minutes.\n4. Serve immediately.\n\n## Notes\nUse canned corn (or thawed frozen corn in a pinch); whole milk is key (do not substitute 2% or nonfat); use \"brick\" cream cheese, not whipped. Variations: swap in jalapeno cream cheese, add diced green chiles for heat, or garnish with chives/green onions/thyme. Make-ahead: store cooled leftovers airtight up to 3 days; not recommended for freezing, as it separates.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vlb3awfmp2uxq5xmm5qqoe5qzu", "title": "Slow Roasted Crispy Chicken Thighs and Potatoes", "ainfo": "Slow Roasted Crispy Chicken Thighs and Potatoes", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat the oven to 325°F (162°C), or 300°F (150°C) convection with a fan.", "notes": "# Slow Roasted Crispy Chicken Thighs and Potatoes\n\nSource: https://thematbakh.com/crispy-roasted-chicken-thighs/\n\nBy Lilian Guidry, The Matbakh. Course: Mains | Cuisine: Mediterranean | Prep: 15 min | Cook: 2 hr 30 min | Total: 2 hr 45 min\n\n## Ingredients\n- 4 lbs chicken thighs, bone-in, skin-on\n- 4 potatoes, golden, medium sized\n- 1 tablespoon olive oil\n- 1 tablespoon melted butter\n- 6 garlic cloves, mashed or pressed\n- 1 sprig fresh rosemary, chopped (substitute dried rosemary)\n- 1 teaspoon fresh thyme, chopped (substitute dried thyme)\n- 1 teaspoon dried oregano\n- 1 large lemon\n- Salt and pepper, to taste\n\n## Instructions\n1. Heat the oven to 325°F (162°C), or 300°F (150°C) convection with a fan.\n2. Chop fresh rosemary into small pieces. Juice the lemon. In a large bowl, combine melted butter, olive oil, lemon juice, chopped rosemary, and crushed garlic. Add the chicken thighs and mix well to marinate.\n3. Peel and slice the potatoes into thin circles.\n4. Line a baking pan with parchment paper. Layer the sliced potatoes in 2 layers and season with salt and pepper.\n5. Place the marinated chicken thighs directly on the potatoes, skin facing up.\n6. Cover with foil and bake 1 hour 30 minutes. Remove the foil and continue baking uncovered for another hour at 325°F. Total cooking time is about 2 hours 30 minutes.\n\n## Notes\nUse bone-in, skin-on chicken thighs for the best crispy, flavor-infused skin. Rub some marinade under the skin for extra flavor. Cooking time may vary by oven — the chicken is done when the skin is crispy and the potatoes pierce easily with a fork. Carrots (baby carrots, halved) can be used alongside or instead of potatoes. Coconut oil or ghee can replace some of the olive oil/butter. Fresh oregano and thyme can substitute for rosemary, or use a mix — keep fresh herbs to 2 tablespoons total or dried herbs to 1 tablespoon to avoid overpowering the dish.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "zuvjnwl4qb3gyva5e2ajy5o2de", "title": "Slow Roasted Lamb Tacos", "ainfo": "Slow Roasted Lamb Tacos", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 325°F. Let the lamb shoulder sit at room temperature for at least 30 minutes before roasting.", "notes": "# Slow Roasted Lamb Tacos\n\nSource: https://whatshouldimakefor.com/slow-roasted-lamb-tacos/\n\nBy Cathy Roma, What Should I Make For... Course: Main Dish. Cuisine: American, Mexican. Prep: 10 min | Cook: 4 hrs 30 min. Servings: 6.\n\n## Ingredients\nSlow Roasted Lamb Shoulder:\n- 5 lb whole lamb shoulder, bone-in\n- 1 Tbsp canola or vegetable oil\n- 2 tsp kosher salt\n- 1/2 tsp ground black pepper\n- 1 tsp ground coriander\n- 1/2 tsp ground cumin\n- 1 tsp garlic powder\n- 1 medium onion, peeled and rough chopped\n- 5 garlic cloves, peeled and smashed\n- 1/2 cup water\n\nSlow Roasted Lamb Tacos:\n- 12 soft flour tortillas, 6 inch\n- 2 cups pickled pears\n- 1 apple, cored and sliced into thin matchsticks\n- 8 oz feta cheese, crumbled\n- 3 green onions, thinly sliced\n\n## Instructions\nSlow Roasted Lamb Shoulder:\n1. Preheat the oven to 325°F. Let the lamb shoulder sit at room temperature for at least 30 minutes before roasting.\n2. Combine the salt and seasonings in a small bowl. Rub the seasoning mix all over the lamb, rubbing it into the meat.\n3. Heat 1 Tbsp oil until hot but not smoking in a large oven-safe pan or roasting pan (an enamel coated dutch oven works well). Place the lamb, fat-side down into the pan and sear, about 3 minutes.\n4. Turn the lamb over, scattering the onion pieces and garlic cloves underneath. Pour 1/2 cup water into the pan and cover tightly (use a lid or tightly wrapped foil). Roast, covered, for about 3 hours.\n5. Remove the lid and allow the lamb to roast for one more hour, uncovered. The lamb should be well-browned and fall off the bone tender at the end of the hour. Remove from the oven and let stand a few minutes to cool slightly. Turn the oven temperature up to 400°F.\n6. Remove the lamb shoulder to a large bowl or platter. Drain all the fat off the drippings — you should have about 1/2 cup of drippings left in the pan with the onion and garlic.\n7. Shred the lamb shoulder, discarding the fat and bones. Add the shredded lamb to the pan with the drippings, onions, and garlic. Season with salt and turn to coat. Return to the oven and cook, stirring once or twice, until the edges are crispy but the lamb is still tender.\n\nSlow Roasted Lamb Tacos:\n8. Char the soft flour tortillas over an open flame if desired.\n9. Assemble the tacos with the slow roasted lamb, topped with pickled pears, apple matchsticks, feta, and green onion.\n\n## Notes\nDon't be intimidated by a whole bone-in lamb shoulder — let it roast, covered and undisturbed, until the meat falls off the bone. Don't skip draining the fat from the drippings (a fat separator works well); they add moisture and flavor but the meat will be greasy if you don't skim the fat. Caramelizing the shredded lamb isn't required but adds texture and chew.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "7yxfvakpoa3krttteyrquriqqy", "title": "Slow-Cooker Collard Greens And Ham Hocks", "ainfo": "Slow-Cooker Collard Greens And Ham Hocks", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Remove the stems from the collard greens, then stack the leaves on top of each other and roughly chop.", "notes": "# Slow-Cooker Collard Greens And Ham Hocks\n\nSource: https://tasty.co/recipe/slow-cooker-collard-greens-and-ham-hocks\n\nBy Pierce Abernathy, Tasty. Prep: 15 min | Cook: 8 hrs | Total: 8 hrs 15 min. Servings: 12. Cuisine: North American, Southern. Inspired by thekitchn.com.\n\n## Ingredients\n- 3 1/2 lb collard greens, washed\n- 1 large yellow onion\n- 2 lb ham hocks\n- 1 tablespoon brown sugar\n- 1/2 teaspoon black pepper\n- 2 teaspoons salt\n- 3 tablespoons apple cider vinegar\n- 32 oz chicken broth\n\n## Instructions\n1. Remove the stems from the collard greens, then stack the leaves on top of each other and roughly chop.\n2. Add the collard greens to a slow cooker with the onion, ham hocks, brown sugar, pepper, salt, apple cider vinegar, and chicken broth.\n3. Cover and cook on low for 8 hours or high for 4 hours, until the greens are tender.\n4. Remove the ham hocks from the slow cooker. Trim and discard any fat and bones. Roughly chop the meat and return it to the greens. Toss to incorporate.\n5. Serve warm.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "r4bk7n4bqf5kc3u3mus2hin3mu", "title": "Smoked Creamed Corn", "ainfo": "Smoked Creamed Corn", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat your smoker to 350°F as per the manufacturer's instructions.", "notes": "# Smoked Creamed Corn\n\nSource: https://cookwhatyoulove.com/smoked-creamed-corn-recipe/\n\nBy Chef Jenn Allen. Prep: 10 min | Cook: 43 min | Total: 53 min. Course: Side Dish. Cuisine: American. Servings: 6. Calories: 367 kcal.\n\n## Ingredients\n- 1/3 cup butter, salted or unsalted\n- 1/3 cup all-purpose flour\n- 1 cup heavy whipping cream\n- 1 cup milk\n- 5 cups corn kernels, fresh or frozen\n- 1/2 teaspoon salt\n- 1/2 teaspoon white pepper\n\n## Instructions\n1. Preheat your smoker to 350°F as per the manufacturer's instructions.\n2. Melt the butter in a medium-size heavy-bottomed pot over low heat. When melted, add the flour and whisk over low heat for 2 minutes, cooking out the flour.\n3. Meanwhile, heat the milk and cream in the microwave or in a pot. It should be hot but not boiling.\n4. Add the hot milk/cream mixture to the flour and butter mixture in a steady stream, whisking while adding.\n5. When all the milk/cream is in, turn the heat to medium-low and cook while whisking for 3-4 minutes or until the mixture is thickened and has started to bubble.\n6. Simmer the bechamel sauce for 2-3 minutes while whisking.\n7. Add the corn kernels, salt, and pepper. Mix well, adjust the seasoning if needed, and transfer to a smoker-safe dish (a cast-iron skillet works well).\n8. Smoke for 45 minutes or until the mixture is starting to bubble and is heated through.\n\n## Notes\nThe sauce needs to be really thick, since the corn releases liquid as it cooks and thins it out. A cast-iron skillet gives lots of surface area to pick up smoke. Can be made ahead up to the point of smoking and refrigerated until ready. Works at any smoker temperature — lower temps just take longer to get hot and bubbly, making it a great add-on when the smoker is already running for other food. Store leftovers in an airtight container for 3-4 days; does not freeze well. Nutrition per 1/2 cup serving: 367 kcal, 28g carbs, 6g protein, 28g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "xfrrcvegmbcwz5n2mfjcommaxq", "title": "Smoked Hamburgers", "ainfo": "Smoked Hamburgers", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat your smoker to 225°F using your favorite hardwood.", "notes": "# Smoked Hamburgers\n\nSource: https://heygrillhey.com/smoked-hamburgers/\n\nBy Susie Bulloch, Hey Grill Hey. Prep: 15 min | Cook: 1 hr 5 min | Total: 1 hr 20 min. Servings: 4.\n\n## Ingredients\n- 1 1/2 pounds ground beef chuck, 80/20 preferred\n- 2 Tablespoons Hey Grill Hey Beef Rub, or equal parts salt, pepper, and garlic powder\n- 4 slices sharp cheddar cheese, optional\n- 4 hamburger buns\n\n## Instructions\n1. Preheat your smoker to 225°F using your favorite hardwood.\n2. Shape your ground beef into 4 equal-sized patties, about 1/2 inch larger in diameter than your burger buns.\n3. Season the hamburger patties on both sides with Beef Rub or equal parts salt, pepper, and garlic powder.\n4. Place the seasoned patties on the grill and smoke until the internal temperature reaches 135°F. This takes around 1 hour.\n5. Increase the heat in your smoker to at least 400°F. Sear the burger patties for about 2-3 minutes on both sides. Add cheese after the first flip, if desired. Sear until the meat reaches a final temperature of 165°F.\n6. Remove the burger patties from the grill and place the buns on the grill grates to toast. Assemble your smoked burgers on the toasted buns with any desired toppings and serve immediately.\n\n## Notes\nUse ground beef with at least 15% fat (80/20 preferred) so the meat doesn't dry out during smoking. Use a stronger wood like hickory, oak, or mesquite since the burgers are only on the smoker briefly and need the smoke to make an impact. Cook to temperature, not color or time — smoking causes a chemical reaction (smoke ring) that can leave the meat pink even when fully cooked, so trust an instant-read thermometer rather than visual cues. Nutrition per serving: 664 kcal, 22g carbs, 40g protein, 45g fat.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "jk5jwtfeyfa72tn6iycsjzsada", "title": "Smoked Jerk Wings with Caribbean Rum Sauce", "ainfo": "Smoked Jerk Wings with Caribbean Rum Sauce", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "To make the jerk seasoning, combine the first 11 ingredients (brown sugar through cumin). Whisk together and break up any clumps of brown sugar.", "notes": "# Smoked Jerk Wings with Caribbean Rum Sauce\n\nSource: https://cookswellwithothers.com/2018/08/12/smoked-jerk-wings-with-caribbean-rum-sauce/\n\nBy Cheri Renee. Course: Appetizer, Main Course. Cuisine: American. Prep: 10 min | Cook: 3 hours. Servings: 4 pounds. Calories: 490 kcal.\n\n## Ingredients\nCaribbean Jerk Seasoning and Chicken Wings\n- 1 cup brown sugar\n- 4 Tbsps ground allspice\n- 2 Tbsps kosher salt\n- 1/2 Tbsp pepper\n- 1/2 Tbsp ground cinnamon\n- 1/2 Tbsp crushed red pepper\n- 1/2 Tbsp ground cloves\n- 1/2 Tbsp turmeric\n- 1/2 Tbsp paprika\n- 1/2 Tbsp dried thyme (leaves or ground)\n- 1/2 Tbsp cumin\n- 4 pounds split chicken wings\n- 1 Tbsp soy sauce\n\nCaribbean Rum Sauce\n- 1 cup brown sugar\n- 3/4 cup dark rum or Captain Morgan's Rum\n- 3/4 cup ketchup\n- 1/4 cup soy sauce\n- 2 Tbsps lime juice\n- 2 Tbsps Caribbean Jerk Seasoning (recipe above)\n- 3 cloves garlic, minced\n- 1 Tbsp ginger paste (or fresh grated ginger)\n\n## Instructions\nCaribbean Jerk Seasoning and Chicken Wings\n1. To make the jerk seasoning, combine the first 11 ingredients (brown sugar through cumin). Whisk together and break up any clumps of brown sugar.\n2. Pat the wings dry and place in a bowl. Add 1 Tbsp soy sauce and mix to coat evenly. Add 5 Tbsps of the jerk seasoning, toss to coat evenly. Place in the fridge for at least 1 hour.\n3. Place the remaining jerk seasoning in an airtight container and save for later.\n4. Place the wings in a smoker set to 250 degrees for 2 and a half hours, or until a thermometer reads 170 degrees. Brush with the Caribbean Rum Sauce several times during the last 30 minutes of smoking.\n\nCaribbean Rum Sauce\n1. Combine all ingredients in a saucepan over medium-high heat. Whisk together until evenly combined. Once it comes to a boil, turn heat to low and simmer for 5-7 minutes, whisking occasionally.\n\n## Notes\nMade with a Traeger pellet grill set to 250 degrees; total cook time about 2.5 hours, ensuring wings reach 170 degrees internally. Extra jerk seasoning keeps well in an airtight container for future use.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qt7xo6scchb6wroq7ums5pndcm", "title": "Smoked Pork Loin (Traeger)", "ainfo": "Smoked Pork Loin (Traeger)", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Season pork loin with Traeger Rub.", "notes": "# Smoked Pork Loin\n\nSource: https://www.traeger.com/learn/how-to-smoke-pork-loin\n\nBy Traeger Kitchen. Prep: 5 min | Cook: 3 hr 30 min. Serves: 6. Pellets: Cherry.\n\nNote: The bookmarked page is primarily a how-to-smoke-pork-loin guide (cut differences, rubs/marinades/brines, wood pellet choices, tips on flipping/fat side/timing/serving suggestions), but it contains this embedded, complete recipe card, captured below along with the guide's general technique notes.\n\n## Ingredients\n- 1 pork loin\n- Traeger Rub, as needed\n\n## Instructions\n1. Season pork loin with Traeger Rub.\n2. When ready to cook, set grill temperature to 180°F and preheat, lid closed, for 15 minutes.\n3. Place pork loin on the grill grates, on a diagonal, and smoke for 3 to 4 hours.\n4. Increase grill temperature to 350°F and cook for 20 to 30 minutes.\n5. Remove from grill, cut into 1-1/2\" steaks. Serve and enjoy!\n\n## Notes\nPork loin (from the back of the pig) is leaner and larger than pork tenderloin (from along the backbone) — don't confuse the two. General smoking guidance from the article: set the smoker to 225-250°F for most pork loin cooks, roughly 30 minutes per pound, targeting an internal temperature of 145°F; don't let it exceed that. Smoke fat side up so rendering fat bastes the meat and prevents drying. No need to flip on an even-heat smoker like a Traeger. Best mild wood pellets: apple, cherry, hickory, or pecan (mix in bolder options like mesquite rather than using alone). If marinating, do so 4-12 hours ahead; if brining, 12-24 hours ahead; for a dry rub, just coat with olive oil and rub before cooking. To prevent dryness, consider increasing heat partway through the cook to finish faster. Rest the meat after smoking — loosely tent with foil to keep it warm, or leave uncovered on a board for crispier bark. Pairs well with roasted carrot salad, balsamic brussels sprouts with bacon, mashed potatoes, or garlic bread.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "rsce2kfv4bj56xriryldjbl4nq", "title": "Smoked Rack of Pork", "ainfo": "Smoked Rack of Pork", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Clean up the rack. Trim off any excess fat or small bits. If the rack has a fat cap, slice a crosshatch pattern into it before adding the seasoning — this helps the seasoning make better contact and prevents the fat from splitting while cooking.", "notes": "# Smoked Rack of Pork\n\nSource: https://www.chilesandsmoke.com/smoked-rack-of-pork/\n\nBy Brad Prose. Prep: 10 min | Cook: 4-6 hrs | Total: 4-6 hrs. Yield: Serves 5-10. Category: Pork. Method: Smoking. Cuisine: Dinner, Holiday Meal. Calories: 335 per slice.\n\n## Ingredients\n- 1 pork roast, about 3-5 pounds\n- 2 tablespoons Sedona Sand Seasoning (or your favorite BBQ seasoning)\n- 2 tablespoons mustard or hot sauce, used as a binder (optional)\n- apple cider vinegar, for spritzing\n\n## Instructions\n1. Clean up the rack. Trim off any excess fat or small bits. If the rack has a fat cap, slice a crosshatch pattern into it before adding the seasoning — this helps the seasoning make better contact and prevents the fat from splitting while cooking.\n2. Season the pork generously. This is a large roast, so use extra seasoning if needed. Allow the pork to rest in the fridge, uncovered, for at least 2 hours if possible before cooking. Dry brining overnight provides the best results.\n3. Prepare the smoker for indirect cooking at 250°F. This temperature keeps the pork moist while providing plenty of wood-fired flavor.\n4. Place the rack of pork in the smoker. Spritz with apple cider vinegar after the first hour, and every 45 minutes after that. Cook for a couple of hours until it reaches about 125°F internal temperature.\n5. Increase the heat for searing. Remove the pork roast briefly while the grill heats up (to 400-450°F). Place it back in the smoker and sear on all sides. Pull it at 140°F internal, which will continue rising as it rests.\n6. Rest the meat for at least 10-15 minutes before slicing and serving.\n\n## Notes\nAlso called Frenching: many roasts come with the bones already cleaned of excess meat/cartilage, but a quick clean-up gives a nicer presentation and built-in handles for the chops. Fruit woods (applewood, cherry) are classic for pork's mild flavor; pecan and maple add sweetness, hickory gives a bolder smoke, and oak sits in the middle. Dry brine for at least 2 hours, up to 24 hours for larger roasts, for better seasoning adhesion, deeper flavor, and juicier meat. Works on a gas grill too — preheat to 250°F using only some burners, and use a foil pack of wood chips over the direct heat for smoke. If glazing, do it near the end of cooking to avoid burning the sugars. Cook to temperature, not time: a 4-5 bone roast takes over 2 hours, an 8-10 bone roast at least 4 hours; always pull at 140°F. Allow at least one bone per person when buying. A crown roast of pork is the same cut, just tied into a standing crown shape. Nutrition per slice: 335 kcal, 63.4g protein, 6.6g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "x7fk6uixeklqq3dvgfejsmoaxu", "title": "Smoked Rack of Pork (Jeff Phillips)", "ainfo": "Smoked Rack of Pork (Jeff Phillips)", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the rack of pork down into a half-size foil or stainless steel pan for ease of cleanup.", "notes": "# Smoked Rack of Pork\n\nSource: https://www.smoking-meat.com/smoked-rack-of-pork\n\nBy Jeff Phillips. Prep: 20 min | Brine: 8-12 hrs | Cook: 4 hrs | Total: 4 hrs 20 min (active). Smoker Temp: 225°F (107°C). Meat Finish Temp: 140°F (60°C). Recommended Wood: Hickory, cherry mix.\n\n## Ingredients\n- 1 rack of pork\n- 2 heaping TBS minced garlic\n- 1/4 cup Jeff's Texas style rub\n- 3/4 cup Jeff's original rub\n- 1 TBS coarse kosher salt\n- 1 stick of butter\n\n## Instructions\n1. Place the rack of pork down into a half-size foil or stainless steel pan for ease of cleanup.\n2. Add 1 TBS of minced garlic onto the top of the roast and spread it evenly with your hands.\n3. Apply about 2 TBS of Jeff's Texas style rub and 2 TBS of Jeff's original rub evenly over the top and sides of the rack of pork.\n4. Sprinkle 1/2 TBS of coarse kosher salt evenly onto the top of the meat.\n5. Let it sit for 20 minutes before continuing.\n6. Flip the meat over carefully and repeat the garlic, rubs, and salt on the other side.\n7. Place the pan with the rack of pork into the fridge overnight or for 8-12 hours to allow it to dry brine.\n8. Prepare the smoker for cooking at 225°F (107°C) using indirect heat. Fill the water pan if your smoker uses one. Use a mix of hickory and cherry (or your preferred smoking wood).\n9. Once the smoker is ready, place the pan with the meat into the smoker, or lay the meat directly on the smoker grates if preferred.\n10. Let the rack of pork cook until it reaches 140°F (60°C) as measured by an instant-read or leave-in thermometer.\n11. Baste the meat a couple of times during the cook with 1 stick of melted butter mixed with 2 TBS of Jeff's original rub.\n12. Once the meat reaches 140°F (60°C), remove it from the smoker and let it sit in the kitchen with foil tented over the top for 15-20 minutes. The temperature will continue rising to a safe 145°F (63°C) and the juices will settle.\n13. Slice the meat between the bones and serve immediately, spooning any au jus from the pan over each slice.\n\n## Notes\nA rack of pork is essentially a pork loin with the back ribs still attached (often frenched for a fancier look). Dry brining rule of thumb: about 1/2 teaspoon salt per pound of meat, adjustable to taste. If in a hurry, lightly spray the rub/salt with water to speed up the paste-forming step from 20 minutes down to about 5. Can safely bump the smoker to 250°F (121°C) to finish in about 3 hours instead of 4.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "y7u6gh2tho2efspgwmiwgeandq", "title": "Sourdough Baguettes", "ainfo": "Sourdough Baguettes", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine the sourdough starter, warm water, and 5 oz of the flour. Mix with the paddle on low speed until it forms a wet dough. Cover and set aside for 30-60 minutes.", "notes": "# Sourdough Baguettes\n\nSource: https://www.baking-sense.com/2020/10/22/sourdough-baguettes/\n\nBy Eileen Gray, Baking Sense. Prep: 30 min | Bake: 20 min | Rising: 12 hrs | Total: 12 hrs 50 min. Makes 2 baguettes.\n\n## Ingredients\n- 8 oz active sourdough starter\n- 5 1/2 oz warm water\n- 10 oz unbleached all purpose flour\n- 1 teaspoon table salt\n\n## Instructions\n1. Combine the sourdough starter, warm water, and 5 oz of the flour. Mix with the paddle on low speed until it forms a wet dough. Cover and set aside for 30-60 minutes.\n2. Switch to the dough hook. Add the salt and the remaining 5 oz flour and mix until the dough begins to form a ball around the hook. Knead 5 minutes on medium-high speed (if mixing by hand, this dough is quite sticky — you can skip kneading for a \"no knead\" approach).\n3. Place the dough into a lightly oiled bowl, turning once to coat. Cover and set aside at room temperature.\n4. After 30 minutes, uncover and fold each side of the dough into the middle, then flip it over (turning it inside-out to redistribute the yeast). Cover and repeat every 60 minutes.\n5. After about 3 hours, the dough should be lively, elastic, and airy (give it another hour or two if still sluggish). Cover tightly and refrigerate overnight, or proceed to shape and bake the same day.\n6. Sprinkle a baking sheet or baguette pan generously with cornmeal.\n7. Remove the dough from the refrigerator and turn it onto a floured surface. Cut into two pieces. Gently stretch each piece into an 8\"x4\" oval, roll tightly like a jellyroll, then use flat hands to roll from the center outward into a 16\" long baguette.\n8. Place the two loaves side by side on the baking sheet or in the baguette pan. Cover with a damp kitchen towel and let rise until almost doubled, about 1-3 hours (timing varies if the dough is cold from the fridge).\n9. Meanwhile, preheat the oven to 475°F. If using a baking stone, preheat it in the oven. Place a shallow pan on the bottom of the oven to preheat.\n10. Just before baking, pour 1/2 cup hot water into the preheated pan on the oven floor and shut the door to capture the steam.\n11. Sprinkle the tops of the baguettes with flour. Use a sharp knife or razor to make 3-4 diagonal slashes on top of each loaf.\n12. Bake until deeply browned and hollow-sounding when tapped, about 15-20 minutes. Interior temperature should be 200°F.\n13. Transfer to a cooling rack and cool to room temperature before slicing.\n\n## Notes\nTimeline: feed your starter the night before or early the day of mixing; mix the dough in the afternoon, ferment at room temp all day, and refrigerate that evening (can hold 2-3 days); shape the next day and let rise 1 1/2-2 hours before baking. Best the day they're baked; freeze baked loaves up to a month, then defrost and warm in the oven before serving.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "elealiso7acxwcjpoyybgzqv5m", "title": "Sourdough Soft Pretzels", "ainfo": "Sourdough Soft Pretzels", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine 8 oz active sourdough starter and 10 oz warm water in the bowl of a stand mixer with the paddle attached (or mix by hand).", "notes": "# Sourdough Soft Pretzels\n\nSource: https://www.baking-sense.com/2018/01/09/sourdough-soft-pretzels/\n\nBy Eileen Gray, Baking Sense. Prep: 1 hr 30 min | Rising: 12 hrs | Bake: 15 min | Total: 13 hrs 45 min.\n\n## Ingredients\n- 8 oz active sourdough starter (1 cup, 100% hydration)\n- 10 oz warm water (1 1/4 cups)\n- 17 1/2 oz all-purpose flour (3 1/2 cups)\n- 1 tablespoon granulated sugar\n- 1 1/2 teaspoons table salt\n- 2 quarts water\n- 2 1/2 oz baking soda (1/3 cup, for boiling)\n- 1 egg white, lightly whisked\n- Salt and seeds for garnish\n\n## Instructions\nDay 1:\n1. Combine 8 oz active sourdough starter and 10 oz warm water in the bowl of a stand mixer with the paddle attached (or mix by hand).\n2. With the mixer running on low, add 10 oz (2 cups) of the flour and mix to form a smooth batter. Cover and set aside for 30-60 minutes.\n3. Switch to the dough hook and add the sugar, salt, and remaining 7 1/2 oz flour. Knead on medium speed for 5 minutes, until the dough clears the bowl and clings to the hook (or knead by hand 5 minutes, adding flour as needed).\n4. Scrape the dough into a lightly oiled bowl, turning once to coat. Cover and set aside at room temperature.\n5. After 30 minutes, uncover and fold each side of the dough into the middle, then flip the dough over (turning it inside-out to redistribute the yeast). Cover and repeat again after 60 minutes.\n6. After another 60 minutes, turn the dough once more — it should now be lively, elastic, and airy (give it another hour or two if still sluggish). Cover tightly and refrigerate overnight (up to 2 days).\n\nDay 2:\n7. Remove the dough from the refrigerator. Line 2 baking sheets with parchment and sprinkle lightly with flour.\n8. Turn the cold dough onto a floured surface and divide into 12 equal pieces; roll each into a smooth ball. Shape each ball into a rope about 20\"-24\" long, using flat hands rolling back and forth from the middle outward.\n9. To form a pretzel, lift the dough rope on either end, letting the middle rest on the surface in a \"U\" shape. Twist the ends together twice and fold the twist over to rest on the center of the \"U\". Lift by the two top loops and place on the baking sheet.\n10. Cover with plastic wrap and let rest 1 hour to come to room temperature.\n11. Meanwhile, combine 2 quarts water and the baking soda in a large pot and bring to a boil. Preheat the oven to 475°F.\n12. Drop pretzels into the boiling water for 10 seconds, flip, and boil another 10 seconds (about 3 at a time, don't overcrowd). Set boiled pretzels on a cooling rack over a clean baking sheet; continue with the rest.\n13. Transfer pretzels to the baking sheets. Brush each with egg white and sprinkle with coarse salt and/or seeds of choice. Bake about 15 minutes, until puffed and golden brown, turning the sheets halfway through for even browning.\n\n## Notes\nBest eaten warm from the oven; they also freeze well — pack in storage bags, freeze up to a month, and re-warm in a low oven. If measuring flour by volume, use the \"dip & sweep\" method. The recipe was developed with a 100% hydration starter; adjust flour or water if yours differs.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2gpwt5nz7rlkipu3tg36odn5zi", "title": "Southern Collard Greens", "ainfo": "Southern Collard Greens", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pull and tear the greens away from the stems (removing stems is a personal choice, but this recipe removes them). Roll a handful of greens tightly lengthwise like a cigar and cut crosswise into 1/2-1 inch strips — smaller strips cook faster.", "notes": "# Southern Collard Greens\n\nSource: https://grandbaby-cakes.com/collard-greens-recipe/\n\nBy Jocelyn Delk Adams, Grandbaby Cakes. Prep: 30 min | Cook: 2 hrs 45 min | Total: 3 hrs 15 min. Servings: 8. Course: Side Dish.\n\n## Ingredients\n- 3 lbs fresh collard greens (about 5-6 smaller bunches)\n- 1 1/2 lbs extra large smoked turkey wings, legs, necks, or ham hock (meaty)\n- 2 teaspoons chicken bouillon (such as Better Than Bouillon)\n- 2 tablespoons sugar (granulated or brown)\n- 1 tablespoon bacon grease\n- 1 tablespoon seasoned salt (such as Lawry's)\n- 2 teaspoons Worcestershire sauce\n- 2 teaspoons apple cider vinegar\n- 1 teaspoon crushed red pepper flakes (use 1/2 teaspoon for less heat)\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon smoked paprika\n- 1/2 cup finely chopped onion\n\n## Instructions\n1. Pull and tear the greens away from the stems (removing stems is a personal choice, but this recipe removes them). Roll a handful of greens tightly lengthwise like a cigar and cut crosswise into 1/2-1 inch strips — smaller strips cook faster.\n2. Wash the greens thoroughly in a clean sink with lukewarm water, removing all grit and debris; drain, refill, and repeat until the water runs clear.\n3. Rinse the smoked turkey or ham hock well, then add to a large pot with about 10 cups of water to fully submerge it. Add the chicken bouillon and bring to a boil over medium-high heat. Reduce heat to low, cover, and simmer gently until the meat is nearly tender, about 45 minutes.\n4. Once the meat is almost tender, add the greens, about 4 additional cups of water (or enough to just barely cover the greens), and the rest of the ingredients. This liquid becomes the \"pot likker.\"\n5. Bring back to a boil, then reduce heat to medium or medium-low and cook partially covered for at least 2 hours, until completely tender — the meat should be falling off the bone and most of the water evaporated, leaving a concentrated, flavorful pot likker. Taste and adjust seasoning, then serve.\n\n## Notes\nWash the greens repeatedly until no grit remains in the water — this is the most important step. Collards can be overcooked; they should end up tender, not mushy. Cook low and slow (2-3 hours) rather than rushing at high heat. Shred the meat off the ham hock/turkey back into the pot once tender so there's meat in every bite. Use a heavy-bottomed pot or Dutch oven for even heat. Turnip or mustard greens can substitute for collards. Bacon can substitute for the ham hock/turkey if rendered down first for flavor. For a vegan version, skip the meat and bacon grease, use vegetable stock, and add liquid smoke for depth. Store in an airtight container (with the pot likker stored separately) up to 5 days in the fridge, or freeze greens with pot likker in freezer bags up to 3 months; thaw a few hours in the fridge before reheating on the stovetop or in the microwave. Serve with cornbread, smothered pork chops, fried chicken, or mashed potatoes. Nutrition (per serving): 88 kcal, 4g carbs, 5g protein, 6g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ctjts3hrbd65tyzree2474yktm", "title": "Spaghetti alla Carbonara", "ainfo": "Spaghetti alla Carbonara", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large sauté pan, heat the oil over medium heat until shimmering. Add the pancetta and cook until browned and the fat has rendered, about 5 minutes. Reduce heat to the lowest setting and keep warm.", "notes": "# Spaghetti alla Carbonara\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/marc-murphy/spaghetti-alla-carbonara-7590670.amp (retrieved via canonical URL)\n\nRecipe courtesy of Marc Murphy, Food Network (The Kitchen). Level: Easy | Total: 20 min | Active: 20 min | Yield: 4 to 6 servings\n\n## Ingredients\n- 2 tablespoons olive oil\n- 8 ounces pancetta or thick bacon, diced\n- 4 large eggs, at room temperature\n- 1 cup (2 1/2 ounces) freshly grated Parmigiano-Reggiano cheese\n- 1 teaspoon freshly ground black pepper\n- Kosher salt\n- 1 pound spaghetti\n\n## Instructions\n1. In a large sauté pan, heat the oil over medium heat until shimmering. Add the pancetta and cook until browned and the fat has rendered, about 5 minutes. Reduce heat to the lowest setting and keep warm.\n2. In a large bowl, mix together the eggs, cheese, and pepper until uniform. Set aside.\n3. Fill a large pot with water and add enough salt so it tastes like seawater. Bring to a boil. Add the pasta and cook according to package directions until al dente. Reserve 1 cup of the pasta cooking liquid.\n4. Drain the pasta, transfer to the bowl with the egg mixture, and add the pancetta along with all the fat from the pan. Toss until the eggs are cooked and the pasta is coated and creamy, about 1 minute. Serve immediately.\n\n## Notes\nIf the pasta looks dry when tossing, add a bit of the reserved pasta water to help create an emulsion. Adapted from \"Season with Authority: Confident Home Cooking\" by Marc Murphy.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "e6mbzwneg6xobzekrmajih2qi4", "title": "Spatchcock Chicken Recipe (One-Pan Dinner)", "ainfo": "Spatchcock Chicken Recipe (One-Pan Dinner)", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 425°F. Place the chicken breast-side down with the wings/neck facing you. Use kitchen shears to cut through the ribs next to the spine on both sides to remove the spine (save it for bone broth). Open the rib cage and use a heavy knife to score down the sternum to help pop out the breast bone and flatten the chicken. Season inside with 1/2 teaspoon salt and a pinch of black pepper.", "notes": "# Spatchcock Chicken Recipe (One-Pan Dinner)\n\nSource: https://natashaskitchen.com/spatchcock-chicken-recipe-video/\n\nBy Natasha, NatashasKitchen.com. Prep: 15 min | Cook: 45 min | Total: 1 hour. Servings: 6. Course: Dinner, Main Course. Cuisine: American.\n\n## Ingredients\nChicken:\n- 4 1/4 lb whole chicken\n- 1/2 teaspoon salt (sea salt)\n- 1/8 teaspoon black pepper\n\nFlavored Butter:\n- 4 tablespoons unsalted butter, softened\n- 1 tablespoon olive oil, plus more to drizzle\n- 1 tablespoon parsley, finely chopped\n- 2 garlic cloves, minced\n- 1/2 teaspoon lemon zest\n- 1 tablespoon lemon juice\n- 1 teaspoon salt, plus more for vegetables\n- 1/8 teaspoon black pepper\n\nOne-Pan Vegetables:\n- 2 lbs medium red potatoes, scrubbed and quartered\n- 3 medium carrots, peeled and quartered\n- 8 oz Brussels sprouts, trimmed and halved\n\n## Instructions\n1. Preheat oven to 425°F. Place the chicken breast-side down with the wings/neck facing you. Use kitchen shears to cut through the ribs next to the spine on both sides to remove the spine (save it for bone broth). Open the rib cage and use a heavy knife to score down the sternum to help pop out the breast bone and flatten the chicken. Season inside with 1/2 teaspoon salt and a pinch of black pepper.\n2. Flip the chicken breast-side up onto a parchment-lined, rimmed baking sheet. Push firmly on the breast bone with the palm of your hand to lay it completely flat. Use your thumbs to separate the skin from the meat over the breast, thigh, and drumstick areas.\n3. In a small bowl, combine the flavored butter ingredients and mash with a fork for a couple of minutes until the lemon juice is mostly incorporated.\n4. Spread 2/3 of the butter mixture under the chicken skin, and dot/spread the rest over the outside of the chicken.\n5. Arrange the potatoes, carrots, and Brussels sprouts around the chicken, drizzle everything with olive oil, and season generously with salt and pepper.\n6. Bake uncovered at 425°F for 45 minutes, or until an instant-read thermometer reads 160°F in the thickest part of the breast. Remove from the oven and rest uncovered for 10 minutes on a cutting board before serving.\n\n## Notes\nLet the raw chicken sit at room temperature for 30 minutes before starting for more even baking. Don't over-bake — the breast will dry out; internal temperature will rise another 5-10°F after coming out of the oven, so pull it at 160°F. Spatchcocking (removing the spine and flattening) lets the breast sit at the same level as the legs so everything cooks evenly and the breast stays juicy. Nutrition (per serving): 523 kcal, 30g carbs, 33g protein, 29g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "kr7nvhq6bwuce4xvubm3ge7aqe", "title": "Spinach Quiche", "ainfo": "Spinach Quiche", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 400°F, rack in the middle. Thaw the pie crust about 10 minutes until soft enough to prick with a fork. Prick the bottom and sides all over, about an inch apart. Bake until fully cooked and lightly golden, 10 to 15 minutes, gently pricking with a fork if it puffs up. Set aside and reduce oven to 325°F.", "notes": "# Spinach Quiche\n\nSource: https://www.onceuponachef.com/recipes/spinach-quiche.html\n\nBy Jennifer Segal, Once Upon a Chef. Total: 1 hr 30 min. Servings: 4 to 6.\n\n## Ingredients\n- 1 (9-in) deep dish frozen pie crust\n- 1 tablespoon butter\n- 1/2 cup thinly sliced shallots (from 2 medium shallots)\n- 4 large eggs\n- 1 1/4 cups heavy cream\n- Pinch ground nutmeg\n- 3/4 teaspoon salt\n- 1/8 teaspoon cayenne pepper\n- 1 cup (4 oz) finely shredded Gruyère, packed\n- 1 (10-oz) package frozen chopped spinach, defrosted and wrung free of water\n\n## Instructions\n1. Preheat the oven to 400°F, rack in the middle. Thaw the pie crust about 10 minutes until soft enough to prick with a fork. Prick the bottom and sides all over, about an inch apart. Bake until fully cooked and lightly golden, 10 to 15 minutes, gently pricking with a fork if it puffs up. Set aside and reduce oven to 325°F.\n2. Heat the butter in a small skillet over medium-low heat. Cook the shallots until soft and translucent, about 8 minutes, without browning. Set aside to cool.\n3. In a medium bowl, whisk together the eggs, heavy cream, nutmeg, salt, and cayenne pepper.\n4. Place the cooked pie crust on a baking sheet. Spread the shallots over the bottom of the crust, sprinkle the Gruyère over top, then scatter the spinach evenly over the cheese, breaking up clumps. Pour the egg and cream mixture over top.\n5. Bake at 325°F for 50 to 55 minutes, until the custard is set and the top is lightly golden. Serve hot or warm.\n\n## Notes\nIf the crust cracks, patch with a paste of 1 1/2 tablespoons flour and 1 tablespoon softened butter, then return to the oven briefly to set. To defrost spinach quickly, run it under hot water in a fine mesh strainer, then squeeze it into a ball repeatedly until completely dry — this is essential or the quiche will be watery. Cheddar can substitute for Gruyère if needed; feta can be added but doesn't melt as evenly. Can be made a day ahead and refrigerated, or frozen up to 3 months (wrap in plastic then foil after cooling; thaw 24 hours before reheating). Reheat covered with foil at 300°F for 35-45 minutes. Can also be made crustless. Nutrition (per serving, 6 servings): 504 kcal, 25g carbs, 14g protein, 39g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "kq3cv22tru7khrsomeei7z4eli", "title": "Spring Vegetable Frittata with Leeks & Potatoes", "ainfo": "Spring Vegetable Frittata with Leeks & Potatoes", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 375°F.", "notes": "# Spring Vegetable Frittata with Leeks & Potatoes\n\nSource: https://smithey.com/blogs/recipes/spring-vegetable-frittata\n\nSmithey Ironware. Serves: 2. Course: Mains.\n\n## Ingredients\n- 6 large eggs\n- 1/3 cup grated parmesan cheese, more to taste\n- 1 teaspoon salt\n- Freshly ground black pepper, to taste\n- 2 tablespoons unsalted butter\n- 1 leek, white and light green parts sliced thin, washed well (1/2 cup)\n- 1/2 cup roughly chopped fresh spinach\n- 1/2 cup diced cooked potatoes\n- 1 ounce goat cheese, crumbled\n- 2 tablespoons chopped fresh parsley\n- 1 tablespoon chopped fresh dill\n\n## Instructions\n1. Preheat the oven to 375°F.\n2. In a medium bowl, beat the eggs to combine. Whisk in the salt, pepper, and grated parmesan.\n3. Melt the butter in a skillet (cast iron recommended) over medium heat, swirling to coat the pan.\n4. Add the leeks and sauté until tender, about 2 minutes. Add the spinach and cook until wilted, about 1 minute more. Scatter the potatoes into the pan and pour the egg mixture over top. Sprinkle with the crumbled goat cheese and half of the herbs.\n5. Cook over medium heat, stirring constantly with a rubber spatula, until the eggs just start to set around the bottom and edges, about 3 minutes. Transfer to the preheated oven and bake until the frittata is puffed and just cooked through, about 10 minutes.\n6. Remove from the oven and sprinkle with the remaining herbs and more parmesan to taste. Serve hot or at room temperature.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "lffplurnpyqf3yz5hkimd5zn3u", "title": "Standing Rib Roast with Fresh Horseradish Sauce", "ainfo": "Standing Rib Roast with Fresh Horseradish Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "If refrigerator space allows, place roast uncovered on a rack over a sheet pan and let \"air dry\" for 3 days. Remove roast 2 hours before roasting.", "notes": "# Standing Rib Roast with Fresh Horseradish Sauce\n\nSource: https://www.mugnaini.com/recipes/standing-rib-roast-with-fresh-horseradish-sauce/\n\nMugnaini Wood and Gas Fired Pizza Ovens. Cooked in a wood-fired oven, Medium Roasting Environment 550-625°F.\n\n## Ingredients\n### Rib Roast\n- 1 bone-in beef rib roast, about 19-20 pounds\n- 2 tablespoons chopped rosemary\n- 4 tablespoons kosher salt, divided\n- 1 teaspoon pepper\n- 1 tablespoon chopped garlic\n\n### Horseradish Sauce\n- 1/2 cup finely grated fresh horseradish\n- 2 cups sour cream\n- 1 tablespoon minced chives\n- 1 teaspoon white wine vinegar\n- 1 teaspoon salt\n- Dash hot red pepper sauce\n\n## Instructions\n### Rib Roast\n1. If refrigerator space allows, place roast uncovered on a rack over a sheet pan and let \"air dry\" for 3 days. Remove roast 2 hours before roasting.\n2. Mix rosemary, 1 tablespoon salt, pepper, and garlic in a small bowl; set aside. Using a sharp knife, slice the bones away from the roast about 3/4 of the way down to create a pocket. Rub the rosemary mixture into the pocket. Tie the bones back to the roast between each rib with butcher's twine. Rub the remaining salt all over the roast.\n3. Place the rib roast on its side on a \"V\" rack in a roasting pan and tent with foil. Roast 30 minutes with the ribs closest to the fire.\n4. Remove pan from oven and carefully roll the roast so the fat side is up. Return to the oven and roast, rotating the pan every 30 minutes, for about 3 1/2 hours, or until the internal temperature at the center reaches 120°F. Remove from oven and let rest 30 minutes, covered.\n5. To serve, remove the bones from the roast and slice.\n\n### Horseradish Sauce\n1. Combine all ingredients in a bowl and mix well. Chill well before serving.\n\n## Notes\nLarger cuts of meat need more resting time to redistribute juices, and internal temperature will rise more during resting than with a smaller cut.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "22seuuojfmjekotl6nevhebrb4", "title": "Star Jones' Garlic Lobster Tails", "ainfo": "Star Jones' Garlic Lobster Tails", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat broiler. With kitchen shears or a large, sharp knife, cut lobster tails down the back on the curved side of the shell. Pry the sides of the shells apart to expose the meat.", "notes": "# Star Jones' Garlic Lobster Tails\n\nSource: http://www.foodnetwork.com/recipes/star-jones-garlic-lobster-tails-recipe.html\n\nRecipe courtesy of Star Jones. Level: Easy. Yield: 4 servings.\n\n## Ingredients\n- 4 large lobster tails (8 ounces each)\n- 4 to 6 large cloves garlic, minced\n- 6 tablespoons butter, cut into bits\n- 1 lemon, juiced\n- 1/2 teaspoon Cajun spice\n- 1/2 teaspoon seafood seasoning, such as Seafood Magic\n\n## Instructions\n1. Preheat broiler. With kitchen shears or a large, sharp knife, cut lobster tails down the back on the curved side of the shell. Pry the sides of the shells apart to expose the meat.\n2. Top the meat with garlic and butter. Squeeze lemon juice over the lobster meat and dust liberally with Cajun spice and seafood seasoning.\n3. Set lobster tails in a roasting pan and broil 4 to 6 inches from heat for 12 to 15 minutes, until the meat is opaque in the center.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wo6sd5h2bbgha3v2rmqysmbtyy", "title": "Steak Sauce", "ainfo": "Steak Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix together ketchup, mustard, Worcestershire sauce, vinegar, salt, pepper, and hot pepper sauce in a medium bowl.", "notes": "# Steak Sauce\n\nSource: https://www.allrecipes.com/recipe/86516/steak-sauce/\n\nBy Ron Shepherd. Prep: 5 mins | Total: 5 mins | Servings: 12\n\n## Ingredients\n- 1 1/4 cups ketchup\n- 2 tablespoons prepared yellow mustard\n- 2 tablespoons Worcestershire sauce\n- 1 1/2 tablespoons apple cider vinegar\n- 4 drops hot pepper sauce (e.g. Tabasco)\n- 1/2 teaspoon salt\n- 1/2 teaspoon ground black pepper\n\n## Instructions\n1. Mix together ketchup, mustard, Worcestershire sauce, vinegar, salt, pepper, and hot pepper sauce in a medium bowl.\n2. Transfer to a jar and refrigerate until needed.\n\n## Notes\nGreat on steaks, burgers, fries, and pork chops. The recipe author prefers Del Monte ketchup over Heinz, finding Heinz a bit sweeter.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "fufzq5scvsrfgqeqrebpig4ila", "title": "Steak with Burgundy Mushroom Sauce", "ainfo": "Steak with Burgundy Mushroom Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, melt butter over high heat. Throw in mushrooms, garlic, and green onions and cook, stirring occasionally, until mushrooms are nice and golden.", "notes": "# Steak with Burgundy Mushroom Sauce\n\nSource: http://thepioneerwoman.com/cooking/steak-with-burgundy-mushroom-sauce/\n\nBy Ree Drummond. Yields: 4 servings | Prep: 5 mins | Cook: 15 mins | Total: 20 mins\n\n## Ingredients\n- 4 whole steaks (sirloin, ribeye, etc.)\n- 1/2 cup butter\n- 1 lb. white mushrooms, sliced\n- 4 cloves garlic, minced\n- 3 whole green onions, sliced\n- 1 1/2 cups red wine (Burgundy, Merlot, Cab, etc.)\n- Salt and pepper, to taste\n- 1 Tbsp. butter\n- Fresh parsley, minced, to taste\n\n## Instructions\n1. In a large skillet, melt butter over high heat. Throw in mushrooms, garlic, and green onions and cook, stirring occasionally, until mushrooms are nice and golden.\n2. Pour in wine and stir, scraping the bottom of the pan. Allow to cook for several minutes or until liquid is reduced by at least half. At the end, add 1 tablespoon butter and stir into the sauce. Add parsley and stir together. Don't be afraid to splash in a little more wine if needed.\n3. Fry a steak in a separate skillet till medium rare.\n4. Spoon mushroom sauce over the top.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tr37psrdw3sos3hyca2fgb4lua", "title": "Tagliatelle Bolognese", "ainfo": "Tagliatelle Bolognese", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Bring 2 quarts water to a boil in a medium saucepan. Add the pasta to the water. Cook for 6 to 8 minutes for fresh pasta and follow package instructions for dried pasta. Strain (reserve 1 cup pasta water to add to the sauce if needed).", "notes": "# Tagliatelle Bolognese\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/tagliatelle-bolognese-17454585.amp (accessed via canonical URL https://www.foodnetwork.com/recipes/tagliatelle-bolognese-17454585)\n\nRecipe courtesy of Black Market, Los Angeles, CA. Level: Intermediate. Total: 2 hr 50 min (includes cooling time) | Active: 1 hr. Yield: 4 to 6 servings.\n\n## Ingredients\nTomato Sauce:\n- 1/4 cup blended olive oil\n- 1 teaspoon chopped garlic\n- 1 teaspoon sugar\n- 1/2 teaspoon salt\n- One 32-ounce can San Marzano tomatoes, blended\n- Aromatic sachet (fresh basil and parsley, tied in cheesecloth)\n\nCheese Stock:\n- 2 cups leftover cheese rinds\n\nBolognese Sauce:\n- 1 pound fresh or dried tagliatelle pasta\n- 1 pound ground beef\n- 1 pound ground pork\n- 1 pound ground veal\n- Salt and ground black pepper\n- Blended olive oil, for cooking\n- 1/2 cup ground bacon\n- 3/4 cup small diced onion\n- 1/2 cup small diced carrots\n- 1/4 cup small diced celery\n- 1/2 cup tomato paste\n- Aromatic sachet (parsley, rosemary, thyme, bay leaf and black peppercorn, tied in cheesecloth)\n- 1 tablespoon chopped fresh rosemary\n- 1 tablespoon chopped fresh thyme\n- 2 1/2 cups white wine\n- 1/2 cup whole milk\n- 2 cups freshly grated Parmesan, plus more for serving\n- 1/4 cup fresh basil chiffonade\n- 1/4 cup chopped fresh parsley\n\n## Instructions\nSpecial equipment: cheesecloth; butcher's twine\n\nTomato sauce: In a large stockpot, add the blended oil and garlic. Add the sugar and salt. Add the tomatoes. Cook for 30 to 45 minutes, then cool with a sachet of basil and parsley in the sauce.\n\nCheese stock: Boil the cheese rinds in 8 cups water in a stockpot for 30 to 45 minutes. Strain out the cheese rinds.\n\nBolognese sauce:\n1. Bring 2 quarts water to a boil in a medium saucepan. Add the pasta to the water. Cook for 6 to 8 minutes for fresh pasta and follow package instructions for dried pasta. Strain (reserve 1 cup pasta water to add to the sauce if needed).\n2. Sprinkle the beef, pork, and veal in a bowl with salt and pepper. In a large heavy round pot, add some oil and heat up. Add the meats and bacon and cook, breaking up big chunks, for 10 minutes.\n3. Add the onions, carrots, and celery and cook 5 minutes. Add the tomato paste and cook, stirring, 5 minutes.\n4. Add the aromatic sachet, along with the chopped rosemary and thyme. Reduce to medium heat and add the white wine; reduce two-thirds of the liquid.\n5. Add the milk and reduce until the liquid has evaporated. Add 1 cup tomato sauce and 1 cup pasta water or cheese stock and cook for 5 minutes.\n6. Add the cooked pasta, then cook for an additional 1 to 2 minutes. Remove from the heat, then add the Parmesan, basil, and parsley.\n7. Place the pasta in the middle of a bowl. Top with fresh Parmesan and parsley.\n\n## Notes\nThis recipe was provided by a chef, restaurant, or culinary professional and has not been tested for home use. From \"Diners, Drive-Ins and Dives,\" Champion Chefs episode.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "z4yat2vn5lfisfdpwygcz5cvcy", "title": "Tangy Memphis BBQ Sauce", "ainfo": "Tangy Memphis BBQ Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine all the sauce ingredients in a small saucepan over medium-low heat. Stir to combine and bring to a simmer.", "notes": "# Tangy Memphis BBQ Sauce\n\nSource: https://barefeetinthekitchen.com/tangy-memphis-bbq-sauce-and-oven-baked/\n\nBy Mary Younkin, Barefeet In The Kitchen (adapted from Cooking Light via Jenn's Food Journey). Prep: 5 min | Cook: 10 min | Total: 15 min. Servings: 6.\n\n## Ingredients\n- 1 cup ketchup\n- 1/2 cup white vinegar\n- 1/4 cup brown sugar\n- 2 tablespoons yellow mustard\n- 2 tablespoons Worcestershire sauce\n- 1 tablespoon onion powder\n- 1/2 teaspoon freshly ground black pepper\n- 1/2 teaspoon cayenne pepper\n- 1/4 teaspoon kosher salt\n\n## Instructions\n1. Combine all the sauce ingredients in a small saucepan over medium-low heat. Stir to combine and bring to a simmer.\n2. Simmer 10 minutes, then remove from the heat. Use immediately or pour into an airtight container and refrigerate for up to 3 days.\n\n## Notes\nThis Memphis-style sauce is thinner and tangier than most barbecue sauces, with a ketchup base, a generous amount of vinegar, and mustard for tang. Great on ribs, pulled pork, grilled chicken, roasted vegetables. Because of its acidity, it keeps well; a triple batch can be portioned and frozen, and thaws quickly.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "yhgitgskhwzkhcivinsmtav4qm", "title": "Texas Chili", "ainfo": "Texas Chili", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Season the beef with kosher salt and black pepper.", "notes": "# Texas Chili\n\nSource: https://www.spendwithpennies.com/texas-chili/\n\nBy Holly Nilsson, Spend With Pennies. Course: Beef, Main Course. Cuisine: American. Prep: 20 min | Cook: 4 hrs | Total: 4 hrs 20 min. Servings: 6.\n\n## Ingredients\n- 4 pounds beef chuck roast, trimmed of excess fat, cut into 1/2 inch chunks\n- Salt and black pepper to taste\n- 6 tablespoons olive oil, divided\n- 3 jalapenos, seeded and diced\n- 1 large yellow onion, diced\n- 5 cloves garlic, minced\n- 1 chipotle pepper in adobo sauce, seeded and finely chopped\n- 28 ounces crushed tomatoes (1 can)\n- 3 tablespoons tomato paste\n- 4 cups beef stock or broth\n- 2 bay leaves\n\nSeasoning Mix:\n- 2 tablespoons chili powder\n- 2 tablespoons smoked paprika\n- 1 tablespoon cumin\n- 1 tablespoon dried oregano\n- 2 teaspoons chipotle chili powder\n- 2 teaspoons unsweetened cocoa powder\n- 1 teaspoon ground coriander\n- 1/2 teaspoon cinnamon\n\n## Instructions\n1. Season the beef with kosher salt and black pepper.\n2. In a large pot, heat 2 tablespoons oil over medium-high heat and brown half of the meat. Repeat with the remaining beef. Remove from heat and set aside.\n3. Add the remaining 2 tablespoons olive oil and heat 30 seconds. Add the jalapeno peppers and onions and saute about 10 minutes, until onions are softened (do not brown them).\n4. Stir in garlic and seasoning mix and cook 30 seconds, just until fragrant.\n5. Add the beef back into the pot along with the remaining ingredients.\n6. Bring the chili to a boil, then turn the heat down to low.\n7. Simmer, uncovered, for 3 to 3 1/2 hours, stirring occasionally so it doesn't stick. Add more stock if it becomes too thick.\n8. Before serving, remove the bay leaves and serve plain or topped with sour cream, shredded cheese, or green onions.\n\n## Notes\nNo beans — true Texas-style chili uses stew beef, chilies, and tomatoes, not ground beef or beans. Chuck roast is uniformly marbled and breaks down tender over low, slow cooking. For more heat, add more chipotle peppers or chipotle chili powder. The meat should slightly shred while cooking — that's normal. Fridge: keeps 4-5 days. Freezer: freezes well up to 4 months in freezer containers/bags with headspace; no need to thaw before reheating.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "skb2wvho6h4s4sgi4vvd7huqbm", "title": "Thai Turkey Burgers", "ainfo": "Thai Turkey Burgers", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine ingredients, shape into burgers and grill!", "notes": "# Thai Turkey Burgers\n\nSource: http://www.sandyskitchenadventures.com/2011/02/thai-turkey-burgers.html?m=0\n\n## Ingredients\n- 8 oz raw 95%-97% fat free ground turkey (yields about 6 oz cooked)\n- 1 tbsp scallions, minced\n- 1 tablespoon fresh cilantro, minced\n- 1 tablespoon lite sodium soy sauce or fish sauce\n- 1/4 teaspoon ground ginger\n- 1/4 tsp garlic salt\n- 1 teaspoon sesame oil\n\n## Instructions\n1. Combine ingredients, shape into burgers and grill!\n\n## Notes\nThe sesame oil gives it a distinct Thai flavor and shouldn't be left out — it also helps keep the leaner turkey from drying out.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "yg4onjvvgjkt4wbmeodj2a44ia", "title": "The Best Bacon Onion Jam", "ainfo": "The Best Bacon Onion Jam", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Cut the bacon into half-inch slices and add to a large frying pan (pieces sticking together is fine, they separate as they cook). Cook over medium-high heat about 10 minutes, stirring frequently, until the bacon is cooked but still quite chewy (a few crispy bits are okay). Remove the bacon with a slotted spoon.", "notes": "# The Best Bacon Onion Jam\n\nSource: https://www.theendlessmeal.com/the-best-bacon-jam/\n\nBy Kristen Stevens, The Endless Meal. Prep: 10 min | Cook: 1 hr | Total: 1 hr 10 min.\n\n## Ingredients\n- 1 lb thick cut bacon\n- 2 extra large onions, quartered and thickly sliced\n- 1/2 cup brown sugar (use coconut sugar for paleo)\n- 1/2 cup water\n- 1/3 cup strong brewed coffee\n- 1 tablespoon balsamic vinegar\n\n## Instructions\n1. Cut the bacon into half-inch slices and add to a large frying pan (pieces sticking together is fine, they separate as they cook). Cook over medium-high heat about 10 minutes, stirring frequently, until the bacon is cooked but still quite chewy (a few crispy bits are okay). Remove the bacon with a slotted spoon.\n2. Pour out all but 1 tablespoon of the bacon drippings. Add the onions and cook about 8-10 minutes, then reduce heat to low. Add the sugar and stir. Continue cooking until the onions have caramelized, about 20 minutes.\n3. Add the reserved bacon, coffee, and water, and increase heat to medium. Continue cooking, stirring about every 5 minutes, until thick and jam-like, about 30 minutes. Remove from heat and stir in the balsamic vinegar. Taste and season with salt if needed.\n4. Use immediately or refrigerate up to a week. Bring back to room temperature before serving — white fat spots that appear when chilled will disappear as it warms.\n\n## Notes\nUse thick-cut bacon and sweet onions, quartered then thickly sliced. Brown sugar adds a caramel taste that granulated sugar doesn't. The coffee isn't tasted directly but elevates the other flavors — a key part of what makes this version distinctive. Balsamic vinegar balances the sweetness; apple cider vinegar can be substituted (start with 1 teaspoon and adjust to taste). Freezes well. Great with cheese and crackers, on burgers, or in grilled cheese. Canning meat carries botulism risk in low-acid foods — if canning, a pressure cooker is required, not a boiling water bath; consult USDA/FDA/Health Canada guidance.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "cydv4fxlb37dqy2453p6ucy4x4", "title": "The Best Baked Beans Ever", "ainfo": "The Best Baked Beans Ever", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Adjust oven rack to lower-middle position and heat oven to 325°F.", "notes": "# The Best Baked Beans Ever\n\nSource: http://thepioneerwoman.com/cooking/the-best-baked-beans-ever/\n\nBy Ree Drummond (recipe by Pam Anderson). Yields: 18 servings | Prep: 25 mins | Cook: 2 hrs | Total: 2 hrs 25 mins\n\n## Ingredients\n- 8 slices bacon, halved\n- 1 medium onion, chopped\n- 1/2 medium green pepper, chopped\n- 3 (28-oz.) cans pork and beans\n- 3/4 cup barbecue sauce\n- 1/2 cup brown sugar\n- 1/4 cup distilled or cider vinegar\n- 2 tsp. dry mustard or 2 tbsp. dijon mustard\n\n## Instructions\n1. Adjust oven rack to lower-middle position and heat oven to 325°F.\n2. Fry the bacon in a large, deep sauté pan until the bacon has partially cooked and released about 1/4 cup of drippings. Remove the bacon from the pan and drain on paper towels.\n3. Add the onion and pepper to the drippings in the pan and sauté until tender, about 5 minutes.\n4. Add the beans and remaining ingredients to the pan; bring to a simmer. (If the pan is not large enough, add the beans and heat to a simmer, then transfer to a large bowl and stir in the remaining ingredients.)\n5. Pour the flavored beans into a greased 13-by-9-inch (or similar size) ovenproof pan. Top with bacon, then bake until the beans are bubbly and the sauce is the consistency of pancake syrup, about 2 hours. Let stand to thicken slightly and serve.\n\n## Notes\nDon't drain the pork and beans — dump the entire contents of the cans in. Thick-cut bacon works best. Can be made ahead; just wait to add the bacon on top until ready to bake. Keeps up to 3 days refrigerated, or freeze (after baking) for up to 3 months.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "lskao6lojbbzq7k5hjkohvueda", "title": "The Best Grilled Salmon", "ainfo": "The Best Grilled Salmon", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the grill. Prepare for direct cooking over high heat, 450°F-550°F. Brush the cooking grates clean and close the lid to heat.", "notes": "# The Best Grilled Salmon\n\nSource: https://www.foodiecrush.com/best-grilled-salmon/\n\nBy
