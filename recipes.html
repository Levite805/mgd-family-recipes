 Cool the mixture over an ice bath, whisking, until no longer warm to the touch but still liquid. Stir in the vanilla and almond extracts if using.\n18. Fold the remaining whipped cream into the cooled milk mixture. Stir in the freeze-dried strawberries, then pour the filling into the cake-lined bowl (it will be fairly liquid).\n19. Fill any large gap between the filling and the top of the cake with additional whipped cream, or trim the cake sides.\n20. Press the 9-inch cake round on top of the filling, trimming if necessary. Cover with plastic wrap and refrigerate at least 6-8 hours, or overnight, to set.\n\nTo serve:\n21. Remove the top plastic wrap. Place a plate upside-down over the bowl, invert, lift the bowl away, and peel off the plastic wrap. Serve chilled.\n\n## Notes\nThe blancmange filling is adapted from Dorie Greenspan's Blanc-Manger recipe (Baking: From My Home to Yours). This cake benefits from overnight chilling — plan accordingly. Variations: swap the jam flavor (raspberry, cherry, mango-peach) or the freeze-dried fruit; fresh fruit is not recommended as it adds too much moisture to the filling. Make-ahead: keeps well-wrapped in the refrigerator up to a week; do not freeze.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tbra4kbdizjih7j3qsmrqr3xve", "title": "Cheese Sauce", "ainfo": "Cheese Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pour the milk into a large saucepan and add the flour and butter.", "notes": "# Cheese Sauce\n\nSource: https://www.bbcgoodfood.com/recipes/cheese-sauce\n\nBy Miriam Nice, BBC Good Food. Serves: 6. Difficulty: Easy. Prep: 5 min | Cook: 8-10 min.\n\n## Ingredients\n- 500ml milk\n- 4 tablespoons plain flour\n- 50g butter\n- 100g grated strong cheddar (or 50g grated cheddar plus 50g crumbled blue cheese)\n\n## Instructions\n1. Pour the milk into a large saucepan and add the flour and butter.\n2. Turn the heat to medium and whisk continuously as the butter melts and the mixture comes to a boil — the flour will disappear and the sauce will begin to thicken.\n3. Whisk for another 2 minutes while the sauce bubbles, then stir in the grated cheese (or cheddar/blue cheese combination) until melted.\n\n## Notes\nA simple all-in-one white sauce method (butter, flour, and milk combined and whisked together from cold, rather than a traditional roux made first) that comes together in about 15 minutes total. Egg-free, nut-free, vegetarian, and low sugar. Use for macaroni cheese or cauliflower cheese. Community feedback suggests some find the sauce too thick with a floury taste using rounded tablespoons of flour — using level tablespoons, or first making a butter-and-flour paste before gradually adding the milk, can help avoid this.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cv4hqhsrab7yqvwr72fke6bncy", "title": "Chewy Ginger Molasses Cookies", "ainfo": "Chewy Ginger Molasses Cookies", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 350°F then line a baking sheet with parchment paper. In a large bowl, combine the almond flour, oat flour, ginger, cinnamon, baking soda, baking powder, and salt. Sift together then set aside.", "notes": "# Chewy Ginger Molasses Cookies\n\nSource: https://www.makingthymeforhealth.com/chewy-ginger-molasses-cookies/\n\nBy Sarah Rotavera. Makes: 12.\n\n## Ingredients\n- 1 cup almond flour, such as Bob's Red Mill\n- 1 cup oat flour*\n- 1 teaspoon baking soda\n- 1 teaspoon baking powder\n- 1 teaspoon ground ginger\n- 1/2 teaspoon cinnamon\n- 1/4 teaspoon salt\n- 1/4 cup solidified unrefined coconut oil**\n- 1/2 cup coconut sugar***\n- 3 tablespoons blackstrap molasses\n- 1 teaspoon vanilla extract\n- 1 tablespoon non-dairy milk\n\n## Instructions\n1. Preheat the oven to 350°F then line a baking sheet with parchment paper. In a large bowl, combine the almond flour, oat flour, ginger, cinnamon, baking soda, baking powder, and salt. Sift together then set aside.\n2. In the bowl of a stand mixer with the paddle attachment (or a large bowl using a hand mixer), add the solidified coconut oil, coconut sugar, molasses, vanilla extract, and milk. Cream together on medium speed for about 1 minute.\n3. With the mixer running on low speed, add the dry ingredients to the bowl in two parts. Allow to mix until a dough forms, about 30 seconds. Use a spatula to scrape down the sides and mix again as needed. If the dough is too sticky to handle, refrigerate it for at least 30 minutes to help the coconut oil solidify.\n4. Take 1 1/2 to 2 tablespoons of dough and roll into a ball. Sprinkle with organic sugar (if desired) then bake for about 10-12 minutes, until puffy and just starting to spread. Peek through the oven door when checking rather than opening it and letting heat out. If they seem undercooked at first, don't worry — they'll harden as they cool.\n5. Allow cookies to cool on the baking sheet for at least 10 minutes. Store in an airtight container for up to 7 days at room temperature.\n\n## Notes\n*Use certified gluten-free oat flour for allergies. **If coconut oil isn't soft enough to scoop at room temperature, microwave it (without the lid) for about 10 seconds — it should be firm but not rock hard. ***Coconut sugar is less sweet than brown or white sugar; if substituting, cookies will be sweeter — try 1/3 cup instead of 1/2 cup (untested). Vegan, gluten-free, and refined sugar-free (if omitting the optional sugar sprinkle on top). Adapted from the site's Dreamy Vegan Snickerdoodles recipe, with molasses added for a softer, chewier texture and ginger-cinnamon warmth.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ifbbimvkiqtvz2pqmuqvod7ojy", "title": "Chicago Steakhouse Peppercorn-Crusted Filet with Crab Au Poivre", "ainfo": "Chicago Steakhouse Peppercorn-Crusted Filet with Crab Au Poivre", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "For the filets: heat the oven to 250°F. Spray a wire rack fitted into a sheet pan with nonstick cooking spray and set aside.", "notes": "# Chicago Steakhouse Peppercorn-Crusted Filet with Crab Au Poivre\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/jeff-mauro/chicago-steakhouse-peppercorn-crusted-filet-with-crab-au-poivre-12558087.amp (retrieved via canonical URL)\n\nRecipe courtesy of Jeff Mauro and Geoffrey Zakarian. Level: Intermediate. Total: 50 min | Active: 25 min. Yield: 4 servings.\n\n## Ingredients\nFilets:\n- Nonstick cooking spray\n- 2 tablespoons whole black peppercorns, cracked\n- 1 tablespoon whole green peppercorns, cracked\n- 1 tablespoon whole pink peppercorns, cracked\n- 7 tablespoons grapeseed oil, divided\n- 1 tablespoon kosher salt\n- 4 center-cut beef filets, each about 2 inches thick\n\nCrab Au Poivre:\n- 1 tablespoon whole black peppercorns, toasted\n- 2 tablespoons unsalted butter\n- 1 tablespoon grapeseed oil\n- 1 shallot, minced\n- 2 cloves garlic, thinly sliced\n- Kosher salt\n- 1/3 cup cognac\n- 3/4 cup beef stock\n- 2 teaspoons Calabrian chile paste\n- 1 1/2 teaspoons Dijon mustard\n- Picked leaves of 3 sprigs fresh thyme\n- 1/2 cup heavy cream\n- 8 ounces jumbo lump crabmeat\n- 1 tablespoon finely chopped chives\n- 1 tablespoon finely chopped fresh parsley\n\n## Instructions\n1. For the filets: heat the oven to 250°F. Spray a wire rack fitted into a sheet pan with nonstick cooking spray and set aside.\n2. In a medium pot, heat the black, green, and pink peppercorns and 5 tablespoons of the oil over low heat. Cook, stirring frequently, until you see tiny bubbles, 6 to 7 minutes. Remove from the heat to cool. Stir the salt into the pepper mixture to form a paste.\n3. Dip each filet all around in the peppercorn paste and place on the prepared sheet pan. Place in the oven to reverse sear until the internal temperature hits 120°F, 25 to 35 minutes.\n4. Heat the remaining 2 tablespoons oil in a large heavy skillet over medium-high heat. Sear the first side of the filets until a very dark golden crust forms, 2 to 3 minutes. Flip and repeat. Remove from the skillet and let rest on the wire-racked sheet pan, lightly tented with foil, for 5 minutes.\n5. For the crab au poivre: while the filets are cooking, coarsely crush the black peppercorns with a mortar and pestle or the bottom of a heavy frying pan. Set aside.\n6. In a large saute pan, heat the butter and oil over medium heat until the butter melts. Add the shallots and garlic and season with salt; cook, stirring occasionally, until soft but not brown, about 5 minutes.\n7. Add the cognac and cook, scraping up any brown bits on the bottom of the pan, until it has almost evaporated, 1 to 2 minutes.\n8. Add the stock, chile paste, Dijon, thyme, the reserved crushed peppercorns, and 1/4 teaspoon salt, and cook until reduced by half, 3 to 5 minutes.\n9. Add the cream and simmer until the sauce is reduced by half, thickened, and coats the back of a spoon, 3 to 4 minutes. Gently stir in the crabmeat. Fold in the chives and parsley. Serve atop steaks.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "r26633qix45sx42phsra4vp7nq", "title": "Chicago Style Deep-Dish Pizza Dough", "ainfo": "Chicago Style Deep-Dish Pizza Dough", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large bowl, dissolve the yeast in 1/4 cup of the warm water. Add the sugar and 1/4 cup of the flour and stir to combine.", "notes": "# Chicago Style Deep-Dish Pizza Dough\n\nSource: https://www.food.com/recipe/chicago-style-deep-dish-pizza-dough-171225\n\nSubmitted by lucid501 (from the book \"Pizza\"), Food.com. Ready in: 3 hrs. Yields: 1 (14-inch crust). Serves: 8.\n\n## Ingredients\n- 1/4 oz active dry yeast (2 1/4 teaspoons)\n- 1 1/4 cups lukewarm water\n- 1 teaspoon sugar\n- 3 1/4 cups unbleached bread flour, plus more for dusting\n- 1/2 cup medium-grind yellow cornmeal\n- 1 teaspoon table salt (or 1 1/2 teaspoons kosher salt)\n- 1/2 cup olive oil, plus more for oiling the bowl and pan\n\n## Instructions\n1. In a large bowl, dissolve the yeast in 1/4 cup of the warm water. Add the sugar and 1/4 cup of the flour and stir to combine.\n2. Cover with plastic wrap and let rise in a warm place for 20 minutes.\n3. Add the remaining 1 cup warm water, 3 cups flour, the cornmeal, salt, and 1/2 cup olive oil. Mix with a wooden spoon, incorporating as much flour as possible.\n4. Turn the dough out onto a lightly floured surface and knead until soft and elastic, 10 to 12 minutes. It will be a bit sticky but shouldn't stick to your hands — use only a minimum of flour on the surface.\n5. Lightly oil a large bowl, add the dough, and turn to coat. Cover with plastic wrap and a damp kitchen towel. Let rise in a warm spot until doubled, 1 1/2 to 2 hours. (For a slow rise, refrigerate the covered bowl 10-12 hours, then bring to room temperature before using.)\n6. Punch down the risen dough and knead for 2 to 3 minutes. Press evenly into the bottom of an oiled 14-inch round deep-dish pizza pan.\n7. Let the dough rise in the pan for 15 to 20 minutes.\n8. Press the dough up the sides of the pan until it comes 2 inches up, even at the bottom and corners.\n9. Proceed with any deep-dish pizza recipe/filling.\n\n## Notes\nLet the dough rest before pressing it up the sides of the pan — it makes shaping much easier. Community feedback notes this version is lighter and less pastry-like than classic deep dish; some reviewers dispute that cornmeal belongs in \"authentic\" Chicago deep dish, and one popular tweak substitutes regular all-purpose flour for the bread flour with good results. One reviewer's tested weight measurements: 7g instant yeast, 60g+237g warm water, 4g sugar, 50g+384g flour, 75g cornmeal, 6g salt, 107g olive oil. For a two 9-10 inch pie version, this recipe makes enough dough to split in half.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "pgv6gcgrvz3cknw65uvpznhuwa", "title": "Chicken Chile Verde", "ainfo": "Chicken Chile Verde", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prepare oven according to Mugnaini's Roasting Environment, 500-600°F.", "notes": "# Chicken Chile Verde\n\nSource: https://www.mugnaini.com/recipes/chicken-chili-verde/ (original title \"Chicken Chili Verde\"; page now published as \"Chicken Chile Verde\" at https://mugnaini.com/chicken-chile-verde/)\n\nMugnaini Wood and Gas Fired Pizza Ovens. Cooked in a wood-fired oven, roasting environment 500-600°F.\n\n## Ingredients\n- 2 pounds tomatillos, husked and cut in half (quarters if large)\n- 1 large poblano or pasilla chili, cut in half lengthwise, seeds removed\n- 1 to 2 jalapeños, cut in half lengthwise, seeds removed\n- 1 medium white onion, peeled and cut into eighths\n- 4 cloves garlic, peeled and left whole\n- 3 tablespoons extra virgin olive oil\n- Kosher salt, to taste\n- 1 bunch cilantro\n- 2 cups chicken stock\n- 6 skin-on, bone-in chicken thighs\n- Flour\n- Kosher salt\n- Black pepper\n- Olive oil\n- Garnish: cilantro, crumbled cotija cheese, pickled radishes (recipe below)\n\n### Pickled Radishes\n- 1 bunch radishes, sliced 1/8 inch thin\n- 2 limes\n- Salt\n\n## Instructions\n1. Prepare oven according to Mugnaini's Roasting Environment, 500-600°F.\n2. Place tomatillos, poblano, jalapeño, onion, and garlic on a half sheet pan, drizzle with olive oil and salt, and toss to coat. Roast 10-12 minutes until vegetables are softened and charred. Let cool about 10 minutes.\n3. Add the roasted vegetables and any juices to a food processor with the cilantro leaves and pulse to combine. Check consistency — if too thick (holds its shape when dolloped), thin with chicken stock. Set aside.\n4. Season chicken with salt and pepper, then lightly dust with flour. Preheat a pan large enough to hold the chicken in a single layer inside the oven. Add about 2 tablespoons olive oil, then add chicken thighs skin side up. Slide back into the oven and lightly brown, rotating once for even exposure, 6-8 minutes.\n5. Once browned, pour the chile verde into the pan until it covers about 3/4 up the side of the chicken. Cover with foil and cook 40-45 minutes, until chicken is tender and breast internal temperature reaches at least 155°F. Uncover and cook 10 more minutes to reduce the sauce.\n6. Taste and adjust seasoning. Serve, passing garnishes separately.\n\n### Pickled Radishes\n1. In a small bowl, mix sliced radishes with the juice of two limes. Season with salt and set aside about 30 minutes.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "hv3qgf7yoeak4hjfnf7j7quj3y", "title": "Chipotle BBQ Sauce", "ainfo": "Chipotle BBQ Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mise en place: Chop the onion and measure all other ingredients.", "notes": "# Chipotle BBQ Sauce\n\nSource: https://getclipdish.com/recipes/that-dude-can-cook-bbq-sauce/\n\nFrom \"This Is The Reason I NEVER Buy BBQ Sauce\" (ClipDish, based on a recipe from That Dude Can Cook). Prep: 10 min | Cook: 20 min | Total: 30 min. Yield: approximately 2 cups.\n\nA flavorful Chipotle BBQ sauce perfect for grilling, providing a smoky kick with a touch of sweetness.\n\n## Ingredients\n- 1 large onion, chopped\n- 1/3 cup malt vinegar\n- 1/2 cup apple cider vinegar\n- 2/3 cup water\n- 2 cups ketchup\n- 2 1/2 tbsp molasses\n- 6 oz can of chipotle in adobo\n- 1/3 cup soy sauce\n- 1/3 cup dark brown sugar\n- 2 tbsp honey\n- 1 1/2 tbsp onion powder\n- 2 tsp garlic powder\n- 1 tsp black pepper\n\n## Instructions\n1. Mise en place: Chop the onion and measure all other ingredients.\n2. In a saucepan, combine the chopped onion, malt vinegar, apple cider vinegar, water, ketchup, molasses, chipotle in adobo, soy sauce, brown sugar, honey, onion powder, garlic powder, and black pepper.\n3. Bring the mixture to a simmer over medium heat, stirring occasionally.\n4. Reduce the heat to low and let the sauce cook for about 20 minutes, allowing the flavors to meld and the sauce to thicken.\n5. Let the BBQ sauce cool before transferring it to a jar. Store in the refrigerator for up to one month.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "klpceqrmy6hbaop3xscuvm2424", "title": "Chorizo Breakfast Burritos", "ainfo": "Chorizo Breakfast Burritos", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat a large non-stick pan over medium heat. Cook the chorizo, breaking it apart with a spatula, 8-10 minutes until cooked through. Drain off all but 1 tablespoon of the fat. Remove the chorizo (leaving the reserved fat in the pan) and transfer to a bowl.", "notes": "# Chorizo Breakfast Burritos\n\nSource: https://www.girlgonegourmet.com/chorizo-breakfast-burritos/\n\nBy April Anderson, Girl Gone Gourmet. Servings: 4 large burritos | Prep: 20 min | Cook: 30 min | Cuisine: American\n\n## Ingredients\n- 1 (8-oz) package Mexican chorizo\n- 2 tablespoons unsalted butter, divided\n- 8 eggs, whisked\n- 1 teaspoon salt, divided\n- 1/2 teaspoon black pepper, divided\n- 1/2 cup shredded cheddar cheese\n- 1/2 cup shredded Monterey jack cheese\n- 10 ounces shredded potatoes (see note)\n- 1 tablespoon chopped parsley or cilantro, optional\n- 4 burrito-sized flour tortillas\n\n## Instructions\n1. Heat a large non-stick pan over medium heat. Cook the chorizo, breaking it apart with a spatula, 8-10 minutes until cooked through. Drain off all but 1 tablespoon of the fat. Remove the chorizo (leaving the reserved fat in the pan) and transfer to a bowl.\n2. In the same pan, melt 1 tablespoon butter, stirring to combine with the reserved fat. Pour in the whisked eggs and add 1/2 teaspoon salt and 1/4 teaspoon pepper. Cook, stirring frequently, about 10 minutes until cooked but still very soft. Add the shredded cheese and stir until melted. Transfer eggs to a bowl.\n3. In the same pan, melt the remaining 1 tablespoon butter over medium-high heat. Add the potatoes and spread into an even layer. Sprinkle with remaining 1/2 teaspoon salt and 1/4 teaspoon pepper. Cook, stirring occasionally, until golden and crispy, about 10 minutes. Remove from heat.\n4. To assemble: microwave the tortillas about 30 seconds to warm and make them easier to stretch. Evenly divide the potatoes, eggs, and chorizo among the four tortillas. Sprinkle chopped herbs over the chorizo, if using.\n5. Fold the edge of the tortilla over the filling, tuck in the sides, and roll up. Repeat with remaining tortillas.\n6. Wrap the burritos in tin foil, place on a baking sheet, and warm in the oven 5-10 minutes before serving.\n\n## Notes\nStore-bought pre-shredded uncooked potatoes (refrigerated hashbrown-style) work well. Burritos keep refrigerated 3-4 days; reheat in microwave or oven. Can be frozen, though the tortilla can get a bit chewy when reheated from frozen — better to thaw in the fridge overnight first.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cymh6fljaxzkvq4sjgy6vm37fy", "title": "Classic Italian Meatballs (Tender and Juicy)", "ainfo": "Classic Italian Meatballs (Tender and Juicy)", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Put the breadcrumbs in a small bowl and pour the milk over. Let them soak for 5 minutes. Add the egg yolks, cheese, garlic, salt, and pepper to the bowl and mash together to form a coarse paste (the panade).", "notes": "# Classic Italian Meatballs (Tender and Juicy)\n\nSource: https://familystylefood.com/classic-italian-meatballs-2/\n\nBy Karen Tedesco, Familystyle Food. Prep: 15 min | Cook: 15 min | Total: 30 min. Course: Meat. Cuisine: Italian. Servings: approximately 16 meatballs.\n\n## Ingredients\n- 1/2 cup (54 g) fresh breadcrumbs, from 1-2 slices white bread (crust removed)\n- 1/4 cup (60 ml) milk\n- 2 egg yolks\n- 1/2 cup (50 g) grated pecorino Romano cheese, or Parmesan cheese\n- 2 garlic cloves, finely chopped or grated\n- 1 teaspoon (8 g) salt, or 2 teaspoons Diamond brand kosher salt (see note)\n- 1 teaspoon ground black pepper\n- 1 pound (450 g) ground beef chuck\n- 1 pound (450 g) ground pork, or veal\n- 1/4 cup grated onion, optional\n- 1/3 cup (30 g) chopped parsley, or basil\n- olive oil\n\n## Instructions\n1. Put the breadcrumbs in a small bowl and pour the milk over. Let them soak for 5 minutes. Add the egg yolks, cheese, garlic, salt, and pepper to the bowl and mash together to form a coarse paste (the panade).\n2. Put the beef, pork, and onion (if using) in a large bowl and mix with a fork to blend. Add the bread mixture and parsley. Blend everything together well using your hands, a large wooden spoon, or a large fork (or a standing mixer on low, just until blended). The mixture can be made and refrigerated up to 2 days ahead of shaping and cooking.\n3. Form the meatballs: use a 1/4-cup measuring cup or cookie scoop to portion the mixture and roll lightly into balls — they don't need to be perfect.\n\nTo cook on the stovetop:\n4. Pour enough oil into a large skillet to coat the bottom and place over medium-high heat. When hot, add as many meatballs as will fit without crowding (they should sizzle immediately).\n5. Brown the meatballs on all sides. Cover the pan, lower the heat, and continue cooking until firm and cooked through (165°F internal), about 15 minutes total. Repeat with remaining meatballs, pouring out and refreshing the oil each time.\n\nTo finish cooking in tomato sauce (preferred method):\n6. Transfer the browned meatballs to a pot of simmering sauce right after browning on all sides (they won't be fully cooked yet). Simmer until cooked through, 10-12 minutes.\n\nTo bake the meatballs:\n7. Preheat the oven to 425°F. Arrange the meatballs on an olive-oil-coated rimmed baking sheet. Bake 10 minutes, turn, then continue baking until nicely browned and cooked through, another 10-12 minutes.\n8. Serve warm with marinara or your favorite tomato sauce.\n\n## Notes\nEqual parts ground chuck and ground pork give the right fat ratio (15-20% fat); lean beef alone makes firmer, less forgiving meatballs. Bulk Italian sausage can replace the ground pork — reduce added salt by about 1/2 teaspoon since sausage is pre-seasoned. Fresh white breadcrumbs (not panko or dried) soaked in milk create a panade that keeps meatballs tender; using dried crumbs (1/3 cup instead of 1/2 cup, unseasoned) or panko (full 1/2 cup) works but yields a firmer result. Pecorino is saltier and sharper than Parmesan — if substituting Parmesan, add about 1/4 teaspoon more salt. Grate garlic finely so it disappears into the mixture. Don't overmix — this compacts the proteins and toughens the meatballs. Salt note: Diamond brand kosher salt has larger, fluffier granules than table salt or Morton kosher salt — if using Morton or another brand, reduce the specified amount by half. Freezes well up to 2 months (cool completely, freeze in an airtight container/bag, thaw overnight in the fridge, then reheat gently in sauce). Traditional serving: browned meatballs finished in homemade marinara, or Italian meat sauce for a richer result; also excellent over ricotta or potato gnocchi. Nutrition per meatball: 184 kcal, 3g carbs, 12g protein, 13g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "76bwmxdzogvtnacrbek7gu4jki", "title": "Classic Sourdough Pancakes or Waffles", "ainfo": "Classic Sourdough Pancakes or Waffles", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "To make the overnight sponge: in a large bowl, stir together the unfed starter, buttermilk, flour, and sugar. Cover and let rest at cool room temperature (about 65°F to 70°F) for about 12 hours, or overnight.", "notes": "# Classic Sourdough Pancakes\n\nSource: https://www.kingarthurbaking.com/recipes/classic-sourdough-waffles-or-pancakes-recipe (redirects to Classic Sourdough Pancakes; King Arthur notes their separate \"Overnight Sourdough Waffles\" recipe for a sturdier waffle version)\n\nRecipe by PJ Hamel. Prep: 42 min | Total: 12 hrs 42 min. Yield: about 2 dozen medium pancakes.\n\n## Ingredients\nOvernight sponge:\n- 1 cup (227g) sourdough starter, unfed/discard\n- 2 cups (454g) buttermilk\n- 2 cups (240g) King Arthur Unbleached All-Purpose Flour\n- 2 tablespoons (28g) granulated sugar\n\nBatter:\n- all of the overnight sponge\n- 2 large eggs\n- 1/4 cup (50g) vegetable oil or 4 tablespoons (57g) butter, melted\n- 1 teaspoon baking soda\n- 3/4 teaspoon table salt\n\n## Instructions\n1. To make the overnight sponge: in a large bowl, stir together the unfed starter, buttermilk, flour, and sugar. Cover and let rest at cool room temperature (about 65°F to 70°F) for about 12 hours, or overnight.\n2. To make the batter: in a small bowl or mixing cup, beat together the eggs and oil or butter. Add the egg mixture to the overnight sponge, stirring just to combine.\n3. Add the baking soda and salt, stirring to combine. The batter will expand and may bubble a bit.\n4. To cook the pancakes: pour the batter by the 1/4-cupful onto a preheated, lightly greased griddle. Cook until bubbles form and pop on the top side, then turn over and cook until browned underneath.\n5. Serve immediately with your favorite toppings, or hold in a warm oven until ready to serve.\n\n## Notes\nStorage: refrigerate leftovers for a day or two, or freeze for longer storage. For gluten-free, substitute King Arthur Gluten-Free Measure for Measure Flour 1:1; cook thoroughly, as gluten-free versions may cook more slowly.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "bumalwy6e7fi5rshzdabar7i4u", "title": "Classic Tuna Melt", "ainfo": "Classic Tuna Melt", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix the red onion, celery, mayonnaise, dill, capers or jalapeños, and lemon juice in a medium bowl until combined. Mix in the tuna, breaking it up with a fork. Season generously with pepper, then taste and add up to 1 tablespoon of the brine if it needs more salt.", "notes": "# Classic Tuna Melt\n\nSource: https://www.bonappetit.com/recipe/classic-tuna-melt\n\nBy Zaynab Issa, Bon Appétit. Total: 15 min. Yield: 4 servings.\n\n## Ingredients\n- 1 small red onion, finely chopped\n- 1 celery stalk, finely chopped\n- 1/2 cup mayonnaise (preferably Kewpie)\n- 1/3 cup finely chopped dill\n- 1 tablespoon drained capers or chopped pickled jalapeños, plus 1 tablespoon brine\n- 1 tablespoon fresh lemon juice\n- 1 (7 oz) jar oil-packed tuna fillets, or one and a half 5-oz cans oil-packed tuna, drained\n- Freshly ground pepper\n- 2 tablespoons butter, room temperature\n- 8 slices Pullman or sourdough bread\n- 4 slices American cheese or sharp cheddar\n- Dill pickles, kettle-style potato chips, and hot sauce, for serving\n\n## Instructions\n1. Mix the red onion, celery, mayonnaise, dill, capers or jalapeños, and lemon juice in a medium bowl until combined. Mix in the tuna, breaking it up with a fork. Season generously with pepper, then taste and add up to 1 tablespoon of the brine if it needs more salt.\n2. Spread the butter over one side of all 8 bread slices. Turn 4 slices buttered side down and top each with a slice of cheese, then divide the tuna mixture evenly over the cheese. Close the sandwiches with the remaining 4 slices, buttered side up.\n3. Heat a large cast-iron skillet over medium heat. Working in batches if needed, cook the sandwiches cheese-side down, turning once and pressing with a spatula for good contact, until the bread is golden and crisp and the cheese is melted, about 4 minutes per side (cover the pan after flipping if using cheddar, to help it melt).\n4. Transfer to a cutting board, slice in half, and serve with pickles and chips.\n\n## Notes\nAmerican cheese melts the most smoothly for a gooey texture; sharp cheddar gives more bite but needs a covered pan to melt fully. This version is a closed sandwich for maximum crunch, but it also works open-faced under the broiler. Starting cheese-side down and toasting the bread well is the key to avoiding a soggy sandwich. No added salt is needed — the pickled ingredients and seasoned mayo provide enough. Kettle chips and a dill pickle on the side are the classic accompaniments.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ysflaorw2upleangjq5e4okxza", "title": "Cocktail Meatballs", "ainfo": "Cocktail Meatballs", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place meat, bread crumbs, and milk into a large bowl. Combine using your hands or a large spoon. Allow the mixture to rest for 5 minutes.", "notes": "# Cocktail Meatballs\n\nSource: https://www.beyondthechickencoop.com/cocktail-meatballs/\n\nBy Kathy Berget, Beyond The Chicken Coop. Meatballs with apricot barbecue glaze. Course: Appetizer. Cuisine: American. Prep: 30 min | Cook: 25 min | Total: 55 min. Servings: 70 meatballs.\n\n## Ingredients\nMeatballs:\n- 1 1/2 pounds ground burger (ground beef, venison, or elk)\n- 2 cups dried breadcrumbs\n- 1/2 cup milk\n- 2 cloves garlic, finely minced\n- 1 1/2 teaspoons salt\n- 1 teaspoon pepper\n- 1 teaspoon onion powder\n- 1 teaspoon red pepper flakes\n\nSauce:\n- 1 cup barbecue sauce\n- 1 cup apricot jam\n- 1/2 teaspoon red pepper flakes\n\n## Instructions\nMeatballs:\n1. Place meat, bread crumbs, and milk into a large bowl. Combine using your hands or a large spoon. Allow the mixture to rest for 5 minutes.\n2. Add remaining meatball ingredients and mix well. Let the mixture rest for an additional 5 minutes and mix again.\n3. Use a small scoop to create meatballs. Place meatballs on a lightly greased baking sheet.\n4. Bake in a preheated 400°F oven for 10-12 minutes.\n5. Allow meatballs to cool. Remove from pan. Use right away, cover and refrigerate, or place in freezer-safe containers and freeze.\n\nSauce:\n6. Add barbecue sauce, apricot jam, and red pepper flakes to a saucepan. Heat over medium-low heat, stirring often.\n7. Simmer sauce until warm. Add a portion of the meatballs at a time. Heat until meatballs are heated through.\n8. Remove meatballs from sauce, letting excess sauce fall off. Add a cocktail toothpick and place on a serving tray. Repeat with remaining meatballs.\n9. Serve warm and garnish with chopped chives or parsley.\n\n## Notes\nCrockpot method: bake meatballs as directed, make the sauce in the crockpot, add cooked meatballs, and heat on high for 1-2 hours or low for 2-4 hours; serve directly from the crockpot. Tips: use a scoop to shape meatballs quickly; meatballs about 1 tablespoon of meat took the listed bake time — increase time for larger ones; test doneness by slicing one in half; keep glazed meatballs warm in a 200°F oven until serving. Freeze meatballs before saucing, in a freezer-safe container, for up to 3 months. Soaking breadcrumbs in milk softens them and helps prevent the meat protein from becoming tough.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "bhxnjlmjyw2yyxvsaxl2xxblry", "title": "Cocoa Oatmeal Cookies", "ainfo": "Cocoa Oatmeal Cookies", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 350 degrees F (175 degrees C).", "notes": "# Cocoa Oatmeal Cookies\n\nSource: http://allrecipes.com/recipe/10604/cocoa-oatmeal-cookies/\n\nPrep: 10 mins | Cook: 10 mins | Total: 20 mins | Servings: 48\n\n## Ingredients\n- 1 cup butter, softened\n- 1 cup packed brown sugar\n- 1/2 cup white sugar\n- 2 eggs\n- 1 teaspoon vanilla extract\n- 1 1/2 cups all-purpose flour\n- 1/3 cup unsweetened cocoa powder\n- 1 teaspoon baking soda\n- 1/2 teaspoon salt\n- 3 cups rolled oats\n- 1 cup raisins\n\n## Instructions\n1. Preheat the oven to 350 degrees F (175 degrees C).\n2. Beat butter or margarine and sugars until creamy. Add eggs and vanilla; beat well.\n3. Add combined flour, cocoa powder, baking soda, and salt; mix well. Stir in oats and raisins, mix well.\n4. Drop dough by rounded tablespoonfuls onto ungreased cookie sheets. Bake 10 to 12 minutes, until cookies are almost set. Do not overbake.\n5. Cool 1 minute on cookie sheets, then move to wire racks. Cool; store tightly covered.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ristrhtz3xkh2g447hjndpgbnm", "title": "Coconut Red Curry with Sauteed Bok Choy and Jasmine Coconut Rice", "ainfo": "Coconut Red Curry with Sauteed Bok Choy and Jasmine Coconut Rice", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Bring a medium pot of water to a boil and season generously with kosher salt (as salty as the sea). Prepare an ice bath and season generously with kosher salt. Add the bok choy stems and leaves to the boiling water and cook 1 to 2 minutes, until tender but still crunchy. Remove and immediately plunge into the ice bath; set aside. Drain the water — you can reserve the pot for the curry sauce.", "notes": "# Coconut Red Curry with Sauteed Bok Choy and Jasmine Coconut Rice\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/anne-burrell/coconut-red-curry-with-sauteed-bok-choy-and-jasmine-coconut-rice-12470483.amp (retrieved via canonical URL)\n\nRecipe courtesy of Anne Burrell. Level: Intermediate. Total: 1 hr | Active: 45 min. Yield: 4 servings.\n\n## Ingredients\n- Kosher salt\n- Ice\n- 2 pieces bok choy, stems thinly sliced and leaves left whole\n- 6 tablespoons extra-virgin olive oil, plus more as needed\n- 4 cloves garlic, minced\n- 1-inch piece ginger, grated\n- 1 cup jasmine rice, rinsed and drained\n- 2 (13-ounce) cans coconut milk\n- 1/2 cup plus 1/3 cup chicken stock\n- 1 small bunch cilantro, stems minced and leaves chopped, plus more whole leaves for garnish\n- 1/2 yellow onion, sliced\n- 2 scallions, thinly sliced on a bias, whites and greens separated\n- 2 tablespoons red curry paste\n- 2 tablespoons plus 1 teaspoon fish sauce\n- 3 teaspoons palm sugar\n- Zest and juice of 1/2 lime\n- 2 (5-ounce) red snapper fillets, skin on\n- 4 large shrimp, deveined and head on and tail on, but rest of shell removed\n\n## Instructions\n1. Bring a medium pot of water to a boil and season generously with kosher salt (as salty as the sea). Prepare an ice bath and season generously with kosher salt. Add the bok choy stems and leaves to the boiling water and cook 1 to 2 minutes, until tender but still crunchy. Remove and immediately plunge into the ice bath; set aside. Drain the water — you can reserve the pot for the curry sauce.\n2. To a medium saucepan, add 2 tablespoons of the olive oil, half of the garlic, and half of the ginger. Cook over medium heat, stirring occasionally, until softened and fragrant, 2 to 3 minutes. Add the rice and stir to coat fully with the oil, garlic, and ginger. Turn up the heat to medium-high and toast the rice for 1 to 2 minutes. Add 1 can of the coconut milk, 1/3 cup of the chicken stock, and kosher salt to taste. Bring to a boil, then cover, reduce to a simmer, and cook 18 minutes. Turn off the heat and let sit, without opening the lid, for 10 minutes. Fluff with a fork and fold in the chopped cilantro leaves.\n3. To make the curry sauce, heat 2 tablespoons of the olive oil over medium-high heat in the same pot used to blanch the bok choy. Add the remaining garlic and ginger, the onion, and minced cilantro stems. Cook until softened and fragrant, 2 to 3 minutes. Add the scallion whites, red curry paste, 2 tablespoons of the fish sauce, and the palm sugar. Stir to combine and cook 2 to 3 minutes. Stir in the remaining can of coconut milk and 1/2 cup chicken stock. Bring back to a boil, then reduce to a simmer and cook 10 to 15 minutes, until reduced and slightly thickened. Add the lime juice and zest.\n4. Pat the skin dry on the red snapper and sprinkle with kosher salt. Heat a large nonstick pan with the remaining 2 tablespoons olive oil over medium-high heat. Place the snapper skin-side down in the pan. Place another oiled pan on top of the fish to weigh it down so the skin gets crispy. Cook until the skin is crisp, about 4 minutes, then remove the top pan and flip the fish. Cook 2 more minutes, then remove to a sheet tray skin-side up. Add the shrimp and cook 2 minutes per side, until pink, then remove. Add a bit more olive oil to the pan, then add the bok choy and the remaining 1 teaspoon fish sauce. Stir and sauté 1 to 2 minutes to warm through.\n5. Plate the rice and top with the sauteed bok choy. Place the fish and shrimp over the bok choy. Spoon the red curry sauce around the rice, being careful not to cover the fish skin so it stays crispy. Garnish with sliced scallion greens and cilantro leaves.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cg2fehlehlbvdjvwfxglkd6unm", "title": "Coconut Tres Leches Cake", "ainfo": "Coconut Tres Leches Cake", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Bake the cake in a 9-by-13-inch baking dish, following the package instructions. Let cool for 30 minutes.", "notes": "# Coconut Tres Leches Cake\n\nSource: https://www.foodnetwork.com/recipes/katie-lee/coconut-tres-leches-cake-12562148\n\nRecipe courtesy of Katie Lee Biegel. Level: Easy. Total: 11 hr 35 min (includes cooling and chilling times) | Active: 20 min. Yield: 10 to 12 servings.\n\n## Ingredients\n- 1 (16.25-ounce) box dairy-free white cake mix, such as Duncan Hines\n- 2 cups full-fat almond milk\n- 2 (7.4-ounce) cans sweetened condensed coconut milk\n- 1 (13.5-ounce) can coconut milk, well shaken\n- 1 teaspoon vanilla extract\n- 1 (9-ounce) container frozen non-dairy coconut whipped cream, thawed\n- 1 cup sweetened coconut flakes, toasted\n\n## Instructions\n1. Bake the cake in a 9-by-13-inch baking dish, following the package instructions. Let cool for 30 minutes.\n2. In a large bowl, whisk together the almond milk, sweetened condensed coconut milk, coconut milk, and vanilla.\n3. Poke holes all over the cake. Pour the milk mixture over the top, a little at a time, letting it soak, so the liquid doesn't overflow. Cover and let soak in the refrigerator for at least 10 or up to 24 hours (the cake should absorb all the liquid, with none pooled on top or sides).\n4. Spread the whipped cream evenly over the cake, then sprinkle the toasted coconut all over the top. Serve chilled or at room temperature.\n\n## Notes\nTo toast the coconut: heat a large skillet over low heat, add the coconut, and toast, stirring often, until lightly browned, 4 to 5 minutes. Alternatively, toast on a parchment-lined sheet tray in a 350°F oven for 5 to 6 minutes. This dairy-free version uses almond and coconut milk instead of the traditional evaporated/condensed/whole milk trio, topped with coconut whipped cream instead of dairy whipped cream. Several reviewers found the amount of milk mixture generous relative to what the cake absorbs — consider pouring slowly and reserving some liquid if it isn't fully absorbing.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "mhkmvlphzfqjzs6btsfiiyxo2q", "title": "Copycat Alley Restaurant Oxtail Soup", "ainfo": "Copycat Alley Restaurant Oxtail Soup", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Boil oxtail in water for 15 minutes. Drain and rinse well to remove the scum.", "notes": "# Copycat Alley Restaurant Oxtail Soup\n\nSource: https://www.angsarap.net/2017/07/10/copycat-alley-restaurant-oxtail-soup/\n\nBy Raymund. Prep: 15 min | Cook: 2 hrs 20 min | Total: 2 hrs 35 min. Yield: 4-5. Category: Main Course. Cuisine: American.\n\n## Ingredients\nSoup:\n- 1 1/2 kg oxtails\n- 4 cups beef stock\n- 2 slices large orange peel\n- 3 pcs star anise\n- 4 pcs ginger slices\n- 8 pcs dried shiitake mushroom\n- 6 pcs Chinese dried dates\n- 1/4 cup raw peanuts\n- 1/4 cup whiskey\n- 2 bunches baby bok choy, trimmed\n- salt\n\nDipping Sauce:\n- 1/3 cup light soy sauce\n- 2 tbsp grated radish\n- juice from 2 lemons\n- sesame seed\n- chopped chillies\n\n## Instructions\n1. Boil oxtail in water for 15 minutes. Drain and rinse well to remove the scum.\n2. Place the oxtails back into a clean pot, pour in the beef stock, then add just enough water to cover the oxtails. Also add the orange peel, star anise, ginger, and salt. Bring to a boil then simmer on low heat for one hour.\n3. Add the shiitake mushrooms, dried dates, raw peanuts, and whiskey, then continue to boil for one more hour on low heat.\n4. Season with salt then add the baby bok choy, cook for 2 more minutes.\n5. Prepare the dipping sauce by combining all dipping sauce ingredients.\n6. Place soup in a bowl, garnish with chopped spring onions and chopped coriander, then serve with dipping sauce.\n\n## Notes\nA homemade recreation of the oxtail soup from The Alley Restaurant in Aiea, Hawaii, as featured on Diners, Drive-Ins and Dives with Guy Fieri. Oxtail's collagen gives the soup a thick texture, while shiitake mushrooms add an earthy, umami depth.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "skgulhbb2e5m6wy4buim4ckmoe", "title": "Cowboy Candy (Candied Jalapeños)", "ainfo": "Cowboy Candy (Candied Jalapeños)", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Remove and discard the jalapeño stems before cutting the peppers into 1/4-inch thick coins.", "notes": "# Cowboy Candy (Candied Jalapeños)\n\nSource: https://www.thepioneerwoman.com/food-cooking/recipes/a35392524/candied-jalapenos-recipe/ (original bookmark URL now 404s; content retrieved from the current live page at https://www.thepioneerwoman.com/food-cooking/recipes/a40410570/cowboy-candy-candied-jalapenos-recipe/)\n\nBy Georgia Goode, Carrie Marie Sawyer. Prep: 10 min | Total: 30 min. Yields: 2 cups.\n\n## Ingredients\n- 1 lb. jalapeño peppers\n- 1 cup apple cider vinegar\n- 1 1/2 cups granulated sugar\n- 1 tsp. salt\n- 1 tsp. pickling spice (optional)\n\n## Instructions\n1. Remove and discard the jalapeño stems before cutting the peppers into 1/4-inch thick coins.\n2. In a medium saucepan, combine the vinegar, sugar, salt, and pickling spices, if using. Bring to a boil over medium-high heat, stirring occasionally, until the sugar dissolves, about 3 minutes.\n3. Add the jalapeños and return to a boil. Reduce the heat to medium-low and simmer until the peppers look slightly shrunken and glossy, about 5 to 6 minutes.\n4. Using a slotted spoon, transfer the jalapeños to a pint-sized mason jar or heat-proof container. Bring the liquid back to a boil and cook until it is syrupy and has reduced to about 1 1/2 cups, 8 to 10 minutes.\n5. Pour the syrup over the jalapeños, pressing the peppers down so that they remain submerged. Cool to room temperature before sealing and refrigerating.\n\n## Notes\nAlso known as Cowboy Candy. Use fresh jalapeños only — frozen ones turn mushy, and canned won't work well. Wear gloves when slicing to avoid capsaicin burns. Stored in the fridge, candied jalapeños last up to one month (canning/sealing yields a longer shelf life). Great as a garnish for dips, chopped into baked beans or tuna salad, atop burgers or bacon-wrapped hot dogs, or the syrup used in place of simple syrup in cocktails like a spicy margarita or bloody Mary.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "xmivdkd6isftlmigsupd4zl6vy", "title": "Creamed Corn", "ainfo": "Creamed Corn", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Cut the corn kernels from the cobs using a sharp knife; set the corn kernels aside. Holding the corn cob upright with the base resting on a plate or rimmed baking sheet, scrape the blade of the knife down the corn cob to extract any extra corn pulp or juices. Reserve the juices and pulp (about 1 cup); discard the cobs or freeze them for making stock or chowder. Add 4 cups of the corn kernels to a blender or food processor; pulse until very finely chopped; set aside.", "notes": "# Creamed Corn\n\nSource: https://www.thepioneerwoman.com/food-cooking/recipes/a40230219/creamed-corn-recipe/\n\nBy Josh Miller. Prep: 15 min | Total: 1 hr. Yields: 8-10 servings.\n\n## Ingredients\n- 12 ears fresh corn, shucked (about 12 cups kernels)\n- 1/4 cup salted butter\n- 2 Tbsp. olive oil\n- 1 small yellow onion, chopped\n- 1 1/2 tsp. kosher salt\n- 1 tsp. ground black pepper\n- 3 cups milk\n- 1/4 cup fresh basil leaves, chopped, plus more for garnish\n\n## Instructions\n1. Cut the corn kernels from the cobs using a sharp knife; set the corn kernels aside. Holding the corn cob upright with the base resting on a plate or rimmed baking sheet, scrape the blade of the knife down the corn cob to extract any extra corn pulp or juices. Reserve the juices and pulp (about 1 cup); discard the cobs or freeze them for making stock or chowder. Add 4 cups of the corn kernels to a blender or food processor; pulse until very finely chopped; set aside.\n2. In a Dutch oven or large skillet, melt the butter over medium heat. Add the olive oil and onion; cook, stirring occasionally, until softened, about 5 minutes.\n3. Add all the corn kernels, corn pulp and juices, salt, and pepper, stirring to combine. Add the milk and bring to a simmer. Reduce the heat to medium-low, and cook, stirring often, until the mixture has thickened, about 30 minutes.\n4. Just before serving, stir in the basil. Garnish with extra basil, if you like.\n\n## Notes\nInspired by Ree Drummond's fresh corn casserole, this stovetop version goes light on dairy and thickens naturally using the sweet juices scraped from the corn cobs rather than heavy cream or flour. To cut kernels from the cob: line a cutting board with a clean dish towel, stand the cob upright pointed-end up, and slice downward letting kernels fall onto the towel. Canned creamed corn isn't a good substitute since it already contains seasonings and thickeners. Frozen corn can be used — reserve about 2 cups of kernels and pulse them in a food processor to help the mixture turn out creamy. Freezes beautifully; thaw and reheat gently in a saucepan over medium-low heat, adding the basil only just before serving.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "quxesp22b3gl3b57uk4sz3xmam", "title": "Creamy Baked Mac and Cheese", "ainfo": "Creamy Baked Mac and Cheese", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 325°F and grease a 3 qt (9x13\") baking dish. Set aside.", "notes": "# Creamy Baked Mac and Cheese\n\nSource: https://www.thechunkychef.com/family-favorite-baked-mac-and-cheese/\n\nBy The Chunky Chef. Prep: 20 min | Cook: 15 min | Total: 35 min. Servings: 8.\n\n## Ingredients\n- 1 lb. dried elbow pasta\n- 1/2 cup unsalted butter\n- 1/2 cup all purpose flour\n- 1 1/2 cups whole milk\n- 2 1/2 cups half and half\n- 4 cups shredded medium cheddar cheese, divided (measured after shredding)\n- 2 cups shredded Gruyere cheese, divided (measured after shredding)\n- 1/2 Tbsp. salt\n- 1/2 tsp. black pepper\n- 1/4 tsp. paprika (smoked paprika preferred)\n\n## Instructions\n1. Preheat oven to 325°F and grease a 3 qt (9x13\") baking dish. Set aside.\n2. Bring a large pot of salted water to a boil. Cook the pasta 1 minute less than package directions for al dente. Drain and drizzle with a little olive oil to keep from sticking.\n3. While water heats, shred the cheeses and toss together, then divide into three piles: about 3 cups for the sauce, 1 1/2 cups for the inner layer, and 1 1/2 cups for the topping.\n4. Melt butter in a large saucepan over medium heat. Sprinkle in flour and whisk to combine (mixture will look like wet sand). Cook about 1 minute, whisking often. Slowly pour in about 2 cups of the half and half, whisking constantly until smooth. Slowly pour in the remaining half and half plus the whole milk, whisking until smooth.\n5. Continue heating over medium heat, whisking often, until thickened to a very thick consistency (almost like semi-thinned condensed soup).\n6. Remove from heat and stir in the spices and 1 1/2 cups of the cheeses, stirring to melt and combine. Stir in another 1 1/2 cups of cheese until completely melted and smooth.\n7. In a large mixing bowl, combine the drained pasta with the cheese sauce, stirring to combine fully. Pour half of the mixture into the prepared baking dish. Top with 1 1/2 cups of shredded cheese, then top with the remaining pasta mixture.\n8. Sprinkle the top with the last 1 1/2 cups of cheese and bake for 15 minutes, until bubbly and lightly golden brown.\n\n## Notes\nCooking tips: boil pasta a bit under al dente since it continues cooking in the oven; use room-temp milk/half and half for faster thickening; shred your own cheese rather than pre-shredded (anti-clump starch prevents good melting). Favorite cheese combos beyond cheddar/gruyere: mozzarella, gouda, smoked gouda, swiss, monterey jack, colby jack, colby.\n\nVariations: add crispy crumbled bacon; make stovetop instead of baked (skip layering, use 3-3.5 cups cheese total); top with panko or crushed Ritz crackers mixed with melted butter instead of cheese; for a crunchier top, bake at 350-375°F for 20-30 minutes then broil 2-5 minutes.\n\nFive-cheese variation: 2 cups cheddar, 1 cup Colby, 1 cup Muenster, 1 1/2 cups Gruyere, 1/2 cup mozzarella, all shredded.\n\nMake-ahead: assemble but don't bake, cool completely, cover tightly and refrigerate 1-2 days; let sit at room temp 30 minutes before baking 25-35 minutes until hot and bubbly (note: loses some creaminess vs. fresh). Freezing (untested by author but reader-suggested): assemble unbaked, cool, wrap tightly in foil, freeze; thaw fully in the fridge, sit at room temp 30 minutes, then bake as directed plus 10-15 extra minutes. Storage: refrigerate leftovers 3-4 days; reheat with a splash of milk or cream, partially covered, stirring often.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "xqi7dl4ayrm7cie7j3dcphpv7a", "title": "Crispy Duck Breast with Caper-Cherry Sauce", "ainfo": "Crispy Duck Breast with Caper-Cherry Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Score the skin side of the duck breasts with a knife. Combine the cardamom, coriander, lavender, salt and pepper in a small bowl. Sprinkle the skin side of the duck breasts with the spice mixture. Let the duck breasts sit in the refrigerator, uncovered, for 2 days (this dries the skin slightly for a crispier result). Remove from the refrigerator and let sit at room temperature for 1 hour before cooking.", "notes": "# Crispy Duck Breast with Caper-Cherry Sauce\n\nSource: https://www.foodnetwork.com/recipes/geoffrey-zakarian/crispy-duck-breast-with-caper-cherry-sauce-8318654\n\nRecipe courtesy of Geoffrey Zakarian. Level: Intermediate | Total: 2 days 1 hr (includes chilling) | Active: 35 min | Yield: 2 servings\n\n## Ingredients\n- 2 duck breasts\n- 1/2 teaspoon ground cardamom\n- 1/2 teaspoon ground coriander\n- 1/2 teaspoon ground lavender\n- 1/2 teaspoon kosher salt\n- 1/2 teaspoon freshly ground black pepper\n- 1 shallot, minced\n- 1/4 cup Amarena cherries, in liquid\n- 2 tablespoon capers, drained\n- 1/4 cup brandy\n- 1 cup chicken stock\n- 1 teaspoon red wine vinegar\n- 2 bunches watercress leaves\n\n## Instructions\n1. Score the skin side of the duck breasts with a knife. Combine the cardamom, coriander, lavender, salt and pepper in a small bowl. Sprinkle the skin side of the duck breasts with the spice mixture. Let the duck breasts sit in the refrigerator, uncovered, for 2 days (this dries the skin slightly for a crispier result). Remove from the refrigerator and let sit at room temperature for 1 hour before cooking.\n2. Place the duck breasts skin-side down in a nonstick pan and cook over low to medium heat, letting the skin render its fat and draining it off occasionally, until fully rendered, brown and crispy, 15 to 20 minutes.\n3. Flip the duck breasts over and cook for 3 minutes, basting with the fat in the pan. Remove the duck from the pan and let rest for 10 minutes.\n4. Drain some excess fat from the pan, then add the shallot. Cook over medium heat until soft, about 2 minutes. Add the cherries, capers and brandy, and flame the pan to cook off the liquid. Reduce to a glaze.\n5. Add the chicken stock and reduce until thick. Season with the red wine vinegar. Slice the duck and serve with the sauce and watercress.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "gsdgokqocjznouzwjvgkwqvn4y", "title": "Crispy Sweet Chilli Chicken", "ainfo": "Crispy Sweet Chilli Chicken", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Coat the chicken – Place the chicken in a large bowl with the sweet paprika, garlic powder, salt, pepper, egg and cornflour. Mix the chicken well until the other ingredients form a paste around it. Set aside.", "notes": "# Crispy Sweet Chilli Chicken\n\nSource: https://simplehomeedit.com/recipe/crispy-sweet-chilli-chicken/#recipe-notes\n\nBy Nicole, Simple Home Edit. Prep: 10 min | Cook: 10 min | Total: 20 min.\n\n## Ingredients\nChicken:\n- 600 g (1¼ lb) boneless, skinless chicken breast or chicken thigh, cut into bite-sized pieces\n- 1 tsp sweet paprika\n- 1 tsp garlic powder\n- ½ tsp sea salt flakes\n- ½ tsp freshly cracked black pepper\n- 1 egg\n- 60 g (½ cup) cornflour (cornstarch)\n- Oil, for frying (see note 1)\n\nSweet Chilli Sauce:\n- 1 tsp freshly minced garlic\n- 1 tsp freshly minced ginger\n- 125 ml (½ cup) sweet chilli sauce\n- 60 ml (¼ cup) tamari or all-purpose soy sauce\n- 60 ml (¼ cup) rice wine vinegar, apple cider vinegar or lime juice (see note 2)\n\nTo Serve:\n- Steamed rice\n- 1 spring onion (scallion), finely sliced\n- 1 tsp sesame seeds\n\n## Instructions\nStovetop Instructions\n1. Coat the chicken – Place the chicken in a large bowl with the sweet paprika, garlic powder, salt, pepper, egg and cornflour. Mix the chicken well until the other ingredients form a paste around it. Set aside.\n2. Combine the sauce ingredients – To make the sauce, combine all the ingredients in a medium bowl. Set aside.\n3. Brown the chicken – Heat the oil over medium-high heat in a large, deep, heavy-based frying pan. Cook the chicken for 5-6 minutes or until it is cooked through and golden all over, turning once halfway through. Set aside on a paper towel to drain excess oil.\n4. Drain the oil from the frying pan and wipe the pan clean.\n5. Cook the chicken in the sauce – Heat the pan over medium-low heat and add the sauce. Stir for 2-3 minutes until the sauce begins to bubble gently and thicken. Turn the heat off and return the chicken to the pan, stirring so that it is evenly coated in the sauce.\n6. Serve – Serve the chicken immediately, heaped on top of steamed rice. Top with finely sliced spring onion and a sprinkle of sesame seeds.\n7. Optional: Add 1-2 tablespoons of boiling water (from the kettle) to the bottom of the pan once the chicken has been removed. Use a spoon to stir the water into the remaining sauce and use this extra sauce to pour over the completed dish.\n\nAir Fryer Instructions\n1. Coat the chicken – Coat the chicken in the egg, spices and seasoning as per the recipe, but don't add the cornflour yet.\n2. Once coated, dip each piece individually into the cornflour so it is evenly coated all over, which will help create a crispy coating.\n3. Cook the chicken – Spray the base of your air fryer basket with oil. Place the chicken in a single layer in the basket and spray generously with oil so the surface is completely covered.\n4. Air fry at 200°C (400°F) for 6-8 minutes, shaking the basket or turning the pieces halfway through cooking time, until golden and cooked through.\n5. Make the sauce – Meanwhile, make the sauce on the stovetop as per the recipe, then toss the crispy chicken through the sauce to serve.\n\n## Notes\nNote 1 (oil): The recipe is based on using a high smoke-point oil such as vegetable oil or canola (rapeseed) oil, which produces a light, crispy coating. You will need enough oil so the bottom of the pan is covered and the oil is at least 5 mm (¼ inch) deep. For regular weeknight cooking, olive oil also works well. It produces a denser coating that isn't as even in colour, but is equally delicious — use 4 tablespoons of olive oil (or olive oil spray to coat the pan and chicken), then cook over medium-high heat for 6-8 minutes, or until cooked through, turning once halfway through. See the FAQs on the site for air frying instructions.\n\nNote 2 (vinegar): The amount of vinegar required depends on the sweetness of the sweet chilli sauce you're using. If in doubt, start with 2 tablespoons and add more to taste. Make sure the sauce is well reduced in step 5 — this helps cook out the acidity and increase the sweetness.\n\nMake Ahead: Best made and eaten immediately, but cutting the chicken and storing it refrigerated in an airtight container is a great way to speed up the dinner process.\n\nLeftovers: Can be refrigerated for up to 3 days. The coating softens during reheating, but the chicken stays tender and juicy.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "nxfrrs73edapahpcd3y5haltvm", "title": "Cumberland Sauce with Venison", "ainfo": "Cumberland Sauce with Venison", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Take the venison out of the fridge and salt it well. Let it rest at room temperature for 30 minutes.", "notes": "# Cumberland Sauce with Venison\n\nSource: https://honest-food.net/venison-cumberland-sauce-recipe/\n\nBy Hank Shaw, Honest Food. Course: Main Course | Cuisine: British | Servings: 4 | Prep: 30 min | Cook: 15 min | Total: 45 min\n\n## Ingredients\n### Venison\n- 1 to 1.5 pounds venison backstrap, in one piece\n- Salt\n- 3 tablespoons unsalted butter, duck fat, or cooking oil\n\n### Cumberland Sauce\n- 1 shallot, minced\n- Salt\n- 1/2 cup Port wine, or red wine\n- 1/4 cup demi-glace, or 1 cup regular stock (unsalted if possible)\n- 1/2 teaspoon dry mustard\n- 1/4 teaspoon cayenne\n- Zest of a lemon and an orange\n- 1/3 cup red currant jelly (or similar, see notes)\n- Freshly ground black pepper\n\n## Instructions\n### Venison\n1. Take the venison out of the fridge and salt it well. Let it rest at room temperature for 30 minutes.\n2. Melt the butter over medium-high heat in a sauté pan large enough to hold the venison. Once hot, turn heat down to medium. Pat the meat dry, then brown on all sides, cooking to your preferred doneness (medium-rare recommended) — remember it will continue cooking as it rests, so pull it a bit early. Move to a cutting board, grind black pepper over it, and let rest while making the sauce.\n\n### Cumberland Sauce\n1. Once the meat is out of the pan, make sure there's at least 1 tablespoon of butter or oil in it (add more if needed). Sauté the shallot over medium-high heat 2 minutes, just until softened — don't let it burn. Lightly salt.\n2. Add the Port wine, scraping up any browned bits with a wooden spoon. Boil furiously until reduced by half. Add the demi-glace (or stock), citrus zest, mustard, and cayenne; boil 1-2 minutes. Stir in the red currant jelly and black pepper. Boil down until thick but still pourable — a wooden spoon dragged through should leave a brief trail. Strain if you want it more refined.\n3. Slice the venison into medallions. Pour any accumulated meat juices into the sauce and stir to combine. Serve the sauce over the meat or alongside.\n\n## Notes\nRed currant jelly is widely available in supermarkets; lingonberry or cranberry jelly are good substitutes (raspberry less so). Syrup versions of these fruits dissolve more easily into the sauce than jelly. Homemade demi-glace (glace de viande) is ideal but takes time — shelf-stable versions are sold at specialty markets, or substitute well-reduced unsalted stock. Works well beyond venison too — hare, lamb, duck, and goose. Pairs well with mashed, boiled, or baked potatoes, polenta, or fried hominy.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qaxn3h46i3vdvhcczks5ytbgrq", "title": "Delmonico's Steak Oscar", "ainfo": "Delmonico's Steak Oscar", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 450°F.", "notes": "# Delmonico's Steak Oscar\n\nSource: https://www.emerils.com/130909/delmonicos-steak-oscar\n\nEmeril Lagasse, Emeril's Delmonico. Yield: 4 servings. Dish Type: Entree. Cuisine: American. Effort Level: Moderate.\n\n## Ingredients\n- 8 oz (2 sticks) unsalted butter, at room temperature\n- 1/4 cup minced fresh parsley\n- 3 teaspoons freshly squeezed lemon juice\n- 4 1/2 teaspoons salt, plus more for seasoning asparagus\n- 2 1/4 teaspoons freshly ground black pepper, plus more for seasoning asparagus\n- Four 14- to 16-oz ribeyes, New York strip steaks, or T-bones, excess fat trimmed\n- 2 tablespoons plus 1 teaspoon olive oil\n- 8 oz jumbo lump crabmeat, picked over for shells and cartilage\n- 1 bunch asparagus, trimmed\n- Bearnaise Sauce, for serving\n\n## Instructions\n1. Preheat the oven to 450°F.\n2. Combine the butter, parsley, lemon juice, 1/2 teaspoon of the salt, and 1/4 teaspoon of the pepper in a medium bowl and stir until combined (maître d'hôtel butter). Set aside.\n3. Heat a large cast-iron skillet over medium-high heat.\n4. Rub both sides of the steaks with 4 teaspoons of the olive oil and season evenly with the remaining 4 teaspoons salt and 2 teaspoons pepper. Sear in the hot skillet (in batches if necessary) for 4 minutes per side until nicely browned. Transfer the skillet to the oven and roast to desired doneness, 6 to 8 minutes for medium-rare (130°F internal temperature; 140°F for medium).\n5. While the steaks cook, toss the asparagus with the remaining tablespoon of olive oil, spread on a baking sheet, season with salt and pepper, and roast until crisp-tender and lightly golden, 8 to 10 minutes.\n6. Remove the steaks and asparagus from the oven; let the steaks rest 5 minutes before serving.\n7. Heat a small skillet over medium-high heat, add 2 to 3 tablespoons of the maître d'hôtel butter, then add the crabmeat and cook, stirring gently to avoid breaking up the lumps, until warmed through.\n8. To serve, top each steak with several asparagus spears, divide the crabmeat among the steaks, and drizzle with Bearnaise Sauce. Pass any remaining Bearnaise Sauce at the table.\n\n## Notes\nUnused maître d'hôtel butter keeps in an airtight container in the fridge up to 1 week, or frozen for several months.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "icqjycwnqkjukinh7wndpwutje", "title": "Dry Wing Rub Basic", "ainfo": "Dry Wing Rub Basic", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine all ingredients and mix well.", "notes": "# Dry Wing Rub Basic\n\nSource: Google Keep note\n\n## Ingredients\n- 2 tbs pepper\n- 2 tbs salt\n- 1.5 tbs oregano\n- 1.5 tbs paprika\n- 1 tbs garlic powder\n- 1 tbs onion powder\n- 1 tbs cumin\n- 0.5 tbs chili powder\n\n## Instructions\n1. Combine all ingredients and mix well.\n2. Coat wings evenly with the dry rub before cooking.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vhxlo6dpxsraye5ly7wcuuu77e", "title": "Easy Authentic Mexican Rice", "ainfo": "Easy Authentic Mexican Rice", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, heat the oil over medium heat. Add the rice and cook, stirring constantly to avoid burning, about 5 minutes, until lightly golden brown.", "notes": "# Easy Authentic Mexican Rice\n\nSource: https://www.iheartnaptime.net/easy-mexican-rice/#recipe\n\nBy Jamielyn Nye, I Heart Naptime. Prep: 10 min | Cook: 30 min | Total: 40 min. Servings: 6.\n\n## Ingredients\n- 2-3 tablespoons oil (canola or olive oil)\n- 1 1/2 cups long grain white rice (measured dry)\n- 1/2 cup onion, finely diced\n- 2-3 cloves garlic, minced\n- 3 cups chicken broth, or water (see notes)\n- 3/4 cup tomato sauce\n- 1/2 teaspoon ground cumin (or taco seasoning), plus more to taste\n- 1 teaspoon Kosher salt, plus more to taste\n- Optional: chopped cilantro\n\n## Instructions\n1. In a large skillet, heat the oil over medium heat. Add the rice and cook, stirring constantly to avoid burning, about 5 minutes, until lightly golden brown.\n2. Push the rice to one side of the skillet. Add the diced onion and cook 2 to 3 minutes. Stir in the garlic and cook 1 minute more. Stir the rice into the onion mixture.\n3. Stir in the broth, tomato sauce, cumin, and salt. Bring to a boil. Reduce heat to low and cover.\n4. Simmer 25 to 35 minutes, until the rice has absorbed the liquid and is cooked through.\n5. Remove from heat and fluff with a fork. Stir in fresh cilantro if desired. Season with salt and pepper to taste, and serve.\n\n## Notes\nWater can substitute for broth — dissolve 2 chicken bouillon cubes in it for flavor. A 14.5-oz can of petite diced or crushed tomatoes can replace the tomato sauce (remove 1/2 cup of broth/water if using the whole can). Vegetables like carrots, green beans, bell pepper, or peas can be added. Use long grain white rice specifically, measured dry with a standard measuring cup — Minute Rice is not recommended for this method.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "jk32d2qodhogqeexevhmaqkht4", "title": "Easy Cheesecake with Blueberry Topping", "ainfo": "Easy Cheesecake with Blueberry Topping", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 350°F.", "notes": "# Easy Cheesecake with Blueberry Topping\n\nSource: http://natashaskitchen.com/2009/11/23/best-cheesecake-with-blueberry-topping/\n\nBy Natasha of NatashasKitchen.com. Prep: 15 minutes | Cook: 1 hr 33 minutes | Total: 1 hr 48 minutes | Servings: 12 slices\n\n## Ingredients\n### The Crust\n- 1 1/2 cups graham cracker crumbs\n- 6 Tbsp (3/4 stick) melted, unsalted butter\n- 1 Tbsp sugar\n\n### The Cheesecake\n- 2 1/2 lb cream cheese (5 blocks, 8oz each), at room temperature\n- 1 1/2 cups sugar\n- 1/4 cup sour cream\n- 7 whole large eggs, at room temp\n- 1 1/2 tsp vanilla extract\n\n### Blueberry Sauce\n- 4 cups frozen blueberries\n- 2 tsp corn starch\n- 1/4 cup water\n- 1 Tbsp lemon juice\n- 2 Tbsp sugar\n\nNote: needs a springform pan where the sides loosen and the bottom comes out.\n\n## Instructions\n1. Preheat the oven to 350°F.\n2. Crust: Combine graham cracker crumbs, sugar and melted butter — mix well. Pour into a 9 or 9 1/2 inch springform pan. Use a large spoon to press the crumbs evenly into the bottom of the pan. Bake for 8 minutes. Let cool to room temperature.\n3. Cheesecake filling: Increase oven temp to 450°F. Place oven rack in the bottom 1/3.\n4. Mix the cream cheese and sugar in the bowl of an electric mixer on medium-high speed using paddle attachment (or use an electric hand mixer). Mix until light and fluffy (5 minutes), scraping the bowl down as necessary.\n5. Reduce the speed to medium and add eggs, one at a time.\n6. Reduce speed to low and add sour cream and vanilla. Mix well and pour into crust.\n7. Bake 15 minutes at 450°F. Without opening the oven door, reduce oven temperature to 225°F and bake for 1 hour 5 minutes to 1 hour 15 minutes until the center is almost set. Try not to open the oven door.\n8. Remove cheesecake from the oven and cool to room temperature, then refrigerate until fully chilled.\n9. When ready to serve, carefully run a butter knife around the sides of the cake. Unlatch and remove the springform pan.\n10. Berry Sauce: In a medium saucepan over medium heat, combine sugar, water, cornstarch and lemon juice. As soon as it starts to thicken, add blueberries and cook until lightly bubbly. Don't boil. Let cool to room temp and spread on top of the cheesecake when serving.\n\n## Notes\nTo prevent leaks from the springform pan while baking, wrap a piece of foil under the outside of the pan. You can place a ring of parchment paper on the bottom to help remove the cake from the pan.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "p2qsus43vchko7meina3vcpw5e", "title": "Easy Goulash Recipe", "ainfo": "Easy Goulash Recipe", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add olive oil to a large pot over medium-high heat. Add the onion, bell pepper, and ground beef; cook until the beef is no longer pink. Drain excess fat and return the pot to the stove. Add garlic and stir until fragrant, about 30 seconds.", "notes": "# Easy Goulash Recipe\n\nSource: https://iwashyoudry.com/easy-goulash-recipe/\n\nBy Shawn, I Wash You Dry. Course: Main Dish. Cuisine: American. Prep: 5 min | Cook: 30 min | Total: 35 min. Servings: 10.\n\n## Ingredients\n- 1 tbsp olive oil\n- 1 cup onion, diced\n- 1 green bell pepper, diced\n- 2 lbs. ground beef, lean\n- 3 tsp garlic, minced\n- 2 (15 oz) cans tomato sauce\n- 2 (15 oz) cans petite diced tomatoes\n- 3 cups beef broth\n- 3 tbsp Worcestershire sauce\n- 2 tsp seasoned salt\n- 2 tbsp Italian seasoning\n- 3 bay leaves\n- 2 cups macaroni noodles, uncooked\n- 1 cup cheddar cheese, shredded\n\n## Instructions\n1. Add olive oil to a large pot over medium-high heat. Add the onion, bell pepper, and ground beef; cook until the beef is no longer pink. Drain excess fat and return the pot to the stove. Add garlic and stir until fragrant, about 30 seconds.\n2. Pour in the tomato sauce, diced tomatoes, beef broth, Worcestershire sauce, seasoned salt, Italian seasoning, bay leaves, and dried macaroni noodles. Stir and bring to a boil. Reduce heat to a light boil and stir occasionally until the pasta is tender, about 20 minutes.\n3. Remove the bay leaves and stir in the cheddar cheese just before serving.\n\n## Notes\nUse a big pot — this recipe makes a lot. Any small pasta can substitute for macaroni. For a leaner meal, use ground turkey instead of beef. Extra veggies like corn, peas, diced carrots, green beans, or baby spinach can be added. Stir in a cup of sour cream at the end for extra creaminess. Add more beef broth if you want a soupier consistency.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "eqs34zpuy5nbgrszw3zifvt56u", "title": "Easy Homemade Chicken Gravy from Scratch", "ainfo": "Easy Homemade Chicken Gravy from Scratch", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Melt butter in a saucepan over medium-high heat.", "notes": "# Easy Homemade Chicken Gravy from Scratch\n\nSource: https://www.food.com/recipe/easy-homemade-chicken-gravy-from-scratch-512030\n\nSubmitted by Air Force Mama, Food.com. Ready in: 20 min. Serves: 8.\n\n## Ingredients\n- 1/4 cup butter\n- 1/3 cup unbleached all-purpose flour\n- 2 cups chicken broth\n- Salt and pepper, to taste\n- 2 tablespoons chicken drippings\n\n## Instructions\n1. Melt butter in a saucepan over medium-high heat.\n2. Add the flour and stir until it becomes a paste and slightly turns brown.\n3. Slowly incorporate the chicken broth with a whisk.\n4. Whisk constantly until thickened.\n5. Once thickened, stir in the chicken drippings and serve hot.\n\n## Notes\nCommunity tips: chicken bouillon cubes (diluted) can substitute for drippings if you don't have any on hand; adding a bit of chicken bouillon plus a savory herb blend (like Mrs. Dash Garlic & Herb) boosts flavor; sautéed onion and celery plus extra bouillon and broth make a heartier version; a splash of cream can be added for a more milk-based gravy. Works well even without drippings — useful for reheated/frozen turkey or chicken with no pan drippings available.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2e5ngiw3qecrj2wyaxmnwzshb4", "title": "Easy New Mexican Red Chile Sauce", "ainfo": "Easy New Mexican Red Chile Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Arrange about 20 of the best chile pods on a cookie sheet and roast in a 250°F oven for about 20 minutes, just enough to bring out the flavor without burning them.", "notes": "# Easy New Mexican Red Chile Sauce\n\nSource: https://www.brandnewvegan.com/recipes/red-chile-sauce\n\nBy Chuck Underwood, Brand New Vegan.\n\n## Ingredients\n- About 20 dried New Mexican red chile pods\n- 2 cups water (chile cooking water or fresh)\n- 1 (8 oz) can tomato sauce\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon onion powder\n- 1/2 teaspoon Mexican oregano\n- 1/2 teaspoon cumin\n- 1/4 teaspoon salt\n- 2-3 cloves fresh garlic\n- About 1/4 of a white onion\n\n## Instructions\n1. Arrange about 20 of the best chile pods on a cookie sheet and roast in a 250°F oven for about 20 minutes, just enough to bring out the flavor without burning them.\n2. Once cool enough to touch, de-stem and de-seed the chiles (kitchen shears work well to snip the stem and dump out the seeds). Wear gloves if sensitive to capsicum oil in the seeds/membranes.\n3. Add the cleaned chiles to a large pasta pot with enough cold water to cover, and bring to a boil. Once simmering, cover, turn off the heat, and let steam about 10 minutes until the chiles are puffed and very soft.\n4. Remove the softened chiles with tongs or a slotted spoon into a blender, reserving about 2 cups of the cooking water.\n5. Add 2 cups of water (chile water or fresh), the tomato sauce, garlic powder, onion powder, Mexican oregano, cumin, salt, fresh garlic, and onion to the blender with the chiles.\n6. Hold the lid on securely and blend on high until smooth (hot liquid builds pressure — hold the lid tightly to avoid accidents).\n7. Taste and adjust seasoning. Optionally strain through a sieve for a smoother texture (messy and not necessary — a slightly chunky texture is also good).\n\n## Notes\nUse New Mexican chile pods specifically, not California chile pods or chile powder — the Hatch, NM growing region gives a distinctive flavor. Clean up spills immediately, as red chile stains; avoid wearing white while working with it. To make it less spicy, use fewer chiles or remove more seeds before blending. Extremely versatile — used on tacos, burritos, enchiladas, baked potatoes, rice, beans, tofu scrambles, veggie burgers, toast, biscuits, corn, and other vegetables, similar to how gravy is used. Fat-free and low calorie. Keeps in the fridge 5-7 days; freezes well in airtight containers or freezer bags once fully cooled.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "o2rgygxp3der7bf24ug2htlvpe", "title": "Easy Tahini Recipe", "ainfo": "Easy Tahini Recipe", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Toast the sesame seeds: add sesame seeds to a wide, dry saucepan over medium-low heat and toast, stirring constantly, until the seeds become fragrant and turn light golden, 3 to 5 minutes. Stay close and keep stirring, as the seeds can burn quickly.", "notes": "# Easy Tahini\n\nSource: https://www.inspiredtaste.net/26901/easy-tahini-recipe/\n\nBy Adam Gallagher, Inspired Taste. Prep: 10 min | Cook: 5 min | Total: 15 min. Makes approximately 1/2 cup.\n\n## Ingredients\n- 1 cup (140g) sesame seeds, we prefer hulled\n- 2 to 4 tablespoons light flavored oil such as sesame oil (not toasted), avocado, grape seed, vegetable, or a light olive oil\n- Pinch of salt, optional\n\n## Instructions\n1. Toast the sesame seeds: add sesame seeds to a wide, dry saucepan over medium-low heat and toast, stirring constantly, until the seeds become fragrant and turn light golden, 3 to 5 minutes. Stay close and keep stirring, as the seeds can burn quickly.\n2. Make tahini: add the toasted sesame seeds to the bowl of a food processor, then process until a crumbly paste, about 2 minutes. Add 2 tablespoons of the oil, then process for 2 to 4 minutes more, stopping to scrape the bottom and sides of the food processor a couple of times.\n3. To finish: check the tahini's consistency. It should be smooth, not gritty, and pourable. You may need to process for another minute and add 1 to 2 more tablespoons of oil. Taste for seasoning, then add salt to taste and process for 5 to 10 seconds to mix.\n\n## Notes\nStoring: keep in an airtight jar in the refrigerator for a month; stir well before using if it separates. Tahini from unhulled sesame seeds tastes more bitter and less smooth than from hulled seeds. If the seeds won't blend: be patient (can take up to 5+ minutes), try a larger batch size, or add a bit more oil. A food processor works best; a high-powered blender can work if you stop to scrape down the sides.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "dvt4wcgoevb7oma53wj4ykz2sy", "title": "Elevated Ground Beef Tacos (Gourmet Filling)", "ainfo": "Elevated Ground Beef Tacos (Gourmet Filling)", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prepare the chile sauce: In a saucepan, bring the chiles, tomatoes, and onion to a boil. Simmer for about 10 minutes until softened. Transfer the mixture to a blender along with the garlic, cinnamon stick, whole cloves, and a bit of the cooking water. Blend until smooth.", "notes": "# Elevated Ground Beef Tacos (Gourmet Filling)\n\nSource: Google Keep note\n\nElevated ground beef tacos focus on depth of flavor in the meat, high-quality toppings, and textural contrast. Instead of relying on a prepackaged seasoning mix, this recipe builds a complex and savory profile with a blend of spices, aromatic vegetables, and rich liquid. This birria-inspired beef filling develops deep, savory flavor by cooking the meat low and slow with a homemade chile sauce.\n\n## Ingredients\nFor the sauce:\n- 3 dried New Mexico chiles\n- 3 dried California chiles\n- 3 dried ancho chiles\n- 3 Roma tomatoes\n- 1/2 onion, quartered\n- 4 garlic cloves\n- 1 cinnamon stick\n- 1/4 tsp whole cloves\n\nFor the beef:\n- 2 tbsp lard or oil\n- 1/2 white onion, diced\n- 2 lbs ground beef\n- 1 tbsp minced garlic\n- 1 tsp each: black pepper, onion powder, garlic powder, ground cumin, oregano, thyme, ginger\n- Salt to taste\n- 1 cup refried beans\n- 2 bay leaves\n\nFor elevated toppings:\n- Avocado crema: 1 avocado, 1/2 cup Greek yogurt or sour cream, juice from 1 lime, a handful of cilantro, pinch of salt\n- Homemade pico de gallo: diced Roma tomatoes, finely diced white onion, fresh cilantro, jalapeño, squeeze of lime juice\n- Pickled onions: thinly sliced red onions, warm water, vinegar, sugar\n- Crumbled cheese: cotija, feta, or salty gorgonzola (instead of pre-shredded blend)\n- Shaved cabbage: finely shredded green or red cabbage (instead of iceberg lettuce)\n\n## Instructions\n1. Prepare the chile sauce: In a saucepan, bring the chiles, tomatoes, and onion to a boil. Simmer for about 10 minutes until softened. Transfer the mixture to a blender along with the garlic, cinnamon stick, whole cloves, and a bit of the cooking water. Blend until smooth.\n2. Brown the meat: In a large skillet, heat the lard or oil. Add the diced onion and minced garlic, sautéing for 2 minutes. Add the ground beef, season with the spices, and brown for 7 minutes, breaking it apart as it cooks.\n3. Combine and simmer: Add the chile sauce and refried beans to the browned beef. Stir to combine, then add the bay leaves. Bring the mixture to a simmer, then reduce the heat to low and cover. Cook for 20 minutes, allowing the flavors to meld and the liquid to reduce.\n4. Prepare toppings while the filling simmers:\n   - Avocado crema: blend the avocado, Greek yogurt/sour cream, lime juice, cilantro, and salt until smooth.\n   - Pico de gallo: combine diced tomatoes, onion, cilantro, jalapeño, and lime juice.\n   - Pickled onions: thinly slice red onions and soak in warm water, vinegar, and sugar for at least 30 minutes.\n5. Serve the beef in tortillas topped with crumbled cheese, shaved cabbage, and the prepared toppings.\n\n## Notes\nHigh-quality, freshly prepared toppings bring texture and acidity to balance the richness of the ground beef.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "mz3ohdlls6ultm7eyv2afk2ulu",
