ture over the eggs.\n4. Bake the eggs for 5-8 minutes, or until cooked to desired consistency.\n\n## Notes\nAll air fryers cook differently — always refer to your specific air fryer's manufacturer instructions. For a firmer yolk, add an extra minute or two of cooking time. Works well beyond breakfast — good for brunch, dinner, or a heart-healthy snack any time of day.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "h5redkvqzrmsil2g7xw52uyuou", "title": "Albondigas (Spanish Meatballs)", "ainfo": "Albondigas (Spanish Meatballs)", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Fire your oven and allow it to fall to a moderate temperature, roughly 400-500°F. This dish can be cooked with a small fire, coals, or retained heat.", "notes": "# Albóndigas (Spanish Meatballs)\n\nSource: https://www.fornobravo.com/blog/recipe/albondigas-spanish-meatballs/\n\nForno Bravo. Course: Appetizer, Meat and Poultry | Cuisine: Spanish | Prep: 20 min | Cook: 25 min | Total: 45 min\n\n## Ingredients\n### Meatballs\n- 1 medium onion, chopped fine\n- 1 lb ground beef\n- 1/4 lb ground pork\n- 2/3 cup fine dry bread crumbs\n- Salt\n\n### Sauce\n- 4 garlic cloves, minced\n- 1 medium onion\n- 2 tbsp olive oil\n- 1 can whole tomatoes\n- 3/4 tsp dried oregano, crumbled\n\n### Plus\n- 1/2 cup stock or wine\n- Garlic cloves, fennel, saffron, or shallots, optional\n\n## Instructions\n1. Fire your oven and allow it to fall to a moderate temperature, roughly 400-500°F. This dish can be cooked with a small fire, coals, or retained heat.\n2. Sauté the onion and add the tomatoes and spices to make the sauce, either in your oven or on a cook top.\n3. Prepare the meatballs by mixing together the ingredients and shaping into balls, keeping them fairly small (about the size of a walnut). Use a gentle hand to keep them light and tender. Place on an oiled terracotta dish, add half the sauce, and roast 10-15 minutes.\n4. Serve with fresh flatbread (made from spare pizza dough) or as a side dish with toothpicks.\n\n## Notes\nKeep the dish juicy by adding stock or wine about halfway through roasting. If the oven is too hot, cover the pan with foil, removing it near the end to brown the tops. Optionally roast halved shallots, garlic, saffron, or fennel alongside the meatballs for different flavor variations.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cc5eeecrchtdzr4umxgcilbzra", "title": "Amazing Salt and Pepper Chicken Wings", "ainfo": "Amazing Salt and Pepper Chicken Wings", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 450 degrees.", "notes": "# Amazing Salt and Pepper Chicken Wings\n\nSource: https://www.thekitchenmagpie.com/amazing-salt-and-pepper-chicken-wings/\n\nBy Karlynn Johnston. Prep: 5 min | Cook: 30 min. Servings: 6. Makes about 36 wings.\n\n## Ingredients\n- 3 pounds party wings (approx. 36 wings)\n- 3 teaspoons salt\n- 4 teaspoons crushed black pepper\n- 4 teaspoons sesame oil\n- 5 cloves garlic, chopped\n- 4 green onions, diced\n- chili pepper flakes, optional but the heat is nice!\n\n## Instructions\n1. Preheat oven to 450 degrees.\n2. Combine salt and pepper together in a bowl. Place chicken wings on a lightly oiled baking sheet. Sprinkle the wings with the salt and pepper, then shake on the baking tray to cover completely.\n3. Bake for 15 minutes, then turn and bake for another 15-20 minutes until crispy and cooked through (to a safe internal temperature of 160°F). They're best very crispy.\n4. As soon as the wings are close to being done, heat the sesame oil in a skillet over medium heat, then add the garlic and onions (and jalapeno as well if adding it in).\n5. Cook until the garlic has browned slightly.\n6. Remove chicken wings from oven and place in a large bowl.\n7. Toss the chicken wings with the garlic oil until completely coated.\n8. Place on a serving platter, spooning any leftover garlic oil over the top.\n9. Serve and enjoy!\n\n## Notes\nAsian-inspired twist on classic salt and pepper wings, using sesame oil, garlic, and green onions. Add red pepper flakes to the sesame oil for a spicy kick. Customize the salt-pepper blend with a pinch of ginger, garlic powder, or paprika. Refrigerate cooked wings in an airtight container for 3-4 days; freeze up to 4 months and reheat straight from frozen in the oven until hot and crispy.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "filbrnxrmi27tr3yswqsar5wta", "title": "Andersen's Split Pea Soup", "ainfo": "Andersen's Split Pea Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Sort the peas in a mesh strainer, removing any stones or impurities. Rinse them clean.", "notes": "# Andersen's Split Pea Soup\n\nSource: https://toriavey.com/toris-kitchen/andersens-split-pea-soup/\n\nVintage recipe from Andersen's Restaurant in Buellton, California. Vegan, Gluten Free. Prep: 15 mins | Cook: 45 mins | Total: 1 hr\n\n## Ingredients\n- 2 cups green split peas\n- 1 stalk celery, coarsely chopped\n- 1 large carrot, peeled and coarsely chopped\n- 1 small onion, peeled and chopped\n- 1/4 tsp thyme\n- 1 bay leaf, crumbled into very small pieces\n- Pinch cayenne pepper\n- 1/2 tsp seasoned salt\n- Salt and pepper to taste\n\nEquipment: soup pot, mesh strainer, food mill\n\n## Instructions\n1. Sort the peas in a mesh strainer, removing any stones or impurities. Rinse them clean.\n2. Combine the peas, celery, carrot, onion, thyme, bay leaf and cayenne in a soup pot and cover with 2 quarts (8 cups) of water.\n3. Bring the pot to a boil. Keep at a high simmer for 20 minutes.\n4. Reduce heat to a low simmer. Let the mixture cook for another 25-30 minutes until the peas are completely tender. Towards the end of cooking, add the seasoned salt, then salt and pepper to taste (about 1/2 tsp salt and 1/4 tsp pepper; use less if sodium-sensitive).\n5. Process the pea mixture through a food mill or a fine mesh sieve until all the liquid is pushed through and only pulp remains. A food mill creates the smoothest, creamiest texture.\n6. Bring the soup to a quick boil once more on the stovetop, then remove from heat immediately. If the soup seems too thick, add some hot water to thin it to the desired consistency.\n7. Serve hot, garnished with a few breadcrumbs if desired (omit to keep gluten free and vegan).\n\n## Notes\nLeftover soup will solidify when chilled — add a little water and stir while reheating to help it heat up smoothly.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "psd7bonwzxg4sgnny3m5abgaoy", "title": "Apple Tarte Tatin", "ainfo": "Apple Tarte Tatin", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat fan oven to 160°C.", "notes": "# Apple Tarte Tatin\n\nSource: Google Keep note (video reference: https://youtu.be/vpRV_Pvlczw)\n\n\"3* Michelin Dessert. No Skill Required.\" Recipe sized for an 18 cm saucepan.\n\n## Ingredients\n- Pink Lady apples, 6-8\n- Butter, 125 g\n- Caster sugar, 125 g\n- All-butter puff pastry, 1 roll, cut to size\n\n## Instructions\n1. Preheat fan oven to 160°C.\n2. Clean the pan and rub with a thin layer of butter.\n3. Put a layer of butter in the bottom of the pan.\n4. Put sugar on top in an even layer.\n5. Peel, quarter and deseed the apples.\n6. Arrange the apples on top of the butter/sugar, starting from the outside in toward the middle, in concentric circles.\n7. Cut a layer of puff pastry 2 inches wider in diameter than the pan you're using.\n8. Gently roll/tuck the pastry between the apples and pan and fold the excess in on itself.\n9. Total cook time will be around 3-4 hours. For your first time making it, check at 2:00, 2:30, and 3:00, and take it out when the apples have turned amber and smell delicious — may need up to 3.5 hours.\n10. Let it cool a little before turning out.\n\n## Notes\nYou can let it cool completely on the side and reheat for 8-10 minutes at 160°C to warm it up and help it release nicely.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "g2lluagul3xpvll77njokn43ea", "title": "Baked Salmon with Maple Mustard Glaze", "ainfo": "Baked Salmon with Maple Mustard Glaze", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 400°F. Line a baking sheet with parchment paper if desired, for easy clean up.", "notes": "# Baked Salmon with Maple Mustard Glaze\n\nSource: https://www.rachelcooks.com/baked-salmon/\n\nBy Rachel Gurk, Rachel Cooks. Prep: 5 min | Cook: 25 min | Total: 30 min | Servings: 4\n\n## Ingredients\n- 2 pounds salmon, rinsed and patted dry with paper towels\n- 2 tablespoons coarse (country style) Dijon mustard\n- 2 tablespoons real maple syrup\n- 1 teaspoon olive oil\n- 1 teaspoon kosher salt\n- 1/2 teaspoon paprika\n- 1/2 teaspoon ground black pepper\n\n## Instructions\n1. Preheat oven to 400°F. Line a baking sheet with parchment paper if desired, for easy clean up.\n2. Place salmon on prepared baking sheet. In a small bowl, combine mustard, maple syrup, olive oil, salt, paprika, and pepper. Spoon about half of this mixture over the salmon in an even layer.\n3. Bake for 15 minutes. Remove from oven and spoon on the rest of the maple mustard mixture.\n4. Return to oven and bake an additional 5 to 10 minutes, until an instant-read thermometer reads 145°F and the fish flakes easily with a fork. Enjoy immediately.\n\n## Notes\nThis is a generous 8 oz serving — could stretch to 8 servings (4 oz each) with sides. Glaze makes enough for up to 3 lbs of salmon; halve the glaze for 1 lb. Works with fresh or frozen salmon — thaw completely and pat dry if using frozen. Fridge: airtight up to 3-4 days. Freezer: wrap tightly and freeze; thaw overnight before reheating.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tkjdw3gty6fxrqbfz3w6tzafje", "title": "Basic Caramelized Onions", "ainfo": "Basic Caramelized Onions", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Melt the butter in a large frying pan over medium-low heat until foaming.", "notes": "# Basic Caramelized Onions\n\nSource: http://www.chowhound.com/recipes/basic-caramelized-onions-11098 (original page removed; retrieved via web.archive.org)\n\nBy Aida Mollenkamp. Yield: 1 cup | Easy | Total: 50 mins\n\n## Ingredients\n- 2 tablespoons unsalted butter\n- 2 medium yellow onions, halved and sliced paper thin (about 4 cups)\n- Kosher salt\n- Freshly ground black pepper\n\n## Instructions\n1. Melt the butter in a large frying pan over medium-low heat until foaming.\n2. Add the onions, and let them cook, stirring rarely, until they are deep golden brown and caramelized, about 45 minutes. Season well with salt and pepper, remove from the pan, and let cool.\n\n## Notes\nCaramelized onions add a sweet and savory note to anything they top — try them over grilled chicken, with cheese on pizza, or in a grilled cheese sandwich.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "zh7swi4qlxvmziezhry5hxrlxe", "title": "Basic Homemade Pasta", "ainfo": "Basic Homemade Pasta", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine the flour and salt.", "notes": "# Basic Homemade Pasta\n\nSource: https://www.theprairiehomestead.com/2015/02/homemade-pasta-recipe.html\n\nBy Jill Winger, The Prairie Homestead. Prep: 70 mins | Cook: 4 mins | Total: 1 hr 14 mins | Yield: 1 lb pasta | Cuisine: Italian\n\n## Ingredients\n- 2 cups flour\n- 1/2 teaspoon sea salt\n- 3 large eggs\n\n## Instructions\n1. Combine the flour and salt.\n2. Make a well in the center of the flour, and add the eggs.\n3. Gently begin to mix the eggs, gradually drawing in flour with each stroke. Eventually a stiff dough will form.\n4. Knead the pasta dough for 8-10 minutes. If too dry, add 1/2 teaspoon of water; if too sticky, sprinkle in a bit more flour. The dough will be stiffer than bread dough but should become smooth and satiny the longer you knead.\n5. Cover the well-kneaded dough tightly with plastic wrap and let it rest for about 45-60 minutes (important — lets the gluten relax before rolling).\n6. Divide the dough into four portions.\n7. Pasta machine: start with the biggest setting (5 or 6), run it through once or twice, then gradually adjust to thinner settings until you have the perfect sheet. Fold the strip into thirds between passes to square up the edges. Then roll through the cutting side to slice into spaghetti or fettuccine.\n8. Rolling pin: roll each portion out on a well-floured surface as thin as possible (it will plump up when cooked), then cut into thin strips with a knife or pizza cutter.\n9. Cook right away (3-4 minutes in boiling water) or dry it. Serve with homemade sauce, or olive oil, Parmesan, and fresh herbs.\n\n## Notes\nRegular unbleached all-purpose flour works great; traditionally pasta uses semolina flour, and you can mix in whole wheat (more whole wheat changes the final texture). Not tested with gluten-free flours. Sprinkle flour generously if the dough sticks to any surface. To store: air dry in a single layer until brittle, then refrigerate 2-3 days or freeze 2-4 weeks; flash-freeze shaped noodles in \"nests\" for longer storage — don't freeze in a big lump. You can flavor the dough with fresh or dried herbs, garlic powder, or onion powder.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "bbphxg3nq3bgrliiafneumd4km", "title": "Beef Bourguignon (Beef Burgundy)", "ainfo": "Beef Bourguignon (Beef Burgundy)", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the beef marinade ingredients in a large, non-reactive ceramic dish or ziplock bag. Marinate overnight in the fridge (minimum 12 hours, maximum 24 hours).", "notes": "# Beef Bourguignon (Beef Burgundy)\n\nSource: https://www.recipetineats.com/beef-bourguignon-beef-burgundy/\n\nBy Nagi Maehashi, RecipeTin Eats. Prep: 40 min | Cook: 2 hrs 30 min | Marinating: 1 day. Servings: 5. Category: Main, Stew. Cuisine: French.\n\n## Ingredients\nBeef Marinade:\n- 800g / 1.6 lb chuck beef, cut in 4-5 cm / 2\" cubes\n- 2 large carrots (~300g/10oz), cut on an angle into 4-5 cm / 2\" pieces\n- 16 pearl onions or small, round pickling onions\n- 1 bay leaf, fresh (sub: dried)\n- 3 sprigs thyme\n- 750ml / 25 oz pinot noir or other red wine\n\nBrowning Beef:\n- 3 tbsp oil, olive, canola or vegetable\n- 3/4 tsp salt\n- 1/2 tsp pepper\n\nStew:\n- 200g / 7oz mushrooms, halved (quarters if large)\n- 150g / 5oz bacon piece, cut into 1cm / 1/2\" thick batons\n- 50g / 3 tbsp unsalted butter\n- 3 garlic cloves, minced\n- 2 tbsp tomato paste\n- 6 tbsp flour, plain/all-purpose\n- 3 cups beef stock (low sodium), preferably homemade\n- 1/4 tsp salt\n- 2 tbsp chopped parsley, for garnish\n\n## Instructions\nMarinate Beef:\n1. Place the beef marinade ingredients in a large, non-reactive ceramic dish or ziplock bag. Marinate overnight in the fridge (minimum 12 hours, maximum 24 hours).\n2. Strain liquid into a bowl, reserving the marinade. Separate the beef, carrots, and onion.\n3. Reduce wine: pour red wine into a saucepan and bring to a boil over medium-high heat. Simmer vigorously, skimming off any impurities, until reduced by half. Set aside.\n\nBrown Beef and Vegetables:\n4. Preheat oven to 180°C / 350°F (160°C fan).\n5. Line a tray with paper towels, spread beef out, then pat dry.\n6. Season beef with 3/4 tsp salt and 1/2 tsp black pepper.\n7. Heat 2 tbsp oil in a large, heavy-based, oven-proof pot over high heat. Add 1/3 of the beef and brown aggressively all over. Remove into a bowl, then repeat with remaining beef, adding more oil if needed.\n8. Add bacon and cook for 3 minutes until golden. Add to the bowl with beef.\n9. Add mushrooms and cook for 5 minutes, or until golden. Remove into a new bowl.\n10. Add a bit of extra oil if needed, then cook onions for 5 minutes or until there are nice golden patches. Add to the bowl with mushrooms.\n11. Add butter to the pot. Once melted, add carrot and cook for 3-4 minutes until there are golden patches. Add garlic and cook for a further 1 minute.\n12. Add tomato paste and cook for 2 minutes.\n13. Add flour and cook for 2 minutes.\n14. While stirring, slowly pour in beef stock to help the flour dissolve lump-free. Then add wine and mix until the flour mixture is dissolved and mostly lump-free.\n15. Add beef, bacon, thyme, bay leaf, 1/4 tsp salt, and pepper into the pot, then stir well.\n\nSlow-Cook:\n16. Bring to a simmer, then cover and transfer to the oven for 1 hour.\n17. Remove from oven, stir in mushrooms and onion.\n18. Cover with lid and return to oven for 1 1/2 hours, or until beef is \"fall-apart tender.\"\n19. Remove from oven, taste sauce and add salt if needed.\n20. If time permits, leave the stew overnight before serving — reheat gently on low stove.\n21. Serve over mashed potato.\n\n## Notes\nScaling up works fine, but brown meat and vegetables in batches to avoid steaming instead of browning. Chuck beef should be well-marbled with fat; buy a large piece and cut it yourself rather than pre-cut small cubes, which cook too fast. Pearl onions are hard to find — substitute pickling onions (peel an extra layer, soak 10-15 min in cold water to loosen skins) or 2 regular onions cut into 1cm slices. No need for expensive wine — a cheap Pinot Noir works fine. Bacon lardons are key for seasoning; use slab bacon or speck if possible, or streaky bacon strips. Homemade beef stock beats store-bought, and never use powdered stock. Flour lumps will dissolve during slow cooking. Can be done on the stovetop (lid on, stirring occasionally) or in a slow cooker (4 hours low, add mushrooms/onion, then 4 more hours low, then reduce uncovered on the stove 15-20 min). Salt to taste at the end since bacon and stock saltiness vary — homemade stock typically needs about 3/4 tsp more salt. Keeps 5 days in the fridge and freezes well. Developed with a classically trained French chef from Burgundy; the author considers it better than Julia Child's version. Nutrition per serving: 745 kcal, 25g carbs, 47g protein, 40g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qanqwrvj6pb7ebyjtrijwn4zue", "title": "Beef Stroganoff (Easy Classic)", "ainfo": "Beef Stroganoff (Easy Classic)", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat the oil in a large pan or pot over medium-high heat. Once lightly smoking, sear the beef until lightly browned, about 1-2 minutes per side. Set aside on a plate.", "notes": "# Beef Stroganoff (Easy Classic)\n\nSource: https://www.billyparisi.com/easy-beef-stroganoff-recipe/#recipe\n\nBy Chef Billy Parisi. Prep: 15 min | Cook: 25 min | Total: 40 min. Servings: 6.\n\n## Ingredients\n- 2 tablespoons neutral-flavored oil\n- 2 pounds thinly sliced top sirloin\n- 2 tablespoons unsalted butter\n- 1 white or yellow onion, thinly sliced\n- 1 cup sliced cremini mushrooms\n- 1 cup sliced button mushrooms\n- 3 cloves garlic, finely minced\n- 1/3 cup brandy\n- 3 cups beef stock\n- 2 bay leaves\n- 1 tablespoon coarse ground mustard\n- 1 1/2 cups sour cream\n- 1 tablespoon chopped parsley, plus more for garnish\n- 1 pound wide egg noodles, boiled and strained\n- Coarse salt and fresh cracked pepper, to taste\n\n## Instructions\n1. Heat the oil in a large pan or pot over medium-high heat. Once lightly smoking, sear the beef until lightly browned, about 1-2 minutes per side. Set aside on a plate.\n2. Add the butter to the pan and cook the onions and mushrooms until caramelized, about 8-10 minutes.\n3. Add the garlic and sauté 1-2 minutes, then return the beef to the pan.\n4. Deglaze with the brandy and cook until nearly evaporated, about 2-3 minutes.\n5. Pour in the beef stock, add the bay leaves and mustard, and cook over medium-high heat 8-10 minutes, until the liquid is reduced by about 1/3.\n6. Finish by whisking in the sour cream, salt, pepper, and parsley.\n7. Toss with the cooked egg noodles and garnish with extra parsley.\n\n## Notes\nTake time to properly caramelize the onions and mushrooms (8-10 minutes) — this step builds most of the dish's flavor and shouldn't be rushed. Use a wide pan so everything caramelizes rather than steams. Slow cooker version: sauté the beef, then onions/mushrooms/garlic until lightly browned, add stock and bay leaves, and cook on low 4-6 hours; stir in sour cream and season before serving. Chuck roast or bottom round work especially well for the slow cooker version since they tenderize with long cooking. Instant Pot version: sauté beef, mushrooms, onions, and garlic 6-8 minutes, add stock and bay leaves, then pressure cook. Reader tip: reheating leftovers with a splash of beef stock (1+ tablespoon) in a skillet over low heat works well to loosen the sauce; cream cheese can substitute for part of the sour cream if you run short.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "o5tenajhfmkmnnv5mvrblfhy4m", "title": "Beef Tacos (Crispy Folded)", "ainfo": "Beef Tacos (Crispy Folded)", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add the ground beef and chopped onion to a skillet over medium-high heat. Cook until browned, then drain the grease. Add the minced garlic, all the seasonings, and the beef broth.", "notes": "# Beef Tacos (Crispy Folded Tacos)\n\nSource: https://cookinginthemidwest.com/blog/beef-tacos-recipe/\n\nBy Luke Brown, Cooking in the Midwest. Prep: 10 min | Cook: 25 min. Servings: 6. Course: Dinner. Cuisine: American.\n\n## Ingredients\n- 2 lb ground beef\n- 1 chopped onion\n- 2 tablespoons minced garlic\n- 1 teaspoon each salt and pepper\n- 1/2 teaspoon cayenne\n- 4 teaspoons chili powder\n- 2 teaspoons each cumin and dried cilantro\n- 1 1/2 cups beef broth\n- White corn tortillas\n- 1 tablespoon oil\n- Shredded Monterey Jack cheese\n- Taco toppings: sour cream, Pico de Gallo, taco sauce, shredded lettuce\n\n## Instructions\n1. Add the ground beef and chopped onion to a skillet over medium-high heat. Cook until browned, then drain the grease. Add the minced garlic, all the seasonings, and the beef broth.\n2. Bring to a boil, then lower the heat, cover, and simmer about 20 minutes until the liquid has reduced.\n3. In a separate skillet, heat over medium heat with a bit of oil. Lay out a few tortillas and top with shredded Monterey Jack cheese, then a spoonful of taco meat. Fold the tortillas over and cook on both sides until golden brown and crispy.\n4. Lay the finished tacos on paper towels to absorb extra grease. Top with your favorite toppings and serve.\n\n## Notes\nUsing 2 lbs of ground beef leaves extra for leftovers. Any tortilla or cheese can be substituted for the white corn tortillas/Monterey Jack. Serve with Pico de Gallo, sour cream, taco sauce, or guacamole. Use a spatula to fold and gently press the tortillas while frying for the crispiest result.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2bnpbmc3udsmt4votwqfisdu2e", "title": "Beginner's Sourdough Bread", "ainfo": "Beginner's Sourdough Bread", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Feed your starter: 12 hours before mixing the dough, combine the starter-feeding ingredients in a clean jar, stir, cover loosely, and let rise at room temperature. It's ready when doubled in size with bubbles on the surface and sides.", "notes": "# Beginner's Sourdough Bread\n\nSource: https://littlespoonfarm.com/sourdough-bread-recipe-beginners-guide/\n\nBy Amy Duska, Little Spoon Farm. Servings: 1 loaf | Prep: 10 min | Cook: 50 min | Fermentation: 8 hours\n\n## Ingredients\n### To Make 1/4 cup (50 g) Active Sourdough Starter\n- 2 teaspoons (10 g) sourdough starter\n- 3 tablespoons (25 g) all-purpose flour\n- 5 teaspoons (25 g) water\n\n### Dough\n- 1/4 cup (50 g) active sourdough starter (100% hydration)\n- 1 1/3 cups + 2 tablespoons (350 g) water\n- 2 teaspoons (10 g) fine sea salt\n- 4 cups + 2 tablespoons (500 g) bread flour\n\n## Instructions\n1. Feed your starter: 12 hours before mixing the dough, combine the starter-feeding ingredients in a clean jar, stir, cover loosely, and let rise at room temperature. It's ready when doubled in size with bubbles on the surface and sides.\n2. Make the dough: Transfer 50 g active starter and 350 g water into a large mixing bowl; stir to distribute evenly. Add the 500 g bread flour and 10 g salt and work together with a stiff spatula or hands until it forms a shaggy mass with no dry flour bits. Cover and rest 1 hour at room temperature.\n3. Stretch and fold: Wet your hand, pick up one side of the dough, stretch it up and over itself, turn the bowl a quarter turn, and repeat around the full circle until the dough forms a tight ball. Cover and rest 30 minutes, then repeat the stretch-and-fold once more.\n4. Bulk fermentation: Cover and let the dough rise 7-10 hours on the counter, until risen about 50-75% (not doubled).\n5. Shape and second rise: Turn the dough onto a lightly floured surface. Shape into a ball by pulling the 4 sides into the center, then flip seam-side down. Gently cup and twist the dough to build surface tension. Center it seam-side down on a piece of parchment, use the parchment as a sling to lift it into a bowl, cover, and let rest 1-2 hours at room temperature — ready when a thumb indentation springs back slowly.\n6. 30 minutes before baking, preheat the oven with an empty Dutch oven inside to 450°F (232°C).\n7. Score the top of the dough with a razor or sharp knife. Using silicone gloves, remove the hot Dutch oven, take off the lid, and use the parchment sling to transfer the dough in. Cover, bake 20 minutes, then uncover and bake 25-30 minutes more, until golden brown (internal temp 205-210°F/96-99°C).\n8. Cool on a rack 1-2 hours before slicing to avoid a gummy loaf.\n\n## Notes\nUsing all-purpose flour instead of bread flour: reduce water to 325 g, adding more 5 g at a time if the dough feels too stiff during stretch and folds. No Dutch oven? Bake in a greased 9x5\" loaf pan after shaping, at 375°F (190°C) for 45 minutes or until internal temp reaches 190°F (88°C). Recipe tested in a 68°F (20°C) kitchen — warmer kitchens speed fermentation, cooler kitchens slow it. Over-proofed dough is sticky and hard to shape; refrigerate up to 2 days to firm up, or use for flatbread. Sour flavor intensifies if the starter isn't fed regularly — feed more often for a milder loaf. A hard bottom crust can mean the Dutch oven sits too close to the heat source; add a baking sheet on the rack below. Store at room temperature (bread bag, towel, or beeswax wrap) up to 3 days — do not refrigerate. Freeze whole or sliced, wrapped tightly, up to 3 months. Can be doubled into two smaller loaves, baked 20 minutes covered and 15-20 minutes uncovered.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "p5qdjafebi2wvqmdrzbjwfpszi", "title": "Best Cheese For Macaroni And Cheese", "ainfo": "Best Cheese For Macaroni And Cheese", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Cook the pasta according to package instructions until al dente. Drain, rinse in cool water, and set aside.", "notes": "# Best Cheese For Macaroni And Cheese (White Cheddar Mac and Cheese)\n\nSource: https://bakeitwithlove.com/best-cheese-for-macaroni-and-cheese/\n\nBy Angela Latimer, Bake It With Love. Servings: 8. Prep: 10 min | Cook: 20 min | Total: 30 min.\n\n## Ingredients\n- 1 lb elbow macaroni, cooked, drained, rinsed\n- 1/2 cup butter (1 stick or 8 tablespoons)\n- 2 tablespoon all-purpose flour\n- 1 teaspoon garlic powder\n- 1/2 teaspoon white ground pepper\n- 1/2 teaspoon salt\n- 1/2 teaspoon onion powder\n- 2 cups heavy cream\n- 3 cups white cheddar, grated\n\n## Instructions\n1. Cook the pasta according to package instructions until al dente. Drain, rinse in cool water, and set aside.\n2. In a medium saucepan, melt the butter over medium heat.\n3. Once melted, add the flour and seasonings (garlic powder, salt, white pepper, onion powder). Stir until a paste forms.\n4. Add the heavy cream and stir or whisk until smooth.\n5. Add the grated white cheddar and stir until melted; remove from heat.\n6. Pour the cheese sauce over the cooked macaroni and stir to coat. Garnish with additional cheese if desired. Serve immediately.\n\n## Notes\nThis recipe is featured within a broader guide to the best cheeses for mac and cheese. Key tips from the article: always grate your own cheese from blocks rather than using pre-shredded (which contains anti-clumping starch that hinders melting). Good cheese pairings for mac and cheese include sharp/mild/white cheddar, Monterey Jack, Colby Jack, mozzarella, pepper jack, smoked gouda, Gruyere, Fontina, Parmesan/Parmigiano Reggiano, and smaller accent amounts of stronger cheeses like blue cheese, gorgonzola, feta, or brie mixed with milder bases. Mixing 2+ cheeses generally produces a more complex, better mac and cheese than a single cheese.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "gxxqhwonaqboem7m34xla7qwqe", "title": "Best Macaroni Salad", "ainfo": "Best Macaroni Salad", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Bring a large pot of salted water to a boil. Cook the macaroni according to package instructions, usually 7-10 minutes. Drain and rinse with cold water.", "notes": "# Best Macaroni Salad\n\nSource: https://www.aspicyperspective.com/best-macaroni-salad/\n\nBy Sommer Collier, A Spicy Perspective. Prep: 15 min | Cook: 10 min | Total: 25 min. Servings: 12. Course: Salad, Side Dish. Cuisine: American.\n\n## Ingredients\n- 1 pound macaroni pasta\n- 12 oz roasted red pepper (1 jar), drained and chopped\n- 3/4 cup kale, finely chopped\n- 1/2 cup cooked bacon, chopped\n- 1/2 cup sweet pickle relish\n- 1/2 cup scallions, chopped\n- 1 1/2 cups mayonnaise (can be low fat)\n- 3 tablespoons apple cider vinegar\n- 1 tablespoon granulated sugar\n- 1 tablespoon hot sauce (Frank's RedHot used)\n- 1 clove garlic, minced\n- Salt and pepper\n\n## Instructions\n1. Bring a large pot of salted water to a boil. Cook the macaroni according to package instructions, usually 7-10 minutes. Drain and rinse with cold water.\n2. In a medium bowl, mix the mayonnaise, apple cider vinegar, sugar, hot sauce, garlic, 1 teaspoon salt, and 1/2 teaspoon ground pepper.\n3. Place the macaroni in a large bowl. Pour the dressing over the top, then add the chopped roasted red peppers, kale, bacon, pickle relish, and scallions.\n4. Toss well to coat, then refrigerate until ready to serve.\n\n## Notes\nRinsing the pasta after cooking stops the cooking and removes excess starch that can make the salad gluey; skipping this can also cause a watery salad (which usually fixes itself after a couple hours of chilling and stirring). Overcooked pasta or unrinsed starch can cause a dry salad — fix with a bit more mayo and a splash more vinegar. Kale holds up well under the dressing without wilting like fresh herbs; parsley can substitute if serving immediately. Low-fat mayo is more acidic, so add a touch more sugar if using it. White wine vinegar can substitute for apple cider vinegar. Pickle relish can be omitted; add rice vinegar 1 tablespoon at a time if the salad then needs more acidity. Bacon can be omitted for a vegetarian version. Store in sealed containers or a covered bowl in the fridge up to 4 days; do not freeze. Don't let a mayonnaise-based salad sit out more than 2-3 hours at room temperature (1 hour in hot weather). Nutrition (per 8 oz serving): 362 kcal, 34g carbs, 5g protein, 22g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7tftpjtkrnflqmufd73nmpvvqq", "title": "Best Sausage Gravy", "ainfo": "Best Sausage Gravy", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Brown the sausage in a large skillet over medium-high heat until no longer pink.", "notes": "# Best Sausage Gravy\n\nSource: https://thesaltymarshmallow.com/best-sausage-gravy/\n\nBy Nichole, The Salty Marshmallow. Course: Main Course. Cuisine: American. Prep: 5 min | Cook: 10 min | Total: 15 min. Servings: 6.\n\n## Ingredients\n- 1 pound ground pork sausage\n- 2 tablespoons butter\n- 1/3 cup flour\n- 3 cups milk\n- 1/4 teaspoon garlic powder\n- 1/4 teaspoon seasoned salt\n- 1/4 teaspoon salt, more to taste\n- 1 teaspoon black pepper, more to taste\n\n## Instructions\n1. Brown the sausage in a large skillet over medium-high heat until no longer pink.\n2. Add the butter to the pan and stir until melted.\n3. Sprinkle the flour over the sausage and stir for 2 minutes, until the raw flour smell is gone.\n4. Pour the milk into the sausage and flour mixture slowly, whisking constantly until smooth.\n5. Whisk in the seasonings. Taste and adjust seasoning if necessary. Simmer 2-3 minutes until thickened.\n6. Serve immediately with your favorite biscuits.\n\n## Notes\nUse mild, hot, maple, or any pork breakfast sausage you prefer. Great over biscuits, fried breakfast potatoes, hashbrowns, grits, or toast. Make-ahead: can be made the night before — cool completely, store airtight in the fridge up to 24 hours (up to 4 days per the recipe body), and reheat in a saucepan over medium-low heat, stirring occasionally.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ins7rqewj4wnq4nw65cdu4t7li", "title": "Best Turkey Gravy Without Drippings", "ainfo": "Best Turkey Gravy Without Drippings", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat a medium sized saucepan over medium heat. Once hot, add the butter and swirl to melt. Once the butter has melted, add in the minced garlic and dried thyme. Sauté until aromatic (about 30-60 seconds).", "notes": "# Best Turkey Gravy Without Drippings\n\nSource: https://keytomylime.com/turkey-gravy-without-drippings-recipe/\n\nBy Alexa Blay, Key To My Lime. Prep: 5 min | Cook: 10 min | Total: 15 min. Cuisine: American. Category: Sauces, Dips, and Dressings.\n\n## Ingredients\n- 1/4 cup salted butter\n- 1 medium clove garlic, minced\n- 1 teaspoon dried thyme\n- 1/4 cup all-purpose flour\n- 2 cups turkey broth (substitute with chicken broth if you can't find turkey broth)\n- 1/2 teaspoon poultry seasoning\n- 1/2 teaspoon fine sea salt*\n- 1/2 teaspoon ground black pepper\n\n## Instructions\n1. Heat a medium sized saucepan over medium heat. Once hot, add the butter and swirl to melt. Once the butter has melted, add in the minced garlic and dried thyme. Sauté until aromatic (about 30-60 seconds).\n2. Sprinkle the flour over the butter and whisk together until there are no lumps, creating a roux. Cook the roux while whisking almost constantly until it starts to darken (about 3 minutes). This cooks off the flour taste and adds more depth of flavor.\n3. Slowly pour the broth into the roux while whisking quickly and constantly. Continue whisking until there are no clumps. Sprinkle in the poultry seasoning, salt, and pepper, and whisk to combine.\n4. While slowly whisking, bring the gravy to a gentle boil then lower the heat to a simmer until the gravy has thickened.\n5. Once the gravy has thickened, transfer it to a serving dish, and enjoy!\n\n## Notes\n*If using regular table salt instead of fine sea salt, start with only 1/4 teaspoon (table salt tastes saltier), then adjust to taste. To freeze, thaw in the fridge overnight, then stir and warm gently on the stove (add a splash of broth if it needs thinning). To reheat in the microwave, cover with a vented microwave-safe lid and heat on medium power in 30-second intervals, stirring between each, until heated through. For a large batch (e.g. 12x), one reader was advised to use: 2 cups salted butter, 8 medium cloves garlic (minced), 2 Tbsp + 2 tsp dried thyme leaves, 2 cups all-purpose flour, 16 cups turkey broth, 1 Tbsp + 1 tsp poultry seasoning, 1 Tbsp + 1 tsp fine sea salt (or 2 tsp if using table salt), and 1 Tbsp + 1 tsp ground black pepper — starting on the lower end of spices and adjusting to taste for large batches. Nutrition per serving (1/6 recipe): 94 kcal, 7.9g fat, 4.8g carbs, 1.2g protein.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "3jgcr5nrgbi3o4e5kq3vwl7stu", "title": "Best White Queso (Mexican White Cheese Dip)", "ainfo": "Best White Queso (Mexican White Cheese Dip)", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place cheese, milk, and butter in a medium saucepan over low heat. Stir until cheese is melted.", "notes": "# Best White Queso (Mexican White Cheese Dip/Sauce)\n\nSource: http://m.allrecipes.com/recipe/84980/mexican-white-cheese-dipsauce/\n\nPrep: 5 mins | Cook: 10 mins | Total: 15 mins | Servings: 8\n\n## Ingredients\n- 1 pound white American cheese, cubed\n- 1/2 cup milk, or as needed\n- 1 tablespoon butter\n- 2 (4 ounce) cans chopped green chilies\n- 2 teaspoons cumin\n- 2 teaspoons garlic powder\n- 2 teaspoons onion powder\n- Cayenne pepper to taste\n\n## Instructions\n1. Place cheese, milk, and butter in a medium saucepan over low heat. Stir until cheese is melted.\n2. Add green chilies, cumin, garlic powder, onion powder, and cayenne pepper; stir until smooth.\n3. Thin with more milk if sauce is too thick.\n4. Cook until heated through, about 2 minutes. Serve warm.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "xpjoucbaqk4rnr3gtkbtmqgfs4", "title": "Big Soft Oatmeal Cookies", "ainfo": "Big Soft Oatmeal Cookies", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Beat butter in the bowl of a stand mixer (or with an electric beater) for about 30 seconds.", "notes": "# Oatmeal Cookies (Big Soft Oatmeal Cookies)\n\nSource: https://sugarspunrun.com/big-soft-oatmeal-cookies/\n\nBy Sam Merritt, Sugar Spun Run. Servings: 24 cookies | Prep: 20 min | Cook: 10 min | Chilling: 30 min | Total: 1 hour\n\n## Ingredients\n- 1 cup (226 g) unsalted butter, softened\n- 1 cup (200 g) light brown sugar, firmly packed\n- 1/2 cup (100 g) granulated sugar\n- 2 large eggs, room temperature preferred\n- 1 1/2 teaspoon vanilla extract\n- 1 3/4 cup (215 g) all-purpose flour\n- 2 teaspoons cornstarch (cornflour in UK)\n- 1 teaspoon baking soda\n- 3/4 teaspoon table salt\n- 3/4 teaspoon ground cinnamon\n- 3 cups (285 g) old-fashioned rolled oats\n- 1 1/2 cups chocolate chips, chopped nuts, or raisins, optional\n\n## Instructions\n1. Beat butter in the bowl of a stand mixer (or with an electric beater) for about 30 seconds.\n2. Add sugars and beat until light and fluffy, scraping down the bowl as needed.\n3. Add eggs, one at a time, beating until combined.\n4. Stir in vanilla extract.\n5. In a separate bowl, whisk together flour, cornstarch, baking soda, salt, and cinnamon.\n6. Gradually add the flour mixture to the butter mixture until completely combined, scraping the bowl as needed.\n7. Gradually stir in oats until completely combined. If using raisins or chocolate chips, stir them in now.\n8. Cover the dough with plastic wrap and refrigerate at least 30 minutes, up to 3 days.\n9. Preheat oven to 375°F (190°C) and line cookie sheets with parchment paper.\n10. Drop dough by rounded 2-tablespoon balls onto the parchment, spacing at least 2 inches apart. Roll between your palms for more uniform cookies, if desired.\n11. Bake at 375°F for 10-12 minutes — edges slightly browned, centers may look slightly underbaked but not raw; they finish cooking as they cool.\n12. Let cookies cool completely on the cookie sheet before serving.\n\n## Notes\nSubstitute dark brown sugar for an even softer, chewier cookie. Instant oats can replace old-fashioned oats in equal amount. If out of cornstarch, substitute an equal amount of flour (cookies will be a bit flatter and less soft/chewy). Store airtight at room temperature up to 5 days.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "j5yqt64myrbllngrkmmhd6el2u", "title": "Birria Ramen", "ainfo": "Birria Ramen", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prepare dried chiles: wearing gloves if desired, rinse the chiles and use scissors to open them and remove the stem and seeds.", "notes": "# Birria Ramen\n\nSource: https://tastesbetterfromscratch.com/birria-ramen/\n\nBy Lauren Allen. Prep: 30 min | Cook: 3 hrs | Total: 3 hrs 30 min. Servings: 6.\n\n## Ingredients\n- 8 dried guajillo chile peppers*\n- 3 dried pasilla chile peppers\n- 2-3 dried arbol chile peppers*\n- 5 Roma tomatoes, quartered (about 1.5lb)\n- 1 white onion, roughly chopped\n- 1 head garlic, peeled (10-12 cloves)\n- 1 Tablespoon whole black peppercorns\n- 1 Tablespoon whole cumin seed (or 1 1/2 teaspoon ground cumin)\n- 1 Tablespoon dried oregano\n- 1 Tablespoon dried thyme\n- 1/2 teaspoon whole coriander seeds (or 1/4 tsp ground coriander, or 4-5 whole cloves)\n- 1 teaspoon fresh minced ginger root\n- 1 inch piece Mexican cinnamon stick* (or 1/8 teaspoon ground cinnamon)\n- 2 Tablespoons apple cider vinegar, or white\n- 4 cups water\n- 2 bay leaves\n- 3 lb beef chuck roast, cut into large chunks\n- 4 bone-in beef short ribs*\n- 1 Tablespoon kosher salt\n- 6 cups low-sodium beef broth\n- 8 packets dry instant ramen noodles, seasoning discarded\n\nFor Serving:\n- 1 white onion, finely chopped\n- 1 bunch cilantro, chopped\n- 2 limes, sliced\n\n## Instructions\n1. Prepare dried chiles: wearing gloves if desired, rinse the chiles and use scissors to open them and remove the stem and seeds.\n2. Make sauce: add tomatoes and onion to a very large stock pot (6+qt) over medium heat. Cook for a few minutes, stirring. Add whole garlic cloves, chile peppers, and all of the spices except the bay leaf. Cook for 5 minutes, stirring often. Add vinegar and 4 cups water. Bring to a low boil, reduce heat to a simmer, and cook for 15 minutes, uncovered.\n3. Blend: add the mixture to a blender and blend as smooth as possible. Pour through a fine mesh strainer back into the pot.\n4. Add 6 cups beef broth and 1 Tablespoon kosher salt. Bring to a boil.\n5. Add short ribs, chuck roast, and 2 bay leaves. Cover, reduce heat to a simmer, and cook for 2 1/2 hours or until the meat is tender.\n6. Remove meat to a plate and shred into pieces. Discard bones and bay leaves.\n7. Cook ramen noodles according to package instructions. Use tongs to remove noodles from cooking liquid and add to a bowl. Pour a ladleful of hot birria broth on top and top with shredded beef, cilantro, onion, and a squeeze of fresh lime juice.\n\n## Notes\nUse any flavor ramen noodles, discarding the seasoning packet — dry noodles work well, or use refrigerated ramen. Also good with a cup of Tapatio ramen (add a half ladleful of birria broth and some hot water, cook per package instructions, then add shredded meat, onion, and cilantro). Make-ahead: prep all components and store separately in the fridge; reheat sauce, broth, and meat and cook noodles fresh when serving. Freezing: meat, broth, and sauce freeze well in separate containers; thaw overnight in the fridge. Leftover meat and broth can be used to make Birria Tacos. Nutrition per serving: 504 kcal, 17g carbs, 50g protein, 28g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "lvmgpzdoaahpyiaor6j6rjuvwm", "title": "Black Powder Rub", "ainfo": "Black Powder Rub", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Toast the sesame seeds, peppercorns, poppy seeds, and mustard seeds in a dry pan until fragrant, 1 to 2 minutes.", "notes": "# Black Powder Rub\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/jeff-mauro/black-powder-rub-11572529.amp (retrieved via canonical URL)\n\nRecipe courtesy of Jeff Mauro. Level: Easy. Total: 5 min | Active: 5 min. Yield: 3/4 cup.\n\n## Ingredients\n- 1/4 cup black sesame seeds\n- 2 tablespoons black peppercorns\n- 1 tablespoon poppy seeds\n- 1 teaspoon brown mustard seeds\n- 1/4 cup kosher salt\n- 2 tablespoons dark brown sugar\n- 1 teaspoon granulated garlic\n- 1 teaspoon dehydrated onion\n\n## Instructions\n1. Toast the sesame seeds, peppercorns, poppy seeds, and mustard seeds in a dry pan until fragrant, 1 to 2 minutes.\n2. Transfer to a food processor, blender, or spice grinder and pulse until coarsely ground.\n3. Add the salt, brown sugar, granulated garlic, and dehydrated onion, and pulse until finely ground.\n\n## Notes\nPerfect for beef. Reviewers recommend a coffee grinder for a finer powder texture, and using oil as a binder before applying liberally to steak before grilling.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wkyigdjchgtkqnee5btw4hoy5u", "title": "Blueberry Crumble", "ainfo": "Blueberry Crumble", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Toss blueberries with 2 Tbsp lemon juice and 1 tsp lemon zest and set aside.", "notes": "# Blueberry Crumble\n\nSource: https://natashaskitchen.com/blueberry-crumble-recipe-extra-blueberries-le-creuset-giveaway/\n\nBy Natasha of NatashasKitchen.com. Prep: 15 min | Cook: 40 min | Total: 55 min. Servings: 6-8. Course: Dessert. Cuisine: American.\n\n## Ingredients\nFor the Filling:\n- 2 to 2 1/4 pounds (about 36 oz) fresh blueberries, rinsed and well-drained\n- 2 Tbsp lemon juice, freshly squeezed\n- 1 tsp lemon zest (zest of 1 lemon)\n- 3 Tbsp all-purpose flour\n- 1/4 cup granulated sugar\n- 1 tsp ground cinnamon\n\nFor the Crumble Topping:\n- 1 cup all-purpose flour, measured correctly\n- 1/4 cup granulated sugar\n- 1/3 cup brown sugar, packed\n- 1/8 tsp (generous pinch) salt\n- 8 Tbsp (1 stick) cold, unsalted butter, diced\n- 1/2 cup quick-cooking oats\n- 1 cup sliced almonds, divided\n\nTo Serve:\n- vanilla ice cream or whipped cream, optional\n\n## Instructions\n1. Toss blueberries with 2 Tbsp lemon juice and 1 tsp lemon zest and set aside.\n2. In a small bowl, whisk together 1/4 cup sugar, 3 Tbsp flour, and 1 tsp ground cinnamon, and toss with the blueberries just until evenly coated. Pour into a 9x13-inch baking dish.\n3. In a food processor fitted with a steel blade, combine 1 cup flour, 1/4 cup granulated sugar, 1/3 cup brown sugar, and 1/8 tsp salt. Pulse several times to combine. Add the diced cold butter and pulse until the butter is the size of peas.\n4. Transfer the mixture to a bowl, add 1/2 cup oatmeal, and use your hands to make large crumbles. Add 1/2 cup of the sliced almonds and mix to combine.\n5. Spread the topping over the fruit and cover evenly, then sprinkle the remaining 1/2 cup of almonds over the top. Bake 40 minutes at 350°F. The blueberries should be bubbling at the edges and the topping and almonds golden brown.\n6. Let the crumble sit for at least 15 minutes before serving — it will thicken slightly as it cools.\n\n## Notes\nNo need to blanch, peel, pit, or slice any fruit — one of the easiest crumbles to prepare. Cinnamon intensifies the flavor of blueberries, and lemon juice/zest pair well with them too. Stays warm for a couple of hours and reheats beautifully the next day. Great served with vanilla ice cream or whipped cream.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "lpmyjgxkrblf4tmrfbb7xcgwkq", "title": "Boneless Leg of Lamb", "ainfo": "Boneless Leg of Lamb", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Remove the netting from the boneless leg of lamb and place it on a rack over a sheet tray. Keep the netting.", "notes": "# Boneless Leg of Lamb\n\nSource: Google Keep note\n\nThis full-flavored boneless leg of lamb recipe is stuffed with roasted garlic cloves and crusted in herbs. USDA recommends lamb reach an internal temp of 145°F with a 3-minute rest. Serves 8. Prep time: 45 minutes. Cook time: 2 hours 45 minutes.\n\n## Ingredients\n- 3 1/2 pound boneless leg of lamb\n- 25-30 roasted garlic confit cloves\n- 1/3 cup roasted garlic oil, plus 2 tablespoons\n- 3 tablespoons minced fresh thyme\n- 3 tablespoons minced fresh rosemary\n- 3 tablespoons minced fresh parsley\n- 3/4 cup dry red wine\n- 3 cups beef stock\n- Coarse salt and fresh cracked pepper, to taste\n\n## Instructions\n1. Remove the netting from the boneless leg of lamb and place it on a rack over a sheet tray. Keep the netting.\n2. Generously season the lamb on both sides with salt and pepper and place it uncovered on the rack/sheet tray for 24-48 hours in the refrigerator.\n3. About 30 minutes before the lamb is ready to be cooked, preheat the smoker or oven to 225°F.\n4. Mix the oil with thyme, rosemary, parsley, 5 roasted garlic cloves, salt, and pepper until combined. Set aside.\n5. Remove the lamb and place it fat side down on the rack. Using a sharp knife, make 1\" wide and deep incisions in 20-25 places about 1/2\" to 1\" apart from each other.\n6. Stuff a roasted garlic clove in each slit until all the holes are filled.\n7. Pour about 1/3 of the herb oil mixture over the inside of the lamb and spread it out using a spoon, brush, or your hands.\n8. Fold the boneless leg of lamb back over and place the netting around it again.\n9. Use another 1/3 of the herb oil mixture over the outside of the lamb and spread it all around, completely covering it.\n10. Place the lamb on a top rack in the smoker with a drip pan underneath (important to use a drip pan). If cooking in the oven, place the lamb directly in a 13x9 pan on the middle rack. Smoke or cook until it reaches an internal temperature of 100°F, about 2 hours.\n11. Turn the heat up to 500°F and cook until it reaches 125°F internally for medium-rare, 135°F for medium, 145°F for medium-well, or 155°F for well.\n12. Remove from the smoker or oven and place on a cutting board to rest for 15 to 20 minutes.\n13. Optional pan sauce: take the drippings from the pan and place them in the freezer to quickly chill.\n14. For the sauce, add 1 to 2 tablespoons of olive oil to a medium-sized sauce pot over medium heat.\n15. Add shallots and sauté until lightly browned, about 2 to 3 minutes.\n16. Deglaze with the wine, turn the heat to high, and cook until there are 2 to 3 tablespoons of liquid left.\n17. Pour in the beef stock and cook until there is about 1 cup left, about 10 minutes.\n18. Finish by whisking in the chilled pan drippings, optional minced fresh parsley, salt, and pepper.\n19. Remove the netting from the lamb and thinly slice it.\n20. Garnish with the remaining 1/3 of herb oil and the optional pan sauce.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "luvtk3vhpba3ljdl5xirizjcci", "title": "Braised Rosemary Lamb Shoulder Chops", "ainfo": "Braised Rosemary Lamb Shoulder Chops", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 300°F (150°C).", "notes": "# Braised Rosemary Lamb Shoulder Chops\n\nSource: https://honestcooking.com/braised-rosemary-lamb-shoulder-chops/\n\nBy Nancy Lopez-McHugh, Honest Cooking. Prep: 15 min | Cook: 240 min. Category: Main Course. Method: Braising. Cuisine: Mediterranean. Serving size: 275g.\n\n## Ingredients\n- 1 lbs (550 g) lamb shoulder chops\n- 1 medium onion\n- 3 large garlic cloves\n- 2 tbsp butter\n- 1 tsp dried thyme\n- 1 tbsp (15 ml) dried rosemary\n- 6 whole allspice\n- Salt and pepper\n- 1/2 cups (118 ml) vegetable broth\n- Fresh rosemary, for serving\n\n## Instructions\n1. Preheat the oven to 300°F (150°C).\n2. Over medium heat, melt the butter in a frying pan, sauté the onion and garlic for 5 minutes, then add the spices and cook for another 2 minutes. Remove the pan contents and set aside.\n3. Turn the heat to high. Pat the lamb dry, then place it in the frying pan. Brown on both sides. Turn the heat off.\n4. Mix the onion and spice mixture back with the lamb.\n5. Place the lamb and pan contents into a baking dish and pour the broth over the lamb, then place the dish into the oven.\n6. Cook the lamb for 3-4 hours, or until the meat is very tender and breaks up easily. Add a little more water or broth as needed to prevent the baking dish from drying out.\n7. Reserve the pan juices and serve them as a sauce over the meat. Serve with fresh rosemary sprigs.\n\n## Notes\nFor deeper flavor, marinate the lamb chops in the rosemary, garlic, and thyme for at least 30 minutes before braising. If lamb shoulder chops are unavailable, bone-in lamb shanks can be substituted, increasing braising time to 4-5 hours. Leftover braised lamb can be shredded and used in tacos, salads, or sandwiches. Sear the chops before braising for deeper flavor — pat dry and sear in batches to avoid steaming.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vm2axqmoeg4pxysmchgs6hszrm", "title": "Braised Short Ribs", "ainfo": "Braised Short Ribs", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F.", "notes": "# Braised Short Ribs\n\nSource: https://tastesbetterfromscratch.com/braised-short-ribs/\n\nBy Lauren Allen, Tastes Better From Scratch. Servings: 4 | Prep: 20 min | Cook: 2 hr 40 min | Total: 3 hours\n\n## Ingredients\n- 3 Tablespoons olive oil\n- 1 yellow onion, diced\n- 3 carrots, chopped\n- 8 whole beef short ribs, bone-in\n- Salt and pepper, to taste\n- 1/4 cup all-purpose flour\n- 1 cup dry red wine (such as Cote du Rhone or Pinot Noir)\n- 2 1/2 cups low-sodium beef broth\n- 2 Tablespoons tomato paste\n- 2 sprigs fresh thyme\n- 2 sprigs fresh rosemary\n\n## Instructions\n1. Preheat oven to 350°F.\n2. In a large Dutch oven or oven-safe pot with a lid, heat 1 tablespoon oil over medium-high heat. Add onion and carrots and cook a few minutes, stirring constantly. Remove veggies to a plate.\n3. Season the ribs with salt and pepper and coat on all sides with flour. Add 2 more tablespoons oil to the pot, turn heat to high, add ribs, and brown on all sides, about 45 seconds per side. Remove to a plate.\n4. Add the wine to deglaze the pan, scraping up browned bits. Bring to a boil and cook 2 minutes.\n5. Add beef broth, salt, and pepper. Stir in tomato paste. Taste and adjust seasoning.\n6. Add ribs, veggies, and whole sprigs of thyme and rosemary to the pot.\n7. Cover and place in the oven. Cook at 350°F for 2 hours, then reduce to 325°F and cook 30 to 45 minutes more, until ribs are very tender, nearly falling off the bone.\n8. Remove from oven and let rest 20 minutes with the lid on before serving. Skim off any fat from the top of the liquid.\n9. Serve over mashed potatoes with a spoonful of gravy from the pot.\n\n## Notes\nBone-in ribs are recommended for more flavor and even cooking, though boneless can be substituted. Store leftovers refrigerated 3-4 days.\n\nSlow Cooker: follow steps 1-4, then transfer everything (ribs, veggies, whole herb sprigs, broth, tomato paste, seasoning) to the slow cooker and cook on low 6-8 hours.\n\nInstant Pot: sauté onion and carrots in 1 tbsp oil, remove; season and flour the ribs, brown in 2 more tbsp oil on high (about 45 sec/side), remove; deglaze with wine, boil 2 minutes; add broth, salt, pepper, and tomato paste; return ribs, veggies, and herbs to the pot; cook on Manual/High pressure 45 minutes, then natural release 15 minutes.\n\nFreezing before cooking: assemble through the pre-oven step, freeze 4-5 months, thaw 24 hours in the fridge, then cook as instructed. Freezing after cooking: cool completely, freeze 3-4 months, thaw in the fridge and reheat in the microwave or on the stove.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "cth3hoxgjc2jermmey2jlixopu", "title": "Brick Oven-Style Chicken", "ainfo": "Brick Oven-Style Chicken", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 500°F.", "notes": "# Brick Oven-Style Chicken\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/giada-de-laurentiis/brick-oven-style-chicken-5291076.amp\n\nRecipe courtesy of Giada De Laurentiis. Level: Intermediate | Total: 1 hr 20 min (includes resting) | Active: 25 min | Yield: 4 servings\n\n## Ingredients\n- 1 1/2 teaspoons kosher salt\n- 1/8 teaspoon freshly ground black pepper\n- 1 teaspoon chopped fresh thyme\n- 1 teaspoon grated lemon zest\n- One 3-pound chicken, spatchcocked or cut into 8 pieces\n- 3 Roma tomatoes, halved or quartered\n- 2 fennel bulbs, cut into 8 wedges each\n- 3 tablespoon olive oil\n- 2 tablespoons chopped fresh basil\n\n## Instructions\n1. Preheat the oven to 500°F.\n2. In a small bowl, mix together the salt, pepper, thyme and lemon zest. Sprinkle the chicken on both sides with all but 1/2 teaspoon of the mixture. Place the chicken skin-side up in a large (5-quart) braiser or cast-iron skillet. Nestle the tomato halves and fennel wedges around the chicken; season the vegetables with the remaining salt mixture. Drizzle the chicken and vegetables with the olive oil.\n3. Cover the pan and place in the oven for 20 minutes. Uncover and return to the oven for about another 20 minutes, until the chicken is golden brown and an instant-read thermometer inserted into the thickest part of the breast reads 160°F. Let rest for 15 minutes before carving.\n4. Serve the chicken alongside the vegetables, drizzled with pan juices and sprinkled with the basil.\n\n## Notes\nSome readers found it needed longer than stated to reach a safe temperature — check with a thermometer rather than relying strictly on time. Leeks can substitute for fennel if out of season.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7ibaqdol6ywygmbxqzcwi3twuq", "title": "Brisket Rub Recipe", "ainfo": "Brisket Rub Recipe", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix all of the ingredients together. Stir in an airtight container until ready to use.", "notes": "# Brisket Rub Recipe\n\nSource: https://www.dinneratthezoo.com/brisket-rub-recipe/\n\nBy Sara Welch. Prep: 5 min | Cook: 1 min | Total: 6 min. Course: Seasoning. Cuisine: American. Serves: 12.\n\n## Ingredients\n- 1/3 cup brown sugar\n- 2 tablespoons paprika\n- 1 tablespoon smoked paprika\n- 2 1/2 teaspoons black pepper, freshly ground\n- 1 tablespoon kosher salt\n- 1 tablespoon garlic powder\n- 1 tablespoon onion powder\n- 3/4 teaspoon mustard powder\n- 1/4 teaspoon cayenne pepper\n\n## Instructions\n1. Mix all of the ingredients together. Stir in an airtight container until ready to use.\n2. Brisket rub keeps for up to 4 months in an airtight container when stored in a cool, dry place.\n\n## Notes\nPairs well with beef, chicken, pork, and fish, and works for grilled, roasted, braised, or smoked brisket (also good on vegetables and potatoes). Don't substitute regular paprika for the smoked paprika — it adds significant flavor. Apply a generous amount, rubbing it over every surface of the meat; can be applied right before cooking or left to sit up to 24 hours. If browning the meat first, add the rub after browning since the sugar can burn. Variations: add 1/2 tsp crushed red pepper flakes or ground chipotle for a Spicy BBQ Rub; double the garlic for a Garlic Lovers Rub; add 1 tablespoon chili powder, 1 teaspoon ground cumin, and 1 teaspoon ground coriander for a Mexican Rub. Nutrition per serving: 53 kcal, 12g carbs, 9g sugar.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "x4f3z7rskx5fuoxpuyjczxltyq", "title": "Brownies Made With Cocoa Powder", "ainfo": "Brownies Made With Cocoa Powder", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Position your oven rack in the lower third of the oven.", "notes": "# Brownies Made With Cocoa Powder\n\nSource: https://www.lovefromtheoven.com/easy-brownies-cocoa-powder/\n\nBy Christi Johnstone. Prep: 15 min | Cook: 30 min | Total: 45 min. Servings: 16 brownies. Course: Dessert. Cuisine: American.\n\n## Ingredients\n- 10 tablespoons unsalted butter\n- 1 1/4 cups sugar\n- 3/4 cup plus 2 tablespoons unsweetened cocoa powder\n- 1/2 teaspoon salt\n- 1 teaspoon baking powder\n- 1 teaspoon pure vanilla extract\n- 2 large eggs\n- 1/2 cup all-purpose flour\n- 1/2 cup chocolate chips (optional)\n- 1/2 cup chopped walnuts (optional)\n\n## Instructions\n1. Position your oven rack in the lower third of the oven.\n2. Preheat oven to 325°F.\n3. Line an 8-inch square pan with parchment or aluminum paper. Spray lightly with non-stick cooking spray.\n4. Combine butter, sugar, cocoa powder, and salt in a large bowl, preferably glass, and place the bowl over a pan of water that is just barely simmering. Stir occasionally until butter is melted and mixture is combined.\n5. Remove from heat and allow to cool for 5-10 minutes. You do not want the mixture too hot when you add the eggs.\n6. After the mixture has cooled slightly, add vanilla and mix well.\n7. Add eggs, one at a time, and beat vigorously until very well mixed.\n8. In a separate bowl, combine flour and baking powder, and stir to combine.\n9. Add the flour mixture to the batter, and mix very well to combine. Unlike most brownie recipes, this batter needs to be stirred vigorously — about 40 strokes with a spoon is a good guide.\n10. If adding chocolate chips and/or nuts, fold them into the batter.\n11. Bake for 30 to 35 minutes, or until a tester comes out with some moist crumbs attached. Allow to cool on a wire rack.\n12. Serve and enjoy. If not eating the same day, wrap or cover tightly.\n\n## Notes\nRecipe lightly adapted from Alice Medrich's Best Cocoa Brownie Recipe. Uses natural (not Dutch process) cocoa powder — most grocery store brands like Hershey's, Ghirardelli, and Scharffen Berger are natural. Regular (not dark) cocoa powder keeps these from becoming overly bittersweet. Great mix-ins beyond chocolate chips/walnuts include pecans, almonds, white chocolate or peanut butter chips, or dried blueberries/raspberries. Travels well for gatherings. Store wrapped tightly at room temperature up to 5 days. Freezes well — cut into individual brownies, wrap in two layers of plastic wrap, then place in a freezer bag; thaw at room temperature. Nutrition per brownie: 207 kcal, 25g carbs, 2g protein, 11g fat, 19g sugar.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "pcupbz6jh2leoz5lzajo4jrk34", "title": "Butternut Squash Risotto", "ainfo": "Butternut Squash Risotto", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, heat 1 tablespoon of butter and the olive oil over high heat. Add the squash and sprinkle with the salt, pepper, and chili powder. Cook for several minutes, turning gently with a spatula, until the squash is deeply golden brown and tender (but not falling apart). Remove to a plate and set aside.", "notes": "# Butternut Squash Risotto\n\nSource: http://thepioneerwoman.com/cooking/butternut-squash-risotto/\n\nBy Ree Drummond. Yields: 8 servings | Prep: 10 mins | Cook: 1 hr | Total: 1 hr 10 mins\n\n## Ingredients\n- 3 Tbsp. butter, divided\n- 1 Tbsp. olive oil\n- 1/2 whole butternut squash, peeled, seeded, and diced\n- 1/2 tsp. kosher salt, plus more to taste\n- Black pepper, to taste\n- 1/4 tsp. chili powder\n- 6 cups low sodium vegetable or chicken broth\n- 1/2 whole diced onion\n- 1 1/2 cups Arborio rice\n- 1/8 tsp. turmeric\n- 1/4 cup heavy cream (less if desired)\n- 1/2 cup parmesan shavings, plus more for serving\n- Finely minced parsley, for serving\n\n## Instructions\n1. In a large skillet, heat 1 tablespoon of butter and the olive oil over high heat. Add the squash and sprinkle with the salt, pepper, and chili powder. Cook for several minutes, turning gently with a spatula, until the squash is deeply golden brown and tender (but not falling apart). Remove to a plate and set aside.\n2. In a saucepan, heat the broth over low heat. Keep warm.\n3. To the skillet you cooked the squash in, add the remaining 2 tablespoons of butter and heat over medium-low. Add the onion and cook for 2 to 3 minutes, or until translucent. Add the Arborio rice and stir, cooking for 1 minute.\n4. Reduce the heat to low. In 1-cup increments, begin adding the broth to the skillet, stirring to combine and gently stirring as the broth is absorbed. As soon as the liquid disappears, add another cup to cup-and-a-half of broth. Continue this process, stirring gently as the broth incorporates and the rice starts to become tender. Season with salt and pepper along the way.\n5. Taste the rice after about 5 cups of broth have been absorbed to check the consistency. Add another 1 to 2 cups of broth as needed to get the rice to the right consistency: tender with just a little bit of \"bite\" left to it.\n6. When the rice is tender, gently stir in the cooked squash and turmeric. Add the heavy cream and parmesan, and stir until just combined. Taste and add more salt and pepper as needed. Sprinkle minced parsley and serve immediately!", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "nsdihm47jnmxtidgrhsw2e47be", "title": "Buttery Sourdough Sandwich Biscuits", "ainfo": "Buttery Sourdough Sandwich Biscuits", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 425°F with a rack in the upper third. Grease a baking sheet, or line it with parchment.", "notes": "# Buttery Sourdough Biscuits\n\nSource: https://www.kingarthurbaking.com/recipes/buttery-sourdough-sandwich-biscuits-recipe (redirects to Buttery Sourdough Biscuits)\n\nRecipe by PJ Hamel, King Arthur Baking. Prep: 10 min | Bake: 20 to 23 min | Total: 30 min. Yield: 6 to 7 large biscuits.\n\n## Ingredients\n- 1 cup (120g) King Arthur Unbleached All-Purpose Flour\n- 2 teaspoons baking powder\n- 3/4 teaspoon table salt\n- 8 tablespoons (113g) unsalted butter, cold\n- 1 cup (227g) sourdough starter, unfed/discard\n\n## Instructions\n1. Preheat the oven to 425°F with a rack in the upper third. Grease a baking sheet, or line it with parchment.\n2. Combine the flour, baking powder, and salt. Work the butter into the flour until the mixture is unevenly crumbly.\n3. Add the starter, mixing gently until the dough is cohesive.\n4. Turn the dough out onto a lightly floured surface (a piece of parchment works well), and gently pat it into a 6\" round about 1\" thick.\n5. Use a sharp 2 3/8\" biscuit cutter to cut four rounds, cutting them as close to one another as possible. Gently push and pat the scraps into a 2 1/2\" x 5\" rectangle. Cut two more biscuits. Push and pat the remaining scraps into a 1\"-thick biscuit; it'll be slightly smaller than the others.\n6. Place the biscuits onto the prepared baking sheet, leaving about 2\" between them; they'll spread as they bake.\n7. Bake in the upper third of the oven for 20 to 23 minutes, until golden brown.\n8. Remove from the oven and serve warm, or cool completely, wrap in plastic, and store at room temperature for several days. Freeze, well-wrapped, for longer storage.\n\n## Notes\nThese big, tender, palm-sized biscuits are great for breakfast sandwiches (egg, ham, sausage) and use up sourdough discard. For a subtle nutty whole-grain flavor, substitute 20g (about 3 tablespoons) medium rye or buckwheat flour for an equal amount of the all-purpose flour. Can be made smaller if desired — reduce bake time slightly. If the dough seems very dry (starters vary in liquidity), dribble in a bit of milk or buttermilk until it comes together.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7vqxl5gbkt5aj5fefxbd3skdoi", "title": "Carne Asada Tacos", "ainfo": "Carne Asada Tacos", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Grill the carne asada until cooked to your preference. Slice it against the grain, then chop it into small pieces.", "notes": "# Carne Asada Tacos\n\nSource: https://downshiftology.com/recipes/carne-asada-tacos/\n\nBy Lisa Bryan, Downshiftology. Prep: 2 hrs | Cook: 10 min | Total: 2 hrs 10 min. Serves: 6 tacos.\n\n## Ingredients\n- 1 recipe carne asada (grilled flank or skirt steak; see the site's separate carne asada recipe)\n- 2 avocados\n- 3 tbsp cotija cheese\n- 1/3 cup onion, finely diced\n- 1/2 cup fresh cilantro, chopped\n- 6 tortillas\n- limes, for garnish\n\n## Instructions\n1. Grill the carne asada until cooked to your preference. Slice it against the grain, then chop it into small pieces.\n2. Use a spoon to mash the avocado and spread a large spoonful or two onto each tortilla. Top the avocado with chopped carne asada, a sprinkle of cotija cheese, some diced onion, and fresh cilantro. Squeeze fresh lime juice on top.\n\n## Notes\nFlank steak is the typical cut for carne asada, though skirt steak also works; an indoor grill pan can substitute for an outdoor grill. Guacamole can replace plain mashed avocado. Additional topping ideas: pico de gallo, homemade salsa, lime crema, chipotle sauce, queso fresco or Mexican cheese blend instead of cotija, and thinly sliced radish for crunch. Great served with a classic or mango margarita. Nutrition per serving: 514.9 kcal, 26.3g carbs, 35.4g protein, 30.7g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "azzp7m555thej6oadzippzpgme", "title": "Carolina Mustard BBQ Sauce", "ainfo": "Carolina Mustard BBQ Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine yellow mustard, apple cider vinegar, honey, Worcestershire sauce, ketchup, garlic powder, red pepper flakes, salt, and brown sugar in a sauce pan. Mix well.", "notes": "# Carolina Mustard BBQ Sauce (Gold Barbecue Sauce)\n\nSource: https://www.aforkstale.com/carolina-mustard-bbq-sauce/\n\nBy Katie Crenshaw, A Fork's Tale. Course: Sauce | Cuisine: American | Prep: 3 minutes | Cook: 7 minutes | Total: 10 minutes | Servings: 12\n\n## Ingredients\n- 3/4 cup yellow mustard\n- 1/2 cup apple cider vinegar\n- 1/2 cup honey\n- 1 teaspoon Worcestershire sauce\n- 2 tablespoon ketchup\n- 1 teaspoon garlic powder\n- 1 tablespoon red pepper flakes\n- 1/2 teaspoon salt\n- 2 tablespoon brown sugar\n\n## Instructions\n1. Combine yellow mustard, apple cider vinegar, honey, Worcestershire sauce, ketchup, garlic powder, red pepper flakes, salt, and brown sugar in a sauce pan. Mix well.\n2. Cook on low heat, stirring continuously to prevent scorching, for 5 to 7 minutes.\n3. Cool completely, then pour into a jar. Refrigerate until ready to serve.\n\n## Notes\nUse plain yellow mustard, not stone-ground or dijon. Don't substitute white vinegar for apple cider vinegar. Omit red pepper flakes for no heat, or add an extra tablespoon for more. Great over pulled pork, grilled chicken, chicken wings, pork chops, or baby back ribs. Keeps refrigerated in an airtight container for up to 2 weeks.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "y2j5qqo2i6tqsruma4pxcbhv3u", "title": "Cauliflower Chowder", "ainfo": "Cauliflower Chowder", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat a large stockpot or Dutch oven over medium heat. Add bacon and cook until brown and crispy, about 6-8 minutes. Transfer to a paper towel-lined plate, reserving 1 tablespoon excess fat in the stockpot.", "notes": "# Cauliflower Chowder\n\nSource: http://damndelicious.net/2014/03/22/cauliflower-chowder/?m\n\nYield: 6 servings | Prep: 20 minutes | Cook: 35 minutes | Total: 55 minutes\n\n## Ingredients\n- 4 slices bacon, diced\n- 2 tablespoons unsalted butter\n- 3 cloves garlic, minced\n- 1 onion, diced\n- 2 celery ribs, diced\n- 1 head cauliflower, roughly chopped\n- 1 bay leaf\n- 1/4 cup all-purpose flour\n- 4 cups chicken broth\n- 1 cup 2% milk\n- Kosher salt and freshly ground black pepper, to taste\n- 2 tablespoons chopped fresh parsley leaves\n\n## Instructions\n1. Heat a large stockpot or Dutch oven over medium heat. Add bacon and cook until brown and crispy, about 6-8 minutes. Transfer to a paper towel-lined plate, reserving 1 tablespoon excess fat in the stockpot.\n2. Melt butter in the stockpot. Add garlic, onion and celery. Cook, stirring occasionally, until tender, about 3-4 minutes.\n3. Stir in cauliflower and bay leaf. Cook, stirring occasionally, until barely crisp-tender, about 4-5 minutes.\n4. Whisk in flour until lightly browned, about 1 minute.\n5. Stir in chicken broth and milk, and cook, stirring frequently, until slightly thickened, about 3-4 minutes.\n6. Bring to a boil; reduce heat and simmer until cauliflower is tender, about 12-15 minutes; season with salt and pepper, to taste.\n7. Puree with an immersion blender until desired consistency is reached.\n8. Serve immediately, garnished with bacon and parsley, if desired.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "mgfodads7akahsxz2kbcf5x2t4", "title": "Cauliflower Pizza Crust", "ainfo": "Cauliflower Pizza Crust", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 400°F. Line a baking sheet with parchment paper.", "notes": "# Cauliflower Pizza Crust\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/katie-lee/cauliflower-pizza-crust-2651381.amp (retrieved via canonical URL)\n\nRecipe courtesy of Katie Lee Biegel, Food Network (The Kitchen). Level: Easy | Total: 50 min | Active: 20 min | Yield: 1 pizza crust\n\n## Ingredients\n- 1 head cauliflower, stalk removed\n- 1/2 cup shredded mozzarella\n- 1/4 cup grated Parmesan\n- 1/2 teaspoon dried oregano\n- 1/2 teaspoon kosher salt\n- 1/4 teaspoon garlic powder\n- 2 eggs, lightly beaten\n\n## Instructions\n1. Preheat the oven to 400°F. Line a baking sheet with parchment paper.\n2. Break the cauliflower into florets and pulse in a food processor until fine. Steam in a steamer basket and drain well (a towel helps remove all the moisture). Let cool.\n3. In a bowl, combine the cauliflower with the mozzarella, Parmesan, oregano, salt, garlic powder, and eggs. Transfer to the center of the baking sheet and spread into a circle resembling a pizza crust. Bake 20 minutes.\n4. Add desired toppings and bake an additional 10 minutes.\n\n## Notes\nDry the cauliflower thoroughly to prevent a soggy crust. Don't overload with too many toppings. Freezes well: bake plain, cool, wrap tightly, and freeze up to 3 months; reheat frozen at 400°F for 5-10 minutes before topping and baking again.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "kuz2dc6suygd5vm7wjqctahham", "title": "Celery, Fennel and Apple Salad with Pecorino and Walnuts", "ainfo": "Celery, Fennel and Apple Salad with Pecorino and Walnuts", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 375°F. Spread the walnuts in a pie plate and toast for 7 to 8 minutes, until golden. Coarsely chop the nuts.", "notes": "# Celery, Fennel and Apple Salad with Pecorino and Walnuts\n\nSource: https://www.foodandwine.com/recipes/celery-fennel-and-apple-salad-pecorino-and-walnuts\n\nBy Athena Calderone, Food & Wine. Total Time: 30 min. Yield: 4 to 6.\n\n## Ingredients\n- 3/4 cup walnuts\n- 3 tablespoons extra-virgin olive oil, plus more for drizzling\n- 2 tablespoons fresh lemon juice\n- Kosher salt\n- Pepper\n- 3 celery ribs, sliced diagonally 1/4-inch thick\n- 2 fennel bulbs, trimmed, halved, cored and thinly sliced on a mandoline\n- 2 Honeycrisp apples, halved, cored and sliced\n- 1/2 cup basil leaves, torn if large\n- Pecorino cheese shavings, for garnish\n\n## Instructions\n1. Preheat the oven to 375°F. Spread the walnuts in a pie plate and toast for 7 to 8 minutes, until golden. Coarsely chop the nuts.\n2. In a large bowl, whisk the 3 tablespoons of olive oil with the lemon juice and season with salt and pepper. Add the celery, fennel, apples, and basil and toss to evenly coat.\n3. Transfer the salad to a serving platter. Season with pepper and drizzle with olive oil, then top with the walnuts and garnish with cheese shavings.\n\n## Notes\nHoneycrisp apples are recommended for their sweet-tart flavor and crisp, juicy texture, but any favorite variety works.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "r7axdn2kws3ffuaygwivzkxpj4", "title": "Charlotte Royale Cake", "ainfo": "Charlotte Royale Cake", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Line a 9-inch round cake pan with parchment and spray with nonstick spray. Spray a 12x18-inch rimmed baking sheet with nonstick spray, line with parchment, spray again, and dust lightly with flour (don't skip this or you won't be able to roll the cake). Preheat oven to 325°F.", "notes": "# Charlotte Royale Cake\n\nSource: https://www.sugarhero.com/charlotte-royale-swiss-roll-cake/#\n\nBy Elizabeth LaBau, SugarHero. Prep: 2 hrs | Cook: 16 min | Chilling: 10 hrs | Total: 12 hrs 16 min.\n\n## Ingredients\nFor the cake:\n- 4.25 oz (1 cup) cake flour\n- 7 oz (1 cup) granulated sugar, divided use\n- 1 tsp baking powder\n- 1/2 tsp salt\n- 4 fl oz (1/2 cup) vegetable oil\n- 2 fl oz (1/4 cup) water\n- 4 large egg yolks, at room temperature\n- 1 TBSP vanilla extract\n- 6 large egg whites, at room temperature\n- 1/4 tsp cream of tartar\n- 13 oz (about 1 1/4 cups) strawberry jam\n\nFor the filling:\n- 2 1/2 cups heavy cream\n- 2 oz (1/2 cup) powdered sugar\n- 1 TBSP unflavored powdered gelatin\n- 3 TBSP cold water\n- 3/4 cup milk\n- 2.6 oz (3/4 cup) almond flour (or almond meal/finely ground almonds)\n- 3.5 oz (1/2 cup) granulated sugar\n- 1 TBSP vanilla extract\n- 1 tsp almond extract, optional\n- 1 1/4 cups freeze-dried strawberries, coarsely chopped\n\n## Instructions\nSwiss roll cake:\n1. Line a 9-inch round cake pan with parchment and spray with nonstick spray. Spray a 12x18-inch rimmed baking sheet with nonstick spray, line with parchment, spray again, and dust lightly with flour (don't skip this or you won't be able to roll the cake). Preheat oven to 325°F.\n2. In a large bowl, sift or whisk together the cake flour, 3/4 cup (5.25 oz) of the sugar, baking powder, and salt.\n3. In a separate small bowl, whisk together the oil, water, yolks, and vanilla.\n4. Whip the egg whites on medium speed in a stand mixer; once frothy, add cream of tartar and continue whipping. Once soft peaks form, slowly add the remaining 1/4 cup sugar. Beat on medium-high until glossy and holding firm peaks.\n5. Add the yolk mixture to the dry ingredients and stir until smooth.\n6. Gently fold a third of the beaten egg whites into the batter, then fold in the rest in two batches, being careful not to deflate.\n7. Scoop 1 1/2 cups (6 oz) of batter into the round pan and spread evenly. Pour the rest into the sheet pan and smooth evenly.\n8. Bake at 325°F for 14-16 minutes, until light golden brown and springy to the touch (watch both cakes, as they may finish at different times). Cool on a wire rack to room temperature.\n9. Spread the strawberry jam in a thin layer over the entire sheet cake.\n10. Starting at the long end nearest you, roll the cake into a spiral, peeling the parchment off as you go. Wrap in cling wrap and refrigerate at least 2 hours (can be done overnight) for easier, cleaner slicing.\n\nAssembling the cake bowl:\n11. Line a 3 or 4 quart round bowl with plastic wrap, extending up and over the sides.\n12. Use a sharp serrated knife to slice the Swiss roll into 1/2 to 1 inch thick pieces (thinner for larger bowls).\n13. Press the slices into the bowl, edge to edge, covering the bottom and sides with as few gaps as possible. Trim, re-roll, or manipulate slices at the top of the bowl for even coverage.\n\nCream filling:\n14. Whip the cream and powdered sugar together to firm peaks. Spread a thin layer inside the cake-lined bowl to seal it against leaking. Refrigerate the remaining whipped cream and the cake bowl.\n15. Combine the gelatin and cold water in a small bowl; let sit about 5 minutes to absorb, then microwave 15-20 seconds until melted and liquid.\n16. Combine the milk, almond flour, and granulated sugar in a saucepan; bring to a simmer, stirring until the sugar dissolves. Remove from heat and whisk in the melted gelatin.\n17.
