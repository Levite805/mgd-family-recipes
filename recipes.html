 fork.\n3. Let the brisket cool uncovered on the counter for about an hour and a half, then refrigerate.\n4. Morning of serving: Remove the fat that has solidified on top of the brisket (there will be a lot). Slice the cold brisket against the grain, then use a spatula to place the slices back into the sauce, keeping them together for a neat presentation.\n5. One hour prior to serving: Place the brisket, covered, in the oven at 275-300°F. Heat for one hour, then remove to a serving platter, pour sauce over, and serve.\n\n## Notes\nCook low and slow — that's the secret to tender brisket. Leftover brisket will keep for 3 days in the fridge.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "guruau46t52gbei6ykvlsf62ie", "title": "Pasta alla Genovese", "ainfo": "Pasta alla Genovese", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pat the beef dry on all sides and season well with salt and pepper. (Optional: for a deeper crust, dry-brine uncovered on a rack in the fridge up to 24 hours.)", "notes": "# Pasta alla Genovese (Caramelized Onion and Braised Meat Sauce)\n\nSource: https://www.billyparisi.com/pasta-alla-genovese/\n\nBy Chef Billy Parisi. Servings: 4, with leftover sauce. Prep: 45 min | Cook: 5 hours. Course: Main Course. Cuisine: Italian.\n\n## Ingredients\n- 2 pounds beef shanks\n- 2 pounds chuck roast, cut into 2\" cubes\n- 4 ounces medium-diced pancetta\n- 6 large julienned yellow onions, about 5 pounds, divided\n- 2 carrots, peeled and finely minced\n- 2 ribs celery, finely minced\n- 2 tablespoons tomato paste\n- 6 to 8 sprigs fresh thyme\n- 15 to 20 torn basil leaves, divided\n- 10 to 12 hand-crushed cherry tomatoes\n- 2 cups dry white wine\n- 1 cup beef stock (plus more as needed)\n- Coarse salt and freshly cracked pepper, to taste\n- Finely grated Parmigiano Reggiano, for garnish\n- 1 pound long ziti (broken) or rigatoni\n\n## Instructions\n1. Pat the beef dry on all sides and season well with salt and pepper. (Optional: for a deeper crust, dry-brine uncovered on a rack in the fridge up to 24 hours.)\n2. Cook the pancetta in a large rondeau or Dutch oven over low-medium heat for 5 to 7 minutes until crispy and the fat is rendered. Set the lardons aside.\n3. Turn the heat high and sear the beef, undisturbed, for 3-4 minutes. Flip, reduce heat to medium, and cook 6-8 minutes more until well-browned. Prep the onions while it cooks. Set the beef aside once browned.\n4. Add half the julienned onions to the pot, season with salt, and sauté over medium heat 10 minutes, then reduce heat to low and cook 20 minutes more, stirring occasionally, until well-browned.\n5. Add the carrots and celery and cook over medium heat 10 minutes.\n6. Stir in the tomato paste and cook 3-4 minutes (\"pincé\") until it turns a rust color.\n7. Add the beef, cooked pancetta, thyme, 10-12 torn basil leaves, cherry tomatoes, and white wine back in. Cook until only about 1/2 cup of liquid remains, about 5-6 minutes.\n8. Cover with the remaining julienned onions and the beef stock, season with salt and pepper, and stir to combine.\n9. Cover the pot and cook over low heat for 3 hours, stirring every 30-45 minutes. Remove the lid and cook 1 hour more (add more beef stock if it looks dry).\n10. Break up the beef so it shreds and incorporates into the sauce. Adjust seasoning with salt and pepper.\n11. Boil the pasta in a large pot of salted water for 75% of the recommended cook time.\n12. Drain and add the pasta to a large saucier pan with 1 cup of pasta water, plenty of the Genovese sauce, grated Parmigiano Reggiano, and the remaining basil leaves. Cook over low heat to finish, letting the pasta absorb the sauce flavor.\n\n## Notes\nCutting the beef into 2-inch cubes helps it fit the pot and sear evenly — the Maillard crust locks in flavor and juices. Dry brining the beef uncovered in the fridge (up to 24 hours) intensifies flavor and browning, though the recipe can be started right after seasoning. \"Pincé\"-ing the tomato paste (caramelizing until darker and fragrant) is essential — skipping it leaves a tinny flavor and less depth. Boil the pasta only to just underdone; it finishes cooking in the sauce. Garnish generously with fresh basil and Parmigiano Reggiano. Serve with garlic bread and a simple Italian or Caesar salad. Make-ahead: the sauce improves after resting — make at least 1 day ahead if possible; keep warm up to 2 hours over low heat before tossing with pasta. Storage: refrigerate up to 5 days or freeze up to 3 months; thaw overnight in the fridge. Reheat gently over low heat before tossing with freshly cooked pasta. Nutrition (per serving): 1325 kcal, 111g carbs, 96g protein, 45g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ikqcffarn6dp7tty2f3k2djkr4", "title": "Perfect Creamy Mashed Potatoes", "ainfo": "Perfect Creamy Mashed Potatoes", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Peel potatoes and cut into large pieces. Place in a large pot, cover with water, and sprinkle with 1 tablespoon salt. Bring to a boil, then lower heat to low, cover, and cook 25-35 minutes until fork tender. Drain.", "notes": "# Perfect Creamy Mashed Potatoes\n\nSource: https://www.modernhoney.com/perfect-creamy-mashed-potatoes/\n\nModern Honey. Prep: 10 min | Cook: 30 min | Total: 40 min | Servings: 8\n\n## Ingredients\n- 3 lbs. Yukon Gold potatoes, peeled and cut into pieces\n- 1/2 cup salted butter\n- 1 to 1 1/2 cups half-n-half, whole milk, or heavy cream\n- 1/2 cup sour cream (regular, full-fat)\n- 2 teaspoons salt (or more to taste)\n\n## Instructions\n1. Peel potatoes and cut into large pieces. Place in a large pot, cover with water, and sprinkle with 1 tablespoon salt. Bring to a boil, then lower heat to low, cover, and cook 25-35 minutes until fork tender. Drain.\n2. In a small saucepan, heat the butter and 1 cup of half-n-half until butter is melted and warm, about 5 minutes (or microwave 1 minute).\n3. Use a potato ricer or masher, or mix in a stand mixer with paddle attachment for 30 seconds to break up the potatoes.\n4. Slowly add the butter and cream mixture, mixing at the lowest speed. Fold in sour cream and salt. Use remaining half-n-half for creamier texture if desired. Taste and season more if necessary.\n\n## Notes\nTo re-warm, add a bit more butter and half-n-half.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "6dlmofez27vopykty2utnfof3u", "title": "Perfect Homemade Biscuits", "ainfo": "Perfect Homemade Biscuits", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 450°F.", "notes": "# Perfect Homemade Biscuits\n\nSource: https://www.momontimeout.com/perfect-biscuits-every-time-recipe/\n\nBy Trish, Mom On Timeout. Course: Breakfast | Cuisine: American | Prep: 5 minutes | Cook: 10 minutes | Total: 15 minutes | Servings: 12\n\n## Ingredients\n- 3 cups all-purpose flour\n- 3 tbsp sugar\n- 1/2 tsp salt\n- 4 tsp baking powder\n- 1/2 tsp cream of tartar\n- 3/4 cup COLD butter\n- 1 egg\n- 1 cup whole milk\n\n## Instructions\n1. Preheat oven to 450°F.\n2. The secret to excellent biscuits is really cold butter. Cut the butter into small pieces and keep refrigerated until ready to use.\n3. Combine the dry ingredients in a large bowl.\n4. Use a pastry cutter to cut the cold butter into the flour mixture — you want small, pea-sized pieces of butter throughout the dough.\n5. Add the milk and egg and mix just until combined. The dough will be sticky — don't overwork it; you should still see butter pieces in the dough.\n6. Turn the dough out onto a generously floured surface. Sprinkle flour on top so it doesn't stick to your fingers, and knead 10-15 times, adding more flour if too sticky.\n7. Pat the dough out to 3/4-1 inch thickness and cut with a biscuit cutter or glass (makes about 9-12 biscuits).\n8. Place the biscuits on a lightly greased or parchment-lined baking sheet and bake for 10 to 15 minutes, until golden brown on top.\n9. Brush the tops with melted butter for extra flavor.\n\n## Notes\nCream of tartar can be omitted if you don't have it. The egg can also be omitted, if preferred. Buttermilk can substitute for whole milk — use slightly more (start with 1 1/4 cup) since it's thicker. Keep butter, egg, and milk cold throughout to prevent the butter from softening before baking.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "o3xeyip3glmcjyyqfzohkyw6ne", "title": "Pesto Options/Guide", "ainfo": "Pesto Options/Guide", "category": "reference", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "", "notes": "", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "mtg42j3kyfalhb77vagbkjcsae", "title": "Pickled Red Cabbage", "ainfo": "Pickled Red Cabbage", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Divide the thinly sliced cabbage, ginger root, mustard seeds, peppercorns, garlic cloves, and chili slices between two glass jars.", "notes": "# Pickled Red Cabbage\n\nSource: https://sweetandsavorymeals.com/pickled-red-cabbage-recipe/\n\nBy Catalina Castravet. Prep: 25 min | Cook: 5 min | Total: 30 min. Course: Appetizer, Side Dish. Cuisine: American. Servings: 2 jars. Calories: 247 kcal.\n\n## Ingredients\n- 1 small head red cabbage, thinly sliced\n- 2 cups rice wine vinegar\n- 2 cups water\n- 2 pieces of 1-inch fresh ginger root, peeled\n- 1/2 teaspoon mustard seed\n- 1/2 teaspoon colored peppercorns\n- 2 cloves garlic, peeled\n- 1 red chili pepper, sliced and seeded\n- 2 tablespoons white sugar\n- 2 tablespoons salt\n\n## Instructions\n1. Divide the thinly sliced cabbage, ginger root, mustard seeds, peppercorns, garlic cloves, and chili slices between two glass jars.\n2. To a medium saucepan over medium heat, add the vinegar, water, sugar, and salt. Stir and bring to a boil.\n3. Pour the liquid over the cabbage and spices, and fill the jars.\n4. Let cool for 10 minutes.\n5. Cover and keep in the fridge for up to two weeks.\n\n## Notes\nRed cabbage is preferred over green because it stays firm rather than getting mushy. Best after chilling at least 2 hours (24-48 hours is even better) to fully absorb the brine flavor. Variations: add red pepper flakes, cayenne, or jalapeños for more heat; brown sugar, honey, or maple syrup for a different sweetness; whole cloves, cinnamon stick, or allspice for a unique spice blend; orange juice for a fruity twist; or swap the vinegar for malt, distilled, apple cider, or red wine vinegar. Unopened jars last several months in the fridge; once opened, use within two weeks. Not recommended for freezing. If no mustard seeds on hand, substitute caraway, cumin, horseradish, or prepared mustard. Nutrition per serving: 247 kcal, 46g carbs, 29g sugar.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qot7p2frotfa36ewjqe27uda2q", "title": "Poblano Ranch Sauce", "ainfo": "Poblano Ranch Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Broil the poblano pepper until the skin is blistered on all sides (about 20 minutes in a toaster oven, possibly less in a regular oven; alternatively, grill the pepper). Place the blistered poblano in a bowl and cover with plastic wrap; let sit 20 minutes. Remove skin, stem, and seeds.", "notes": "# Poblano Ranch Sauce\n\nSource: https://jeanetteshealthyliving.com/poblano-ranch-sauce/\n\nBy Jeanette, Jeanette's Healthy Living (adapted from The Pioneer Woman). Course: Sauce. Prep: 15 min | Total: 15 min. Servings: 10.\n\n## Ingredients\n- 1 poblano pepper\n- 2 cloves garlic, chopped\n- 1/4 cup parsley, coarsely chopped\n- 2 tablespoons chives, chopped\n- 1 tablespoon dill, coarsely chopped\n- 1 cup low-fat mayonnaise\n- 1/2 cup low-fat sour cream\n- 1/4 teaspoon sea salt\n- Black pepper to taste\n\n## Instructions\n1. Broil the poblano pepper until the skin is blistered on all sides (about 20 minutes in a toaster oven, possibly less in a regular oven; alternatively, grill the pepper). Place the blistered poblano in a bowl and cover with plastic wrap; let sit 20 minutes. Remove skin, stem, and seeds.\n2. Place the peeled, seeded poblano pepper in a food processor and process until chopped fine. Add garlic, parsley, chives, dill, mayonnaise, sour cream, salt, and pepper. Process until smooth, leaving a few flecks of green if desired.\n\n## Notes\nRoasting the poblano adds smokiness and mellows the flavor, giving just a bit of heat to the ranch. Versatile as a dip, spread, or salad dressing (thin it out for dressing use). Great with tacos or fresh vegetable sticks.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "3hscq72ky6uhwskzm4h47fmxz4", "title": "Pomegranate Glazed Lamb Lollipops with Feta Tzatziki", "ainfo": "Pomegranate Glazed Lamb Lollipops with Feta Tzatziki", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Whisk the pomegranate juice and cornstarch in a small saucepan. Add the sugar, honey, and mustard and whisk to combine. Bring to a simmer over medium heat and cook until thickened to the consistency of barbecue sauce, 6 to 8 minutes. Season to taste and let cool for 30 minutes. (The glaze can be made ahead and refrigerated up to 2 weeks.)", "notes": "# Pomegranate Glazed Lamb Lollipops with Feta Tzatziki\n\nSource: https://www.foodnetwork.com/recipes/jeff-mauro/pomegranate-glazed-lamb-lollipops-with-feta-tzatziki-12273495\n\nBy Jeff Mauro, Food Network. Level: Easy. Active: 30 min | Total: 2 hr (includes cooling and marinating). Yield: 2 to 3 servings.\n\n## Ingredients\nLamb & Glaze:\n- 1/2 cup pomegranate juice\n- 1 teaspoon cornstarch\n- 2 tablespoons light brown sugar\n- 2 tablespoons honey\n- 2 tablespoons Dijon mustard\n- Kosher salt and freshly cracked black pepper\n- 6 lamb rib chops, slightly frenched\n- Vegetable oil, for oiling grill grates\n- 1/2 cup crushed roasted pistachios\n- Feta Tzatziki (recipe below)\n- Fresh mint, chiffonade, for garnish\n\nFeta Tzatziki:\n- 1/2 English cucumber\n- Kosher salt and freshly ground black pepper\n- 1 cup whole-fat Greek yogurt\n- 4 ounces crumbled feta\n- 1 tablespoon fresh lemon juice\n- 1 tablespoon chopped fresh mint\n- 1 teaspoon honey\n- 1 clove garlic, minced or pressed\n\n## Instructions\n1. Whisk the pomegranate juice and cornstarch in a small saucepan. Add the sugar, honey, and mustard and whisk to combine. Bring to a simmer over medium heat and cook until thickened to the consistency of barbecue sauce, 6 to 8 minutes. Season to taste and let cool for 30 minutes. (The glaze can be made ahead and refrigerated up to 2 weeks.)\n2. Place the lamb chops in a large zipper-top bag. Pour half the glaze into the bag and marinate at room temperature for 1 hour. Reserve the remaining glaze for basting on the grill.\n3. Preheat a grill or grill pan over medium-high heat and liberally oil the grates.\n4. Remove the chops from the bag and wipe off excess marinade with a paper towel to ensure a good crust. Season with salt and pepper on both sides. Grill until charred in spots, 3 to 4 minutes. Flip, baste liberally with the reserved glaze, and grill another 3-4 minutes, or until internal temperature reaches 135°F.\n5. Baste once more with the glaze and remove from the grill. Coat one side of each chop in the crushed pistachios. Serve with a schmear of feta tzatziki and garnish with fresh mint.\n\nFeta Tzatziki:\n1. Grate the cucumber on the large holes of a box grater and place in a fine-mesh strainer or cheesecloth over a bowl. Salt and let sit for 10 minutes, then squeeze out excess moisture.\n2. Combine the strained cucumber with the yogurt, feta, lemon juice, mint, honey, and garlic in a bowl. Season with salt and pepper to taste.\n\n## Notes\nThe glaze can be made ahead and refrigerated up to 2 weeks. The tzatziki keeps in an airtight container in the fridge up to 3 days.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "5xo5w5q4by32b5gqc66x4kvipm", "title": "Pork Belly Burnt Ends with Maple and Bourbon", "ainfo": "Pork Belly Burnt Ends with Maple and Bourbon", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Start by lathering your cubed pork belly with oil, then thoroughly season with Maple Bourbon seasoning or your favorite pork rub.", "notes": "# Pork Belly Burnt Ends with Maple and Bourbon\n\nSource: https://overthefirecooking.com/maple-bourbon-pork-belly-burnt-ends/\n\nBy Derek Wolf. Prep: 20 min | Cook: 4 hrs 15 min | Total: 4 hrs 35 min. Course: Main Course. Cuisine: American. Servings: 4.\n\n## Ingredients\nPork Belly:\n- 2 lbs pork belly, cubed\n- Maple Bourbon Seasoning or your favorite pork rub\n- 1/2 cup brown sugar\n- 6 tbsp butter\n- oil, as needed\n\nBBQ Sauce:\n- 1/3 cup Cowboy Prairie Fire BBQ Sauce or your favorite BBQ sauce\n- 2 tbsp maple syrup\n- 2 tbsp bourbon\n\n## Instructions\n1. Start by lathering your cubed pork belly with oil, then thoroughly season with Maple Bourbon seasoning or your favorite pork rub.\n2. Set in the fridge for 1-2 hours.\n3. Using Cowboy Charcoal, fill one chimney full of coals, light, and let preheat your smoker for low heat (250°F).\n4. Top the hot coals with 1-2 hickory pit logs for added smoke flavor.\n5. Add your pork belly onto the smoker and cook for 2.5 hours.\n6. Once done, pull off and place in an aluminum foil pan, topping with butter and brown sugar.\n7. Place back in the smoker for 1.5 hours, or until the pork belly reaches 205°F internal.\n8. Heat up your BBQ sauce along with the maple syrup and bourbon.\n9. Simmer over low heat until thick (about 10 minutes).\n10. Lather the pork belly in BBQ sauce, crank up the heat in the smoker, and let caramelize for 5-10 minutes.\n11. Pull out of the smoker, serve, and enjoy!\n\n## Notes\nBurnt ends traditionally come from smoked brisket — the fatty ends cook faster and develop extra bark/crispness. This recipe applies the same slow-cook-and-caramelize technique to cubed pork belly. Leftovers: wrap in foil and store in an airtight container in the fridge for 3-5 days; reheat in the oven at 350°F for 10-15 minutes. Leftover BBQ sauce keeps in the fridge for a couple weeks. Substitute rum or brandy for bourbon (or apple cider vinegar for a nonalcoholic option). Nutrition per 0.5 lb serving: 1515 kcal, 43g carbs, 22g protein, 137g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "hg52dfy7ywym5xj2b4iukqjs3e", "title": "Pork Rack Roast with Fennel & Coriander", "ainfo": "Pork Rack Roast with Fennel & Coriander", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine all the seasoning ingredients, adding the garlic at the end and mixing until evenly dispersed.", "notes": "# Pork Rack Roast with Fennel & Coriander\n\nSource: https://journal.swaledale.co.uk/recipes/roast-pork-rack-with-fennel/\n\nBy Valentine Warner. Serves: 6-8. Cook time: 2 hours.\n\n## Ingredients\n- 1.4 kg pork rack roast\n- 1 tbsp fresh thyme leaves, very finely chopped\n- 2 tbsp coriander seeds, coarsely ground in a pestle and mortar\n- 2 tbsp fennel seeds, coarsely ground in a pestle and mortar\n- 1 tbsp dried oregano\n- 1 tbsp dried sage (ground if loose-leaved)\n- 2 tsp coarsely ground black pepper\n- 1/2 tsp dried chilli flakes\n- finely grated zest of 2 unwaxed lemons\n- 4 garlic cloves, finely grated\n- 4 tsp sea salt flakes\n\n## Instructions\n1. Combine all the seasoning ingredients, adding the garlic at the end and mixing until evenly dispersed.\n2. Score the skin lightly through to the fat at 1/2 cm intervals. Boil a full kettle, place the pork on a rack in the sink, and pour the boiling water slowly over the skin — this opens the pores and helps it crisp.\n3. Transfer the pork to a roasting tray and pat the skin dry with kitchen paper. Rub all over with sunflower oil, then cover generously with the seasoning mix.\n4. Roast at 180°C for about 70 minutes before checking with a thermometer. The internal temperature should reach 62°C. Return to the oven if needed until this reading is achieved.\n5. Rest the pork for at least 20 minutes before slicing thickly. Deglaze the roasting tray with a splash of white wine and lemon juice, bring to a simmer, and serve the juices over the pork.\n\n## Notes\nCut from the top end of the loin and left on the bone for the best roasting — delivers glistening fat, tender flesh, and crackling that snaps under the knife. Scoring and scalding the skin with boiling water is key to achieving good crackling.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "smgy67kut2ja72oac4hku4tlyu", "title": "Potatoes O'Brien", "ainfo": "Potatoes O'Brien", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large frying pan over medium-high heat, melt 1/2 tablespoon of the butter with 1/2 tablespoon of the olive oil.", "notes": "# Potatoes O'Brien\n\nSource: http://www.food.com/recipe/potatoes-obrien-25545?photo=37942\n\nCrisp, panfried potatoes with peppers and onions, originating in the early 1900s at a Manhattan restaurant known as Jack's. Ready in 35 minutes, serves 6.\n\n## Ingredients\n- 1 1/2 tablespoons unsalted butter\n- 1 1/2 tablespoons olive oil\n- 1 large yellow onion, finely chopped\n- 1/2 small red bell pepper, seeded, deribbed and finely diced\n- 1/2 small green bell pepper, seeded, deribbed and finely diced\n- 2 lbs small white potatoes or red potatoes, peeled and cut into 1/2 inch cubes\n- 2 tablespoons finely chopped fresh parsley\n\n## Instructions\n1. In a large frying pan over medium-high heat, melt 1/2 tablespoon of the butter with 1/2 tablespoon of the olive oil.\n2. Add the onion and saute, stirring occasionally, until golden brown and just beginning to caramelize, 5-7 minutes. Do not allow the onion to scorch.\n3. Add the red and green peppers and saute until beginning to soften, 3-5 minutes longer. Transfer to a serving bowl and set aside.\n4. Add 1/2 tablespoon each of the remaining butter and olive oil to the same pan.\n5. Add half of the cubed potatoes and cook, turning to brown all sides, 5-7 minutes. If the potatoes are too dry, add a little more butter or oil.\n6. Transfer the browned potatoes to the bowl holding the pepper mixture. Repeat with the remaining butter, olive oil and potatoes.\n7. Return the mixture to the pan. Raise the heat to high so that it quickly warms through.\n8. Remove from the heat and season to taste with salt and pepper. Add the parsley and stir to combine.\n9. Return to the serving bowl and serve immediately.\n\n## Notes\nYukon gold or red potatoes work better than russets, which can overcook and lose crispiness. Also good with sausage gravy instead of hash browns or biscuits.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "dbhu5gewgfsgtcx3drw455via4", "title": "Pulled Pork Rub", "ainfo": "Pulled Pork Rub", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix together all of the ingredients in a bowl.", "notes": "# Pulled Pork Rub\n\nSource: https://www.tastesoflizzyt.com/pulled-pork-rub/\n\nBy Julie Clark. Prep: 5 min | Total: 5 min. Servings: 20 (about 2 cups of rub). Course: Condiment. Cuisine: American. Calories: 41 kcal.\n\n## Ingredients\n- 1/2 cup smoked paprika\n- 1/3 cup dark brown sugar\n- 1/4 cup salt\n- 1/4 cup garlic powder\n- 2 tablespoons black pepper\n- 2 tablespoons chili powder\n- 2 tablespoons onion powder\n- 2 tablespoons chipotle chili pepper\n- 1 tablespoon cayenne pepper\n- 1 tablespoon cumin\n- 1 tablespoon dry mustard\n\n## Instructions\n1. Mix together all of the ingredients in a bowl.\n2. Store in an airtight container.\n3. To use, sprinkle a 10 pound pork roast on all sides with 1/3 cup spice rub.\n\n## Notes\nMakes about 2 cups of rub — enough for about 6 large (10-pound) pork roasts. Uses dark brown sugar (not light) for a richer, deeper sweetness, and smoked paprika (not regular) for a smoky flavor that intensifies during smoking. No need to rub the spice mix in — the meat's natural dampness helps it stick, so sprinkling is enough. Also great on grilled chicken, pork chops, pork ribs, or smoked pork tenderloin. Keeps about 1 year stored in a cool, dry place in an airtight container (like a mason jar); check before using that it isn't clumpy and still smells fragrant. Nutrition per serving (1/20 of recipe): 41 kcal, 9g carbs, 4g sugar.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "54qk7um7nfi4kayvbbtyflgllq", "title": "Quiche Lorraine", "ainfo": "Quiche Lorraine", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Blind bake the crust: Preheat the oven to 400°F and set a rack in the middle position. Thaw the frozen pie crust about 10 minutes, until just soft enough to prick with a fork. Prick the bottom and sides all over. Place on a baking sheet and bake until lightly golden, 10 to 15 minutes, gently pricking with a fork if it puffs up. Set aside and reduce the oven to 325°F.", "notes": "# Quiche Lorraine\n\nSource: https://www.onceuponachef.com/recipes/quiche-lorraine.html\n\nBy Jennifer Segal, Once Upon a Chef. Prep: 20 min | Cook: 1 hour | Total: 1 hr 20 min. Servings: 4 to 6.\n\n## Ingredients\n- One 9-inch (23-cm) deep-dish frozen pie crust\n- 8 oz thick-cut bacon (about 6 slices), diced\n- 1/2 cup chopped shallots (from 2 medium shallots)\n- 4 large eggs\n- 1 1/4 cups heavy cream\n- 1/4 teaspoon salt\n- 1/8 teaspoon cayenne pepper\n- Pinch ground nutmeg\n- 4 oz Gruyère, finely shredded (about 1 1/4 cups)\n\n## Instructions\n1. Blind bake the crust: Preheat the oven to 400°F and set a rack in the middle position. Thaw the frozen pie crust about 10 minutes, until just soft enough to prick with a fork. Prick the bottom and sides all over. Place on a baking sheet and bake until lightly golden, 10 to 15 minutes, gently pricking with a fork if it puffs up. Set aside and reduce the oven to 325°F.\n2. In a medium nonstick sauté pan over medium heat, cook the bacon, stirring occasionally, until crisp, about 10 minutes. Transfer with a slotted spoon to a paper towel-lined plate to drain.\n3. Pour off all but 1 tablespoon of fat from the pan. Add the shallots and cook over medium-low heat until soft and translucent, 3 to 4 minutes, without browning. Remove from heat and set aside.\n4. In a medium bowl, whisk the eggs, then add the heavy cream, salt, cayenne, and nutmeg; whisk until evenly combined.\n5. Spread the shallots evenly over the bottom of the baked crust. Top with half the bacon, all of the Gruyère, then the remaining bacon. Pour the egg/cream mixture over top, stopping just below the top of the crust.\n6. Bake the quiche (still on the baking sheet) at 325°F for 45 to 50 minutes, until the custard is set and lightly golden. Serve hot or at room temperature.\n\n## Notes\nUse a deep-dish frozen crust rather than rolled refrigerated crust — it won't shrink during par-baking. If the crust cracks, patch with a paste of 1 tablespoon flour and 1 tablespoon water, then return to the oven briefly to set. Baking the custard at a lower temperature (325°F) prevents the eggs from scrambling and keeps the texture silky smooth. Can be baked up to a day ahead and refrigerated; reheat covered with foil at 300°F for 35-45 minutes. Freezes well for up to 3 months (wrap in plastic then foil after cooling); thaw 24 hours in the fridge before reheating covered at 300°F for 35-45 minutes. Can be made crustless with similar bake time (watch closely near the end). Leftovers keep about 3 days refrigerated. Nutrition (per serving, 6 servings): 616 kcal, 24g carbs, 16g protein, 51g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "uoasjlpmy3swbcox7n5s5kjm64", "title": "Quick Pickled Sweet Peppers", "ainfo": "Quick Pickled Sweet Peppers", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place peppers into a jar.", "notes": "# Quick Pickled Sweet Peppers\n\nSource: https://www.simplywhisked.com/quick-pickled-sweet-peppers/\n\nBy Melissa Belanger, Simply Whisked. Prep: 10 min | Cook: 5 min | Total: 15 min | Servings: 8\n\n## Ingredients\n- 2 cups sliced sweet peppers\n- 1/4 cup rice vinegar\n- 3/4 cup water\n- 2 tablespoons sugar\n- 2 teaspoons salt\n- 4 garlic cloves, minced\n\n## Instructions\n1. Place peppers into a jar.\n2. In a small saucepan, heat vinegar, water, sugar, and salt. Stir until sugar and salt are dissolved. Remove from heat and add garlic.\n3. Pour the liquid over the peppers in the jar. Top with additional water if necessary to cover the peppers.\n4. Cover jar and refrigerate for at least 1 hour before serving.\n\n## Notes\nNot fully pickled — keep refrigerated and eat within a week or two. Apple cider vinegar can substitute for rice vinegar, though the peppers will be more acidic.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "kadmwq2sn34o4ajax3z2wtnew4", "title": "Ranch Chicken Wings", "ainfo": "Ranch Chicken Wings", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 375 degrees.", "notes": "# Ranch Chicken Wings\n\nSource: https://www.staysnatched.com/ranch-chicken-wings/\n\nBy Brandi Crawford. Prep: 5 min | Cook: 45 min | Total: 50 min. Servings: 4. Course: dinner, lunch. Cuisine: American.\n\n## Ingredients\n- 2 pounds chicken wings (split wings/party wings)\n\nHomemade Ranch Seasoning (if using store-bought seasoning, use enough to fully coat the wings):\n- 1 1/2 tablespoons chives\n- 1 1/2 tablespoons dried dill\n- 1 tablespoon onion powder\n- 1 tablespoon garlic powder\n- salt and pepper to taste (see notes)\n\nOptional Butter Ranch Glaze:\n- 2-3 tablespoons unsalted butter\n- 1/2 tablespoon chives\n- 1/2 tablespoon dried dill\n- 1-2 teaspoons onion powder\n- 1-2 teaspoons garlic powder\n- salt and pepper to taste\n\n## Instructions\nOven and Baking Instructions\n1. Preheat the oven to 375 degrees.\n2. Pat the chicken dry and place it in a large bowl or plastic bag.\n3. Add all of the spices to the chicken. Rub the spices into the meat to ensure the chicken isn't bland. Look for \"bald spots\" where the meat isn't seasoned and add more spices to fully coat the wings.\n4. Line a sheet pan with a baking rack or parchment paper and add the wings. A baking rack works best for crispy wings because it allows airflow; wings sitting directly on a sheet pan or parchment paper will steam in their own juice and get soggy.\n5. Bake the wings for 20 minutes, then open and flip. Bake for an additional 20-30 minutes. Ensure the wings reach a minimum internal temperature of 165 degrees (use a meat thermometer).\n6. Optional Ranch Butter Glaze: In a small saucepan or microwave, melt butter over low heat. Remove from heat and whisk in the remaining ranch seasoning until glossy.\n7. Add the hot wings to a bowl and drizzle with the ranch butter. Toss until glossy and coated, or brush the butter onto each wing.\n\nAir Fryer Instructions\n1. Pat the chicken dry and place it in a large bowl or plastic bag.\n2. Add all of the spices to the chicken, rubbing them in to fully coat and avoid bland \"bald spots.\"\n3. Place the chicken in the air fryer basket and spritz with cooking oil.\n4. Air fry for 12-15 minutes at 400 degrees.\n5. Open the air fryer and flip the chicken. Cook an additional 5-10 minutes or until crisp, reaching a minimum internal temperature of 165 degrees.\n6. Optional Ranch Butter Glaze: melt butter over low heat, whisk in remaining ranch seasoning until glossy.\n7. Add the hot wings to a bowl and drizzle with the ranch butter, tossing until coated, or brush onto each wing.\n\n## Notes\nFor breaded wings, add 1/4-1/3 cup all-purpose flour when seasoning the wings along with the homemade ranch seasoning; ensure fully coated, and sprinkle any leftover spices from the bowl over the chicken before cooking. Cook time stays the same. To enhance ranch flavor, dip in Homemade Ranch Dressing or a store-bought ranch. For a low-carb version, swap the flour for 1-2 tablespoons of baking powder, or omit flour entirely for naked wings. Actual (non-split) wings can be used but may require adjusting ingredient amounts to fully coat. Salt is key — typically 1/4-1/2 teaspoon — season to taste. Ensure wings are fully coated with spices to avoid blandness. Start with 1/4 cup flour for breaded wings, adding more as needed; spritz any visible white flour spots with oil. Foil can substitute for parchment paper (cook time may vary; wings still need to reach 165 degrees). For spicy wings, add 1-1 1/2 teaspoons cayenne pepper or Cajun seasoning. Reheat in the air fryer for 4 minutes at 400 degrees, or in the oven at 350 degrees until warm. Leftovers can be frozen tightly sealed for a few months.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "6zln6wr5w43lkaf6bdqf2mb2eq", "title": "Raspberry Cream Crumble", "ainfo": "Raspberry Cream Crumble", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F.", "notes": "# Raspberry Cream Crumble\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/raspberry-cream-crumble-6565501.amp (accessed via canonical URL https://www.foodnetwork.com/recipes/raspberry-cream-crumble-6565501)\n\nRecipe courtesy of The Pie Hole, Vancouver, Canada. Level: Easy. Total: 3 hr 20 min (includes cooling time) | Active: 20 min. Yield: one 9-inch pie.\n\n## Ingredients\nFilling:\n- 2 eggs, preferably free range and organic\n- 1 1/3 cups full-fat sour cream\n- 1 teaspoon pure vanilla extract\n- 1 cup sugar\n- 1/3 cup unbleached all-purpose flour\n- pinch sea salt\n\nCrumble Topping:\n- 1/2 cup sugar\n- 1/2 cup unbleached all-purpose flour\n- 1/4 cup (1/2 stick) unsalted butter\n\nPie:\n- One 9-inch pie pastry or store-bought shell, fitted into a pie pan\n- 3 cups fresh or frozen raspberries, preferably organic\n- fresh whipped cream, for serving\n\n## Instructions\n1. Preheat oven to 350°F.\n2. For the filling: whisk the eggs in a large bowl until light and lemon colored. Whisk in the sour cream and vanilla, then continue whisking until smooth and creamy. Add the sugar, flour, and salt and whisk until smooth and thoroughly incorporated.\n3. For the crumble topping: add sugar, flour, and butter to a large bowl or the bowl of a stand mixer. Work the butter through using your hands or the mixer until the mixture is a coarse crumble (a squeezed handful should stick together but break apart easily).\n4. For the pie: fill the pie shell with the raspberries and slowly pour the custard on top. Spread the crumble over the whole surface. Bake until the edges of the pie start to rise, the crumble topping is golden brown, and the middle no longer jiggles when moved, about 1 hour. Let cool completely before serving. Serve at room temperature with dollops of fresh whipped cream.\n\n## Notes\nThis recipe was provided by a chef, restaurant, or culinary professional and has not been tested for home use. From \"Diners, Drive-Ins and Dives,\" Burger and Breakfast episode. Many home cooks report the pie needs longer than the stated 1 hour to fully set in the middle — commonly 1 hour 20 minutes to as long as 2 hours at 350°F (per the show itself); don't pull it too soon. If using a standard 9-inch pie tin, the filling volume can be generous — a deeper 9 or 10-inch tin helps prevent overflow. Frozen raspberries or other berries (blueberries, blackberries) work well as substitutes. A homemade crust is often preferred over store-bought.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "bhawnjrkgjdgheimh7q2fqkv7q", "title": "Red Cabbage Coleslaw (No Mayo)", "ainfo": "Red Cabbage Coleslaw (No Mayo)", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add cabbage and carrot to a large bowl.", "notes": "# Red Cabbage Coleslaw (No Mayo)\n\nSource: https://www.platingsandpairings.com/vinegar-coleslaw-recipe-no-mayo/\n\nBy Erin Lynch, Platings and Pairings. Prep: 10 min | Cook: 0 min | Total: 10 min. Serves: 12.\n\n## Ingredients\n- 1/2 head red cabbage, shredded\n- 1/2 head green cabbage, shredded\n- 1 carrot, grated\n- 1/4 cup apple cider vinegar\n- 1 Tablespoon honey\n- 1 Tablespoon olive oil\n- 1 teaspoon kosher salt\n- salt and pepper, to taste\n\n## Instructions\n1. Add cabbage and carrot to a large bowl.\n2. Whisk together apple cider vinegar, honey, olive oil, and salt. Pour over the cabbage mixture.\n3. Toss well to combine. Season with additional salt and pepper, to taste.\n\n## Notes\nIn place of the cabbage and carrot, you can use a 16-ounce package of shredded cabbage mix. Substitute the apple cider vinegar with red wine vinegar, white wine vinegar, champagne vinegar, rice vinegar, lemon, or lime juice; substitute the honey with agave syrup, maple syrup, or sugar. Optional add-ins: a pinch of celery seed, red pepper flakes for heat, a spoonful of dijon mustard for tang, or red onion for extra crunch. Keeps in the fridge up to 2 days once tossed; for maximum crunch, store the cabbage mixture and dressing separately and toss just before serving (lasts up to 5 days this way). Nutrition per serving: 39 kcal, 7g carbs, 1g protein, 1g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "l4rf5silgiilikiw2iyk6c7xba", "title": "Red Snapper with Baby Bok Choy", "ainfo": "Red Snapper with Baby Bok Choy", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat 1 tablespoon olive oil in a medium saucepan over medium heat. Add garlic, scallion whites, lemongrass, and the piece of ginger. Cook, stirring, until translucent, about 1 minute. Add coconut milk, green curry, brown sugar, fish sauce, and kaffir lime leaves; let simmer for 30 minutes. Strain through a fine mesh sieve into a medium bowl; stir in lime juice and scallion greens. Set aside.", "notes": "# Red Snapper with Baby Bok Choy\n\nSource: https://www.marthastewart.com/332815/red-snapper-with-baby-bok-choy (original page now redirects elsewhere on marthastewart.com; content retrieved via cached recipe aggregator)\n\nRecipe courtesy of chef Harold Dieterle, via Martha Stewart.\n\n## Ingredients\n- 1 tablespoon olive oil\n- 1 bunch scallions, white parts finely chopped and green parts sliced\n- 6 cloves garlic, finely chopped\n- 1 stalk lemongrass, bottom 2 inches finely chopped\n- 1 piece ginger (1 by 2 inches), peeled, plus 1 teaspoon peeled and minced\n- 5 cans (12 ounces each) coconut milk\n- 1 can (4 ounces) green curry\n- 1/4 cup packed dark brown sugar\n- 1/4 cup Thai fish sauce\n- 2 kaffir lime leaves\n- Juice of 4 limes\n- 1 tablespoon grapeseed oil\n- 6 fillets (6 ounces each) red snapper\n- Coarse salt and freshly ground white pepper\n- 1 tablespoon olive oil\n- 2 cups baby bok choy, sliced crosswise\n- 1/2 cup salted cashews, toasted\n\n## Instructions\n1. Heat 1 tablespoon olive oil in a medium saucepan over medium heat. Add garlic, scallion whites, lemongrass, and the piece of ginger. Cook, stirring, until translucent, about 1 minute. Add coconut milk, green curry, brown sugar, fish sauce, and kaffir lime leaves; let simmer for 30 minutes. Strain through a fine mesh sieve into a medium bowl; stir in lime juice and scallion greens. Set aside.\n2. Preheat oven to 425°F. In a medium ovenproof skillet, heat grapeseed oil over medium-high heat. Season snapper with salt and pepper and add to skillet. Immediately transfer skillet to oven and cook until opaque, about 7 minutes. Remove from oven and keep warm.\n3. In a medium skillet, add remaining olive oil and the minced ginger. Cook over medium heat until the ginger just begins to brown, about 1 minute. Add bok choy and cook until soft, 2 to 3 minutes. Season with salt and pepper; sprinkle with cashews and toss to combine.\n4. To serve, spoon some of the sauce onto each of 4 plates. Top with bok choy and snapper; serve immediately.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7rmzvaau2sfr2b5qucahqr7dqy", "title": "Refried Beans", "ainfo": "Refried Beans", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Rinse the beans thoroughly, then place them in a large pot with the bacon. Pour water over the top, enough to cover the beans by 1 or 2 inches. Bring to a boil over medium-high heat, then reduce the heat to low and cover. Simmer for 2 to 3 hours, adding more water if the liquid evaporates too quickly. The beans are done when fork tender.", "notes": "# Refried Beans\n\nSource: http://www.foodnetwork.com/recipes/ree-drummond/refried-beans.html\n\nRecipe courtesy of Ree Drummond. Level: Easy | Total: 3 hr 15 min | Active: 15 min | Yield: 12 servings\n\n## Ingredients\n- 6 cups dried pinto beans\n- 4 slices thick-cut bacon, cut into 1-inch slices (or salt pork, ham hock or diced ham)\n- 1 tablespoon chili powder\n- 1 teaspoon salt, plus more if needed\n- 2 teaspoons black pepper, plus more if needed\n- 1/2 stick butter (bacon grease, lard or shortening will work)\n- 1 onion, diced\n- 2 cups grated sharp Cheddar\n- Sliced jarred jalapenos\n\n## Instructions\n1. Rinse the beans thoroughly, then place them in a large pot with the bacon. Pour water over the top, enough to cover the beans by 1 or 2 inches. Bring to a boil over medium-high heat, then reduce the heat to low and cover. Simmer for 2 to 3 hours, adding more water if the liquid evaporates too quickly. The beans are done when fork tender.\n2. Add the chili powder, salt and pepper. Stir and taste, adjusting seasoning as necessary.\n3. Heat the fat in a large skillet and cook the onions until translucent. Add the beans to the skillet and mash to the consistency you want. Stir and cook until heated, then add the grated cheese. Top with jalapenos.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tpdh5nhe2y335ybnozx46yevfy", "title": "Rib-Eye Steak with Mushroom Sauce", "ainfo": "Rib-Eye Steak with Mushroom Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, melt butter over medium heat. Add mushrooms, shallot, and garlic; cook, stirring frequently, for about 10 minutes or until mushrooms are tender. Add broth and bring to a boil; reduce heat and simmer for 12 minutes or until liquid is reduced to about 1/2 cup. Stir in cream, and simmer for 6 to 8 minutes or until sauce is thickened. Stir in thyme, 1/2 teaspoon salt, and 1/2 teaspoon pepper. Set aside, and keep warm.", "notes": "# Rib-Eye Steak with Mushroom Sauce\n\nSource: http://www.foodnetwork.com/recipes/paula-deen/rib-eye-steaks-with-mushroom-sauce-recipe.html (original page removed; content from pauladeen.com)\n\nBy Paula Deen. Difficulty: Easy | Prep: 30 minutes | Cook: 80 minutes | Servings: 6\n\n## Ingredients\n- 2 tablespoons butter\n- 4 (4oz) packages gourmet blend mushrooms, sliced\n- 1 shallot, minced\n- 4 cloves garlic, minced\n- 1 cup beef broth\n- 1/2 cup heavy whipping cream\n- 1/2 teaspoon dried thyme\n- Salt\n- Ground black pepper\n- 6 1-inch thick New York strip steaks\n- 2 tablespoons olive oil\n\n## Instructions\n1. In a large skillet, melt butter over medium heat. Add mushrooms, shallot, and garlic; cook, stirring frequently, for about 10 minutes or until mushrooms are tender. Add broth and bring to a boil; reduce heat and simmer for 12 minutes or until liquid is reduced to about 1/2 cup. Stir in cream, and simmer for 6 to 8 minutes or until sauce is thickened. Stir in thyme, 1/2 teaspoon salt, and 1/2 teaspoon pepper. Set aside, and keep warm.\n2. Sprinkle steaks evenly with salt and pepper.\n3. In a large skillet, heat oil over medium-high heat. Add steaks, in batches if necessary, and cook for 4 to 5 minutes per side or until desired degree of doneness. Remove from pan, and let stand for 10 minutes. Serve steaks with mushroom sauce. Garnish with thyme leaves, if desired.\n\n## Notes\nYou can make the sauce ahead and rewarm just before serving. For the steaks, let stand at room temperature for 30 minutes before cooking. Don't cut into them right away after cooking — let them stand for 10 minutes before serving.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "zfqgii7dcx43sv7lipoxy7jy3m", "title": "Rigatoni with Sausage & Fennel", "ainfo": "Rigatoni with Sausage & Fennel", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat the olive oil in a large heavy pot or Dutch oven over medium heat. Add the fennel and onion and sauté 7 minutes, stirring occasionally, until tender. Add the sausage and cook 7-8 minutes, crumbling with a fork, until nicely browned. Add the garlic, crushed fennel seeds, red pepper flakes, 2 teaspoons salt, and 1 teaspoon black pepper and cook 1 minute.", "notes": "# Rigatoni with Sausage & Fennel\n\nSource: https://www.foodnetwork.com/recipes/ina-garten/rigatoni-with-sausage-and-fennel-3753750\n\nRecipe courtesy of Ina Garten, from Cooking for Jeffrey, Food Network. Level: Intermediate | Total: 1 hr | Active: 40 min | Yield: 6 servings\n\n## Ingredients\n- 3 tablespoons good olive oil\n- 3 cups chopped fennel (1 large bulb)\n- 1 1/2 cups chopped yellow onion\n- 1 1/4 pounds sweet Italian sausages, casings removed\n- 2 teaspoons minced garlic (2 cloves)\n- 1/2 teaspoon whole fennel seeds, crushed with a mortar and pestle\n- 1/2 teaspoon crushed red pepper flakes\n- Kosher salt and freshly ground black pepper\n- 1 cup dry white wine\n- 1 cup heavy cream\n- 2/3 cup half-and-half\n- 2 tablespoons tomato paste\n- 1 pound rigatoni\n- 1/2 cup chopped fresh parsley leaves\n- 1 cup freshly grated Italian Parmesan cheese, divided\n\n## Instructions\n1. Heat the olive oil in a large heavy pot or Dutch oven over medium heat. Add the fennel and onion and sauté 7 minutes, stirring occasionally, until tender. Add the sausage and cook 7-8 minutes, crumbling with a fork, until nicely browned. Add the garlic, crushed fennel seeds, red pepper flakes, 2 teaspoons salt, and 1 teaspoon black pepper and cook 1 minute.\n2. Pour in the wine, bring to a boil, then add the heavy cream, half-and-half, and tomato paste. Bring back to a boil, lower the heat, and simmer 20 minutes, until the sauce has thickened.\n3. Meanwhile, bring a large pot of water to a boil, add 2 tablespoons salt, and cook the rigatoni according to package directions. Drain and add to the sauce, stirring to coat.\n4. Cook over low heat 5 minutes to let the pasta absorb the sauce. Off the heat, stir in the parsley and 1/2 cup of the Parmesan. Serve hot in shallow bowls with the remaining 1/2 cup Parmesan on the side.\n\n## Notes\nReprinted from Cooking for Jeffrey, copyright 2016 by Ina Garten. Reviewers note Ina's kosher salt is about half the strength of table salt — use half as much if substituting table salt. Popular variations: browning the sausage first without oil so vegetables cook in the rendered fat, substituting evaporated milk for the cream and half-and-half, using hot Italian sausage for more spice, or adding a Parmesan rind while simmering.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "blz4elqg5set76q24mbs67gkl4", "title": "Roast Chicken and Banana Chocolate-Chip Muffins", "ainfo": "Roast Chicken and Banana Chocolate-Chip Muffins", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the chicken in a roasting tin and preheat the oven to 200°C/gas mark 6. In a mortar, grind the dried thyme, cumin seeds, and black peppercorns to a coarse powder, then stir in a generous seasoning of salt and the olive oil. Rub the paste over the chicken (breast and legs), then roast for 45 minutes.", "notes": "# Roast Chicken with Thyme and Sesame-Roasted Cauliflower\n\nSource: https://www.google.com/amp/s/amp.theguardian.com/food/2022/mar/27/nigel-slaters-recipes-for-roast-chicken-and-banana-chocolate-chip-muffins (retrieved via canonical URL)\n\nBy Nigel Slater, The Guardian/The Observer. Serves 4.\n\n## Ingredients\n- 1 chicken, approximately 2.2kg\n- 3 tsp dried thyme\n- 1/2 tsp cumin seeds\n- 1 tsp black peppercorns\n- 3 tbsp olive oil\n- 3 tbsp thyme leaves\n- 2 tbsp sesame seeds\n- Zest of 1 orange\n- A cauliflower\n\n## Instructions\n1. Place the chicken in a roasting tin and preheat the oven to 200°C/gas mark 6. In a mortar, grind the dried thyme, cumin seeds, and black peppercorns to a coarse powder, then stir in a generous seasoning of salt and the olive oil. Rub the paste over the chicken (breast and legs), then roast for 45 minutes.\n2. Meanwhile, mix together the thyme leaves, sesame seeds, and orange zest; set aside to sprinkle over the chicken once it starts to brown.\n3. Trim the cauliflower and break into large florets. Steam over boiling water until tender to the point of a skewer, about 10 minutes.\n4. Once the chicken has roasted 45 minutes, add the cooked cauliflower to the pan, toss each floret in the roasting juices, and return to the oven for a further 20 minutes.\n5. Scatter the sesame and orange mixture over both chicken and cauliflower and continue roasting 15 minutes (reserve a little to sprinkle at the table).\n6. Remove the chicken from the roasting tin and rest, lightly covered, in a warm place for 10 minutes. Return the cauliflower to the oven to keep warm and toast a bit further, then serve together.\n\n---\n\n# Banana Chocolate-Chip Muffins\n\nBy Nigel Slater, The Guardian/The Observer. Makes 9 small, deep muffins.\n\n## Ingredients\n- 250g plain flour\n- 2 tsp baking powder\n- 125g butter\n- 235g light muscovado sugar\n- 350g ripe bananas (peeled weight)\n- 1 tsp vanilla extract\n- 2 eggs\n- 100g dark chocolate\n- 9 banana chips\n\n## Instructions\n1. Set the oven to 180°C/gas mark 4. Prepare 9 deep paper muffin cases.\n2. Sift the flour and baking powder together. Using an electric mixer, cream the butter and sugar until light and fluffy.\n3. Mash the bananas with a fork — the mixture should be lumpy, not puréed. Stir in the vanilla extract. Beat the eggs lightly and add a little at a time to the butter and sugar mixture. If it shows signs of curdling, add a spoonful or two of the flour.\n4. Chop the chocolate into small pieces (roughly 0.5cm, a mix of sizes is fine). Mix the chocolate and mashed bananas into the batter, then gently fold in the flour and baking powder — keep the mixture lumpy; avoid overmixing.\n5. Divide the mixture between the muffin cases on a baking sheet or in deep patty tins. Place a banana chip on top of each (or a walnut half as an alternative).\n6. Bake 30 minutes, until lightly springy to the touch. Cool before removing the paper cases.\n\n## Notes\nThese muffins are more cake-like than typical — beating the butter and sugar thoroughly is key to a light, fluffy texture. They stay moist for several days in an airtight box, and are arguably even better the day after baking.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qotcyeyyqlbidkp3gdv2zdntn4", "title": "Roast Pork Loin with Lemon, Garlic and Fennel", "ainfo": "Roast Pork Loin with Lemon, Garlic and Fennel", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pre-heat your wood-fired oven to 180°C and bring the pork to room temperature.", "notes": "# Roast Pork Loin with Lemon, Garlic and Fennel\n\nSource: https://www.fuegowoodfiredovens.com/cook/roast-pork-loin-with-lemon-garlic-and-fennel/\n\nBy Fuego Wood-Fired Ovens. Prep: 10 min | Cook: 1 hr 40 min. Serves: 6.\n\n## Ingredients\n- 2kg pork loin, bone in and French trimmed\n- 1 large garlic bulb, cut in half\n- 1 whole lemon\n- 2 tablespoons fennel seeds, lightly toasted and crushed\n- 6 sprigs thyme\n- 1 bay leaf\n- 75ml extra virgin olive oil\n- 75ml water\n- 75ml white wine\n- salt and pepper, to season\n\n## Instructions\n1. Pre-heat your wood-fired oven to 180°C and bring the pork to room temperature.\n2. Place the pork loin in a large roasting dish and rub with the garlic and fennel seeds. Season with salt and pepper, add the thyme sprigs and bay leaf, and drizzle with the olive oil. Grate the lemon peel on top of the pork, cut the lemon in half and add to the roasting tin. Pour in the wine and water.\n3. Start by roasting the pork skin side up for 20 minutes to brown all sides — keep turning the roasting tin to avoid the crackling from burning. If the crackling has crisped up but the sides still need browning, cover with a sheet of foil to avoid burning.\n4. Once the pork is browned on all sides, cover the roasting tin with tin foil and roast at 180°C for 1 hour and 20 minutes. Close the oven door, leaving the door vent open, and turn the flue to three-quarters closed.\n5. Remove the pork from the wood-fired oven and transfer onto a warm serving platter skin side up. Allow to rest covered for 20 minutes. Remove excess oil from the cooking juices with a spoon and fine strain the juices. Check the seasoning, adjusting with more salt if needed, and serve with the roasted pork.\n\n## Notes\nDesigned for a wood-fired oven; roasting juices can be spooned over the finished pork for extra flavor.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "5ax45q74aix42rzqb3ldwjqdzy", "title": "Roasted Carrots with Pecans and Sorghum", "ainfo": "Roasted Carrots with Pecans and Sorghum", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F. Toss together pecans, butter, paprika, and cayenne on a rimmed baking sheet. Bake until lightly browned and toasted, about 8 minutes. Remove from oven; cool completely on pan, about 15 minutes. Coarsely chop pecans; set aside.", "notes": "# Roasted Carrots with Pecans and Sorghum\n\nSource: https://www.myrecipes.com/recipe/roasted-carrots-with-pecans-sorghum (page now redirects to a search results page; recovered via Wayback Machine, snapshot 20220628082016)\n\nBy Robby Melvin. Originally appeared on southernliving.com. Active: 15 min | Total: 1 hr 10 min. Yield: Serves 6.\n\n## Ingredients\n- 1/2 cup pecan halves\n- 1 tablespoon unsalted butter, melted\n- 1/4 teaspoon smoked paprika\n- 1/8 teaspoon cayenne pepper\n- 3 pounds small carrots with tops\n- 2 tablespoons olive oil\n- 1 teaspoon kosher salt\n- 1/4 teaspoon black pepper\n- 1 tablespoon apple cider vinegar\n- 2 tablespoons sorghum syrup\n- 1 tablespoon thinly sliced fresh chives\n\n## Instructions\n1. Preheat oven to 350°F. Toss together pecans, butter, paprika, and cayenne on a rimmed baking sheet. Bake until lightly browned and toasted, about 8 minutes. Remove from oven; cool completely on pan, about 15 minutes. Coarsely chop pecans; set aside.\n2. Increase oven to 450°F. Peel carrots; trim carrot tops to 1 inch (discard the trimmed greens, or reserve for another use). Toss together trimmed carrots, oil, salt, and pepper in a bowl; spread in a single layer on a rimmed baking sheet. Roast, stirring once, until browned and tender, 30 to 35 minutes. Remove from oven; immediately drizzle hot carrots with vinegar, and toss to coat.\n3. Arrange carrots on a serving platter. Drizzle with sorghum syrup; sprinkle with pecans and chives.\n\n## Notes\nA sweet and tangy vinaigrette made with apple cider vinegar and sorghum syrup makes these carrots flavorful. If you can't find sorghum syrup, use an equal amount of honey or maple syrup. Choose small carrots — they roast and caramelize more evenly and have more natural sweetness than larger ones.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "at2u6qgny456fyfantki4qg4uy", "title": "Roasted Pork with Fennel Spice Rub", "ainfo": "Roasted Pork with Fennel Spice Rub", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat the olive oil in a large sauté pan over medium heat until hot. Add the onions and a pinch of salt and pepper. Reduce heat to medium-low and cook for about 1 minute. Add the sage and cook until the onions stop releasing water (about 3 minutes). Add the water, cover, and cook until the onions are very tender (about 10 minutes). Uncover and sauté until the onions are very soft and the pan is dry again (about 2 minutes). Season well with salt and pepper.", "notes": "# Roasted Pork with Fennel Spice Rub\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/roasted-pork-with-fennel-spice-rub-recipe-1959145.amp (accessed via canonical URL https://www.foodnetwork.com/recipes/roasted-pork-with-fennel-spice-rub-recipe-1959145)\n\nBy Michael Chiarello. Yield: 8 servings.\n\n## Ingredients\nPork:\n- 2 Tbs. extra-virgin olive oil\n- 2 cups thinly-sliced onions\n- gray salt\n- freshly-ground pepper\n- 1-1/2 tsp. finely-chopped fresh sage\n- 1/2 cup water\n- 4 lbs. pork leg or shoulder, at room temperature\n- about 1/4 cup Fennel Spice (recipe below)\n\nFennel Spice Rub (yields 1-1/4 cups):\n- 1 cup fennel seeds\n- 3 Tbs. coriander\n- 2 Tbs. white peppercorns\n- 3 Tbs. kosher salt\n\n## Instructions\nPork:\n1. Heat the olive oil in a large sauté pan over medium heat until hot. Add the onions and a pinch of salt and pepper. Reduce heat to medium-low and cook for about 1 minute. Add the sage and cook until the onions stop releasing water (about 3 minutes). Add the water, cover, and cook until the onions are very tender (about 10 minutes). Uncover and sauté until the onions are very soft and the pan is dry again (about 2 minutes). Season well with salt and pepper.\n2. Preheat the oven to 275°F. Peel back the pork skin and spread the onions directly on the fat layer. Fold the skin back over the onions and tie closed with kitchen string. Season well all over with the Fennel Spice. Arrange the meat on a rack in a roasting pan and cook until the meat is very tender (approx. 6-8 hours). The meat is ready when it pulls away easily if picked at with a pair of tongs. It's often easiest to cook overnight or start it in the morning and let it cook all day — it doesn't need to be attended.\n\nFennel Spice Rub:\n1. Put the fennel seeds, coriander seeds, and peppercorns in a heavy pan over medium heat. Watch carefully, tossing frequently so the seeds toast evenly. When light brown and fragrant, pour the seeds onto a plate to cool — they must be cool before grinding or they will gum up the blades.\n2. Pour the seeds into a blender or spice grinder and add the salt. Blend to a fine powder, shaking the blender or grinder occasionally to redistribute the seeds. Store in a tightly-sealed glass jar in a cool, dry place, or freeze.\n\n## Notes\nCategories: Roast, Pork Roast, Pork, High Fiber, Gluten Free. The onion mixture is tucked under the pork skin/fat layer before roasting for extra flavor. Low-and-slow roasting at 275°F over 6-8 hours produces tender, easily pulled meat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "iyhlqvyqcztffyh54c2lonoupm", "title": "Rosemary Chicken with Roasted Onions", "ainfo": "Rosemary Chicken with Roasted Onions", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pat the chicken dry with paper towels and season with salt.", "notes": "# Rosemary Chicken with Roasted Onions\n\nSource: https://ooni.com/blogs/recipes/rosemary-chicken-with-roasted-onions\n\nOoni USA. Serves 4 as a main. Cooked in an Ooni pizza oven (or conventional oven) using a cast iron skillet.\n\n## Ingredients\n- 5 chicken thighs, skin on\n- 1 large red onion, cut into wedges\n- 2 large sprigs rosemary\n- 3 tablespoons (50ml) olive oil\n- 3.5 oz (100g) butter\n- 1 tablespoon (15g) salt\n\n## Instructions\n1. Pat the chicken dry with paper towels and season with salt.\n2. Preheat your Ooni pizza oven to medium-high heat. If using a conventional oven, preheat to 360°F (180°C).\n3. Put the olive oil in the Skillet and place the skillet into the oven. (Note: the skillet handle will become very hot — use gloves or a dry dish towel and place on a heat-proof surface.)\n4. Remove the hot skillet from the oven. Place the chicken skin side down onto the hot skillet and leave to sizzle untouched for 3 minutes, or until the skin starts to brown.\n5. Once golden brown, flip the chicken over. Add the butter to the skillet and baste the chicken with the melted butter. Add the rosemary sprigs and onion to the skillet.\n6. Return the skillet to the oven and continue cooking the chicken until the juices run clear.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wwes2hxzgvpwqqj7ckbcyczg4u", "title": "Rosemary Roasted Potatoes", "ainfo": "Rosemary Roasted Potatoes", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 400°F.", "notes": "# Rosemary Roasted Potatoes\n\nSource: http://www.foodnetwork.com/recipes/ina-garten/rosemary-roasted-potatoes-recipe.html\n\nRecipe courtesy of Ina Garten. Level: Easy | Prep: 8 min | Cook: 1 hr | Total: 1 hr 8 min | Yield: 3 to 4 servings\n\n## Ingredients\n- 1 1/2 pounds small red or white-skinned potatoes (or a mixture)\n- 1/8 cup good olive oil\n- 3/4 teaspoon kosher salt\n- 1/2 teaspoon freshly ground black pepper\n- 1 tablespoon minced garlic (3 cloves)\n- 2 tablespoons minced fresh rosemary leaves\n\n## Instructions\n1. Preheat the oven to 400°F.\n2. Cut the potatoes in half or quarters and place in a bowl with the olive oil, salt, pepper, garlic and rosemary; toss until the potatoes are well coated. Dump the potatoes on a baking sheet and spread out into 1 layer; roast in the oven for at least 1 hour, or until browned and crisp. Flip twice with a spatula during cooking to ensure even browning.\n3. Remove the potatoes from the oven, season to taste, and serve.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "week2okt4e4ouidjmz6w7yegl4", "title": "Sage Rosemary Salt", "ainfo": "Sage Rosemary Salt", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 250°F.", "notes": "# Sage Rosemary Salt (Flavored Salts for Gift Giving)\n\nSource: https://simplebites.net/flavored-salts-for-gift-giving-recipe-sage-rosemary-salt/\n\nBy Megan, Simple Bites. Prep: 5 min | Cook: 15 min | Total: 20 min. Yield: 1 cup. Course: Condiments.\n\n## Ingredients\n- 1 cup coarse Kosher salt\n- 1/2 cup fresh sage leaves\n- 1/4 cup fresh rosemary leaves\n\n## Instructions\n1. Preheat oven to 250°F.\n2. Process the ingredients together in a food processor until the herbs are chopped, about 30 seconds.\n3. Spread onto a rimmed baking sheet and bake for about 15 minutes.\n4. Let cool and package in airtight containers.\n\n## Notes\nGeneral ratio for flavored salts of any kind: 1/4 cup salt to 1 teaspoon dried flavoring, adjusted to taste (this recipe uses fresh herbs at a larger scale). Kosher salt is inexpensive and easy to find in bulk; a larger-flake salt would be more gourmet. Great for gift-giving packaged in small airtight jars (such as small Weck jars) — properly stored, these salts last indefinitely. Use on meat, fish, homemade potato chips, roasted vegetables, popcorn, or desserts for a savory contrast. Nutrition (per serving): 18 kcal.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "ogmk4neg7dnil4uwxm4m7hetze", "title": "Sausage and Sage Stuffing", "ainfo": "Sausage and Sage Stuffing", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 350°F. Lightly grease a 9x13-inch baking dish with butter.", "notes": "# Sausage and Sage Stuffing\n\nSource: https://thedefineddish.com/sausage-and-sage-stuffing/#wprm-recipe-container-18548\n\nBy Alex Snodgrass, The Defined Dish. Prep: 20 min | Cook: 1 hour | Total: 1 hr 20 min. Servings: 8. Course: Side Dish. Cuisine: American.\n\n## Ingredients\n- 10 tablespoons unsalted butter, plus more for greasing\n- 1 pound loaf sourdough bread\n- 2 cups finely diced yellow onions (from about 1 large onion)\n- 1 cup thinly sliced celery (from 3 to 4 stalks)\n- 2 garlic cloves, minced\n- 2 teaspoons chopped fresh thyme leaves (from about 8 sprigs)\n- 2 teaspoons kosher salt, divided\n- 1 teaspoon freshly ground black pepper, divided\n- 1 pound mild or hot Italian sausage\n- 10 to 12 fresh sage leaves, finely chopped\n- 1/2 cup dry white wine\n- 1/4 cup low-sodium chicken broth\n- 3 large eggs, beaten\n- 1/4 cup chopped flat-leaf parsley leaves\n- 1 teaspoon dried sage\n- 1/2 teaspoon dried thyme\n\n## Instructions\n1. Preheat the oven to 350°F. Lightly grease a 9x13-inch baking dish with butter.\n2. Cut the bread into 1/2-inch cubes (about 12 cups total) and spread across 2 large baking sheets. Bake until completely dry and beginning to crisp, about 20 minutes. Remove and set aside.\n3. Meanwhile, heat a large skillet over medium heat and melt 9 tablespoons of the butter. Add the onions, celery, garlic, thyme, 1 teaspoon salt, and 1/2 teaspoon pepper. Cook, stirring often, until the onions and celery are very tender, 8-10 minutes. Transfer to a large mixing bowl.\n4. Increase heat to medium-high. Add the sausage and fresh sage to the skillet. Cook, breaking up the meat, until cooked through, about 6 minutes.\n5. Add the remaining 1 tablespoon butter and toss to coat. Add the wine and cook until reduced by half, 2-3 minutes. Transfer the sausage mixture to the bowl with the onions and celery.\n6. Add the toasted bread to the bowl and toss to combine. Add the chicken broth, eggs, parsley, dried sage, dried thyme, remaining 1 teaspoon salt, and 1/2 teaspoon pepper. Toss again to combine.\n7. Transfer to the prepared baking dish and bake uncovered for 20-25 minutes, until golden brown on top.\n\n## Notes\nHot Italian sausage adds more flavor; mild Italian or pork breakfast sausage work for a milder crowd. For a gluten-free version, use a hearty, crusty gluten-free bread so it doesn't turn soggy. Nutrition (per serving): 534 kcal, 35g carbs, 17g protein, 35g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "5dv4vv2skcbm5ixwvjki2n3g3u", "title": "Sausage Stuffed Anaheim Chiles", "ainfo": "Sausage Stuffed Anaheim Chiles", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat a wood-fired oven or regular oven to 500°F.", "notes": "# Sausage Stuffed Anaheim Chiles\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/nate-appleman/sausage-stuffed-anaheim-chiles-18233331.amp%3fic1=amp_lookingforsomethingelse (accessed via canonical URL https://www.foodnetwork.com/recipes/nate-appleman/sausage-stuffed-anaheim-chiles-18233331)\n\nBy Nate Appleman. Level: Easy. Total: 1 hr | Active: 35 min. Yield: 6 servings.\n\n## Ingredients\nFilling:\n- 1 tablespoon ground fennel\n- 1 tablespoon fennel seeds\n- 1 teaspoon freshly ground black pepper\n- 3 cloves garlic, minced\n- 2 whole Calabrian chiles, minced\n- 1 pound ground pork\n- 1/4 cup grated Parmigiano-Reggiano, plus more for serving\n- 1/4 cup grated Pecorino-Romano\n- 1/4 cup whole milk ricotta\n- 1 large egg\n- 2 teaspoons kosher salt, plus more for sprinkling\n- 4 Anaheim peppers, stems removed, sliced in half lengthwise, ribs and seeds removed\n- 2 cups tomato sauce\n- 2 tablespoons extra-virgin olive oil\n\nTopping:\n- 1/2 cup olive oil\n- 2 cloves garlic, minced\n- 1 cup fresh basil leaves, chopped\n- 1 tablespoon Calabrian chiles, minced\n- pinch kosher salt\n\n## Instructions\nSpecial equipment: a mortar and pestle\n\nFilling:\n1. Preheat a wood-fired oven or regular oven to 500°F.\n2. In a mortar and pestle, grind together the ground fennel, fennel seeds, black pepper, garlic, and Calabrian chiles. Add to a large bowl along with the ground pork, Parmigiano, pecorino, ricotta, and egg. Sprinkle the filling with 2 teaspoons kosher salt. Mix.\n3. Sprinkle the peppers with salt and let sit for 5 minutes to soften slightly. Evenly distribute the filling among the pepper halves. Press the filling firmly into each pepper half so it stays perfectly compact.\n4. To a large cast-iron or baking dish, add your favorite tomato sauce along with the olive oil. Gently place the peppers (stuffing side up) on top of the tomato sauce. Tightly cover the top of the baking dish with foil and place in the oven until the sausage filling is cooked through, about 15 minutes. Uncover and cook for another 3 to 5 minutes, until the filling is golden brown and crisp.\n\nTopping:\n1. Meanwhile, heat the olive oil until hot, then pour over the garlic in a bowl. Let cool, then add the basil, chiles, and salt and mix to combine.\n2. Transfer the peppers to a platter and top with the basil topping and some grated Parmigiano-Reggiano.\n\n## Notes\nInspired by stuffed bell peppers from the author's Ohio upbringing, reimagined with long hot peppers and homemade Italian sausage inspired by time in Italy. Any leftover sausage filling is great browned up for pasta, pizza topping, or other uses. From \"Guy's Ranch Kitchen,\" Bring On the Heat episode.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tn6ctgixs3rorl2bisrnm6e65q", "title": "Scallops over Wilted Spinach Parmesan Risotto", "ainfo": "Scallops over Wilted Spinach Parmesan Risotto", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat chicken stock in a small pot.", "notes": "# Scallops over Wilted Spinach Parmesan Risotto\n\nSource: https://www.skinnytaste.com/seared-scallops-over-wilted-spinach-and/\n\nBy Skinnytaste. Course: Dinner. Cuisine: Italian. Prep: 5 min | Cook: 35 min | Total: 40 min. Yield: 3 servings.\n\n## Ingredients\nFor the risotto:\n- 1 cup arborio rice\n- 2 tsp butter\n- 1 shallot, minced\n- 1/2 cup white wine\n- 4 cups fat free chicken stock\n- Salt and pepper\n- 1/4 cup grated parmesan cheese\n- 2 tbsp chopped parsley\n\nFor the scallops:\n- 16 oz sea scallops, about 12-14\n- Salt and fresh pepper\n- 2 tsp butter\n- 1 tsp olive oil\n- 1 shallot, minced\n- 10 oz baby spinach, washed\n\n## Instructions\nRisotto:\n1. Heat chicken stock in a small pot.\n2. In a medium heavy saucepan, melt butter over medium-low heat. Add shallots and sauté about 1 minute.\n3. Add rice, mixing well until coated and translucent, about 2 minutes.\n4. Add wine, salt, and pepper; mix until absorbed into the rice.\n5. Ladle 1 cup of stock into the rice and mix until absorbed, then add another ladle. Continue adding and stirring until all the broth is absorbed, about 20-25 minutes.\n6. Add parmesan cheese and parsley, mix well, and serve.\n\nScallops:\n7. Wash scallops and pat dry with a paper towel. Season with salt and pepper.\n8. Heat a medium pan on high. When hot, melt 1 tsp butter and place half of the scallops in the pan.\n9. Sear without touching for a few minutes until the bottom forms a caramel-colored crust. Turn over and cook 1-2 more minutes, until the center is slightly translucent (check from the side) and the bottom is seared. Be careful not to overcook.\n10. Remove from the pan and set aside on a warm plate. Add another 1 tsp butter and cook the remaining scallops; set aside.\n11. Add olive oil to the pan and sauté shallots; add spinach, salt, and pepper. Toss until the spinach wilts, 2-3 minutes.\n12. Serve scallops with spinach over the risotto.\n\n## Notes\nIf you prefer not to cook with wine, substitute extra chicken stock. Pescatarian option: use vegetable broth. Not a scallop fan? Swap in shrimp. Easily doubled to feed more people. Pat scallops very dry for a good sear, use a nonstick or well-seasoned cast iron pan, and don't move the scallops while searing.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "nhlfmfngzffbxn4rgmumphewqa", "title": "Seafood Boil", "ainfo": "Seafood Boil", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Get the water going; add half to the entire bag of seasoning. Once about to boil, add potatoes and give them 7 minutes.", "notes": "# Seafood Boil\n\nSource: Google Keep note\n\n## Ingredients\n- 60 qt pot\n- ~40 qt water\n- 1 full bag deep creole seafood boil seasoning\n- 3 large onions, halved\n- 4 garlic bulbs\n- 4 celery sticks\n- 5 lbs red potatoes\n- 6 to 8 ears of corn, halved\n- Shrimp\n- Crab\n- Crab clusters\n- Lobster tails, halved\n- Andouille sausage\n- Lemons\n\nCajun Garlic Butter Sauce:\n- 1 stick butter\n- 4 cloves garlic, minced\n- 1 tbsp lemon juice\n- 2 tbsp Creole Kick seasoning (source noted as sweetsmokiejoe, link incomplete in original note)\n- 1 tbsp fresh parsley, minced\n\n## Instructions\n1. Get the water going; add half to the entire bag of seasoning. Once about to boil, add potatoes and give them 7 minutes.\n2. Add lemons, onions, garlic, and celery.\n3. Add sausage and put the lid on.\n4. Boil 15 minutes.\n5. Add corn, give it a few minutes.\n6. Add lobster tails, 5 minutes.\n7. Add crab clusters and legs, 3 minutes.\n8. Add shrimp, 5 minutes.\n9. When shrimp is done, it's ready.\n\nFor the Cajun Garlic Butter Sauce: melt the butter, add minced garlic, lemon juice, Creole Kick seasoning, and fresh parsley; combine and serve alongside the boil.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "gfzojp6amiyvlilacfmsjgrnlq", "title": "Seafood Stock", "ainfo": "Seafood Stock", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Warm the oil in a stockpot over medium heat. Add the shrimp shells, onions, carrots, and celery and sauté 15 minutes, until lightly browned. Add the garlic and cook 2 more minutes.", "notes": "# Seafood Stock\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/ina-garten/seafood-stock-recipe-1925497.amp (retrieved via canonical URL)\n\nRecipe courtesy of Ina Garten, from Barefoot Contessa Parties!, Food Network. Level: Easy | Total: 1 hr 35 min | Prep: 15 min | Cook: 1 hr 20 min | Yield: about 1 quart\n\n## Ingredients\n- 2 tablespoons good olive oil\n- Shells from 1 pound large shrimp\n- 2 cups chopped yellow onions (2 onions)\n- 2 carrots, unpeeled and chopped\n- 3 stalks celery, chopped\n- 2 garlic cloves, minced\n- 1/2 cup good white wine\n- 1/3 cup tomato paste\n- 1 tablespoon kosher salt\n- 1 1/2 teaspoons freshly ground black pepper\n- 10 sprigs fresh thyme, including stems\n\n## Instructions\n1. Warm the oil in a stockpot over medium heat. Add the shrimp shells, onions, carrots, and celery and sauté 15 minutes, until lightly browned. Add the garlic and cook 2 more minutes.\n2. Add 1 1/2 quarts of water, the white wine, tomato paste, salt, pepper, and thyme. Bring to a boil, then reduce heat and simmer 1 hour.\n3. Strain through a sieve, pressing the solids. You should have approximately 1 quart of stock — make up any difference with water or wine.\n\n## Notes\nShells from other shellfish (crab, lobster, mussels, clams) can be substituted or combined with the shrimp shells for extra depth. Some reviewers found the tomato paste made the stock overly sweet and suggest using fresh tomatoes instead, or reducing the amount. Adding a bottle of clam juice is a popular tweak for extra seafood flavor. Reprinted from Barefoot Contessa Parties!, copyright 2001 by Ina Garten.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "uivkbwfct6lmaxjm6qn4id2gdq", "title": "Shakshuka (Poached Eggs in Spicy Tomato Sauce)", "ainfo": "Shakshuka (Poached Eggs in Spicy Tomato Sauce)", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, heat the oil over medium heat. Add the onions, garlic, and bell pepper and cook, uncovered, for about 8 minutes, until softened. Do not brown; reduce the heat if necessary.", "notes": "# Shakshuka (Poached Eggs in Spicy Tomato Sauce)\n\nSource: https://www.onceuponachef.com/recipes/shakshuka.html\n\nBy Jennifer Segal. Servings: 4 to 6. Prep: 10 min | Cook: 40 min | Total: 50 min.\n\n## Ingredients\n- 2 tablespoons extra-virgin olive oil\n- 2 small yellow onions (or 1 medium), peeled and diced\n- 3 cloves garlic, peeled and roughly chopped\n- 1 bell pepper (red, orange, or yellow), diced\n- 3/4 teaspoon smoked paprika\n- 1 teaspoon ground cumin\n- 1 teaspoon ground coriander\n- 1/4 teaspoon crushed red pepper flakes\n- 1 1/2 teaspoons salt, divided\n- 1 teaspoon sugar\n- 1 (28-oz) can diced tomatoes with juices\n- 2 cups finely chopped greens, such as Swiss chard, kale, or spinach, tough ribs removed, gently packed\n- 1/2 cup heavy cream\n- 3 oz feta cheese, crumbled\n- 6 eggs\n- Handful chopped cilantro\n\n## Instructions\n1. In a large skillet, heat the oil over medium heat. Add the onions, garlic, and bell pepper and cook, uncovered, for about 8 minutes, until softened. Do not brown; reduce the heat if necessary.\n2. Add the smoked paprika, cumin, coriander, red pepper flakes, 1 1/4 teaspoons of the salt, sugar, and tomatoes. Cook, uncovered, stirring occasionally, for about 10 minutes, or until the sauce is slightly thickened.\n3. Add the chopped greens and heavy cream to the sauce, and continue cooking, uncovered, stirring occasionally, until the greens are soft and wilted, about 10 minutes more. While the greens are cooking, set an oven rack in the top position and preheat the broiler.\n4. Turn off (or remove the pan from) the heat. Using a spoon, make 6 wells/indentations in the sauce. Carefully crack an egg into each well, then spoon a bit of the sauce over each of the egg whites (this will contain them and help them cook a bit faster than the yolks), being careful not to disturb the yolks. Sprinkle the eggs with the remaining 1/4 teaspoon salt, then sprinkle the feta around the eggs.\n5. Set the pan on the stove over low heat and cover with a lid. Cook for 5 to 7 minutes, until the egg whites are mostly set but still translucent on top (check frequently towards the end as cook time can vary).\n6. Remove the lid, transfer the pan to the oven, and broil until the eggs are cooked to your liking, 1 minute or less for runny yolks. Remove the pan from the oven and sprinkle the cilantro over top. Serve hot with bread.\n\n## Notes\nFor fully cooked yolks, you can cook entirely on the stovetop a few minutes longer without using the broiler. For runny yolks, the stovetop-to-broiler method is the most reliable way to fully cook the whites without overcooking the yolks. Make-ahead: the tomato sauce can be made up to 2 days ahead and refrigerated, or frozen up to 2 months; reheat on the stovetop before proceeding.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "nqxfaiz66mwakawfg3ccxmwgfq", "title": "Shrimp Cakes with Lemon Aioli", "ainfo": "Shrimp Cakes with Lemon Aioli", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pat dry shrimp with paper towels then dice into pea-sized pieces.*", "notes": "# Shrimp Cakes with Lemon Aioli\n\nSource: https://natashaskitchen.com/shrimp-cakes-recipe-video/\n\nBy Natasha, NatashasKitchen.com. Prep: 10 min | Cook: 15 min | Total: 25 min. Servings: 6 (2 fritters per serving). Course: Lunch, Main Course. Cuisine: American. Calories: 258 kcal.\n\n## Ingredients\nFor the Shrimp Cakes/Fritters:\n- 1 lb large raw shrimp, peeled and deveined\n- 4 oz mozzarella cheese (1 1/2 cups shredded)\n- 1 large egg\n- 1/4 cup mayonnaise\n- 2 Tbsp parsley, finely chopped, plus more to garnish\n- 1/2 tsp sea salt, or to taste\n- 1/8 tsp black pepper\n- 1/4 cup all-purpose flour, or gluten free flour\n- 2 Tbsp light olive oil, or high heat cooking oil of choice\n\nFor the Lemon Aioli Sauce:\n- 1/2 cup mayonnaise\n- 1 tsp lemon zest\n- 2 Tbsp lemon juice\n- 1 garlic clove, pressed or finely minced\n\n## Instructions\nHow to Make Shrimp Cakes:\n1. Pat dry shrimp with paper towels then dice into pea-sized pieces.*\n2. Transfer chopped shrimp to a large mixing bowl. Add 4 oz shredded mozzarella, 1 egg, 1/4 cup mayo, 2 Tbsp parsley, 1/2 tsp salt, and 1/8 tsp black pepper. Stir together then add 1/4 cup flour and mix until batter is creamy and well combined.\n3. Heat a large non-stick pan over medium heat and add 1 Tbsp olive oil. Add 1 heaping tablespoon at a time (or a level ice cream scoop) and flatten out the tops as you go so they are abo
