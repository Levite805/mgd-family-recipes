Heidi Larsen, FoodieCrush. Course: Main Course. Cuisine: American. Prep: 20 min | Cook: 20 min | Rest: 3 min | Total: 43 min. Servings: 4.\n\n## Ingredients\n- 4 (6-8 ounce) skin-on salmon fillets, about 1-inch thick\n- 2 tablespoons grapeseed oil\n- 2 teaspoons kosher salt\n- 2 teaspoons freshly ground black pepper\n- 1 lemon, cut into wedges\n\n## Instructions\n1. Preheat the grill. Prepare for direct cooking over high heat, 450°F-550°F. Brush the cooking grates clean and close the lid to heat.\n2. Season the salmon: generously coat the flesh side of the fillets with oil and season evenly with kosher salt and black pepper.\n3. Grill the salmon skin side down over direct high heat with the lid closed for about 6-8 minutes, or until the fish lightens in color, becomes firmer to the touch, and lifts off the grates without sticking. Turn the salmon over, close the lid, and cook to 130°F, about 2-4 minutes for medium rare, or longer to desired doneness.\n4. Rest before serving: transfer to a platter to rest 1-2 minutes. Slide the skin from the fillets and serve with lemon wedges and tartar sauce or cucumber dill sauce.\n\n## Notes\nGrill skin-side down for about 90% of the cooking time — this protects the flesh and helps release from the grates. Oil the fish, not the grill grates. Choose skin-on salmon (king, chinook, coho, or sockeye) and a neutral high-smoke-point oil like grapeseed. Charcoal grills give the best smoky flavor. Test grill heat by holding a hand 3-4 inches above the grates for a 3-count, or look for 450°F on the lid gauge. Good sauce pairings: tartar sauce, cucumber dill sauce, mango salsa, chimichurri, gremolata, or compound butter.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7igyklqihtbzo6c33cmdl5wcty", "title": "The Best Homemade Pizza Sauce", "ainfo": "The Best Homemade Pizza Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat oil in a large pot over medium heat (the pot will seem too big, but this sauce likes to splatter and a larger pot cuts down cooking time). Add garlic and cook until browned and fragrant, about 30 seconds to 1 minute.", "notes": "# The Best Homemade Pizza Sauce\n\nSource: https://bakingmischief.com/2017/02/22/best-homemade-pizza-sauce/\n\nBy Tracy, Baking Mischief. Course: Dinner | Cuisine: Italian | Prep: 5 minutes | Cook: 25 minutes | Total: 30 minutes | Servings: 8\n\n## Ingredients\n- 1/4 cup olive oil\n- 4 cloves garlic, pressed or minced\n- 1 28-ounce can crushed tomatoes (or two 14-ounce cans)\n- 8 fresh basil leaves, thinly sliced, OR 1 1/2 teaspoons dried basil\n- 1/2 teaspoon (2g) sugar\n\nSpecial equipment: mesh splatter screen (optional but nice to have)\n\n## Instructions\n1. Heat oil in a large pot over medium heat (the pot will seem too big, but this sauce likes to splatter and a larger pot cuts down cooking time). Add garlic and cook until browned and fragrant, about 30 seconds to 1 minute.\n2. Add crushed tomatoes carefully (the oil will sizzle and splash), sugar, and basil. Stir and bring to a simmer.\n3. Simmer uncovered for 20-30 minutes, stirring occasionally, until sauce is thickened and reduced to about 1 1/2 cups.\n\n## Notes\nIf using diced or whole tomatoes, pulse them with an immersion blender or food processor until they're mostly pureed with some small pieces intact, like a not-too-chunky salsa. Makes about 1 1/2 cups — enough for 2 medium pizzas, 4 naan pizzas, 1 French bread pizza, or 8-10 bagel pizzas. Freezes well for 2-3 months.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "bslcbwb6lpci2e6tinaxjteusi", "title": "The Best Homemade Sloppy Joes", "ainfo": "The Best Homemade Sloppy Joes", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat butter and oil in a large skillet over medium/medium-high heat. Add beef and brown, breaking apart into crumbles as it cooks, about 5 minutes. Transfer to a colander to drain.", "notes": "# The Best Homemade Sloppy Joes\n\nSource: https://www.thechunkychef.com/best-homemade-sloppy-joes/\n\nBy The Chunky Chef. Prep: 5 minutes | Cook: 20 minutes | Total: 25 minutes | Servings: 6\n\n## Ingredients\n- 1 Tbsp butter\n- 1 tsp olive oil\n- 1 lb. ground beef\n- 1/3 green bell pepper, minced\n- 1/2 large yellow onion, minced\n- 3 cloves garlic, minced\n- 1 Tbsp tomato paste\n- 2/3 cup ketchup\n- 1/3 cup water\n- 1 Tbsp brown sugar (or less, if preferred)\n- 1 tsp yellow mustard\n- 3/4 tsp chili powder\n- 1/2 tsp Worcestershire sauce\n- 1/2 tsp kosher salt\n- 1/4 tsp red pepper flakes (optional)\n- 1/4 tsp black pepper\n- Dash of hot sauce (optional)\n\n## Instructions\n1. Heat butter and oil in a large skillet over medium/medium-high heat. Add beef and brown, breaking apart into crumbles as it cooks, about 5 minutes. Transfer to a colander to drain.\n2. Add onion and bell pepper to the same skillet and cook 2-3 minutes until soft. Add garlic and cook about 30 seconds until fragrant. Add beef back to the skillet along with tomato paste. Stir well.\n3. Add ketchup, water, brown sugar, mustard, chili powder, Worcestershire sauce, salt, red pepper flakes (if using), and black pepper. Stir well to combine.\n4. Cook over medium heat for 10-15 minutes, until the mixture has thickened to your liking. Remove from heat and serve over toasted buns.\n\n## Notes\nToast the buns first for best results — high heat, drizzle of oil, buns cut-side down until golden. Watch the sauce so it doesn't reduce too much (dry) or stay too liquidy — a good consistency leaves a brief trail when you drag a spoon through it. The meat mixture freezes well for up to 4 months; thaw overnight in the fridge and reheat before serving.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "e4vxibdzaokmp3hfueooj4sejy", "title": "The Best Italian-American Meatballs", "ainfo": "The Best Italian-American Meatballs", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "If using the optional stock/gelatin: sprinkle the gelatin over the stock in a heatproof measuring cup and let sit 5 minutes, then microwave briefly until fully dissolved. Pour into a wide bowl and refrigerate until fully set, about 30 minutes.", "notes": "# The Best Italian-American Meatballs\n\nSource: https://www.seriouseats.com/italian-american-beef-pork-meatballs-red-tomato-sauce-recipe\n\nBy Daniel Gritzer, Serious Eats. Prep: 50 min | Cook: 25 min | Chilling: 30 min | Total: 1 hr 45 min. Servings: 6 (yields about 20 handball-sized meatballs, serves 4-6).\n\n## Ingredients\n- 1 packet (1/4 oz / 7g) unflavored gelatin (optional, see notes)\n- 1/2 cup (120 ml) homemade chicken stock or low-sodium broth (optional, see notes)\n- 6 oz (170g) crustless fresh white bread, cut into 1/2-inch cubes (about 2 1/2 cups unpacked)\n- 1/3 cup (80 ml) buttermilk, plus more as needed\n- 2 cups (9 oz / 265g) finely minced yellow onion, from 1 large 10-oz onion\n- 3 oz (85g) fatty pancetta, finely minced (about 3/4 cup)\n- 2 oz (55g) Parmigiano-Reggiano, grated (about 1 1/4 cups), plus more for serving\n- 8 medium cloves garlic (about 1 3/4 oz / 50g), finely minced (about 2 1/2 tablespoons)\n- 1/2 cup loosely packed fresh flat-leaf parsley leaves (1/2 oz / 15g), minced (about 2 1/2 tablespoons)\n- 4 large egg yolks\n- 1 teaspoon dried oregano\n- 1 teaspoon ground fennel seed\n- 1 tablespoon Diamond Crystal kosher salt (9g); use half as much by volume for table salt, or the same weight\n- 1/2 teaspoon freshly ground black pepper\n- 1 pound (455g) ground beef, at least 25% fat\n- 1 pound (455g) ground pork, at least 25% fat\n- 5 cups (1.2 L) tomato sauce of your choice\n\n## Instructions\n1. If using the optional stock/gelatin: sprinkle the gelatin over the stock in a heatproof measuring cup and let sit 5 minutes, then microwave briefly until fully dissolved. Pour into a wide bowl and refrigerate until fully set, about 30 minutes.\n2. In a stand mixer bowl, toss the bread cubes with the buttermilk. Let sit, tossing occasionally, about 10 minutes until fully moistened throughout — squeeze or mash to check for dry spots, adding a splash more buttermilk if needed.\n3. Add the onion, pancetta, Parmigiano-Reggiano, garlic, parsley, egg yolks, oregano, fennel, salt, and pepper to the bread mixture. If using, finely mince the set gelatin block and add it in as well.\n4. Fit the mixer with the paddle attachment and beat the bread/flavoring mixture on low, increasing to medium-high, until thoroughly blended (about 1 minute), scraping down the sides as needed.\n5. Add about a third each of the beef and pork and beat at medium-high speed until fully incorporated into the bread mixture.\n6. Remove the bowl from the mixer and add the remaining beef and pork. Gently work the mixture together by hand, teasing the meat apart so it distributes evenly, without overmixing.\n7. Preheat the broiler with a rack in the upper position. Line two rimmed baking sheets with foil. Shape the mixture into tight, handball-sized meatballs (about 2 inches wide, 3-3.25 oz each) — you should get about 20. Arrange on the baking sheets.\n8. Broil until browned on top, 7-10 minutes (timing varies by broiler strength). Repeat with remaining meatballs.\n9. Heat the tomato sauce to a simmer in a medium pot and add half the meatballs. Simmer until just cooked through, registering about 145°F internally, 10-12 minutes. Transfer to a serving dish and repeat with the remaining meatballs.\n10. Serve with sauce spooned over and extra grated cheese on top.\n\n## Notes\nBeef and pork are used in a 1:1 ratio for a loose, tender texture; veal can be added by substituting two-thirds of a pound of each of the three meats if desired, though the author considers it unnecessary given the other flavor elements. Fresh bread soaked in buttermilk (rather than milk or water) forms a moisture-rich panade — buttermilk's tang balances the richness of the meat. Fatty pancetta is important for juiciness; lean pancetta (over 50% muscle) won't render enough fat, and it's easiest to mince when nearly frozen. The optional gelled stock adds pockets of extra moisture but isn't essential for a good result. Salt should ideally be weighed (9g/tablespoon of Diamond Crystal kosher salt) since salt density varies significantly by type/brand. Broiling is preferred over pan-frying for large meatballs since it sears evenly without deforming them. Simmer meatballs in sauce only until just cooked through — longer simmering pulls more juice out into the sauce at the meatballs' expense. Look for coarsely-ground high-fat (about 25%) beef and pork from a butcher, or grind your own from chuck and pork shoulder. Nutrition per serving: 778 kcal, 46g fat, 28g carbs, 62g protein.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "nsvpqkbvqpiz3qxdt5qz422xhm", "title": "The BEST Pumpkin Pie", "ainfo": "The BEST Pumpkin Pie", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 425°F.", "notes": "# The BEST Pumpkin Pie (with Caramel Pecan Topping)\n\nSource: https://tastesbetterfromscratch.com/pumpkin-pie-with-caramel-pecan-topping/\n\nBy Lauren Allen, Tastes Better From Scratch (filling recipe from Libby's). Prep: 30 min | Cook: 1 hr 5 min | Total: 1 hr 35 min. Servings: 12.\n\n## Ingredients\nPumpkin Pie:\n- 1 9-inch homemade or store-bought deep dish pie crust, unbaked\n- 3/4 cup granulated sugar\n- 1 teaspoon ground cinnamon\n- 1/2 teaspoon salt\n- 1/2 teaspoon ground ginger\n- 1/4 teaspoon ground cloves\n- 2 large eggs\n- 15 oz can pumpkin (or fresh pumpkin puree)\n- 12 oz can evaporated milk\n\nCaramel Pecan Topping (optional):\n- 1/2 cup light brown sugar, packed\n- 2 tablespoons heavy whipping cream\n- 1 tablespoon light corn syrup\n- 1 tablespoon butter\n- 1/2 cup chopped pecans\n- 1/2 teaspoon vanilla extract\n\n## Instructions\n1. Preheat oven to 425°F.\n2. In a large bowl, beat the eggs and pumpkin together. In a separate bowl, combine the sugar, cinnamon, salt, ginger, and cloves, then add to the pumpkin mixture.\n3. Gradually stir in the evaporated milk. Carefully pour into the unbaked pie shell.\n4. Bake at 425°F for 15 minutes. Reduce temperature to 350°F and bake 40 to 50 minutes longer, until set — the center may jiggle just slightly (it continues to set as it cools), or it's done when a knife inserted in the center comes out clean.\n5. Cool completely on a wire rack. Serve with whipped cream and caramel pecan topping, if desired.\n\nCaramel Pecan Topping:\n1. Combine the brown sugar, cream, corn syrup, and butter in a small saucepan over medium-high heat. Bring to a boil, then reduce heat and simmer uncovered about 5 minutes, stirring frequently.\n2. Remove from heat and stir in the pecans and vanilla. The topping thickens as it cools. Spoon over cooled pie slices.\n\n## Notes\nNo blind-baking needed — starting at a high temperature sets the crust before lowering to finish baking. Check for cracking around the 55-minute mark; over-baking is the main cause, and rushing the cooling process can also crack the top, so let it cool undisturbed at room temperature. Fresh sugar pie pumpkin puree can substitute for canned. Can be made a day ahead (whole pie, or crust and filling stored separately) and refrigerated. Homemade pumpkin pie should be refrigerated if not eaten within 2 hours of cooling; keeps 3-4 days in the fridge. Freezes well up to 3 months (wrap in plastic then foil); thaw overnight in the fridge. Nutrition (per serving): 225 kcal, 32g carbs, 5g protein, 9g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "gwzzwl2e42axwduo6yizjzngr4", "title": "The Best, Easiest Focaccia Bread Recipe", "ainfo": "The Best, Easiest Focaccia Bread Recipe", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Make the dough: In a large bowl, whisk together the flour, salt, and instant yeast. Add the water and mix with a rubber spatula until absorbed and the mixture forms a sticky dough ball. Cover and let rest 30 minutes. Optionally, stretch and fold: with a wet hand, grab an edge of the dough and pull it up and toward the center; repeat 8-10 times, rotating around the bowl, until the dough turns from shaggy to smooth and cohesive.", "notes": "# The Best, Easiest Focaccia Bread Recipe (Overnight, Refrigerator Focaccia)\n\nSource: https://alexandracooks.com/2018/03/02/overnight-refrigerator-focaccia-best-focaccia/\n\nBy Alexandra Stafford, Alexandra's Kitchen. Adapted from the focaccia recipe in Bread Toast Crumbs. Total time: 18 hours 30 minutes | Yield: 2 loaves | Prep: 18 hours | Cook: 30 min | Cuisine: Italian\n\n## Ingredients\n- 4 cups (512 g) all-purpose flour or bread flour\n- 2 to 3 teaspoons (10 to 15 g) kosher salt\n- 2 teaspoons (8 g) instant yeast (see notes if using active-dry)\n- 2 cups (455 g) lukewarm water, made by combining 1/2 cup boiling water with 1 1/2 cups cold water\n- Butter for greasing\n- 4 tablespoons olive oil, divided\n- Flaky sea salt, such as Maldon\n- 1 to 2 teaspoons whole rosemary leaves, optional\n\n## Instructions\n1. Make the dough: In a large bowl, whisk together the flour, salt, and instant yeast. Add the water and mix with a rubber spatula until absorbed and the mixture forms a sticky dough ball. Cover and let rest 30 minutes. Optionally, stretch and fold: with a wet hand, grab an edge of the dough and pull it up and toward the center; repeat 8-10 times, rotating around the bowl, until the dough turns from shaggy to smooth and cohesive.\n2. Cold proof: Rub the dough surface lightly with olive oil. Cover the bowl with a lid or plastic wrap and refrigerate immediately for at least 12 hours, up to 3 days. Make sure the dough is well slicked with oil so it doesn't dry out and crust over.\n3. Line two 8- or 9-inch pie plates (or one 9x13-inch pan) with parchment, or grease with butter/nonstick spray.\n4. Pour 1 tablespoon oil into each pan (2 tablespoons if using the 9x13 pan). Using two forks, deflate the dough, pulling it toward the center while rotating the bowl, forming a rough ball. Split into two pieces (or leave whole for the 9x13 pan). Place each piece in a pan and roll in the oil to coat. Let rest, uncovered, at room temperature for 3 to 4 hours.\n5. Preheat oven to 425°F with a rack in the middle. If using rosemary, sprinkle over the dough. Pour 1 tablespoon oil over each round (2 tablespoons for the 9x13 pan). Rub hands with oil and press all fingers straight down to create deep dimples, gently stretching the dough to fill the pan as needed. Sprinkle generously with flaky sea salt.\n6. Bake 25 to 30 minutes, until the underside is golden and crisp. Transfer to a cooling rack and let cool 10 minutes before cutting (cool completely if slicing for sandwiches).\n\n## Notes\nThis is a high-hydration (88%) no-knead dough; the long, cold fermentation (12 hours to 3 days) develops flavor and browning without any added sugar. If short on time, let the dough rise at room temperature until doubled (about 1.5-2 hours) instead of refrigerating, then the second rise will take about 30-60 minutes. Pan options: two 9-inch pie plates, one 9x13-inch pan (do not split dough — creates a thicker focaccia), or a 13x18-inch sheet pan (thinner focaccia, good for slab sandwiches). Salt should be 2-3% of flour weight by design. Mix-ins (olives, sun-dried tomatoes, roasted garlic) can be added directly to the flour before adding water. Store cooled focaccia airtight at room temperature up to 3 days, or freeze up to 3 months; reheat at 350°F for 15 minutes to revive the crust. Can also be baked in a muffin tin — see original post for that variation.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "f7evif7ozwsx73hoykacotzbp4", "title": "The Perfect Fried Chicken Sandwich", "ainfo": "The Perfect Fried Chicken Sandwich", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Start by deboning your chicken thighs. Flip them over so the skin side is against your cutting board. Find the bone with your fingers. Using a sharp paring knife, cut along the length of the bone, keeping your knife directly on the center of the bone. Using the back of your knife scrape away the meat around the bone to reveal it completely. Scrape the bone out of the thigh until you get to the edges where the knuckle portions of the bone are connected with the chicken. To free the remainder of the bone, cut it away from the meat at those connecting points (two on either side of the thigh bone). Leave the skin on the chicken.", "notes": "# The Perfect Fried Chicken Sandwich\n\nSource: https://www.joshuaweissman.com/recipes/perfect-fried-chicken-sandwich-recipe\n\nBy Chef Joshua Weissman.\n\n## Ingredients\nMarinade:\n- 2 lbs (908g) bone-in skin-on chicken thighs, about 6-8\n- 1.5 cups (360mL) buttermilk\n- 2 Tbsp (30mL) hot sauce\n- 1 tsp (3g) white pepper\n- 1 Tbsp (16g) gochujang\n- 1.5 tsp (5g) MSG\n- 1 Tbsp (10g) kosher salt\n- 2 tsp (6g) sugar\n- 2 tsp (6g) garlic powder\n\nPickled Jalapeños:\n- 5-7 large jalapeños, very thinly sliced\n- 1 cup (240mL) white distilled vinegar\n- 1 cup (240mL) water\n- 1 Tbsp (12g) kosher salt\n- 3 Tbsp (27g) sugar\n- 3 large sprigs dill\n- 2 cloves garlic, peeled and lightly crushed\n\nChicken Sauce:\n- ¼ cup (64g) gochujang\n- 3 Tbsp (48g) ketchup\n- 2 Tbsp (30g) dark soy sauce\n- 2 Tbsp (30g) sweet soy sauce\n- 2 Tbsp (32g) honey\n- 2 Tbsp (30g) white distilled vinegar\n- 4 cloves garlic, finely minced\n\nGarlic Mayo:\n- 1 cup (236g) kewpie mayonnaise\n- ¼ tsp (<1g) MSG\n- 2-3 cloves garlic, finely grated\n- Kosher salt and freshly cracked black pepper, to taste\n\nSlaw:\n- 2 cups green cabbage, cored and very thinly sliced\n- 1 cup kimchi, drained of juice and very finely chopped (optional)\n- 2 green onions, very thinly sliced on a bias\n- 1 clove garlic, finely grated\n- 2 Tbsp (30g) kewpie mayonnaise\n- Kosher salt, to taste\n\nDredge and Fry:\n- 2 cups (300g) all-purpose flour\n- ½ cup (75g) potato starch\n- 2 tsp (6g) kosher salt\n- 1 tsp (3g) MSG\n- 1 tsp (3g) cayenne powder\n- 1 tsp (3g) garlic powder\n- ½ tsp (1g) onion powder\n- 2 tsp (6g) black pepper\n- 1 tsp (3g) baking soda\n- 3.5 quarts (3.3 L) high temperature cooking oil (vegetable oil, avocado oil, canola oil, etc.)\n\nAssembly:\n- Unsalted butter, for toasting\n- 6-8 homemade or brioche buns\n\n## Instructions\nMarinade:\n1. Start by deboning your chicken thighs. Flip them over so the skin side is against your cutting board. Find the bone with your fingers. Using a sharp paring knife, cut along the length of the bone, keeping your knife directly on the center of the bone. Using the back of your knife scrape away the meat around the bone to reveal it completely. Scrape the bone out of the thigh until you get to the edges where the knuckle portions of the bone are connected with the chicken. To free the remainder of the bone, cut it away from the meat at those connecting points (two on either side of the thigh bone). Leave the skin on the chicken.\n2. Combine all marinade ingredients except the chicken in a large bowl and whisk together until thoroughly combined. Add your deboned chicken thighs and marinate, covered, in the fridge overnight.\n\nPickled Jalapeños:\n3. In a medium sauce pot, add vinegar, water, salt, and sugar. Set over medium-high heat and bring to a boil. In a pint-sized heat-proof container, add the jalapeños. Once the solids have dissolved, pour the pickling liquid over the jalapeños. Press a piece of plastic wrap or paper towel right on top of the surface to keep everything submerged, then let cool to room temperature. Once cool, add the dill and garlic. Cover with a tight-fitting lid and refrigerate until ready to use.\n\nSauce:\n4. Add all sauce ingredients except the garlic to a 1-2 quart sauce pot. Bring to a boil over medium-high heat. Once boiling, cut the heat then stir in the garlic.\n\nSlaw:\n5. Combine the cabbage, kimchi, green onion, and garlic. Only once ready to serve, add in the mayo, season to taste with salt, and toss until evenly incorporated.\n\nGarlic Mayo:\n6. Combine all ingredients and whisk together until fully combined. Season to taste with salt and freshly cracked black pepper.\n\nDredge:\n7. In a large bowl, combine everything except the baking soda. Whisk together until thoroughly combined.\n\nAssembly and Frying:\n8. Remove the chicken from the marinade and set on a plate or sheet tray. To your marinade, whisk in a ½ cup of your dredge and the remaining 1 teaspoon of baking soda. Flick a couple tablespoons of your now-wet batter into the dry dredge. Whisk so you get small pea-sized lumps in your dredge. Dunk your chicken back in your marinade then in your dredge. Press firmly to adhere the dredge to the chicken. Once thoroughly coated, place on a clean plate or sheet tray and repeat with all chicken pieces.\n9. Fill a large 7-quart heavy-bottomed pot with the oil, making sure not to fill more than about halfway up. Heat over medium heat until it reaches 300°F (149°C). Fry your chicken in batches for about 2-4 minutes, or until the chicken is cooked through and the bubbling has subsided. Remove and drain over a wire rack — there won't be much color on the chicken yet. Increase the heat until the temperature reaches 350°F (177°C) and fry your chicken in batches again until golden brown and crispy. Drain on paper towels.\n10. In a large pan, heat a couple tablespoons of butter over medium heat until melted and bubbling. Add your buns cut side down and toast for about 2 minutes, or until golden brown toasted on both sides. Repeat with all the remaining buns. In a large bowl, toss your chicken with your chicken sauce.\n11. To assemble your sandwich, start with a generous tablespoon or two of garlic mayo on the bottom and top bun. On the bottom bun add your slaw, then your sauced chicken, some pickled jalapeños on top of your chicken, and then your mayo'd top bun. Repeat with all your sandwiches. Serve and enjoy!", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "45eobguyb2p3hrx3twhwamlyeu", "title": "The Ultimate Chicken Fried Steak with Gravy", "ainfo": "The Ultimate Chicken Fried Steak with Gravy", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a shallow bowl, whisk together flour, one teaspoon black pepper, one teaspoon salt, paprika, onion powder, garlic powder, baking soda, and baking powder. Set aside.", "notes": "# The Ultimate Chicken Fried Steak with Gravy\n\nSource: https://www.momontimeout.com/chicken-fried-steak-recipe-with-gravy/\n\nBy Trish, Mom On Timeout. Course: Breakfast, Dinner. Cuisine: American. Prep: 10 min | Cook: 15 min. Servings: 4.\n\n## Ingredients\n- 4 cube steaks (about 1/3 lb each)\n- 1 1/2 cups all purpose flour\n- 2 teaspoons fresh ground black pepper, divided\n- 2 teaspoons kosher salt or sea salt, divided\n- 1/2 teaspoon smoked paprika\n- 1/2 teaspoon onion powder\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon baking soda\n- 1/2 teaspoon baking powder\n- 1 1/2 cups buttermilk\n- 2 teaspoons TABASCO Sauce (original)\n- 2 eggs\n- 1 cup vegetable oil\n\nChicken Fried Steak Gravy:\n- 4 tablespoons grease (reserved from frying)\n- 4 tablespoons flour\n- 2 to 3 cups whole milk\n- 1/2 cup heavy whipping cream\n- Salt and pepper to taste\n\n## Instructions\n1. In a shallow bowl, whisk together flour, one teaspoon black pepper, one teaspoon salt, paprika, onion powder, garlic powder, baking soda, and baking powder. Set aside.\n2. In a separate shallow bowl, whisk together buttermilk, TABASCO Sauce, and eggs. Set aside.\n3. Pat cube steaks dry with a paper towel, removing as much moisture as possible. Season with one teaspoon of salt and one teaspoon of pepper. Let sit for 5 minutes and pat dry again with a paper towel.\n4. Dredge the cube steaks in the flour mixture, shaking off excess, then dredge in the buttermilk-egg mixture, letting excess drip off, then once again in the flour mixture, shaking off excess.\n5. Place breaded cube steaks on a sheet pan or metal rack and press any remaining flour mixture into the steaks so the entire steak is completely coated. Let sit for 10 minutes.\n6. Preheat oven to 225 to 250°F.\n7. Meanwhile, heat vegetable oil in a heavy skillet or large cast iron skillet over medium-high heat, about 1/4-inch deep (shallow frying, not deep frying).\n8. Test the oil by dropping a bit of the breading in — it should sizzle and bubble, glistening but not smoking, about 320-340°F.\n9. Place two steaks in the pan at a time and fry 3 to 4 minutes on each side, until golden brown. Do not flip more than once, and do not overcrowd the pan, or the breading will fall off.\n10. Remove steaks from pan and drain on paper towels. Place in the preheated oven. Turn skillet heat to medium.\n\nGravy:\n11. Pour the remaining grease into a heat-safe bowl or measuring cup. Do NOT scrape the skillet clean — leave the browned bits for flavor.\n12. Add back in 4 tablespoons of the grease to the hot skillet.\n13. Whisk in flour and continue whisking for 2 to 3 minutes, until nice and golden brown.\n14. Combine the cream and milk and slowly drizzle in about 2 1/2 cups into the skillet, whisking constantly.\n15. Continue whisking and bring the gravy to a simmer. Cook until smooth and creamy, about 5 to 7 minutes, adding more milk if it gets too thick. Season with salt and pepper to taste.\n16. Serve chicken fried steak with gravy, mashed potatoes, and your favorite green veggies.\n\n## Notes\nDo not deep fry — shallow fry with about a cup of oil or less; vegetable oil preferred. A heavy skillet (cast iron ideal) works best. Never overcrowd the pan — fry two steaks at a time and keep fried steaks warm in a 225-250°F oven. Baking soda and baking powder in the breading give it extra crispiness. Press the flour coating firmly into the steaks after breading. Storage: leftover steaks keep in an airtight container in the refrigerator up to 3 days.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "kktvoowwqm222y4gr55dr27y7a", "title": "Toasted Coconut Cheesecake", "ainfo": "Toasted Coconut Cheesecake", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Make the crust: Butter a 9\" springform pan. Wrap the bottom and sides in a double layer of aluminum foil. Set a rack in the middle of the oven and preheat to 350°F.", "notes": "# Toasted Coconut Cheesecake\n\nSource: https://www.delish.com/cooking/recipe-ideas/recipes/a46483/toasted-coconut-cheesecake-recipe/\n\nBy Lindsay Funston, Delish. Yields: 10 | Prep: 35 min | Total: 7 hr 25 min\n\n## Ingredients\n### Crust\n- 15 graham crackers\n- 1/8 tsp. kosher salt\n- 3 Tbsp. sugar\n- 1/2 stick butter, melted\n\n### Cheesecake\n- 4 (8-oz.) packages cream cheese, softened\n- 1 1/4 cups sugar\n- 1/2 tsp. kosher salt\n- 1 Tbsp. pure vanilla extract\n- 4 large eggs\n- 1 cup coconut milk\n- 1/4 cup sour cream\n\n### Frosting\n- 1 (8-oz.) package cream cheese, softened\n- 1/2 cup butter, softened\n- 3 Tbsp. coconut milk\n- 3 cups powdered sugar\n- 1 cup toasted shredded coconut\n\n### Garnish\n- Toasted shredded coconut, for topping\n\n## Instructions\n1. Make the crust: Butter a 9\" springform pan. Wrap the bottom and sides in a double layer of aluminum foil. Set a rack in the middle of the oven and preheat to 350°F.\n2. Grind graham crackers into fine crumbs in a food processor or blender. Add salt and sugar and pulse to combine. Transfer to a medium bowl, add butter, and blend with a fork or fingers until evenly moist. Press into the bottom and about a third of the way up the sides of the pan, then freeze 10 minutes.\n3. Place pan on a baking sheet and bake the crust 10 minutes. Cool on a rack; reduce oven temperature to 325°F.\n4. Make the cheesecake: bring a medium saucepan or teakettle of water to a boil.\n5. In a large bowl or stand mixer with the whisk attachment, beat cream cheese on medium until completely smooth, 3-4 minutes, scraping down as needed. Add sugar and salt and beat until smooth and fluffy, 3-4 minutes. Add vanilla and beat 30 seconds. Add eggs one at a time, beating 1 minute after each addition and scraping down as needed. Add coconut milk and sour cream and beat on low until fully incorporated and smooth, 1 minute.\n6. Pour the batter into the cooled crust and smooth the top. Place the cheesecake in a deep roasting pan on the middle oven rack. Carefully pour boiling water into the roasting pan to come about halfway up the sides of the springform pan. Bake until the top just starts to brown and crack, about 1 hour 30 minutes. Turn off the oven, prop the door open with a wooden spoon, and let the cheesecake cool slowly in the water bath for 1 hour.\n7. Remove the roasting pan from the oven, carefully lift the springform pan out of the water, and remove the foil. Let the cheesecake come to room temperature on a rack. Once completely cool, loosely cover with plastic wrap and refrigerate 4 hours, up to overnight.\n8. When ready to serve, make the frosting: beat cream cheese, butter, and coconut milk until combined. Slowly add powdered sugar and toasted coconut until creamy. Frost the cheesecake and top all over with toasted coconut.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "bk4y6iygryjafjdkidxgfyrc34", "title": "Traditional Vietnamese Beef Pho", "ainfo": "Traditional Vietnamese Beef Pho", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the beef bones in a large stock pot and add enough cold water to cover by 2 inches. Bring to a boil over high heat and cook 10 minutes to blanch the bones and remove impurities.", "notes": "# Traditional Vietnamese Beef Pho\n\nSource: https://www.google.com/amp/s/tasty.co/amp/recipe/traditional-vietnamese-beef-pho (retrieved via canonical URL https://tasty.co/recipe/traditional-vietnamese-beef-pho)\n\nBy Pierce Abernathy, Tasty. Total: 8 hr | Prep: 1 hr | Cook: 7 hr | Servings: 8\n\n## Ingredients\n- 10 lb mixed beef leg bones, shin, knuckle, and marrow bones\n- 12 oz ginger (2 large hands), halved lengthwise\n- 1 head large garlic, halved crosswise\n- 4 medium yellow onions, halved lengthwise\n- 8 sticks cinnamon\n- 1/4 cup whole black peppercorns\n- 6 pods whole star anise\n- 1 lb beef brisket\n- Kosher salt\n- 1/4 cup fish sauce, plus more to taste\n- 1 lb boneless sirloin steak\n- 1 lb flat rice noodles, cooked according to package instructions\n\n### For Serving\n- 2 cups fresh mung bean sprouts\n- 1 small red onion, very thinly sliced lengthwise\n- 1 jalapeño, sliced into thin rounds\n- 1 large bunch fresh Thai basil\n- 1 lime, cut into wedges\n- Hoisin sauce\n- Sriracha\n\n## Instructions\n1. Place the beef bones in a large stock pot and add enough cold water to cover by 2 inches. Bring to a boil over high heat and cook 10 minutes to blanch the bones and remove impurities.\n2. Set a rack in the upper third of the oven and preheat the broiler.\n3. Drain the bones in a colander and rinse under cold running water. Return blanched bones to the stockpot.\n4. Meanwhile, arrange the ginger, garlic, and onions cut-side up on a rimmed baking sheet and broil on high until deeply charred in spots, about 5 minutes. Add to the stockpot with the bones.\n5. Combine the cinnamon sticks, peppercorns, and star anise in a medium skillet over medium-high heat and toast, shaking occasionally, until darkened in spots and fragrant, about 5 minutes. Add to the stockpot.\n6. Season the brisket liberally with salt and add it to the stockpot.\n7. Fill the pot with enough cold water to cover everything by 1 inch. Bring to a boil over high heat, then reduce to medium for a gentle simmer, skimming off fat as needed, until the brisket is fork-tender, 2-3 hours.\n8. Transfer the brisket to a plate, let cool completely, and refrigerate until ready to serve.\n9. Continue simmering the broth to extract flavor from the bones, 3-4 hours more.\n10. Remove and discard the bones and aromatics. Strain the broth through a fine mesh strainer into a large pot. Skim and discard fat, then stir in the fish sauce. Taste and add more as desired.\n11. Thinly slice the cooled brisket. Very thinly slice the raw sirloin against the grain.\n12. Divide the noodles among 6-8 large bowls, top with brisket and raw steak. Ladle hot broth over the noodles and meat and serve immediately with bean sprouts, onion, jalapeño, Thai basil, lime wedges, hoisin sauce, and Sriracha alongside.\n\n## Notes\nReader tips: substitute grilled shallots for garlic for a more traditional taste; add sugar cane for sweetness; incorporate cardamom, fennel, and cloves for extra flavor; roasting the bones first adds depth; simmering the broth overnight deepens the flavor. Freezing the sirloin for a few hours makes it easier to slice thin.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "rqtqlih2oggekyigvq6wvfof5i", "title": "Traeger Smoked Beer Brats", "ainfo": "Traeger Smoked Beer Brats", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the brats into a large baggie and add one bottle of beer. Seal and let marinate for 4-6 hours. Drain and discard marinade.", "notes": "# Traeger Smoked Beer Brats\n\nSource: https://www.orwhateveryoudo.com/2022/07/traeger-smoked-beer-brats.html\n\nOr Whatever You Do. Prep: 5 min | Cook: 2 hrs | Total: 2 hrs 5 min. Yield: 6 servings. Cuisine: American. Category: Traeger Recipes.\n\n## Ingredients\n- 6 uncooked bratwurst\n- 2 bottles beer\n- 1 large sweet onion\n- 6 buns\n- 2 tablespoons spicy brown mustard\n\n## Instructions\n1. Place the brats into a large baggie and add one bottle of beer. Seal and let marinate for 4-6 hours. Drain and discard marinade.\n2. Preheat your smoker to 180°F.\n3. Slice the onions into long strips. Place into the bottom of a prepped grill-safe baking dish.\n4. Put the brats directly on the grill grates, and place the pan of onions in the grill as well. Smoke for 1 hour at 180°F.\n5. Turn up the grill temperature to 350°F. Put the other beer in with the onions in the baking dish and place the brats on top. Cook on the grill for approximately 30-60 minutes, until the brats have simmered in the onion/beer mixture for about 20-25 minutes total (time depends on how long it takes the beer to come to a simmer on the grill).\n6. Optional: remove the brats from the beer and place directly on the grill grates for 5-10 minutes for extra char.\n7. Serve on toasted buns with onions and mustard.\n\n## Notes\nUse fresh, uncooked, locally made bratwurst if possible — do not use pre-cooked or pre-smoked sausage. Sweet onions (Walla Walla or Vidalia) are preferred; yellow or white onion works in a pinch, but avoid red onion. Leftovers keep in the fridge 3-4 days; reheat in the microwave or back on the grill. Nutrition (per serving, estimated): 477 calories, 27g fat, 33g carbs, 17g protein.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "e5pozydqza6nkwrwmpb3opxsgm", "title": "Turkey Dumpling Soup", "ainfo": "Turkey Dumpling Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat a Dutch oven over medium-high heat, add the oil, then the onion, carrot, celery, garlic, a sprinkle of salt, and the dried herbs. Sauté for 5 minutes.", "notes": "# Turkey Dumpling Soup\n\nSource: https://liveatslocal.com/turkey-dumpling-soup/ (site is down as of this capture; retrieved via Wayback Machine snapshot: http://web.archive.org/web/20260515020135/https://liveatslocal.com/turkey-dumpling-soup/)\n\nLiv Eats Local. Prep: 15 min | Cook: 45 min | Total: 1 hour. Servings: 4. Course: Main Course. Cuisine: American.\n\n## Ingredients\nSoup:\n- 6 cups turkey, cooked and shredded\n- 2 tablespoons oil\n- 1 small onion, diced\n- 1 large carrot, peeled and diced\n- 2 stalks celery, diced\n- 2 cloves garlic, minced\n- 1 teaspoon dried sage\n- 1 teaspoon dried oregano\n- 1 teaspoon dried rosemary\n- Salt, to taste\n- 12 cups broth (chicken broth used)\n- 2 chicken bouillon cubes\n\nDumplings:\n- 1 cup all-purpose flour\n- 1/2 cup milk (oat milk used)\n- 1 teaspoon salt\n- 2 teaspoons baking powder\n\n## Instructions\n1. Heat a Dutch oven over medium-high heat, add the oil, then the onion, carrot, celery, garlic, a sprinkle of salt, and the dried herbs. Sauté for 5 minutes.\n2. While the vegetables cook, make the dumplings: combine the dry ingredients in a mixing bowl, then mix in the milk until you have a thick but slightly sticky dough. Let rest a few minutes.\n3. Once the vegetables are soft and slightly translucent, add the broth and bouillon cubes, stirring to dissolve. Add the turkey.\n4. Once the broth is boiling, form the dumpling dough into balls about 1-1 1/2 inches in diameter (by hand or with a spoon) and drop them into the boiling broth, keeping them near the surface.\n5. Cover with the lid and continue boiling until the dumplings are fully cooked, about 10 minutes. Serve.\n\n## Notes\nMakes about 4-6 servings with roughly 12 dumplings about 1 inch in diameter; dumpling size can be adjusted, which will affect cooking time. Leftover chicken can substitute for turkey. Water can substitute for broth since the bouillon provides most of the flavor. Leave the lid on while cooking drop dumplings so they steam properly.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wfghn5ppwdh5ngczvbfdijzhxq", "title": "Tzatziki", "ainfo": "Tzatziki", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the cucumber on a towel and gently squeeze out a bit of the excess water.", "notes": "# Tzatziki\n\nSource: https://www.loveandlemons.com/tzatziki-sauce/\n\nBy Jeanine Donofrio & Phoebe Moore, Love and Lemons. Prep: 5 min. Serves 4 to 6.\n\n## Ingredients\n- 1/2 cup finely grated cucumber\n- 1 cup thick whole milk Greek yogurt\n- 1 tablespoon fresh lemon juice\n- 1/2 tablespoon extra-virgin olive oil\n- 1 garlic clove, grated\n- 1/4 teaspoon sea salt\n- 1 tablespoon chopped fresh dill\n- 1 tablespoon chopped fresh mint, optional\n\n## Instructions\n1. Place the cucumber on a towel and gently squeeze out a bit of the excess water.\n2. In a medium bowl, combine the cucumber, yogurt, lemon juice, olive oil, garlic, salt, dill, and mint, if using. Chill until ready to use.\n\n## Notes\nDelicious on pita, grilled veggies, sandwiches, or as part of a summer crudité platter.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "76etpdxtdwj4lirfahqq4sbcum", "title": "Vanilla Syrup for Coffee", "ainfo": "Vanilla Syrup for Coffee", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine the sugars and water in a saucepan.", "notes": "# Vanilla Syrup for Coffee\n\nSource: https://www.google.com/amp/s/www.food.com/amp/recipe/vanilla-syrup-for-coffee-255067 (retrieved via canonical URL https://www.food.com/recipe/vanilla-syrup-for-coffee-255067)\n\nSubmitted by Leopardstripes, Food.com. Ready in: 20 min. Serves: 32.\n\n## Ingredients\n- 2 1/2 cups water\n- 2 cups white sugar\n- 3/4 cup brown sugar\n- 4 tablespoons vanilla extract\n\n## Instructions\n1. Combine the sugars and water in a saucepan.\n2. Boil for at least 10 minutes.\n3. Let cool. When the solution has cooled, add the extract and stir well. Store in an airtight bottle or container.\n\n## Notes\nA copycat of Torani-style flavored syrup — almond, hazelnut, or other extracts can be substituted for vanilla. Some reviewers found boiling too long causes the syrup to thicken/crystallize like candy; one suggested heating only until the liquid turns clear (sugar dissolved) rather than boiling. A pinch of salt was noted to liven up the flavor.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "fvdradmskynsfmngahighk7mvq", "title": "Western Tangy BBQ Sauce (Red)", "ainfo": "Western Tangy BBQ Sauce (Red)", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine ingredients: In a saucepan, whisk together the apple cider vinegar, ketchup, brown sugar, hot pepper sauce, Worcestershire sauce, ground mustard, kosher salt, black pepper, and optional paprika and red pepper flakes.", "notes": "# Western Tangy BBQ Sauce (Red)\n\nSource: Google Keep note\n\n## Ingredients\n- 2 cups apple cider vinegar\n- 3/4 cup ketchup\n- 1/3 cup dark brown sugar (increase to 1/2 cup for a sweeter sauce)\n- 1 tablespoon hot pepper sauce (like Texas Pete's or your favorite)\n- 1 tablespoon Worcestershire sauce\n- 1 teaspoon ground mustard\n- 1/2 teaspoon kosher salt\n- 1/2 teaspoon freshly ground black pepper\n- 1/4 to 1/2 teaspoon smoked paprika and crushed red pepper flakes (optional, to taste)\n\n## Instructions\n1. Combine ingredients: In a saucepan, whisk together the apple cider vinegar, ketchup, brown sugar, hot pepper sauce, Worcestershire sauce, ground mustard, kosher salt, black pepper, and optional paprika and red pepper flakes.\n2. Simmer the sauce: Bring the mixture to a gentle simmer over medium heat, stirring occasionally. Let it simmer for 15-18 minutes, or until it thickens slightly and becomes glossy.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "tnfe6qkzkrpyydgnkcwkeasp2e", "title": "Wood Fired Lobster", "ainfo": "Wood Fired Lobster", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat your pizza oven to 500 degrees.", "notes": "# Wood Fired Lobster\n\nSource: https://gyberoutdoors.com/blogs/recipe/wood-fired-lobster (original page unavailable — \"This store is unavailable\"; content retrieved via Wayback Machine snapshot from 2024-05-23)\n\n## Ingredients\n- 4 lobster tails\n- 1 lb asparagus\n\nButter sauce:\n- butter (amount not specified in original; melted)\n- 1 tsp garlic paste\n- 1 tsp lemon grass paste\n- 1/2 tsp dried thyme\n- 1/2 tsp dried chili flakes\n- 1/2 tsp dried rosemary\n- 1/2 tsp dried parsley\n\n## Instructions\n1. Preheat your pizza oven to 500 degrees.\n2. Make the butter sauce: in a bowl, add all the butter sauce ingredients (microwave the butter until melted) and combine together.\n3. Prep the lobster tails: with a pair of kitchen scissors, cut through the middle of the shell. With your index finger, loosen up the meat, then push it up and let it rest on top of its own shell. Repeat for all lobster tails.\n4. Season the tails with salt, pepper, and garlic. Baste them with the butter sauce.\n5. Place the asparagus along with the lobster tails in a cast iron skillet.\n6. Cook for about 5-8 minutes, until the lobster tails are nicely charred and the shells turn red. Don't overcook — cook to an internal temperature of 135 degrees. Let cool before serving.\n\n## Notes\nDesigned for a wood-fired pizza oven at 500 degrees. The original recipe listed a \"Butter sauce\" ingredient group but did not specify a butter quantity — use enough melted butter to make a basting sauce with the listed herbs and aromatics, to taste.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "5xmfnugpudcfifarynwz6w6f74", "title": "Wood Roasted Prime Rib of Beef", "ainfo": "Wood Roasted Prime Rib of Beef", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pick a quality rib roast with a good fat cap and well-marbled meat.", "notes": "# Wood Roasted Prime Rib of Beef\n\nSource: https://www.google.com/amp/s/wildforage.wordpress.com/2015/10/07/wood-roasted-prime-rib-of-beef/amp/\n\nBy Wild Forage\n\n## Ingredients\n- 7 pound prime rib with a good fat cap\n- 1/4 cup extra virgin olive oil\n- Montreal Steak Seasoning\n- Horseradish, for serving\n\n## Instructions\n1. Pick a quality rib roast with a good fat cap and well-marbled meat.\n2. Take the roast out of the refrigerator and liberally slather with olive oil. Sprinkle the meat on all sides with Montreal Steak Seasoning — don't skimp. Cover and refrigerate to marinate for at least 2 hours, or overnight for best results.\n3. Start a fire in a wood oven, using a mixture of oak and cherry wood (or any hardwood). Once the fire no longer needs constant watching, remove the roast from the fridge and let it come to room temperature. Push the hot coals to one side of the oven and add a piece of wood.\n4. Sear the meat: place the roast on a small rack in a roasting pan and put it in the oven for about 5 minutes (for a 7 lb roast), watching closely and moving the pan to avoid burning.\n5. Once seared and the fat cap is sizzling, remove the roast, cover with aluminum foil, and return to the oven. Cook for 15 minutes per pound, rotating the pan every five minutes for even cooking.\n6. Check the internal temperature in the thickest part with an electronic meat thermometer — about 125-128°F for medium rare. Let the meat rest, covered, for at least 20 minutes.\n7. Serve with horseradish and a nice glass of red wine.\n\n## Notes\nRecipe developed for a wood-fired oven (Forno Bravo Primavera), but the sear-then-slow-roast method (500°F sear, then 350°F at 15 min/lb) also works in a conventional oven.", "updatedAt": "2026-08-16T01:00:04Z"}];

const CAT_LABELS = {
  sourdough:  'Sourdough',
  smoked:     'Smoked & BBQ',
  breads:     'Breads & Doughs',
  asian:      'Asian & Filipino',
  soups:      'Soups & Stews',
  pasta:      'Pasta & Risotto',
  tacos:      'Tacos & Mexican',
  breakfast:  'Breakfast & Brunch',
  mains:      'Mains',
  sides:      'Sides & Salads',
  salads:     'Salads & Dressings',
  appetizers: 'Appetizers & Dips',
  sauces:     'Sauces & Condiments',
  rubs:       'Rubs, Spices & Pickles',
  desserts:   'Desserts & Baking',
  reference:  'Reference',
};

// ── STATE
let activeFilter = 'all';
let searchQuery = '';
let modalPhotoBase = [];        // curated photos for the open recipe (r.photos/r.image)
let modalCommunityPhotos = [];  // visitor-submitted photos for the open recipe, from Firestore
let modalCarouselIdx = 0;
let modalRecipeTitle = '';
let sortField = localStorage.getItem('recipeSortField') || 'title';
let sortDir = localStorage.getItem('recipeSortDir') || 'asc';

// ── MARKDOWN RENDERER
// Shared by renderMd() (paragraphs/lists/headers) and buildTable() (table
// cells) so bold/italic/*link* formatting works the same everywhere a
// recipe's notes get rendered, not just in the main body text.
const inline = s => s
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\*([^*]+?)\*/g, '<em>$1</em>')
  // Auto-link bare URLs (most recipe "Source:" lines are plain text,
  // not markdown link syntax). Trims trailing punctuation/brackets that
  // are almost always sentence punctuation rather than part of the URL.
  .replace(/(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]])/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');

function renderMd(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const out = [];
  let inUl = false, inOl = false;

  const flush = () => {
    if (inUl) { out.push('</ul>'); inUl = false; }
    if (inOl) { out.push('</ol>'); inOl = false; }
  };

  // Table parsing
  let tableLines = [];
  let inTable = false;

  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const line = raw.trim();

    // Detect table row
    if (line.startsWith('|') && line.endsWith('|')) {
      if (!inTable) { flush(); inTable = true; tableLines = []; }
      tableLines.push(line);
      continue;
    } else if (inTable) {
      // flush table
      out.push(buildTable(tableLines));
      tableLines = []; inTable = false;
    }

    if (!line) { flush(); out.push(''); continue; }
    if (line === '---') { flush(); out.push('<hr>'); continue; }

    const hm = line.match(/^(#{1,4})\s+(.+)/);
    if (hm) {
      flush();
      const lv = hm[1].length;
      const content = inline(hm[2]);
      out.push(`<h${lv}>${content}</h${lv}>`);
      continue;
    }

    // Note blocks (*italic text at start of line*)
    const noteM = line.match(/^\*([^*].+[^*])\*\s*$/);
    if (noteM) {
      flush();
      out.push(`<div class="note-block">${inline(noteM[1])}</div>`);
      continue;
    }

    // Unordered list
    if (/^\* /.test(line)) {
      if (inOl) { out.push('</ol>'); inOl = false; }
      if (!inUl) { out.push('<ul>'); inUl = true; }
      out.push(`<li>${inline(line.slice(2))}</li>`);
      continue;
    }

    // Ordered list
    const olm = line.match(/^(\d+)\. (.+)/);
    if (olm) {
      if (inUl) { out.push('</ul>'); inUl = false; }
      if (!inOl) { out.push('<ol>'); inOl = true; }
      out.push(`<li>${inline(olm[2])}</li>`);
      continue;
    }

    flush();
    out.push(`<p>${inline(line)}</p>`);
  }

  if (inTable) out.push(buildTable(tableLines));
  flush();
  return out.join('\n');
}

function buildTable(lines) {
  if (lines.length < 2) return lines.map(l => `<p>${inline(l)}</p>`).join('');
  const parse = l => l.split('|').slice(1, -1).map(c => c.trim());
  const headers = parse(lines[0]);
  // lines[1] is the separator row, skip
  const rows = lines.slice(2).map(parse);
  let html = '<table><thead><tr>';
  headers.forEach(h => html += `<th>${inline(h)}</th>`);
  html += '</tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    r.forEach(c => html += `<td>${inline(c)}</td>`);
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

// ── FILTER + SEARCH
function matches(r) {
  if (activeFilter === 'cookbook') {
    if (!r.cookbook) return false;
  } else if (activeFilter === 'gruenberg') {
    if (!(r.tags || []).includes('Gruenberg Recipes')) return false;
  } else if (activeFilter === 'moser') {
    if (!(r.tags || []).includes('Moser Recipes')) return false;
  } else if (activeFilter !== 'all') {
    if (r.category !== activeFilter) return false;
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    const haystack = (r.title + ' ' + (r.notes || '') + ' ' + r.attribution).toLowerCase();
    if (!haystack.includes(q)) return false;
  }
  return true;
}

// ── SORT
function sortRecipes(list) {
  const dirMul = sortDir === 'desc' ? -1 : 1;
  const sorted = list.slice();
  sorted.sort((a, b) => {
    if (sortField === 'updated') {
      const av = a.updatedAt || '';
      const bv = b.updatedAt || '';
      return dirMul * (av < bv ? -1 : av > bv ? 1 : 0);
    }
    if (sortField === 'rating') {
      const aHas = typeof a.avgRating === 'number';
      const bHas = typeof b.avgRating === 'number';
      // Unrated recipes always sink to the bottom, regardless of
      // direction -- flipping direction should re-order rated recipes,
      // not make "no rating yet" jump to the top.
      if (!aHas && !bHas) return a.title.localeCompare(b.title);
      if (!aHas) return 1;
      if (!bHas) return -1;
      return dirMul * (a.avgRating - b.avgRating);
    }
    return dirMul * a.title.localeCompare(b.title);
  });
  return sorted;
}

// ── RENDER GRID
function render() {
  const grid = document.getElementById('grid');
  const meta = document.getElementById('resultsMeta');
  const visible = sortRecipes(RECIPES.filter(matches));

  grid.innerHTML = '';
  meta.textContent = visible.length === RECIPES.length
    ? `${RECIPES.length} recipes`
    : `${visible.length} of ${RECIPES.length} recipes`;

  if (!visible.length) {
    grid.innerHTML = '<div class="no-results">No recipes found. Try a different search.</div>';
    return;
  }

  visible.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    if (r.photo) {
      card.classList.add('has-photo');
      card.style.backgroundImage = `url("${r.photo}")`;
    }
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', r.title);

    const catLabel = CAT_LABELS[r.category] || '';
    const cbBadge = r.cookbook ? '<span class="cookbook-badge">Family Cookbook</span>' : '';
    const attrHtml = r.attribution ? `<div class="card-attribution">${r.attribution}'s Recipe</div>` : '';
    const previewHtml = r.preview ? `<div class="card-preview">${escHtml(r.preview)}</div>` : '';

    card.innerHTML = `
      <div class="card-header">
        <div class="card-title">${escHtml(r.title)}</div>
        ${cbBadge}
      </div>
      <div class="card-cat">${escHtml(catLabel)}</div>
      ${attrHtml}
      ${previewHtml}
    `;

    card.addEventListener('click', () => openModal(r));
    card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(r); });
    grid.appendChild(card);
  });
}

// ── COUNTS
function updateCounts() {
  const saved = { filter: activeFilter, query: searchQuery };
  const allCats = ['sourdough','smoked','breads','asian','soups','pasta','tacos','breakfast','mains','sides','salads','appetizers','sauces','rubs','desserts','reference'];

  // All
  activeFilter = 'all'; searchQuery = '';
  document.getElementById('count-all').textContent = RECIPES.filter(matches).length;

  allCats.forEach(cat => {
    activeFilter = cat; searchQuery = '';
    document.getElementById(`count-${cat}`).textContent = RECIPES.filter(matches).length;
  });

  // Cookbook
  activeFilter = 'cookbook'; searchQuery = '';
  document.getElementById('count-cookbook').textContent = RECIPES.filter(matches).length;

  // Family tags
  activeFilter = 'gruenberg'; searchQuery = '';
  document.getElementById('count-gruenberg').textContent = RECIPES.filter(matches).length;
  activeFilter = 'moser'; searchQuery = '';
  document.getElementById('count-moser').textContent = RECIPES.filter(matches).length;

  activeFilter = saved.filter; searchQuery = saved.query;
}

// ── MODAL
function openModal(r) {
  document.getElementById('modalTitle').textContent = r.title;

  const badges = document.getElementById('modalBadges');
  badges.innerHTML = '';
  const catSpan = document.createElement('span');
  catSpan.className = 'modal-cat';
  catSpan.textContent = CAT_LABELS[r.category] || '';
  badges.appendChild(catSpan);

  if (r.attribution) {
    const attrSpan = document.createElement('span');
    attrSpan.className = 'modal-attr';
    attrSpan.textContent = r.attribution + "'s Recipe";
    badges.appendChild(attrSpan);
  }
  if (r.cookbook) {
    const srcSpan = document.createElement('span');
    srcSpan.className = 'modal-source';
    srcSpan.textContent = '📖 Family Cookbook';
    badges.appendChild(srcSpan);
  }

  document.getElementById('modalContent').innerHTML = renderMd(r.notes);
  setupScaleBar();

  modalPhotoBase = (r.photos && r.photos.length) ? r.photos.slice() : (r.image ? [r.image] : []);
  modalCommunityPhotos = [];
  modalRecipeTitle = r.title;
  modalCarouselIdx = 0;
  buildCarousel(false);

  const overlay = document.getElementById('modalOverlay');
  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';

  // Scroll modal to top
  document.getElementById('modal').scrollTop = 0;

  // Track current recipe for sharing & update URL hash
  currentRecipeUuid = r.uuid;
  history.replaceState(null, '', location.pathname + '#recipe-' + r.uuid);

  if (window.showNotesForRecipe) window.showNotesForRecipe(r.uuid);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
  currentRecipeUuid = null;
  history.replaceState(null, '', location.pathname);
  if (window.hideNotesForRecipe) window.hideNotesForRecipe();
}

// Combines curated photos (modalPhotoBase) with any visitor-submitted
// photos (modalCommunityPhotos, appended by window.setCommunityPhotos as
// they load from Firestore) into the modal's hero carousel. Only the
// active photo is rendered at a time so the box always sizes itself to
// that photo's own aspect ratio.
function buildCarousel(preserveIdx) {
  const carousel = document.getElementById('modalCarousel');
  const track = document.getElementById('carouselTrack');
  const dotsEl = document.getElementById('carouselDots');
  const prevBtn = document.getElementById('carouselPrev');
  const nextBtn = document.getElementById('carouselNext');
  const photoList = modalPhotoBase.concat(modalCommunityPhotos);

  if (!photoList.length) {
    carousel.style.display = 'none';
    track.innerHTML = '';
    dotsEl.innerHTML = '';
    return;
  }

  carousel.style.display = 'block';
  const multi = photoList.length > 1;
  dotsEl.innerHTML = multi
    ? photoList.map((_, i) => `<button class="carousel-dot" data-i="${i}" aria-label="Photo ${i + 1} of ${photoList.length}"></button>`).join('')
    : '';
  prevBtn.style.display = multi ? 'flex' : 'none';
  nextBtn.style.display = multi ? 'flex' : 'none';

  const showSlide = i => {
    modalCarouselIdx = (i + photoList.length) % photoList.length;
    track.innerHTML = `<div class="carousel-slide"><img src="${photoList[modalCarouselIdx]}" alt="${escHtml(modalRecipeTitle)} photo"></div>`;
    dotsEl.querySelectorAll('.carousel-dot').forEach((dot, di) => dot.classList.toggle('active', di === modalCarouselIdx));
  };
  prevBtn.onclick = () => showSlide(modalCarouselIdx - 1);
  nextBtn.onclick = () => showSlide(modalCarouselIdx + 1);
  dotsEl.querySelectorAll('.carousel-dot').forEach(dot => {
    dot.onclick = () => showSlide(parseInt(dot.dataset.i, 10));
  });
  showSlide(preserveIdx && modalCarouselIdx < photoList.length ? modalCarouselIdx : 0);
}

// Bridge for the Firebase notes module script: called whenever the
// currently-open recipe's visitor-submitted photos load/change, so they
// join the carousel alongside any curated photos.
window.setCommunityPhotos = function (uuid, photos) {
  if (uuid !== currentRecipeUuid) return;
  modalCommunityPhotos = photos;
  buildCarousel(true);
};

// Bridge for the Firebase notes module script: applies a one-time,
// page-load batch of community data to the in-memory RECIPES array --
// the earliest visitor photo per recipe (for any recipe with no curated
// photo of its own, so it becomes that recipe's featured card-grid
// background too, matching modal carousel behavior) and average
// rating + rating count per recipe (so the "Rating" sort option and any
// future rating display have real data to work with).
window.applyCommunityData = function (photoByUuid, ratingByUuid) {
  let changed = false;
  RECIPES.forEach(r => {
    if (!r.photo && photoByUuid[r.uuid]) {
      r.photo = photoByUuid[r.uuid];
      changed = true;
    }
    const rating = ratingByUuid[r.uuid];
    if (rating) {
      r.avgRating = rating.avg;
      r.ratingCount = rating.count;
      changed = true;
    }
  });
  if (changed) render();
};

// ── EVENT LISTENERS
document.getElementById('closeBtn').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.cat;
    render();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

// ── SORT CONTROLS
const sortFieldEl = document.getElementById('sortField');

/* ── UNIT CONVERTER ── */
const VOLUME_UNITS = {
  tsp: { label: 'tsp', factor: 4.92892 },
  tbsp: { label: 'tbsp', factor: 14.7868 },
  flOz: { label: 'fl oz', factor: 29.5735 },
  cup: { label: 'cup', factor: 236.588 },
  pint: { label: 'pint', factor: 473.176 },
  quart: { label: 'quart', factor: 946.353 },
  gallon: { label: 'gallon', factor: 3785.41 },
  mL: { label: 'mL', factor: 1 },
  L: { label: 'L', factor: 1000 },
};
const WEIGHT_UNITS = {
  oz: { label: 'oz', factor: 28.3495 },
  lb: { label: 'lb', factor: 453.592 },
  g: { label: 'g', factor: 1 },
  kg: { label: 'kg', factor: 1000 },
};
const TEMP_UNITS = {
  F: { label: '°F' },
  C: { label: '°C' },
};
const CONV_DEFAULTS = {
  volume: ['cup', 'mL'],
  weight: ['oz', 'g'],
  temp: ['F', 'C'],
};

function unitsForCategory(cat) {
  return cat === 'volume' ? VOLUME_UNITS : cat === 'weight' ? WEIGHT_UNITS : TEMP_UNITS;
}

function populateConvUnits() {
  const cat = document.getElementById('convCategory').value;
  const units = unitsForCategory(cat);
  const fromSel = document.getElementById('convFrom');
  const toSel = document.getElementById('convTo');
  fromSel.innerHTML = '';
  toSel.innerHTML = '';
  Object.entries(units).forEach(([key, u]) => {
    fromSel.appendChild(new Option(u.label, key));
    toSel.appendChild(new Option(u.label, key));
  });
  const [defFrom, defTo] = CONV_DEFAULTS[cat];
  fromSel.value = defFrom;
  toSel.value = defTo;
  computeConversion();
}

function roundNice(n) {
  if (!isFinite(n)) return '0';
  const rounded = Math.round(n * 1000) / 1000;
  return rounded.toString();
}

function convertTemp(val, from, to) {
  if (from === to) return val;
  const c = from === 'F' ? (val - 32) * 5 / 9 : val;
  return to === 'F' ? c * 9 / 5 + 32 : c;
}

function computeConversion() {
  const cat = document.getElementById('convCategory').value;
  const val = parseFloat(document.getElementById('convValue').value);
  const from = document.getElementById('convFrom').value;
  const to = document.getElementById('convTo').value;
  const units = unitsForCategory(cat);
  const result = document.getElementById('convResult');
  if (isNaN(val)) { result.textContent = '—'; return; }
  let out;
  if (cat === 'temp') {
    out = convertTemp(val, from, to);
  } else {
    out = val * units[from].factor / units[to].factor;
  }
  result.textContent = `${roundNice(val)} ${units[from].label} = ${roundNice(out)} ${units[to].label}`;
}

document.getElementById('convCategory').addEventListener('change', populateConvUnits);
document.getElementById('convValue').addEventListener('input', computeConversion);
document.getElementById('convFrom').addEventListener('change', computeConversion);
document.getElementById('convTo').addEventListener('change', computeConversion);
populateConvUnits();

/* ── COOKING TIMER ── */
let timerIdCounter = 0;
const activeTimers = new Map();

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(delay => {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.3);
    });
  } catch (e) { /* audio not available */ }
}

function formatTime(sec) {
  sec = Math.max(0, Math.round(sec));
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function addTimer(minutes, label) {
  minutes = parseFloat(minutes);
  if (!minutes || minutes <= 0) return;
  const id = ++timerIdCounter;
  const totalSec = Math.round(minutes * 60);
  const timer = { id, remaining: totalSec, label: label || `${minutes} min timer`, done: false, intervalId: null };
  activeTimers.set(id, timer);
  renderTimers();
  timer.intervalId = setInterval(() => {
    timer.remaining -= 1;
    if (timer.remaining <= 0) {
      timer.remaining = 0;
      timer.done = true;
      clearInterval(timer.intervalId);
      beep();
    }
    updateTimerCard(timer);
  }, 1000);
}

function removeTimer(id) {
  const t = activeTimers.get(id);
  if (t && t.intervalId) clearInterval(t.intervalId);
  activeTimers.delete(id);
  renderTimers();
}

function renderTimers() {
  const list = document.getElementById('timerList');
  list.innerHTML = '';
  activeTimers.forEach(timer => list.appendChild(buildTimerCard(timer)));
}

function buildTimerCard(timer) {
  const card = document.createElement('div');
  card.className = 'timer-card' + (timer.done ? ' done' : '');
  card.id = 'timer-card-' + timer.id;
  card.innerHTML = `
    <div class="timer-card-info">
      <div class="timer-card-label">${timer.label}</div>
      <div class="timer-time">${formatTime(timer.remaining)}</div>
    </div>
    <div class="timer-card-actions">
      <button class="timer-btn" aria-label="Remove timer" title="Remove timer">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1l12 12M13 1L1 13"/></svg>
      </button>
    </div>
  `;
  card.querySelector('.timer-btn').addEventListener('click', () => removeTimer(timer.id));
  return card;
}

function updateTimerCard(timer) {
  const card = document.getElementById('timer-card-' + timer.id);
  if (!card) return;
  card.classList.toggle('done', timer.done);
  card.querySelector('.timer-time').textContent = formatTime(timer.remaining);
}

/* ── RECIPE SCALER ── */
const FRAC_TO_DEC = {
  '¼': 0.25, '½': 0.5, '¾': 0.75,
  '⅓': 1 / 3, '⅔': 2 / 3,
  '⅕': 0.2, '⅖': 0.4, '⅗': 0.6, '⅘': 0.8,
  '⅙': 1 / 6, '⅚': 5 / 6,
  '⅛': 0.125, '⅜': 0.375, '⅝': 0.625, '⅞': 0.875,
};
const DEC_TO_FRAC = [
  [1 / 8, '⅛'], [1 / 6, '⅙'], [0.2, '⅕'], [0.25, '¼'], [1 / 3, '⅓'],
  [0.375, '⅜'], [0.4, '⅖'], [0.5, '½'], [0.6, '⅗'], [0.625, '⅝'],
  [2 / 3, '⅔'], [0.75, '¾'], [0.8, '⅘'], [5 / 6, '⅚'], [0.875, '⅞'],
];
const FRAC_CHARS = Object.keys(FRAC_TO_DEC).join('');

function formatScaledQty(value) {
  if (!isFinite(value) || value <= 0) return '0';
  let whole = Math.floor(value + 1e-9);
  let rem = value - whole;
  if (rem < 0.03) return String(whole);
  if (1 - rem < 0.03) return String(whole + 1);
  let best = null, bestDiff = Infinity;
  for (const [dec, ch] of DEC_TO_FRAC) {
    const diff = Math.abs(dec - rem);
    if (diff < bestDiff) { bestDiff = diff; best = ch; }
  }
  if (bestDiff <= 0.04) {
    return whole > 0 ? `${whole} ${best}` : best;
  }
  const combined = whole + rem;
  return (Math.round(combined * 100) / 100).toString();
}

function scaleIngredientHTML(html, factor) {
  if (factor === 1) return html;
  const pattern = new RegExp(
    `(\\d+(?:\\.\\d+)?)\\s*\\/\\s*(\\d+)` +           // "1/2"
    `|(\\d+)\\s+([${FRAC_CHARS}])` +                    // "1 ½"
    `|(\\d+\\.\\d+)` +                                  // "1.5"
    `|([${FRAC_CHARS}])` +                              // "½"
    `|\\b(\\d+)\\b`,                                    // "2"
    'g'
  );
  return html.replace(pattern, (match, num1, den1, wholeNum, fracChar1, decNum, fracCharAlone, plainInt) => {
    let value;
    if (num1 !== undefined && den1 !== undefined) value = parseFloat(num1) / parseFloat(den1);
    else if (wholeNum !== undefined) value = parseFloat(wholeNum) + FRAC_TO_DEC[fracChar1];
    else if (decNum !== undefined) value = parseFloat(decNum);
    else if (fracCharAlone !== undefined) value = FRAC_TO_DEC[fracCharAlone];
    else if (plainInt !== undefined) value = parseFloat(plainInt);
    else return match;
    return formatScaledQty(value * factor);
  });
}

let scaleTargetLis = [];

function setupScaleBar() {
  const bar = document.getElementById('scaleBar');
  const content = document.getElementById('modalContent');
  const heading = Array.from(content.querySelectorAll('h1, h2, h3, h4'))
    .find(h => /ingredient/i.test(h.textContent));

  scaleTargetLis = [];
  if (heading) {
    let el = heading.nextElementSibling;
    while (el && !/^H[1-6]$/.test(el.tagName)) {
      if (el.tagName === 'UL' || el.tagName === 'OL') {
        scaleTargetLis.push(...el.querySelectorAll('li'));
      }
      el = el.nextElementSibling;
    }
  }

  if (scaleTargetLis.length) {
    scaleTargetLis.forEach(li => { li.dataset.orig = li.innerHTML; });
    bar.style.display = 'flex';
  } else {
    bar.style.display = 'none';
  }

  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.scale-btn[data-factor="1"]').classList.add('active');
  document.getElementById('scaleCustom').value = '';
}

function applyScale(factor) {
  scaleTargetLis.forEach(li => {
    li.innerHTML = scaleIngredientHTML(li.dataset.orig, factor);
  });
}

document.querySelectorAll('.scale-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('scaleCustom').value = '';
    applyScale(parseFloat(btn.dataset.factor));
  });
});
document.getElementById('scaleCustom').addEventListener('input', e => {
  const val = parseFloat(e.target.value);
  document.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('active'));
  if (!isNaN(val) && val > 0) applyScale(val);
});
</script>

  document.getElementById("notesList").innerHTML = '<div class="notes-empty">Loading notes…</div>';
  document.getElementById("ratingSummary").innerHTML = "";

  if (unsubscribe) { unsubscribe(); unsubscribe = null; }

  const q = query(notesCol, where("uuid", "==", uuid), orderBy("createdAt", "desc"), limit(100));
  unsubscribe = onSnapshot(
    q,
    snap => {
      const docs = snap.docs.map(d => {
        const data = d.data();
        return { ...data, createdAt: data.createdAt ? data.createdAt.toDate() : null };
      });
      renderNotes(docs);

      // Feed any visitor-submitted photos into this recipe's hero carousel,
      // oldest first, alongside whatever curated photos it already has.
      const communityPhotos = docs
        .filter(d => d.photoData)
        .sort((a, b) => (a.createdAt ? a.createdAt.getTime() : 0) - (b.createdAt ? b.createdAt.getTime() : 0))
        .map(d => d.photoData);
      if (window.setCommunityPhotos) window.setCommunityPhotos(uuid, communityPhotos);
    },
    err => {
      // Log the real error for debugging, but never show raw Firestore/
      // technical error text to visitors -- fall back to the same empty
      // state a recipe with zero notes would show.
      console.error("recipeNotes query failed:", err);
      document.getElementById("notesList").innerHTML =
        '<div class="notes-empty">No notes yet — be the first to leave one!</div>';
      document.getElementById("ratingSummary").innerHTML = "";
    }
  );
};

window.hideNotesForRecipe = function () {
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
  currentUuid = null;
};

// Star picker
document.querySelectorAll(".star-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    selectedRating = parseInt(btn.dataset.star, 10);
    document.querySelectorAll(".star-btn").forEach(b => {
      b.classList.toggle("filled", parseInt(b.dataset.star, 10) <= selectedRating);
    });
  });
});

// Photo picker: resize/compress client-side to a small base64 JPEG so the
// whole note document stays well under Firestore's 1MiB doc limit.
function resizeImageToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("could not decode image"));
      img.onload = () => {
        let width = img.width, height = img.height;
        const MAX_DIM = 1000;
        if (width > MAX_DIM || height > MAX_DIM) {
          const scale = MAX_DIM / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);

        const MAX_LEN = 700000; // characters -- comfortably under the 900000 Firestore-rule cap
        let quality = 0.75;
        let dataUrl = canvas.toDataURL("image/jpeg", quality);
        let attempts = 0;
        while (dataUrl.length > MAX_LEN && attempts < 6) {
          quality -= 0.1;
          if (quality < 0.35) {
            width = Math.round(width * 0.8);
            height = Math.round(height * 0.8);
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            quality = 0.6;
          }
          dataUrl = canvas.toDataURL("image/jpeg", Math.max(quality, 0.35));
          attempts++;
        }
        if (dataUrl.length > MAX_LEN) { reject(new Error("image too large to compress")); return; }
        resolve(dataUrl);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

document.getElementById("notePhoto").addEventListener("change", async e => {
  const file = e.target.files[0];
  const label = document.getElementById("notePhotoLabel");
  const labelEl = label.closest("label");
  const statusEl = document.getElementById("noteStatus");
  if (!file) {
    selectedPhotoDataUrl = null;
    label.textContent = "Add a photo";
    labelEl.classList.remove("has-photo");
    return;
  }
  label.textContent = "Compressing…";
  try {
    selectedPhotoDataUrl = await resizeImageToDataUrl(file);
    label.textContent = "Photo attached ✓";
    labelEl.classList.add("has-photo");
  } catch (err) {
    selectedPhotoDataUrl = null;
    label.textContent = "Add a photo";
    labelEl.classList.remove("has-photo");
    statusEl.textContent = "Could not process that image — try a different file.";
    statusEl.className = "note-status error";
  }
});

// Submit
document.getElementById("noteForm").addEventListener("submit", async e => {
  e.preventDefault();
  const statusEl = document.getElementById("noteStatus");
  const submitBtn = document.getElementById("noteSubmitBtn");
  if (!currentUuid) return;
  const name = document.getElementById("noteName").value.trim();
  const text = document.getElementById("noteText").value.trim();

  if (!selectedRating && !text && !selectedPhotoDataUrl) {
    statusEl.textContent = "Add a rating, a note, or a photo before posting.";
    statusEl.className = "note-status error";
    return;
  }

  submitBtn.disabled = true;
  statusEl.textContent = "Posting…";
  statusEl.className = "note-status";

  const noteDoc = { uuid: currentUuid, text, createdAt: serverTimestamp() };
  if (selectedRating) noteDoc.rating = selectedRating;
  if (name) noteDoc.name = name;
  if (selectedPhotoDataUrl) {
    noteDoc.photoData = selectedPhotoDataUrl;
    noteDoc.hasPhoto = true;
  }

  try {
    await addDoc(notesCol, noteDoc);
    resetNoteForm();
    statusEl.textContent = "Thanks — your note was posted!";
    statusEl.className = "note-status success";
  } catch (err) {
    statusEl.textContent = "Something went wrong posting your note: " + err.message;
    statusEl.className = "note-status error";
  } finally {
    setTimeout(() => { submitBtn.disabled = false; }, 3000);
  }
});

// One-time, page-load pass over the whole recipeNotes collection, used
// to derive two things per recipe uuid: the earliest visitor photo (for
// recipes with no curated photo of their own -- becomes the card-grid
// background) and the average rating + rating count (for the "Rating"
// sort option). One unfiltered fetch rather than two filtered ones,
// since a note can carry both a rating and a photo -- there's no way to
// download just the rating field without also pulling photoData for
// notes that happen to include one, so filtering by hasPhoto wouldn't
// actually save anything; text-only notes (no photo) are tiny either
// way. This is a low-traffic family site, so a full collection fetch is
// cheap; if the note volume ever grows large, revisit with a lighter
// aggregate collection instead. Not live -- a note added after this
// page load won't be reflected until the next reload.
(async () => {
  try {
    const snap = await getDocs(notesCol);
    const earliestPhotoByUuid = {};
    const ratingSumByUuid = {};
    snap.forEach(d => {
      const data = d.data();
      if (!data.uuid) return;
      const t = data.createdAt ? data.createdAt.toMillis() : 0;
      if (data.photoData) {
        if (!earliestPhotoByUuid[data.uuid] || t < earliestPhotoByUuid[data.uuid].t) {
          earliestPhotoByUuid[data.uuid] = { t, photoData: data.photoData };
        }
      }
      if (typeof data.rating === "number") {
        const agg = ratingSumByUuid[data.uuid] || { sum: 0, count: 0 };
        agg.sum += data.rating;
        agg.count += 1;
        ratingSumByUuid[data.uuid] = agg;
      }
    });
    const photoByUuid = {};
    for (const uuid in earliestPhotoByUuid) photoByUuid[uuid] = earliestPhotoByUuid[uuid].photoData;
    const ratingByUuid = {};
    for (const uuid in ratingSumByUuid) {
      const agg = ratingSumByUuid[uuid];
      ratingByUuid[uuid] = { avg: agg.sum / agg.count, count: agg.count };
    }
    if (window.applyCommunityData) window.applyCommunityData(photoByUuid, ratingByUuid);
  } catch (err) {
    console.warn("Could not load community photo/rating data:", err);
  }
})();
</script>
