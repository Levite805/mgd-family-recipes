"title": "Elk Baked Meatballs", "ainfo": "Elk Baked Meatballs", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 400°F and spray a large baking sheet with cooking spray.", "notes": "# Elk Baked Meatballs\n\nSource: https://www.google.com/amp/s/www.wideopeneats.com/recipes/elk-baked-meatballs/amp/ (retrieved via redirect to Wide Open Country: https://www.wideopencountry.com/elk-baked-meatballs/)\n\nBy Lyndsay Cordell, Wide Open Country. Servings: 10 | Prep: 15 min | Cook: 20 min | Total: 35 min\n\n## Ingredients\n- 1 lb ground elk\n- 1/2 cup chopped onion\n- 1/4 cup breadcrumbs\n- 3 garlic cloves, minced\n- 2 eggs, beaten\n- 3 Tbsp ketchup\n- 1 tsp salt\n- 1/2 tsp pepper\n- 1 Tbsp minced parsley\n- 1 1/2 cups barbecue sauce\n\n## Instructions\n1. Preheat oven to 400°F and spray a large baking sheet with cooking spray.\n2. In a large bowl, mix together the ground elk, onion, breadcrumbs, garlic, eggs, ketchup, salt, pepper, and parsley. Mix just until combined — don't overmix.\n3. Form into 1-inch balls and place on the baking sheet. Bake until browned and cooked through, about 15-20 minutes.\n4. Pour the barbecue sauce into a large bowl and toss the meatballs in the sauce. Serve on toothpicks (or over egg noodles for a full meal).\n\n## Notes\nGround venison can substitute for elk with the addition of some extra fat. If elk isn't available locally, check specialty online suppliers (e.g., Fossil Farms, Wild Fork Foods) — expect higher shipping costs due to ice pack requirements.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "hppwkdpxoc6pqd267zt3t6b6fm", "title": "Elk Burgers", "ainfo": "Elk Burgers", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the ground elk meat in a large bowl.", "notes": "# Elk Burgers\n\nSource: https://www.runningtothekitchen.com/elk-burgers/\n\nBy Gina Matsoukas, Running to the Kitchen. Servings: 4 | Prep: 10 min | Cook: 8 min | Additional: 10 min | Total: 28 min | Course: Main Dishes | Cuisine: American\n\n## Ingredients\n- 1 pound ground elk meat\n- 4 tablespoons ghee, or grass-fed pastured butter\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon onion powder\n- 1/2 teaspoon kosher salt\n- 1/4 teaspoon oregano\n- 1/4 teaspoon turmeric\n- 1/4 teaspoon black pepper\n- 4 slices sharp cheddar cheese, optional\n\n### For Serving\n- Lettuce\n- Tomato\n- Onion\n- Ketchup\n- Buns of choice\n\n## Instructions\n1. Place the ground elk meat in a large bowl.\n2. Add the ghee and seasonings and mix until well combined.\n3. Form into four similarly sized patties, place on a plate, and refrigerate 10-15 minutes while the grill heats up.\n4. Heat an outdoor grill to medium-hot. Once hot, grill the burgers about 3-4 minutes per side, until medium-rare to medium (internal temperature 135-140°F). Alternatively, cook in a cast iron skillet over medium-high heat with a touch of ghee or butter.\n5. If using cheddar, place a slice on each burger about 1 minute before removing from the grill, closing the lid so the cheese melts.\n6. Serve with chosen toppings on a bun, if desired.\n\n## Notes\nElk is very lean, so added fat (ghee or grass-fed butter) is key to a juicy burger — refrigerating the formed patties lets the fat solidify so it doesn't seep out during cooking. Do not overcook past medium; elk dries out quickly beyond that point.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2ysigyhldpzqpiwqa3elurt6oe", "title": "Elk Loin with a Blackberry Sauce", "ainfo": "Elk Loin with a Blackberry Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pat elk loin dry and season all sides with kosher salt and freshly ground black pepper.", "notes": "# Elk Loin with a Blackberry Pan Sauce\n\nSource: https://nevadafoodies.com/elk-loin-with-a-blackberry-sauce/\n\nNevadaFoodies (Wild Game Cuisine). Course: Main Course | Cuisine: American | Servings: 4 | Prep: 10 min | Cook: 20 min | Rest: 10 min | Total: 40 min\n\n## Ingredients\n- 2 lbs elk loin\n- 1 tsp kosher salt\n- 1 tsp freshly ground black pepper\n- 1 cup fresh blackberries, washed\n- 2 tbsp balsamic vinegar\n- 2 tbsp honey\n- 1/2 cup red wine (Pinot Noir, Cabernet Sauvignon, or Merlot)\n- 1/2 tsp fresh rosemary, finely chopped\n- 4 tbsp unsalted butter, divided\n- Salt, to taste\n\n## Instructions\n1. Pat elk loin dry and season all sides with kosher salt and freshly ground black pepper.\n2. Heat 2 tbsp butter in a cast iron skillet over medium heat. Sear elk 4 minutes per side until browned and internal temperature reaches 125°F for medium-rare.\n3. Transfer elk to a cutting board, tent loosely with foil, and let rest 10 minutes.\n4. In a saucepan over medium-low heat, cook blackberries 2-3 minutes until softened. Add balsamic vinegar, honey, red wine, and rosemary; simmer until thickened.\n5. Strain the sauce through a fine-mesh sieve, return to the pan, swirl in the remaining 2 tbsp butter, and season with a pinch of salt.\n6. Slice elk against the grain, arrange on plates, and drizzle with the warm blackberry sauce.\n\n## Notes\nElk is lean and best served medium-rare. Doneness guide: rare 120-125°F, medium-rare 130-135°F (recommended for elk, venison, antelope), medium 140-145°F. Works well with venison or antelope backstrap — antelope cooks faster due to leanness, so monitor temperature closely. Fully heat the skillet before searing for a good crust. The blackberry sauce can be made a day ahead and gently reheated. Black currants or blueberries can substitute for blackberries for a different seasonal twist.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vtkpmbpzr4pzrwn7tlew2y3ipy", "title": "Elote-Style Roasted Corn and Poblano Salad", "ainfo": "Elote-Style Roasted Corn and Poblano Salad", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F. Place whole ears of corn on a baking sheet. Roast for 30 minutes. Remove from oven and let cool for 15 minutes before handling.", "notes": "# Elote-Style Roasted Corn and Poblano Salad\n\nSource: https://sweetcayenne.com/elote-style-roasted-corn/#recipe\n\nBy Whitney Reist, Sweet Cayenne. Prep: 30 min | Cook: 45 min | Total: 1 hr 15 min. Servings: 9. Gluten-Free, Vegetarian, Mexican.\n\n## Ingredients\n- 6 ears of corn (roasted, seared, shucked, and kernels cut off)\n- 2 medium poblano peppers (roasted under broiler 8-10 minutes)\n- 2 tablespoons salted butter\n- 2 tablespoons olive oil mayo\n- 3 tablespoons fresh lime juice (about 2 limes)\n- 1 tablespoon Tajín chile-lime seasoning\n- ½ teaspoon black pepper\n- ¼ teaspoon salt\n- ½ cup Cotija cheese\n- ⅓ cup basil leaves, roughly chopped (or cilantro)\n\n## Instructions\n1. Preheat oven to 350°F. Place whole ears of corn on a baking sheet. Roast for 30 minutes. Remove from oven and let cool for 15 minutes before handling.\n2. While the corn is cooling, preheat your broiler on high. Place the poblano peppers on the baking sheet. Broil (with the rack placed 12 inches from the broiler) for 4-5 minutes on each side until all sides of the pepper are lightly charred. Remove from oven and let cool.\n3. Shuck the corn husks and remove all silk. Sear the corn lightly on all sides in a skillet over medium-high heat, about 1 minute per side. Rub the butter all over each ear of corn. Use a serrated knife to carefully remove the corn kernels from the cob. Place kernels in a large bowl.\n4. Finely chop the poblanos, discarding the core and seeds (no need to peel the pepper). Add the chopped pepper into the bowl of corn.\n5. In a small bowl, combine the mayo, lime juice, Tajín, black pepper, salt, cheese, and basil. Add to the corn and peppers. Toss lightly to combine thoroughly. Serve immediately or chill for up to 4 hours before serving.\n6. Leftovers will keep for up to 3 days in the fridge.\n\n## Notes\nNutrition per serving (1 cup): Calories 246, Carbohydrates 31.8g, Protein 9g, Fat 11.7g, Saturated Fat 5.6g, Cholesterol 27mg, Sodium 413mg, Potassium 491mg, Fiber 4.6g, Sugar 6g, Calcium 109mg, Iron 4mg.\n\nIngredient notes: fresh corn is sweetest when picked the day of or day before purchase (peak season May-September). Poblano peppers are roasted under the broiler to bring out smoky flavor. Mayo (here, olive oil mayo) combined with butter helps the Cotija cheese and chili powder adhere, in the tradition of Mexican street corn (elote). Basil is used here as a cilantro substitute for those who find cilantro tastes soapy; cilantro can be substituted back in if preferred. Pairs well with grilled carne asada, fajitas, as a taco topping, alongside enchiladas, in burrito bowls, on nachos, or with brisket and refried black beans.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "uazohlkkcvurpvsq5g7hkilv4a", "title": "Empanada Dough", "ainfo": "Empanada Dough", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add the flour, butter, egg, cold water, and salt to a food processor fitted with a dough blade. Pulse until the mixture resembles coarse crumbs. (For sweet dough, add the sugar too.)", "notes": "# Empanada Dough\n\nSource: https://sundaysuppermovement.com/empanada-dough/\n\nBy Isabel Laessig, Sunday Supper Movement. Prep: 20 min | Total: 20 min. Servings: 12 discs.\n\n## Ingredients\n- 2 1/2 cups all-purpose flour, plus more for sprinkling\n- 1 stick butter, cold and cut into pieces\n- 1 egg, beaten\n- 1/4 cup cold water\n- 1 pinch salt\n\nFor sweet empanadas, add:\n- 1/2 tablespoon granulated sugar\n\n## Instructions\n1. Add the flour, butter, egg, cold water, and salt to a food processor fitted with a dough blade. Pulse until the mixture resembles coarse crumbs. (For sweet dough, add the sugar too.)\n2. Pour the dough mixture onto a sheet of plastic wrap. Use your hands to form it into a ball. Wrap tightly and refrigerate for 30 minutes.\n3. Remove the dough from the fridge. Sprinkle flour onto a clean surface and roll out the dough as thinly as possible with a floured rolling pin.\n4. Use a 5 or 6-inch round bowl or plate to cut discs from the dough, running a knife around the bowl. Re-form scraps into a ball and re-roll to cut more discs until all the dough is used.\n5. Store or use immediately. Fill with no more than 2 tablespoons of filling per disc to prevent bursting and make sealing easier.\n6. Seal by rolling or pursing the edges with your fingers, or pressing the edges with the tines of a fork. Brush with egg wash (beaten egg mixed with water) for best results.\n\n## Notes\nWithout a food processor: cut the cold cubed butter into the flour with a fork, pastry cutter, or your hands until it resembles coarse crumbs; stir in salt; add water and egg and mix until a dough forms; knead about 5 minutes, then proceed with rolling and cutting. Refrigerating the dough 15-30 minutes before use relaxes the gluten for flakier dough; you can also chill sealed empanadas 30 minutes before baking/frying to help them hold shape. Store leftover dough wrapped tightly in the fridge up to 1-2 days, or freeze as stacked discs (parchment between layers) for up to 3 months — thaw about 20 minutes before use. Works for both baked and fried empanadas; bake at 375°F until golden brown. Don't roll the dough too thin or it may burst; egg wash helps crispness. Can also be used for turnovers or hand pies.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "pjqjs2nidw6soqabdmb76sfn3y", "title": "Falafel (Traditional Chickpea)", "ainfo": "Falafel (Traditional Chickpea)", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "One day ahead: Pour the chickpeas into a large bowl and cover by about 3 inches of cold water. Add 1/2 tsp baking soda and stir. Cover and let soak overnight in a cool, dark place or the fridge, 12-24 hours until tender (change soaking water for fresh after 12 hours). They will double in size, yielding 4-5 cups.", "notes": "# Falafel (Traditional Chickpea)\n\nSource: https://toriavey.com/toris-kitchen/falafel/\n\nBy Tori Avey. Course: Main Course | Servings: 6 | Prep: 15 min | Cook: 40 min | Resting: 12 hrs | Total: 12 hrs 55 min\n\n## Ingredients\n- 1 pound dry chickpeas (garbanzo beans) — must be dry, not canned\n- 1/2 teaspoon baking soda\n- 1 small onion, roughly chopped\n- 1/4 cup chopped fresh parsley\n- 3-5 cloves garlic (roasted garlic preferred)\n- 1 1/2 tablespoon flour or chickpea flour\n- 1 3/4 teaspoon salt\n- 2 teaspoon cumin\n- 1 teaspoon ground coriander\n- 1/4 teaspoon black pepper\n- 1/4 teaspoon cayenne pepper\n- Pinch of ground cardamom\n- 1 teaspoon baking powder (optional, for fluffier falafel)\n- Vegetable oil for frying (avocado, grapeseed, sunflower, canola, or peanut oil)\n\n## Instructions\n1. One day ahead: Pour the chickpeas into a large bowl and cover by about 3 inches of cold water. Add 1/2 tsp baking soda and stir. Cover and let soak overnight in a cool, dark place or the fridge, 12-24 hours until tender (change soaking water for fresh after 12 hours). They will double in size, yielding 4-5 cups.\n2. Drain and rinse the chickpeas well. Add to a food processor with the chopped onion, garlic, parsley, flour, salt, cumin, coriander, black pepper, cayenne, and cardamom. (If your food processor is small, process in two batches.)\n3. Pulse until a rough, coarse meal forms, between the texture of couscous and a paste — don't over-process into hummus.\n4. Pour into a bowl and stir with a fork for even texture, removing any large chickpea chunks. Cover and refrigerate for 1-2 hours.\n5. Fill a skillet with oil to a depth of 1 1/2 inches. Heat slowly over medium heat to 360-375°F (use a deep fry or candy thermometer).\n6. Form the mixture into round balls or slider-shaped patties with wet hands or a falafel scoop, about 2 tbsp per falafel.\n7. Fry a test falafel first — at the right temperature it takes 2-3 minutes per side (5-6 minutes total) to brown. If it browns faster, cool the oil slightly.\n8. Fry the falafels in batches of 5-6 until golden brown on both sides. Remove with a slotted spoon and drain on paper towels.\n9. Serve fresh and hot with hummus and tahini sauce, or stuffed into a pita.\n\n## Variations\n- Sesame Falafel: dip balls in sesame seeds before frying.\n- Herb (Green) Falafel: add 1/2 cup additional chopped parsley or cilantro before blending.\n- Turmeric (Yellow) Falafel: add 3/4 tsp turmeric before blending.\n- Egyptian Fava Bean Falafel: substitute 1 lb dried fava beans (soak 24 hrs, then peel), add 1 leek, 1/4 cup chopped dill, 1/4 cup chopped cilantro, extra 3/4 tsp cayenne, and stir in 2 1/2 tbsp sesame seeds after processing.\n\n## Notes\nMakes about 30-34 falafel balls (about 5 per serving). If the balls won't hold together, process further, or add more flour, or 1-2 eggs. Best served fresh; leftovers keep in the fridge 2-3 days. Baking (400°F, 20-25 min, flipped halfway) works but tends to dry them out compared to frying.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "atyuzwuy5jgq53z2p46x7lwsce", "title": "Fire-Grilled Artichokes", "ainfo": "Fire-Grilled Artichokes", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "For the Calabrian pepper aioli: in a food processor, combine and puree the lemon juice, Dijon mustard, and peppers. Fold the mayonnaise into the puree and mix well. Reserve.", "notes": "# Fire-Grilled Artichokes\n\nSource: https://www.google.com/amp/s/www.foodnetwork.com/recipes/fire-grilled-artichokes-recipe-2111882.amp (retrieved via canonical URL)\n\nRecipe courtesy of Shaun Brobak and Brian Johnston, Crockett's Public House. Level: Easy. Total: 45 min | Prep: 20 min | Cook: 25 min. Yield: 2 artichokes.\n\n## Ingredients\nCalabrian Pepper Aioli:\n- 1/8 cup fresh squeezed lemon juice\n- 2 1/2 tablespoons Dijon mustard\n- 3/4 ounce long hot Calabrian peppers, stemmed and seeded\n- 1 3/4 cups mayonnaise\n\nArtichokes:\n- 2 artichokes\n- 1/2 cup fresh squeezed lemon juice\n- 1/4 cup plus 2 teaspoons salt\n- 4 tablespoons canola oil\n- 2 teaspoons fresh ground pepper\n\n## Instructions\n1. For the Calabrian pepper aioli: in a food processor, combine and puree the lemon juice, Dijon mustard, and peppers. Fold the mayonnaise into the puree and mix well. Reserve.\n2. For the artichokes: cut the artichokes in half lengthwise, splitting the stem. Remove the two bottom layers of leaves and, with a potato peeler, peel the stem until the outer fibers are removed. With a small spoon, dig out the inner fibers at the center of the artichoke.\n3. Submerge the artichokes in a bowl of cold water and add the lemon juice to prevent browning.\n4. Bring 1 gallon water to a boil and add 1/4 cup of the salt, stirring until dissolved. Add the artichoke halves to the boiling water and cook until a fork inserts easily into the stem, 10 to 15 minutes, depending on size. Remove from the boiling water and place in ice cold water to chill.\n5. Heat a char broiler or wood-fired grill. Brush the cut side of the artichokes with the oil, season with the remaining 2 teaspoons salt and the pepper. Place cut-side down on the grill and cook until heated through.\n6. Serve with the Calabrian pepper aioli.\n\n## Notes\nThis recipe was provided by a chef/restaurant and has not been tested for home use.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "pholg57qtpziwinkap7rky2z6u", "title": "Franklin Barbecue's BBQ Sauces", "ainfo": "Franklin Barbecue's BBQ Sauces", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix the ketchup, both vinegars, soy sauce, garlic and onion powders, and sugar together in a saucepan and bring to a simmer over medium heat, stirring occasionally.", "notes": "# Franklin Barbecue's BBQ Sauces (Espresso & Classic)\n\nSource: https://www.google.com/amp/s/www.eater.com/platform/amp/2015/7/2/8864653/franklin-barbecue-sauce-recipe-meat-burgers-ribs\n\nBy Aaron Franklin, via Eater (Devra Ferst). Two sauces from Franklin Barbecue in Austin, TX.\n\n## Aaron Franklin's Espresso Barbecue Sauce\nMakes about 2 cups\n\n### Ingredients\n- 1 1/2 cups ketchup\n- 1/2 cup white vinegar\n- 1/2 cup cider vinegar\n- 1/4 cup dark soy sauce\n- 1 tablespoon garlic powder\n- 1 tablespoon onion powder\n- 1/4 cup brown sugar\n- 3 tablespoons (1 1/2 ounces) freshly pulled espresso\n- Brisket drippings, for flavoring\n\n### Instructions\n1. Mix the ketchup, both vinegars, soy sauce, garlic and onion powders, and sugar together in a saucepan and bring to a simmer over medium heat, stirring occasionally.\n2. Remove from heat, stir in the espresso, then add brisket drippings to taste.\n3. Let cool, then transfer to a jar or bottle. Store in the refrigerator for up to 2 weeks.\n\n## Aaron Franklin's Classic Barbecue Sauce\nMakes about 3 cups\n\n### Ingredients\n- 1 3/4 cups ketchup\n- 1/2 cup plus 2 tablespoons water\n- 1/4 cup plus 1 tablespoon cider vinegar\n- 1/4 cup plus 1 tablespoon white vinegar\n- 1/4 cup plus 1 1/2 teaspoons brown sugar\n- 2 tablespoons plus 1 1/2 teaspoons Worcestershire sauce\n- 1 tablespoon chile powder\n- 1 tablespoon ground cumin\n- 1 1/2 teaspoons kosher salt\n- 1 1/2 teaspoons coarse black pepper\n\n### Instructions\n1. Combine all ingredients in a saucepan and warm gently over medium heat, stirring occasionally. No need to bring to a boil — just warm enough to melt and integrate the ingredients.\n2. Remove from heat and let cool. Transfer to a jar or bottle. Store in the refrigerator for up to 1 month.\n\n## Notes\nTry the espresso sauce on pork and beef; the classic sauce works with just about any meat. Serve alongside grilled meat, or baste on near the end of cooking (sugars can burn if added too early on the grill).", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "de5q6an4bdz5mpqni52bdrbviy", "title": "Fresh Herb Risotto", "ainfo": "Fresh Herb Risotto", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Put your stock or broth into a saucepan and bring it to a simmer on the stove, with a ladle nearby. Make sure it's well seasoned. Combine the herbs and one of the minced garlic cloves in a bowl and set aside.", "notes": "# Fresh Herb Risotto\n\nSource: https://cooking.nytimes.com/recipes/1012583-fresh-herb-risotto\n\nBy Martha Rose Shulman, NYT Cooking. Total Time: 45 minutes | Yield: 4 servings\n\n## Ingredients\n- 7 cups chicken stock or vegetable stock\n- 4 garlic cloves, minced\n- 2 cups finely chopped fresh herbs, such as parsley, tarragon, chives, chervil, dill, basil, and arugula (4 cups leaves)\n- 2 tablespoons extra virgin olive oil\n- 2/3 cup finely chopped onion or leek\n- Salt, preferably kosher salt, to taste\n- 1 1/2 cups arborio or carnaroli rice\n- 1/2 cup dry white wine, such as pinot grigio or sauvignon blanc\n- Freshly ground pepper\n- 1 teaspoon finely chopped lemon zest\n- 1 tablespoon freshly squeezed lemon juice\n- 1/2 cup freshly grated Parmesan\n\n## Instructions\n1. Put your stock or broth into a saucepan and bring it to a simmer on the stove, with a ladle nearby. Make sure it's well seasoned. Combine the herbs and one of the minced garlic cloves in a bowl and set aside.\n2. Heat the olive oil over medium heat in a wide, heavy skillet or saucepan. Add the onion or leek and 1/2 teaspoon salt, and cook gently until just tender, about 3 minutes. Do not brown.\n3. Stir in the rice and the remaining three cloves of garlic, and stir just until the grains of rice separate and begin to crackle. Add the wine and cook, stirring, until absorbed.\n4. Begin adding the simmering stock, a couple of ladlefuls (about 1/2 cup) at a time. The stock should just cover the rice and should be bubbling, not too slowly but not too quickly. When the rice is just tender all the way through but still chewy, usually 20 to 25 minutes, it's done. Taste and correct seasoning.\n5. Add another ladleful of stock to the rice. Stir in the herbs, pepper, lemon zest and juice, and Parmesan, and remove from the heat. The mixture should be creamy — if you put some on a plate and tilt it, the mound of rice should flatten out. Serve right away.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "zkjgj35ul4imctt3cjtiks6xuy", "title": "Fresh Mango Salsa", "ainfo": "Fresh Mango Salsa", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a serving bowl, combine the prepared mango, bell pepper, onion, cilantro and jalapeño. Drizzle with the juice of one lime.", "notes": "# Fresh Mango Salsa\n\nSource: https://cookieandkate.com/2015/fresh-mango-salsa-recipe/\n\nBy Kathryne Taylor, Cookie and Kate. Prep: 15 mins | Total: 15 minutes | Yield: 3 cups | Vegan\n\n## Ingredients\n- 3 ripe mangos, diced\n- 1 medium red bell pepper, chopped\n- 1/2 cup chopped red onion\n- 1/4 cup packed fresh cilantro leaves, chopped\n- 1 jalapeño, seeded and minced\n- 1 large lime, juiced (about 1/4 cup lime juice)\n- 1/8 to 1/4 teaspoon salt, to taste\n\n## Instructions\n1. In a serving bowl, combine the prepared mango, bell pepper, onion, cilantro and jalapeño. Drizzle with the juice of one lime.\n2. Using a large spoon, stir the ingredients together. Season to taste with salt, and stir again. For the best flavor, let the salsa rest for 10 minutes or longer.\n\n## Notes\nStore in the refrigerator, covered, for several days — best enjoyed fresh. Great with chips, on tacos, on fish tacos, over salad, or eaten straight as a salad.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "a5i2p3xos6ekxnz4ugfsrbvfai", "title": "Fresh Mint, Fennel & Apple Coleslaw", "ainfo": "Fresh Mint, Fennel & Apple Coleslaw", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Use a mandoline to finely slice the fennel bulb and place into a bowl. Pick a few of the fennel fronds, and chop until you have roughly 1 tablespoon. Add fronds to the bowl.", "notes": "# Fresh Mint, Fennel & Apple Coleslaw\n\nSource: https://jesspryles.com/fresh-fennel-apple-mint-coleslaw/\n\nBy Jess Pryles.\n\n## Ingredients\n- 1 fennel bulb, plus fronds\n- 1/2 a firm red apple (Envy recommended)\n- 2 Tablespoons mint, chopped\n- 2 Tablespoons wholegrain mustard\n- 1/2 Tablespoon maple syrup\n- 1.5 Tablespoons olive oil\n- 2 Tablespoons cider vinegar\n- salt, to taste\n\n## Instructions\n1. Use a mandoline to finely slice the fennel bulb and place into a bowl. Pick a few of the fennel fronds, and chop until you have roughly 1 tablespoon. Add fronds to the bowl.\n2. Repeat the slicing process with the apple, and add to the bowl, along with the chopped mint.\n3. In a small jar, combine mustard, maple syrup, oil, and vinegar. Place lid on the jar and shake vigorously to combine. Pour over the fennel mixture and toss to coat evenly.\n4. Add salt to taste, toss again, then serve immediately.\n\n## Notes\nA mayo-free coleslaw alternative — apple and fennel both complement the sweetness of pork-based proteins. Especially good paired with smoked pork ribs. Best served immediately for maximum crunch.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2gw5wg2qaxpgincnjoi6jx5qpi", "title": "Fried Eggs in an Air Fryer", "ainfo": "Fried Eggs in an Air Fryer", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add a small aluminum pan to the basket of the air fryer.", "notes": "# Fried Eggs in an Air Fryer\n\nSource: https://www.kudoskitchenbyrenee.com/fried-eggs-air-fryer/\n\nBy Renee Goerger, Kudos Kitchen by Renee. Prep: 1 min | Cook: 8 min | Total: 9 min. Servings: 1. Course: Air Fryer Breakfast, Breakfast, Savory Breakfast. Cuisine: American.\n\n## Ingredients\n- 2 large eggs\n- 2 tablespoons butter\n- Salt and pepper, to taste\n\nEquipment: air fryer, lightweight (disposable) aluminum pan, slotted spatula.\n\n## Instructions\n1. Add a small aluminum pan to the basket of the air fryer.\n2. Add the butter and heat at 350°F to melt, about 1 minute.\n3. Crack both eggs into the aluminum pan.\n4. Return to the air fryer and cook at 325°F until desired doneness. For over-hard eggs, this takes about 8 minutes, though times vary by air fryer.\n\n## Notes\n1 serving = 2 fried eggs. Remove the eggs sooner for softer yolks — this recipe is written for over-hard. For over-easy eggs, keep the temperature low (350°F) and check frequently until desired doneness. Oil can be used instead of butter — good choices include olive oil, avocado oil, peanut oil, safflower oil, vegetable oil, canola oil, or bacon grease. A lightweight disposable aluminum pan works well since it can be bent to fit the air fryer basket and reused or discarded. Nutrition (per serving): 363 kcal, 1g carbs, 14g protein, 33g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "4pel6xae35vp2e5iuqe34rhdfu", "title": "Garlic Roasted Brussels Sprouts", "ainfo": "Garlic Roasted Brussels Sprouts", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 400°F.", "notes": "# Garlic Roasted Brussels Sprouts\n\nSource: http://paleogrubs.com/garlic-roasted-brussels-sprouts\n\nPrep: 5 minutes | Cook: 20 minutes | Total: 25 minutes\n\n## Ingredients\n- 1 pound Brussels sprouts\n- 2 garlic cloves, minced\n- 1/2 tsp cayenne pepper (optional)\n- 4 tbsp melted coconut oil\n- 2 tsp lemon juice\n- Salt to taste\n\n## Instructions\n1. Preheat oven to 400°F.\n2. Bring a large pot of lightly salted water to a boil, add the Brussels sprouts and cook for two minutes.\n3. Add the minced garlic, cayenne pepper and melted coconut oil and gently toss to coat. Transfer the Brussels sprouts to a baking pan and sprinkle with salt. Bake for 15-20 minutes, shaking pan occasionally, until sprouts are quite brown and crisp on the outside and tender on the inside.\n4. Adjust the taste with more salt if necessary, drizzle with lemon juice, toss to combine and serve.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "dfhg7yf2no6mwrq26gt5hk6jey", "title": "Ginger Carrot Soup", "ainfo": "Ginger Carrot Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a 6-quart pan over medium-high heat, add butter and onions and cook, stirring often, until onions are limp. Add broth, carrots, and ginger. Cover and bring to a boil. Reduce heat and simmer until carrots are tender when pierced.", "notes": "# Ginger Carrot Soup\n\nSource: http://www.foodnetwork.com/recipes/ginger-carrot-soup-recipe.html\n\nRecipe courtesy of Maxine Bonneau. Level: Easy. Total: 1 hr 35 min | Prep: 30 min | Inactive: 20 min | Cook: 45 min. Yield: 8 servings.\n\n## Ingredients\n- 2 tablespoons sweet cream butter\n- 2 onions, peeled and chopped\n- 6 cups chicken broth\n- 2 pounds carrots, peeled and sliced\n- 2 tablespoons grated fresh ginger\n- 1 cup whipping cream\n- Salt and white pepper\n- Sour cream\n- Parsley sprigs, for garnish\n\n## Instructions\n1. In a 6-quart pan over medium-high heat, add butter and onions and cook, stirring often, until onions are limp. Add broth, carrots, and ginger. Cover and bring to a boil. Reduce heat and simmer until carrots are tender when pierced.\n2. Remove from heat and transfer to a blender, filling no more than halfway (work in batches if needed). Cover the blender and hold a kitchen towel over the top; be careful, hot liquid can spurt out. Pulse to start, then puree until smooth.\n3. Return to the pan and add cream; stir over high heat until hot. For a smoother flavor, bring the soup to a boil, then add salt and pepper to taste.\n4. Ladle into bowls and garnish with a dollop of sour cream and parsley sprigs.\n\n## Notes\nWhen blending hot liquid: let it cool about 5 minutes first, fill the blender only halfway, put the lid on with one corner open, and cover with a kitchen towel to catch splatters while pulsing until smooth. This recipe was provided by a show guest and has not been tested for home use.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "mhj7kcrkdkm37kznkbeay5hhcy", "title": "Giordano's Famous Stuffed Deep Dish Pizza", "ainfo": "Giordano's Famous Stuffed Deep Dish Pizza", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Make the dough 1-2 days ahead. Dissolve the yeast and sugar in the water in a small bowl. Combine the flour and salt in a large bowl, add the oil, margarine, and yeast solution, and mix until the dough forms a ball — don't overknead. Place in a covered container and refrigerate 1 to 2 days.", "notes": "# Giordano's Famous Stuffed Deep Dish Pizza (Copycat)\n\nSource: https://topsecretrecipes.com/foodhackerblog/giordanos-famous-stuffed-deep-dish-pizza/\n\nBy Todd Wilbur, Top Secret Recipes / The Food Hacker. Prep: 25 min | Cook: 1 day 50 min | Total: 1 day 1 hr 15 min.\n\n## Ingredients\nCrust:\n- 3/4 cup water (room temperature)\n- 1/2 teaspoon active dry yeast\n- 1 tablespoon granulated sugar\n- 16 oz (3 cups) all-purpose flour\n- 3/4 teaspoon salt\n- 1/3 cup vegetable oil\n- 6 tablespoons margarine, softened\n\nSauce:\n- 28 oz can whole peeled tomatoes\n- 1/2 cup canned petite diced tomatoes\n- 2 tablespoons vegetable oil\n- 1 teaspoon garlic powder\n- 1 teaspoon dry basil\n- 3/4 teaspoon salt\n- 1/4 teaspoon ground black pepper\n- 1 tablespoon fresh basil\n\nPizza:\n- 24 oz (about 6 cups) freshly shredded mozzarella cheese, room temperature (not pre-shredded)\n- 1 tablespoon margarine, softened, for greasing the pan\n- 1 tablespoon grated Romano cheese\n- 1 tablespoon grated Parmesan cheese\n\nOptional toppings: cooked Italian sausage, pepperoni, onions, mushrooms, green peppers.\n\nEquipment: a pizza stone, a 10-inch deep dish pizza pan.\n\n## Instructions\n1. Make the dough 1-2 days ahead. Dissolve the yeast and sugar in the water in a small bowl. Combine the flour and salt in a large bowl, add the oil, margarine, and yeast solution, and mix until the dough forms a ball — don't overknead. Place in a covered container and refrigerate 1 to 2 days.\n2. Make the sauce: simmer the canned tomatoes in a saucepan over medium heat for 5 minutes, then mash with a potato masher (leave it a little chunky). Add the remaining sauce ingredients except the fresh basil and cook 10 more minutes, stirring occasionally. Add the fresh basil and cook 5 minutes more. Cover and cool; refrigerate until pizza time.\n3. A couple hours before baking, remove the dough from the fridge to come to room temperature. Place a pizza stone in the oven and preheat to 425°F.\n4. Slice off one-third of the dough and set aside. Roll the larger portion into a 16-inch circle. Press it into a 10-inch deep dish pizza pan (2-inch high edge) that's been greased with 1 tablespoon softened margarine.\n5. Arrange a single layer of any chosen toppings onto the dough, then fill with the cheese, smoothing it evenly with your hands.\n6. Roll the smaller dough portion into a 12-inch circle (thinner than the bottom crust) and place over the cheese. Press it down onto the cheese at the edges, pinch the two doughs together, and trim flush with the top of the pan. Cut a few vent holes in the center.\n7. Spread about 1 1/4 cups of the sauce over the top dough, all the way to the edge. (Optional: place one piece of each topping in the center of the sauce as a marker.)\n8. Bake on the pizza stone for 35 to 40 minutes, until browning on top, spinning the pizza halfway through for even browning.\n9. Combine the Romano and Parmesan and sprinkle over the pizza when it comes out of the oven.\n10. Loosen the edge with a flexible spatula, then slide it under the pizza to lift it out of the pan onto a cutting board. Slice through the middle 3 times for 6 slices.\n\n## Notes\nThe dough is deliberately flakier than standard pizza dough, closer to pie crust, thanks to the fat content. Refrigerating it for 24-48 hours slows fermentation for a more tender, less yeasty crust — don't skip the cold rise. Use quality canned tomatoes (San Marzano-style recommended) for the sauce. Use freshly shredded block mozzarella rather than pre-shredded, which is coated in cornstarch and doesn't melt as smoothly; let it come to room temperature before assembling. Unlike a regular pizza, toppings go under the cheese, and the sauce goes on top of the second dough layer, not underneath. The recipe makes enough sauce for roughly two pizzas.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "46rnikbd6bhusx6j3qlnufigfe", "title": "Gordon Ramsay Scrambled Eggs", "ainfo": "Gordon Ramsay Scrambled Eggs", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Crack the eggs into a deep saucepan. Add the knob of butter. Turn the heat onto medium high.", "notes": "# Gordon Ramsay Scrambled Eggs\n\nSource: https://everylittlecrumb.com/gordon-ramsay-scrambled-eggs/\n\nBy Farah Abumaizar, Every Little Crumb (recipe adapted from Gordon Ramsay). Course: Breakfast. Cuisine: American. Prep: 5 min | Cook: 3 min. Servings: 4.\n\n## Ingredients\n- 6 eggs, cold\n- 1 big tablespoon butter (15-20 g)\n- 1 tablespoon yogurt\n- Salt and pepper to taste\n- Herbs for garnish, if desired\n\n## Instructions\n1. Crack the eggs into a deep saucepan. Add the knob of butter. Turn the heat onto medium high.\n2. Using a rubber spatula, stir constantly, by folding the eggs and constantly scraping the bottom. Don't whisk.\n3. After 30 seconds on the heat, remove the pan from the heat and continue stirring for 10 seconds. Place back on the heat for another 30 seconds, then remove from heat and stir for another 10 seconds or so. Keep repeating for about 3 minutes, or until eggs are soft and wet but cooked through.\n4. Remove from the heat and stir in the yogurt, then season with salt and pepper. Garnish with chopped chives, fresh thyme, or green onion if desired and serve immediately.\n\n## Notes\nThe key technique is taking the pan on and off the heat and folding (not whisking) with a rubber spatula, which gives the eggs their soft, custardy texture. Don't salt the eggs until after cooking — salting raw eggs can toughen them. Gordon's original recipe uses creme fraiche instead of yogurt. Leftovers keep tightly covered in the fridge for 4 days; reheat in the microwave in 15-second intervals.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "a2mujnqkx55fqoflmke56uyuba", "title": "Grandma's Sweet Pickles", "ainfo": "Grandma's Sweet Pickles", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "", "notes": "Source:  Jason Moser's Grandma Moser\n\nIngredients\n\n4lb sugar \n7 medium to large cinnamon sticks \ngallon jug of pickles sliced \n2 tablespoons of mustard seed \nheaping teaspoon of celery seed \nsmall jar of minced garlic\n\nDrain juice and add ingredients, shake to combine.  Shake occasionally over the next day or two and should be good to go after that.  Store in fridge.   \n\n\n\nFor 1 Quart Jar of Pickles\n\nBuy the sliced if available, if not they will need to be sliced dill pickles\n\n1lb of Sugar\n\n3 Cinnamon Sticks, medium to long length\n\n1 tbs of Mustard Seeds or more if you like\n\n1/4 tps heaping of Celery Seed\n\n1/4 small jar of minced garlic 8oz, drain juice and add, more or less depending on taste\n\n\n\nDrain pickle juice out of 1 quart jar, add all ingredients and stir.  Give at least one day but shake or stir it a few times.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7hm6qxemnjtlpged6mn7gwb5qu", "title": "Greek Lamb Tacos with Cucumber Pico de Gallo", "ainfo": "Greek Lamb Tacos with Cucumber Pico de Gallo", "category": "tacos", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large bowl, stir together the cucumber, tomato, red onion, and half a chopped jalapeno.", "notes": "# Greek Lamb Tacos with Cucumber Pico de Gallo\n\nSource: https://burrataandbubbles.com/greek-lamb-tacos-with-cucumber-pico-de-gallo/\n\nBy Amanda McGrory-Dixon, Burrata and Bubbles. Course: Main Dishes. Cuisine: Mexican-Greek Fusion. Prep: 20 min | Cook: 10 min | Total: 30 min. Servings: 8 tacos.\n\n## Ingredients\nCucumber Pico de Gallo:\n- 1 cup chopped cucumber\n- 1/2 cup chopped Roma tomato\n- 1/2 cup chopped red onion\n- 1/2-1 chopped jalapeno, seeded\n- 1 lime, juiced\n- 1 tablespoon chopped fresh mint\n- 2 tablespoons chopped fresh parsley\n- 1/2 teaspoon salt\n\nGreek Lamb Tacos:\n- Flour or corn tortillas\n- 1 tablespoon olive oil\n- 3 garlic cloves, grated or minced\n- 1 pound ground lamb\n- 1 teaspoon dried oregano\n- 1 teaspoon salt\n- 1/2 teaspoon ground cumin\n- 1/2 teaspoon pepper\n- Feta cheese, for topping\n- Greek yogurt, for topping\n- Any additional desired toppings\n\n## Instructions\nCucumber Pico de Gallo:\n1. In a large bowl, stir together the cucumber, tomato, red onion, and half a chopped jalapeno.\n2. Stir in lime juice, mint, parsley, and salt. Taste; if you'd like more spice, add the other half of the jalapeno.\n3. Refrigerate in an airtight container for a few hours to allow the flavors to meld. Best the day of making, but stays crisp for two or three days.\n\nGreek Lamb Tacos:\n4. Wrap the tortillas in foil with a piece of parchment paper between each tortilla to prevent sticking, and heat in a 350°F oven for 8 to 10 minutes. Remove from oven and don't open the foil until ready to serve.\n5. As the tortillas warm, heat a large skillet over medium heat with the olive oil. When hot, add the garlic. Stir constantly and cook for 30 seconds.\n6. Add the lamb to the skillet and sprinkle with oregano, salt, cumin, and pepper. Use a wooden spoon to break up the meat. Cook until brown.\n7. Drain the lamb on a paper towel-lined plate. Serve with warm tortillas, cucumber pico de gallo, feta, Greek yogurt, and any additional toppings.\n\n## Notes\nBoth flour and corn tortillas work well. Additional topping ideas: shredded lettuce, pickled radishes, kalamata olives.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "4lxo4j4mdonug5g5ret7bjrqg4", "title": "Ground Beef Taco Seasoning", "ainfo": "Ground Beef Taco Seasoning", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a small bowl, mix together all of the ingredients and store in an airtight container until ready to use.", "notes": "# Ground Beef Taco Seasoning\n\nSource: https://whiskitrealgud.com/homemade-taco-seasoning/\n\nBy April Boller Wright, Whisk It Real Gud. Prep: 5 min | Total: 5 min. Servings: 5 (for about 1 lb ground beef). Course: Dinner, Lunch. Cuisine: American, Mexican.\n\n## Ingredients\n- 2 tablespoons chili powder, plus an additional 1 teaspoon\n- 3/4 teaspoon garlic powder\n- 3/4 teaspoon onion powder\n- 3/4 teaspoon paprika\n- 1/4 teaspoon sugar\n- 3/4 teaspoon cumin\n- 3/4 teaspoon oregano\n- 1/4 teaspoon pepper (optional)\n- 1/4 teaspoon salt\n- 1/4 teaspoon cornstarch\n\n## Instructions\n1. In a small bowl, mix together all of the ingredients and store in an airtight container until ready to use.\n\n## Notes\nMakes about 3 1/2 tablespoons, meant to season about 1 lb of ground beef. Store-bought packets typically equal 2 tablespoons of seasoning, but the author found that using the full batch gave better flavor. Crushed red pepper can be added if you like a bit more heat (an earlier version of the recipe included it). Salt can be omitted for more control over saltiness. Works for both beef and chicken tacos.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wicoqiu3fvirf4b5hpluv2yyqu", "title": "Ground Elk Stroganoff", "ainfo": "Ground Elk Stroganoff", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Boil the egg noodles according to package directions and set aside.", "notes": "# Ground Elk Stroganoff\n\nSource: https://primalpioneer.com/ground-elk-stroganoff/\n\nBy Mike Shreckengost, Primal Pioneer. Yield: 8 | Prep: 5 min | Cook: 15 min | Total: 20 min | Cuisine: American\n\n## Ingredients\n- 1 pound ground elk meat\n- 1 Tbsp. olive oil\n- 1/2 yellow or white onion, chopped\n- 1 tsp. minced garlic\n- 1 cup fresh sliced mushrooms\n- 2 Tbsp. flour\n- 1 cup beef broth\n- 1 cup heavy cream\n- 1 Tbsp. Worcestershire\n- 1/4 tsp. black pepper\n- 1/2 tsp. salt\n- 1/3 cup sour cream\n- 8 oz. egg noodles\n- Fresh parsley, optional\n\n## Instructions\n1. Boil the egg noodles according to package directions and set aside.\n2. Add the olive oil to a large skillet and heat over medium-high heat. Add the ground elk and cook until done.\n3. Add the finely chopped onion, minced garlic, and fresh mushrooms, and cook until softened.\n4. Add the flour to the skillet and stir to combine.\n5. Slowly add the broth, stirring as you add. Stir in the heavy cream. Add the Worcestershire and stir. Season with salt and pepper.\n6. Reduce heat to low and simmer for 5 minutes.\n7. Remove from heat. Add the sour cream and cooked egg noodles, stirring to combine. Garnish with fresh parsley, if desired, and serve immediately.\n\n## Notes\nCan be served over mashed potatoes instead of egg noodles. Ground venison or ground beef can be swapped in 1:1 for the elk.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "xhmy62fnk5kl7zfe7u3owdhc5q", "title": "Gumbo Greens", "ainfo": "Gumbo Greens", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Boil the smoked turkey in about 8 cups of water for about 45 minutes. Once done, reserve 4-6 cups of the cooking liquid.", "notes": "# Gumbo Greens\n\nSource: https://iheartrecipes.com/gumbo-greens-recipe/\n\nBy Rosie, I Heart Recipes. Prep: 45 min | Cook: 3 hrs 10 min | Total: 3 hrs 55 min. Servings: 10. Course: Main Dish. Cuisine: Southern/Soul Food.\n\n## Ingredients\n- 3 pounds frozen collard greens\n- 1 cup vegetable oil\n- 1 cup all-purpose flour\n- 1 large onion, chopped\n- 1 bell pepper, chopped\n- 3 celery stalks, chopped\n- 1 tablespoon minced garlic\n- 1 pound smoked turkey tails (wings or legs also work)\n- 48 ounces chicken broth\n- 1 pound smoked hot Louisiana sausage, sliced (andouille also works)\n- 2 tablespoons Rosamae Seasoning salt\n- 2 teaspoons Creole seasoning\n- 1 teaspoon crushed red pepper\n- 1 pound large shrimp, peeled and deveined\n- 2-3 teaspoons gumbo file powder\n\n## Instructions\n1. Boil the smoked turkey in about 8 cups of water for about 45 minutes. Once done, reserve 4-6 cups of the cooking liquid.\n2. In a large pot, heat 1 cup of vegetable oil over medium heat. Gradually whisk in the flour, stirring continuously until the roux turns a rich brown color, about 15-20 minutes.\n3. Add the onion, bell pepper, and celery to the roux. Cook until softened, about 5 minutes. Add the garlic and cook about 1 minute more, until fragrant.\n4. Stir in the smoked turkey tails, then pour in the reserved turkey cooking liquid and the chicken broth; bring to a simmer. Stir in the Rosamae Seasoning salt, Creole seasoning, and crushed red pepper.\n5. Reduce heat to low and simmer the gumbo base for about 1 hour. Add the sliced sausage partway through as it simmers.\n6. Add the frozen collard greens and cook until tender, about 45 minutes to 1 hour. In the last 10 minutes of cooking, add the shrimp.\n7. Stir in the gumbo file powder to thicken.\n8. Serve hot once everything is heated through and flavors have melded.\n\n## Notes\nThe roux is the foundation — take it slow, aim for a color like a penny, and stir constantly to avoid burning (a burnt roux can't be saved). Dice the onion, bell pepper, and celery (\"holy trinity\") evenly so they cook at the same rate. Keep the simmer low and slow once the smoked meats and broth are in. Season conservatively and taste as you go. Fresh collards can substitute for frozen; wash well to remove grit. Add shrimp only at the very end so they don't overcook. Add the file powder after the heat is off — boiling it can make the gumbo stringy. Letting it rest a bit before serving improves the flavor. Good with white rice, cornbread, or potato salad. To reheat: thaw in the fridge overnight if frozen, then warm gently on the stovetop over medium-low heat (adding broth or water if too thick) or in the microwave in 2-minute bursts; avoid boiling during reheating, which can toughen the shrimp and make the greens mushy.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "ee27z557s46knqv6mq23l6e34e", "title": "Hearty Butternut Squash Soup", "ainfo": "Hearty Butternut Squash Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large stockpot or Dutch oven over medium-high heat, add the olive oil. Next, add the apples, squash, garlic and onions and saute until the vegetables begin to sweat and soften, about 5 minutes. Add the sage, ground nutmeg and salt and pepper to taste and continue to cook another 2 minutes. Add the stock, making sure that it covers the squash; if necessary, add a little water. Bring the soup to a boil and then reduce the heat to medium low. Simmer until the squash is very tender, about 30 minutes.", "notes": "# Hearty Butternut Squash Soup\n\nSource: http://www.foodnetwork.com/recipes/nancy-fuller/hearty-butternut-squash-soup.html\n\nRecipe courtesy of Nancy Fuller. Level: Easy | Total: 50 min | Active: 20 min | Yield: 8 servings\n\n## Ingredients\n- 3 tablespoons olive oil\n- 3 apples, peeled, cored and roughly chopped\n- Two 3-pound butternut squash, peeled, seeded and roughly chopped\n- 1 clove garlic, chopped\n- 1 large yellow onion, chopped\n- 2 tablespoons chopped fresh sage\n- 1/2 teaspoon ground nutmeg\n- Salt and freshly ground black pepper\n- 8 cups chicken stock\n- 1 cup heavy cream\n- 1/2 cup freshly grated Parmesan\n- 2 tablespoons butter\n\n## Instructions\n1. In a large stockpot or Dutch oven over medium-high heat, add the olive oil. Next, add the apples, squash, garlic and onions and saute until the vegetables begin to sweat and soften, about 5 minutes. Add the sage, ground nutmeg and salt and pepper to taste and continue to cook another 2 minutes. Add the stock, making sure that it covers the squash; if necessary, add a little water. Bring the soup to a boil and then reduce the heat to medium low. Simmer until the squash is very tender, about 30 minutes.\n2. Using an immersion blender, blend the soup until smooth. Stir in the heavy cream, Parmesan and butter. Serve immediately.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vajlu3cmbdtsuk2piloymi74e4", "title": "Heidi's Deli Egg Salad Sandwich", "ainfo": "Heidi's Deli Egg Salad Sandwich", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine the diced hard-boiled eggs with salt, pepper, chives, spicy mustard, and mayo.", "notes": "# Heidi's Deli Egg Salad Sandwich\n\nSource: Google Keep note\n\n## Ingredients\n- 1 dozen eggs, hard boiled and diced small\n- 1 teaspoon salt\n- 1/2 teaspoon black pepper\n- 1 tablespoon chives\n- 2 tablespoons spicy mustard\n- 3/4 cup mayo (needs to be a good mayo, like Hellman's)\n\n## Instructions\n1. Combine the diced hard-boiled eggs with salt, pepper, chives, spicy mustard, and mayo.\n2. Mix well. Adjust if it's too dry, or not salty or peppery enough.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "fndzvkbzpsrbk6s55kig5zjyny", "title": "Homemade Beef Burgers", "ainfo": "Homemade Beef Burgers", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large bowl, whisk together the egg, Worcestershire sauce, paprika, onion powder, garlic powder, salt, and pepper. Add the ground beef and breadcrumbs and mix with your hands until combined.", "notes": "# Homemade Beef Burgers\n\nSource: https://feelgoodfoodie.net/recipe/homemade-hamburgers/\n\nBy Yumna Jawad, Feel Good Foodie. Prep: 5 min | Cook: 10 min | Chilling: 20 min | Total: 35 min. Servings: 4.\n\n## Ingredients\n- 1 large egg\n- 2 tablespoons Worcestershire sauce\n- 1 teaspoon paprika\n- 1/2 teaspoon onion powder\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon salt\n- 1/2 teaspoon black pepper\n- 1 pound ground beef, 85% lean\n- 1/4 cup fine breadcrumbs\n- Fries, for serving\n\n## Instructions\n1. In a large bowl, whisk together the egg, Worcestershire sauce, paprika, onion powder, garlic powder, salt, and pepper. Add the ground beef and breadcrumbs and mix with your hands until combined.\n2. Gently shape into 4 patties, about 3/4-inch thick. Press a thumb indent into the center of each patty.\n3. Refrigerate the patties 20-30 minutes to help them hold their shape.\n4. Preheat the grill or grill pan to medium heat and oil the grates or pan. Cook the burgers 4-5 minutes per side until desired doneness.\n5. Let rest a few minutes, then serve with favorite condiments.\n\n## Notes\nThe center thumb indent prevents the patties from puffing up and shrinking unevenly as they cook. Mix with your hands (gloves optional) for easier combining, but don't overmix or the burgers will turn tough. Don't press down on the burgers with a spatula while grilling — it squeezes out the juices. All-purpose flour can substitute for breadcrumbs; for gluten-free, use quick oats, almond flour, or panko. Ground turkey or chicken can substitute for beef (add a tablespoon of olive oil to compensate for the lower fat). Can be stuffed with a cube of cheese in the center before cooking. Store cooked burgers in an airtight container in the fridge up to 3 days; reheat in a skillet with a little oil or in the microwave. Freeze uncooked patties on a baking sheet, then transfer to a ziplock bag; thaw overnight in the fridge before cooking. Nutrition (per burger, no bun/toppings): 255 kcal, 7g carbs, 25g protein, 13g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "lz5b7nrbkyjary472kox7rbzwm", "title": "Homemade Blueberry Sauce", "ainfo": "Homemade Blueberry Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a medium saucepan over medium heat, combine blueberries, 1/2 cup water, sugar, and lemon juice. Stir frequently and bring to a low boil.", "notes": "# Homemade Blueberry Sauce\n\nSource: https://www.mybakingaddiction.com/homemade-blueberry-sauce-recipe/\n\nBy Jamie, My Baking Addiction. Prep: 5 min | Cook: 10 min | Total: 15 min | Servings: 8\n\n## Ingredients\n- 2 cups fresh or frozen blueberries\n- 1/2 cup water\n- 1/2 cup granulated sugar\n- 2 tablespoons fresh lemon juice\n- 2 tablespoons cornstarch mixed with 2 tablespoons cold water\n- 1/2 teaspoon pure vanilla extract\n- Zest of 1 lemon, about 1 tablespoon (optional)\n\n## Instructions\n1. In a medium saucepan over medium heat, combine blueberries, 1/2 cup water, sugar, and lemon juice. Stir frequently and bring to a low boil.\n2. In a small bowl, whisk the cornstarch with 2 tablespoons cold water.\n3. Slowly stir the cornstarch slurry into the blueberries, taking care not to crush the berries. Simmer until thick enough to coat the back of a metal spoon, about 5 minutes.\n4. Remove from heat and gently stir in vanilla and lemon zest.\n\n## Notes\nAdjust sugar to taste depending on berry sweetness. If too thick, thin with a bit of water. No lemons? Substitute orange juice and zest.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2rkn5a6vbzwys22mhftvr44iwi", "title": "Homemade Cheese Sauce (Shake Shack Copycat)", "ainfo": "Homemade Cheese Sauce (Shake Shack Copycat)", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Slice the jalapenos and onions (6 slices jalapeno is about half a small one; 3/4 cup onion is about 1 very small onion or half a medium onion).", "notes": "# Homemade Cheese Sauce (Shake Shack Copycat)\n\nSource: https://thefoodcharlatan.com/cheese-sauce/\n\nBy The Food Charlatan. Source recipe: Shake Shack. Prep: 10 min | Cook: 10 min | Steep: 30 min | Total: 50 min. Servings: 12.\n\n## Ingredients\n- 1 tablespoon oil\n- 6 slices jalapeno, seeds included\n- 3/4 cup sliced onion\n- 2 tablespoons whole peppercorn\n- 1 1/2 teaspoons kosher salt\n- 1 tablespoon white wine vinegar\n- 2 tablespoons white wine\n- 2 cups heavy cream\n- 2 cups American cheese, 8 ounces, cubed\n- 2 cups sharp cheddar cheese, 8 ounces, shredded\n\n## Instructions\n1. Slice the jalapenos and onions (6 slices jalapeno is about half a small one; 3/4 cup onion is about 1 very small onion or half a medium onion).\n2. Set a medium frying pan over medium-high heat. When hot, add the oil — it should shimmer right away. Add the sliced jalapeno, sliced onion, and peppercorns.\n3. Sprinkle with the salt and saute 3-5 minutes.\n4. Add the white wine vinegar and white wine. Continue sauteing until the liquid has mostly evaporated and absorbed into the onions and jalapenos.\n5. Add the cream and stir together. After about 30 seconds, when the cream is warm but not bubbling, remove from heat.\n6. Set aside and let steep for 30 minutes.\n7. While waiting, chop the American cheese and shred the cheddar cheese; set aside.\n8. After 30 minutes, strain the jalapenos, onions, and peppercorns out through a sieve. Return the smooth cream to the pan (no need to clean it, just scrape out the solids).\n9. Set the pan of cream back over medium heat, stirring occasionally. When it starts to get frothy on the edges and form small bubbles, add the American cheese and cheddar cheese in increments, whisking as you go. Turn the heat down to low.\n10. Continue whisking until completely smooth. Serve immediately while hot.\n\n## Notes\nNot spicy as written — the jalapeno and peppercorns are for flavor, not heat; add a whole jalapeno for more kick. Half American cheese, half sharp cheddar is the key combo: American melts smooth and never turns grainy, cheddar brings flavor; substitutes for cheddar could include mozzarella, pepper jack, fontina, or Oaxaca. If it thickens as it cools, reheat gently and thin with milk a tablespoon at a time. Store covered in the fridge (it solidifies when chilled); reheat over low heat, whisking frequently, adding milk to loosen. Great on fries, roasted potatoes, broccoli, nachos, burgers, hot dogs, scrambled eggs, baked potatoes, mac and cheese, or chili.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cogqgpupos23rj6aqcccdssemq", "title": "Homemade Cranberry Sauce", "ainfo": "Homemade Cranberry Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Wash bag of cranberries under cool water, then dump them into a medium saucepan.", "notes": "# Homemade Cranberry Sauce\n\nSource: http://thepioneerwoman.com/cooking/homemade-cranberry-sauce/\n\nBy Ree Drummond. Yields: 4 servings | Prep: 5 mins | Cook: 15 mins | Total: 20 mins\n\n## Ingredients\n- 12 oz. cranberries\n- 1 cup orange or cranberry juice\n- 1 cup pure maple syrup (not pancake syrup!)\n- 2 Tbsp. grated orange zest\n\n## Instructions\n1. Wash bag of cranberries under cool water, then dump them into a medium saucepan.\n2. Add juice, maple syrup, and orange zest. Stir together and turn heat on high until it reaches a boil.\n3. Once it comes to a rolling boil, turn the heat down to medium low and continue cooking over lower heat for about 10 minutes, or until the juice is thick. Turn off the heat.\n4. Transfer to a container and store in the refrigerator until ready to serve.\n\n## Notes\nUse real pure maple syrup, not pancake syrup. Keeps in the fridge up to a week, or freeze up to 2 months. Best served chilled — the sauce firms up more as it cools.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "r2v2eq4rp6z4bub4o2cytpr2iq", "title": "Homemade Green Chile Queso Cheese Dip", "ainfo": "Homemade Green Chile Queso Cheese Dip", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "To roast the peppers, preheat the oven to 400°F. Rub the peppers with a bit of olive oil and place them on a baking sheet. Roast until the outside skins begin to blister and char, about 30 minutes. Remove the peppers and place them in a resealable plastic bag for 20 minutes to steam. (To shorten this process, grill or roast the peppers over a gas stovetop until charred, then steam in the bag.)", "notes": "# Homemade Green Chile Queso Cheese Dip\n\nSource: http://www.howsweeteats.com/2015/09/roasted-green-chile-queso-cheese-dip/\n\nBy Jessica, How Sweet It Is. Yield: 4 to 6 | Total: 45 minutes\n\n## Ingredients\n- 4 green chiles (Anaheims work well)\n- 2 jalapeno peppers\n- 1 tablespoon olive oil\n- 1 tablespoon unsalted butter\n- 1/2 sweet onion, diced\n- 2 garlic cloves, minced\n- 1/8 teaspoon salt\n- 1/8 teaspoon pepper\n- 1 1/2 cups half and half\n- 1 tablespoon cornstarch\n- 16 ounces sharp white cheddar cheese, freshly grated\n- 8 ounces monterey jack cheese, freshly grated\n- Fresh cilantro, for topping\n- Homemade tortilla chips, for serving\n\n## Instructions\n1. To roast the peppers, preheat the oven to 400°F. Rub the peppers with a bit of olive oil and place them on a baking sheet. Roast until the outside skins begin to blister and char, about 30 minutes. Remove the peppers and place them in a resealable plastic bag for 20 minutes to steam. (To shorten this process, grill or roast the peppers over a gas stovetop until charred, then steam in the bag.)\n2. Once the peppers have steamed, remove the blistered skin. Slice off the tops and remove the seeds (unless you want tons of heat), then dice the peppers.\n3. Heat a saucepan over medium heat and add the olive oil and butter. Stir in the peppers, onions and garlic. Season with the salt and pepper. Cook until the onion softens, about 5 to 6 minutes. Slowly stream in 1 cup of the half and half, whisking the entire time. In a bowl, whisk together the remaining 1/2 cup half and half and cornstarch until no lumps remain to create a slurry. Stir the slurry into the saucepan and cook for a minute until the milk thickens. Reduce the heat to low.\n4. Stir in the grated cheese, one small handful at a time, until melted. Transfer the mixture to a crock, larger bowl, or a small crockpot heating on low. Top with fresh cilantro if desired. Serve immediately with chips!", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "makokcmgbzsknx6shez4ehu54q", "title": "Homemade Italian Seasoning", "ainfo": "Homemade Italian Seasoning", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Combine the rosemary and fennel in a mortar and pestle, crush until they are in small bits. If you don't have a mortar and pestle, you can also use a spice grinder. Grind until the spices are a coarse consistency (not a powder).", "notes": "# Homemade Italian Seasoning\n\nSource: https://www.foxandbriar.com/italian-seasoning-recipe/\n\nBy Meghan McMorrow, Fox and Briar. Prep: 5 min | Total: 5 min. Servings: 10. Course: Seasonings. Cuisine: Italian.\n\n## Ingredients\n- 2 tablespoons dried basil\n- 2 tablespoons dried oregano\n- 2 tablespoons dried thyme\n- 2 tablespoons dried marjoram\n- 1 tablespoon dried rosemary\n- 1 tablespoon dried fennel\n\n## Instructions\n1. Combine the rosemary and fennel in a mortar and pestle, crush until they are in small bits. If you don't have a mortar and pestle, you can also use a spice grinder. Grind until the spices are a coarse consistency (not a powder).\n2. Combine the rosemary and fennel with the rest of the spices. Stir to fully mix.\n3. Store in a glass, airtight container for up to 6 months.\n\n## Notes\nRed pepper flakes are intentionally left out so heat can be added separately to accommodate personal taste. Grinding the rosemary and fennel releases their oils for more fragrance and flavor, and keeps their larger pieces from being unpleasant in finished dishes. Great in homemade marinara sauce or meatballs.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "evzkogxwrlhmmgqcydd3jzwxgi", "title": "Homemade Pickling Spice", "ainfo": "Homemade Pickling Spice", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Gather all ingredients.", "notes": "# Homemade Pickling Spice\n\nSource: https://www.allrecipes.com/recipe/231256/homemade-pickling-spice/\n\nSubmitted by Mooseinthekitchen. Prep: 10 min | Total: 10 min. Servings: 6. Yield: 1/4 cup.\n\n## Ingredients\n- 2 tablespoons whole mustard seeds\n- 1 tablespoon whole allspice berries\n- 2 teaspoons whole coriander seeds\n- 1 teaspoon red pepper flakes, or more to taste\n- 1 teaspoon ground ginger\n- 2 bay leaves, crumbled\n- 2 cinnamon sticks, broken in half\n- 6 whole cloves\n\n## Instructions\n1. Gather all ingredients.\n2. Place mustard seeds, allspice berries, coriander seeds, and pepper flakes into a small glass jar with a tight-fitting lid.\n3. Shake to combine. Add ginger to the jar, seal, and shake again.\n4. Add crumbled bay leaves, cinnamon stick halves, and cloves to the jar. Seal and shake once more to combine.\n5. Store in a tightly sealed jar for up to 1 month.\n\n## Notes\nPickling spice is mostly whole spices rather than ground, so it holds up well during pickling. Use for traditional pickles or any pickled vegetable, or alone with a brine for overnight quick-pickling tough meats (rinse, pat dry, then slow-roast in a water bath at low heat the next day). Store in a tightly sealed glass jar in a cool, dark place for up to one month. Substitute caraway seeds for coriander seeds if desired; drop a whole clove of garlic into each jar of cucumbers as a finishing touch. Fresher spices make a more pungent blend; pre-ground spices should be used sparingly as they can overpower the mix.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "qmgme6isslkyx3n2wpdqipfepe", "title": "Homemade Pickling Spice", "ainfo": "Homemade Pickling Spice", "category": "rubs", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place the mustard seeds, allspice berries, coriander seeds, and red pepper flakes into a small glass jar with a tight-fitting lid. Shake to combine.", "notes": "# Homemade Pickling Spice\n\nSource: https://www.allrecipes.com/article/pickling-spice/\n\nBy Melanie Fincher, Allrecipes (recipe by Mooseinthekitchen). Yield: about 1/3 cup blend.\n\nNote: this page is primarily an explainer article (\"What Is Pickling Spice?\") covering what pickling spice is, its typical ingredients, and how to use it — but it contains this complete embedded recipe for making your own blend from scratch.\n\n## Ingredients\n- 2 tablespoons whole mustard seeds\n- 1 tablespoon whole allspice berries\n- 2 teaspoons whole coriander seeds\n- 1 teaspoon red pepper flakes, or more to taste\n- 1 teaspoon ground ginger\n- 2 bay leaves, crumbled\n- 2 cinnamon sticks, broken in half\n- 6 whole cloves\n\n## Instructions\n1. Place the mustard seeds, allspice berries, coriander seeds, and red pepper flakes into a small glass jar with a tight-fitting lid. Shake to combine.\n2. Add the ground ginger to the seeds and shake again.\n3. Sprinkle the crumbled bay leaves over the spice mixture and add the cinnamon stick halves. Seal and shake to combine.\n\n## Notes\nMixture can be stored in the tightly sealed jar for up to 1 month without loss of flavor. Use for pickling cucumbers, vegetables, or fruits (add directly to the jar along with the brine), or tie a portion in cheesecloth/a coffee filter as a sachet to flavor braised meats, stews, beans, and rice dishes — leave extra string on the bundle for easy removal after cooking. Other common pickling spice ingredients not in this specific blend include cardamom, additional whole cinnamon, and peppercorns, which can be added or swapped to taste.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2a7c4vqailmkaktypy2d2tdzj4", "title": "Homemade Pumpkin Puree", "ainfo": "Homemade Pumpkin Puree", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 375°F.", "notes": "# Homemade Pumpkin Puree\n\nSource: https://tastesbetterfromscratch.com/pumpkin-puree/\n\nBy Lauren Allen, Tastes Better From Scratch. Prep: 10 min | Cook: 45 min | Total: 55 min. Yield: 7 cups.\n\n## Ingredients\n- 5-8 lbs sugar pie pumpkin (about one medium or two small pumpkins)\n\n## Instructions\n1. Preheat oven to 375°F.\n2. Wash the pumpkin. Line a sheet pan with parchment paper or a baking mat. Cut off the stem, then cut the pumpkin in half lengthwise. Scrape out the seeds with a large spoon (discard or roast for a snack).\n3. Place the pumpkin halves cut-side down on the baking sheet. Bake 35-45 minutes, until tender when pierced with a fork.\n4. Scoop the cooked flesh out of the shells into a food processor or blender. Blend until smooth, adding a tablespoon or two of water if needed (and a drop of orange food coloring if desired for color).\n5. Use in place of canned pumpkin in any recipe, 1:1 ratio.\n\n## Notes\nUse small \"sugar pumpkins\" or \"pie pumpkins\" for the best texture, flavor, and sweetness — large pumpkins work but have less flavor. Instant Pot method: add 1 cup water and the rack to the Instant Pot, place the whole pumpkin (stem removed) on the rack, cook on high pressure 13 minutes, natural release 10 minutes, then cool 15 minutes before halving, seeding, peeling, and blending. Home canning of pumpkin puree is not USDA-recommended. Store in the fridge in an airtight container up to 1 week, or freeze in 1-cup portions in freezer-safe bags/containers up to 6 months. Nutrition (per serving): 74 kcal, 18g carbs, 3g protein, 1g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "4pxthdczl2hnjtghgqshnxrmnu", "title": "Homemade Sloppy Joes", "ainfo": "Homemade Sloppy Joes", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Heat vegetable oil in a large cast iron skillet over medium high heat. Add ground beef and cook until browned, about 3-5 minutes, crumbling the beef as it cooks; drain excess fat.", "notes": "# Homemade Sloppy Joes\n\nSource: https://damndelicious.net/2023/09/08/homemade-sloppy-joes/\n\nBy Chungah Rhee, Damn Delicious. Prep: 15 min | Cook: 30 min | Total: 45 min. Yield: 6 servings.\n\n## Ingredients\n- 1 tablespoon vegetable oil\n- 1 1/2 pounds lean ground beef, 90/10\n- 1 small sweet onion, diced\n- 1 small green bell pepper, diced\n- 2 tablespoons tomato paste\n- 3 cloves garlic, minced\n- 1 teaspoon smoked paprika\n- 1 teaspoon chili powder\n- 1/8 teaspoon cayenne pepper\n- 1 1/2 cups beef stock\n- 1 cup ketchup\n- 2 tablespoons Dijon mustard\n- 2 teaspoons Worcestershire sauce\n- 1 tablespoon brown sugar\n- Kosher salt and freshly ground black pepper, to taste\n\n## Instructions\n1. Heat vegetable oil in a large cast iron skillet over medium high heat. Add ground beef and cook until browned, about 3-5 minutes, crumbling the beef as it cooks; drain excess fat.\n2. Add onion and bell pepper. Cook, stirring occasionally, until tender, about 3-4 minutes.\n3. Stir in tomato paste, garlic, paprika, chili powder, and cayenne pepper until fragrant, about 1 minute.\n4. Stir in beef stock, scraping any browned bits from the bottom of the skillet.\n5. Stir in ketchup, Dijon, Worcestershire, and brown sugar; season with salt and pepper to taste. Bring to a boil; reduce heat and simmer, stirring occasionally, until thickened and flavors have blended, about 15-20 minutes.\n6. Serve immediately.\n\n## Notes\nUse 85-90% lean ground beef — more fat makes it greasy, too lean makes it dry. Finely dice the onion and bell pepper so they melt into the sauce rather than leaving large chunks. Simmer at least 15-20 minutes for proper \"sloppy\" consistency; simmer longer for thicker sauce, or thin with a tablespoon of water at a time if too thick. Toast the buns first to prevent sogginess. Freezes well up to 3 months in single-serving portions (cool completely, portion into freezer bags, remove excess air, lay flat to freeze); thaw overnight in the fridge and reheat over low heat, stirring, adding a splash of water as needed. Leftovers keep 2-3 days in the fridge. Ground pork, chicken, turkey, or lentils can substitute for the beef.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "unv7pz35x6as7zvlhst4icbfei", "title": "Homemade Tomato Sauce", "ainfo": "Homemade Tomato Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a sauce pan, heat the olive oil over medium heat. Add onions and cook 4-5 minutes until soft and golden. Add garlic and sauté, being careful not to burn.", "notes": "# Homemade Tomato Sauce\n\nSource: http://www.primaverakitchen.com/how-to-make-basic-tomato-sauce/\n\nBy Olivia Ribas, Primavera Kitchen. Servings: 6 small mason jars | Prep: 15 minutes | Cook: 1 hour | Total: 1 hour 15 minutes\n\n## Ingredients\n- 1 tablespoon extra virgin olive oil\n- 1/2 onion, finely chopped\n- 4 garlic cloves, crushed\n- 2 tablespoons tomato paste\n- 28oz San Marzano whole peeled tomatoes, or 1 3/4 lb fresh tomatoes (peeled, seeded, and diced)\n- 1 tablespoon brown sugar\n- 1/2 teaspoon dried oregano\n- 2 dried bay leaves\n- Salt and black pepper\n- 1 tablespoon chopped fresh basil\n\n## Instructions\n1. In a sauce pan, heat the olive oil over medium heat. Add onions and cook 4-5 minutes until soft and golden. Add garlic and sauté, being careful not to burn.\n2. Add tomato paste and stir well. Add crushed tomatoes, including the juice if using canned tomatoes. Then add brown sugar, dried oregano, dried bay leaves, salt, and pepper.\n3. Cover and bring to a low simmer for 30 minutes to 1 hour. Finally, remove from the heat, add fresh basil, and stir well. Remove the bay leaves. Adjust seasoning if needed.\n\n## Notes\nCook the tomato paste in the oil for a minute or two before adding tomatoes — it removes the raw, tinny taste. Breaking up whole tomatoes with a spoon keeps the sauce chunky rather than smooth; blend with an immersion blender if you prefer it smooth. Store in the fridge up to 5 days, or freeze up to 3 months.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "dqpslxabcux4b2rhsblxh3kxke", "title": "Homemade Turkey Stock", "ainfo": "Homemade Turkey Stock", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "(Optional: if using a turkey neck too, brown it with the vegetables, or roast it along with the wings.)", "notes": "# Homemade Turkey Stock\n\nSource: https://www.howsweeteats.com/2020/11/turkey-stock-recipe/\n\nBy Jessica, How Sweet Eats. Prep: 1 hour | Cook: 3 hours | Total: 4 hours. Yield: 10 cups. Course: Soup. Cuisine: American. Slightly adapted from Epicurious.\n\n## Ingredients\n- 3 pounds turkey (or chicken) wings\n- Kosher salt and pepper\n- 2 tablespoons olive oil\n- 2 onions, cut in half\n- 2 carrots, cut into pieces\n- 2 celery stalks, cut into pieces\n- 1 handful fresh parsley\n- 2 sprigs fresh thyme\n- 1 handful fresh sage\n\n## Instructions\n1. (Optional: if using a turkey neck too, brown it with the vegetables, or roast it along with the wings.)\n2. Preheat the oven to 450°F. Place the wings in a baking dish, season all over with salt and pepper, and brush with 1/2 tablespoon of the olive oil. Roast for 30 minutes, then flip and roast 30-40 minutes more, until golden brown.\n3. While the wings roast, heat the remaining oil in a large stock pot over medium heat. Add the onions, carrots, and celery with a pinch of salt and pepper, and brown until golden and caramelized on all sides.\n4. When the wings are done, add them to the stock pot with the vegetables. Add the parsley and thyme. Fill the pot with about 14-16 cups of water. Bring to a boil, then reduce to a simmer and simmer uncovered for 30 minutes.\n5. After 30 minutes, add more water if a lot has evaporated. Cover and simmer for about 2 to 2.5 hours, checking and stirring occasionally.\n6. Turn off the heat. Remove the large wings and vegetables with tongs. Strain the stock through a fine mesh strainer or cheesecloth into a large bowl, repeating 1-2 more times to remove as many bits as possible. Taste and season with salt (usually 1-2 teaspoons kosher salt).\n7. Skim any fat off the top once it sits. Cool the stock (in a covered pot or via an ice bath), then refrigerate promptly once cool enough.\n\n## Notes\nRoasting the wings first (rather than just browning a turkey neck) gives a much richer, more golden stock. If turkey wings aren't available, chicken wings work as a substitute. Salt the wings and vegetables while cooking, but hold off on salting the stock itself until the end, tasting as you go. Can be made 3-4 days ahead and refrigerated; extra stock can be frozen. Great for gravy, stuffing, or anywhere a recipe calls for stock/broth.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "rznvtkfhvfbud5pq3kx3b5noxm", "title": "Homemade Vanilla Extract", "ainfo": "Homemade Vanilla Extract", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Cut the vanilla beans in half lengthwise with scissors or a knife. Leave a bit intact at the end if desired. Cut the beans down to fit the height of your jar if necessary.", "notes": "# Homemade Vanilla Extract\n\nSource: https://www.thepioneerwoman.com/food-cooking/recipes/a99489/how-to-make-vanilla-extract/\n\nBy Erica Kastner (Buttered Side Up) for The Pioneer Woman. Yields: 1 cup. Prep: 5 mins (does not include 2-month waiting period).\n\n## Ingredients\n- 6 whole vanilla beans\n- 1 cup vodka\n\n## Instructions\n1. Cut the vanilla beans in half lengthwise with scissors or a knife. Leave a bit intact at the end if desired. Cut the beans down to fit the height of your jar if necessary.\n2. Put the beans in an 8-ounce jar. Cover with the vodka. Screw the lid on and give it a good shake.\n3. Place in a cool, dark place. Let sit for at least 2 months. The longer the vanilla sits, the stronger the flavor will be. While it's sitting, give the jar a shake every week, or as often as you can remember.\n\n## Notes\nYou can use rum or bourbon instead of vodka, but the flavors won't be as clean. Use something with at least 35% alcohol and a neutral or complementary flavor. Ratio: 6 vanilla beans per 8 ounces of alcohol — scale up for larger jars.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "cnllxl77yk3zvw2ecy7dbwhbeu", "title": "Homemade Vietnamese Pho", "ainfo": "Homemade Vietnamese Pho", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Place beef bones in a stockpot (10-quart or larger). Cover with cold water. Bring to a boil over high heat for 3 to 5 minutes. Drain the bones, rinse with warm water, and scrub the stockpot clean. Return bones to the pot and add 6 quarts of cold water.", "notes": "# Homemade Vietnamese Pho\n\nSource: http://www.inspiredtaste.net/4307/vietnamese-soup-pho/\n\nBy Adam and Joanne Gallagher, Inspired Taste. Prep: 45 mins | Cook: 3 hr 20 mins | Total: 4 hr 5 mins | Makes 3-4 quarts broth (4 large or 6 small bowls)\n\n## Ingredients\n### Pho Broth\n- 5 to 6 pounds beef knuckles or leg bones\n- 6 quarts cold water\n- 2 onions, quartered\n- 4-inch piece fresh ginger, halved lengthwise\n- 2 cinnamon sticks\n- 1 tablespoon coriander seeds\n- 1 tablespoon fennel seeds\n- 6 whole star anise\n- 6 whole cloves\n- 1 black cardamom pod\n- 1 1/2 tablespoons fine sea salt\n- 1/4 cup fish sauce\n- 1-inch piece yellow rock sugar\n\n### Assembly\n- 1 pound dried or fresh \"banh pho\" noodles\n- 8 ounces raw eye of round, sirloin, or tri-tip steak, thinly sliced across the grain\n- 1/4 cup thinly sliced onions\n- 1/4 cup chopped cilantro leaves\n- Optional for the table: fresh mint, Thai basil, bean sprouts, lime wedges, sliced green or red chilies, fish sauce, hoisin sauce, sriracha or chili sauce\n\n## Instructions\n### Make the Broth\n1. Place beef bones in a stockpot (10-quart or larger). Cover with cold water. Bring to a boil over high heat for 3 to 5 minutes. Drain the bones, rinse with warm water, and scrub the stockpot clean. Return bones to the pot and add 6 quarts of cold water.\n2. Preheat oven broiler to high. Line a baking sheet with foil. Place onion quarters and halved ginger on the baking sheet and broil for 10 to 15 minutes, turning occasionally until nicely charred.\n3. Place cinnamon, coriander, fennel, star anise, cloves, and cardamom pod in a dry frying pan over low heat. Toast for about 5 minutes, stirring occasionally, until fragrant. Transfer the spices to a muslin bag or cheesecloth and seal with twine.\n4. Bring the stockpot to a boil, then reduce heat to a gentle simmer. Add the charred onions, ginger, spice bag, salt, fish sauce, and rock sugar. Gently simmer uncovered for 3 hours, skimming off any foam that rises to the surface.\n5. Use tongs to remove bones, onions, and ginger. Strain the broth through a fine-mesh strainer. To remove the fat, skim it off with a spoon or refrigerate the broth overnight.\n\n### Assembling Pho\n1. Place the strained broth into a stockpot and simmer over medium-low heat while you prepare the noodles.\n2. Place dried pho noodles in a bowl and cover with hot water. Soak for 15 to 20 minutes or until soft and opaque. If using fresh noodles, add them to a colander and rinse with cold water instead.\n3. Bring a medium saucepan of water to a boil. Add noodles and cook briefly (about 10 seconds) until they soften. Drain and divide evenly between serving bowls, filling each about 1/3 of the way.\n4. Arrange slices of raw meat over the noodles in each bowl. Carefully ladle the very hot broth over the meat, cooking it gently. Top with onion slices and cilantro. Serve with your favorite pho toppings at the table.\n\n## Notes\nParboiling the bones makes the broth clear without losing flavor. Keep the broth at a low simmer — if it reduces too quickly, partially cover the pot. There will be a generous amount of fat on top when done; skim with a spoon or refrigerate overnight (fat solidifies and lifts off easily). Black cardamom is optional but adds a nice smoky flavor. Yellow rock sug
