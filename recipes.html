ar is sold at Asian markets; break into smaller chunks with a hammer or rolling pin. Broth keeps in the fridge up to 5 days or freezer up to 6 months (don't freeze cooked noodles).", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "ywhgdckzmrt6tinlxz6lvwndge", "title": "Honey Garlic Chicken Thighs", "ainfo": "Honey Garlic Chicken Thighs", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Season the chicken on both sides with salt and pepper.", "notes": "# Honey Garlic Chicken Thighs\n\nSource: https://www.allrecipes.com/recipe/282124/honey-garlic-chicken-thighs/\n\nSubmitted by Eric VanLandingham, Allrecipes. Prep: 10 min | Cook: 20 min | Total: 30 min. Servings: 8.\n\n## Ingredients\n- 8 (5 oz) boneless chicken thighs\n- Salt and ground black pepper, to taste\n- 2 tablespoons olive oil, or as needed\n- 1/2 medium onion, finely chopped\n- 7 cloves garlic, chopped (or to taste)\n- 1 cup honey\n- 1/2 cup soy sauce\n- 1 pinch onion powder, or to taste\n- 1 pinch garlic powder, or to taste\n- 1/4 cup chopped fresh cilantro\n\n## Instructions\n1. Season the chicken on both sides with salt and pepper.\n2. Heat olive oil in a cast iron skillet over medium-high heat. Add chicken and brown on one side, 3 to 5 minutes.\n3. Flip the chicken and add the onion and garlic; continue cooking until the chicken is mostly (not fully) cooked and the onion and garlic are soft, 5 to 7 minutes more. Remove the chicken to a plate.\n4. Add the honey, soy sauce, onion powder, and garlic powder to the skillet. Stir and scrape the bottom of the pan to mix the garlic and onion into the liquid.\n5. Return the chicken to the skillet, cover, and reduce heat to medium. Cook until no longer pink in the center and juices run clear, about 10 more minutes, turning once halfway through. Internal temperature should reach 165°F.\n6. Arrange the chicken on a serving plate, drizzle with the pan liquid, and sprinkle with cilantro to serve.\n\n## Notes\nSkin-on, skinless, boneless, or bone-in thighs all work; bone-in needs about 5-10 minutes longer cooking time. A whole chopped head of garlic can be used instead of individual cloves for more punch. Great served over rice (plan on 3-4 cups uncooked rice) to soak up the sauce. Fresh parsley can substitute for cilantro as a garnish. Nutrition (per serving): 368 kcal, 38g carbs, 25g protein, 13g fat.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "n3hqngsu5xiyl73hgyzkw6i2tu", "title": "Horseradish Sauce", "ainfo": "Horseradish Sauce", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a small mixing bowl, stir all of the ingredients together. Serve right away or cover and refrigerate for about 2 weeks.", "notes": "# Horseradish Sauce\n\nSource: https://natashaskitchen.com/horseradish-sauce-recipe/\n\nBy Natasha, NatashasKitchen.com. Prep: 2 min | Total: 2 min | Servings: 12 (yields 3/4 cup)\n\n## Ingredients\n- 1/2 cup sour cream\n- 2 Tbsp prepared horseradish, drained\n- 2 Tbsp mayonnaise\n- 1 tsp apple cider vinegar\n- 1/4 tsp salt\n- 1/8 tsp black pepper\n- 1 Tbsp chives, finely chopped\n\n## Instructions\n1. In a small mixing bowl, stir all of the ingredients together. Serve right away or cover and refrigerate for about 2 weeks.\n\n## Notes\nFor a stronger horseradish flavor, add more prepared horseradish to taste. Great with prime rib, steak sandwiches, beef or pork tenderloin, sushi (instead of wasabi), or deviled eggs.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "t4vouttddndmntple5qhz2ain4", "title": "Horseradish Sauce For Prime Rib", "ainfo": "Horseradish Sauce For Prime Rib", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Add all of the ingredients to a small mixing bowl and stir to combine. Taste and adjust ingredients as desired.", "notes": "# Horseradish Sauce For Prime Rib\n\nSource: https://foodieandwine.com/horseradish-sauce-for-prime-rib/\n\nBy Darcey Olson. Prep: 5 min | Total: 5 min. Servings: 4. Calories: 109 kcal. Cost: $5.\n\n## Ingredients\n- 1/2 cup sour cream, full fat\n- 2 tbsp prepared horseradish, drained*\n- 2 tbsp mayonnaise\n- 1 tbsp finely chopped chives\n- 1 tsp apple cider vinegar**\n- 1/4 tsp salt\n- 1/8 tsp black pepper\n- Optional: 1/2 tsp Dijon mustard***\n\n## Instructions\n1. Add all of the ingredients to a small mixing bowl and stir to combine. Taste and adjust ingredients as desired.\n2. Cover and refrigerate for up to two weeks.\n\n## Notes\n*Prepared horseradish has quite a bit of liquid, so drain off the excess before adding to the bowl. **Substitute champagne vinegar or lemon juice for the apple cider vinegar if preferred. ***Dijon adds an extra dimension of flavor but isn't essential if you don't have it on hand. For a milder sauce, stick with prepared horseradish since fresh horseradish is about twice as spicy. Best made about 24 hours before serving to let the flavors meld. Use full-fat sour cream and mayonnaise for the best creaminess and tang. Great with prime rib, corned beef, roast beef sandwiches, tri-tip, steak crostini, or as a horseradish aioli on burgers. Nutrition per serving: 109 kcal, 2g carbs, 11g fat.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "aj6v32dr5fiwhe53kejstykgqm", "title": "Hot and Fast Ribs", "ainfo": "Hot and Fast Ribs", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prep: Flip the ribs so the bones face up. Pull off the membrane with a paper towel and discard. Trim off the flap of meat on the backside and remove excess fat.", "notes": "# Hot and Fast Ribs\n\nSource: https://girlscangrill.com/recipe/hot-and-fast-ribs/#wprm-recipe-container-14950\n\nBy Christie Vanover, Girls Can Grill. Prep: 30 min | Cook: 2 hrs 15 min | Total: 2 hrs 45 min. Servings: 6. Course: Main Course. Cuisine: American.\n\n## Ingredients\n- 2 slabs St. Louis Style Ribs\n- Yellow mustard\n- Girls Can Grill Pork Rub (or favorite pork rub)\n- Apple cider vinegar\n- 1/4 cup butter\n- Brown sugar\n- Honey\n- 1/4 cup apple or grape juice (or mop sauce)\n- Favorite BBQ sauce\n\n## Instructions\n1. Prep: Flip the ribs so the bones face up. Pull off the membrane with a paper towel and discard. Trim off the flap of meat on the backside and remove excess fat.\n2. Season: Rub the backside with mustard and pork rub. Rest in the fridge 15 minutes. Flip and rub the topside with mustard and pork rub. Rest in the fridge while heating the grill to 300°F with an indirect heat zone.\n3. Smoke: Place the ribs meat-side up over indirect heat. Smoke with the lid closed for 1 hour 15 minutes, spritzing with apple cider vinegar at the 30-minute and 1-hour marks.\n4. Wrap: Lay two sheets of heavy-duty foil on the counter, top with 4-5 pats of butter, 1-2 tablespoons brown sugar, a liberal drizzle of honey, and 2 tablespoons juice or mop sauce. Place the ribs meat-side down on the butter. Add 4-5 more pats of butter, 1-2 more tablespoons brown sugar, and another drizzle of honey to the bone side. Wrap tightly, crimping the ends.\n5. Braise: Return to the smoker for 45 minutes to 1 hour. The ribs should bend when picked up.\n6. Final step: Remove from the smoker, unwrap, and flip the ribs over. Brush with BBQ sauce. Return to the smoker unwrapped for 10-15 minutes to set the sauce. Remove, let rest a few minutes, and slice.\n\n## Notes\nThis \"hot and fast\" method (300°F, ~2 hrs 15 min) cuts the classic 3-2-1 method's roughly 6-hour cook time in half and is popular with competition pitmasters. For a tug-of-the-bite texture, cook to about 210°F internal (ribs bend and just start to crack when lifted); for fall-off-the-bone, cook to about 215°F (ribs nearly break in half). To slice, rest the ribs, lay them bone-side up, and cut between each bone with a long serrated knife. For competition prep, consider injecting the meat (water, injection powder like Kosmos Q Moisture Magic, and 1/4 cup maple syrup or apple juice) and letting it rest overnight, plus squaring off the bones and trimming to 4.5-5 inches. Serve with smoked mac and cheese or a potato salad. Nutrition (per serving): 639 kcal, 1g carbs, 58g protein, 43g fat (varies with amount of mustard, sugar, honey, and sauce used).", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wwfgrwertu6hyigqmqu74frkc4", "title": "Hot Cocoa Mix (Big Batch)", "ainfo": "Hot Cocoa Mix (Big Batch)", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large mixing bowl, add the confectioners' sugar, cocoa powder, powdered milk, cornstarch, and salt. Whisk together to combine.", "notes": "# Hot Cocoa Mix {Big Batch}\n\nSource: https://iambaker.net/hot-cocoa-mix-recipe/\n\nBy Amanda Rettke, i am baker. Prep: 5 min | Total: 5 min. Servings: 18 (about 4 1/2 cups of mix). Course: Drinks.\n\n## Ingredients\n- 2 cups (250 g) confectioners' sugar\n- 1 cup (118 g) Dutch-processed cocoa powder\n- 2 1/2 cups (250 g) powdered milk\n- 2 teaspoons cornstarch\n- 1 teaspoon kosher salt\n\nFor serving:\n- Mini marshmallows, optional\n- Hot water (or milk)\n\n## Instructions\n1. In a large mixing bowl, add the confectioners' sugar, cocoa powder, powdered milk, cornstarch, and salt. Whisk together to combine.\n2. Store the mixture in an airtight container for up to a year. Makes 4 1/2 cups of mix, enough for about 18 cups of hot cocoa.\n3. To make a cup of hot cocoa: use about 1/4 cup of powder per cup of hot water or milk (adjust to taste). Top with mini marshmallows if desired, then pour hot liquid over the powder and stir until dissolved.\n\n## Notes\nRegular unsweetened cocoa powder can be used instead of Dutch-processed. Cornstarch gives the cocoa a creamier consistency; salt enhances sweetness and chocolate flavor. Up to 2 more cups of confectioners' sugar can be added for a sweeter mix (use a larger storage container). Both hot water and hot milk work well; hot coffee or chocolate milk are also good options. Store in a cool, dry place up to a year — flavor may fade over time. Nutrition (per serving): 124 kcal.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "3fs26t2mjhem2yin5x4b6oi3ja", "title": "Hot Sausage Beer Cheese Dip", "ainfo": "Hot Sausage Beer Cheese Dip", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, cook the Italian sausage over medium heat until browned and cooked through, breaking it into crumbles as it cooks. Drain excess fat and set aside.", "notes": "# Hot Sausage Beer Cheese Dip\n\nSource: https://creativescookery.com/hot-sausage-beer-cheese-dip-recipe/\n\nBy Sophia. Prep: 10 min | Cook: 20 min | Total: 30 min. Yield: 8 servings.\n\n## Ingredients\n- 1 lb Italian sausage, removed from casing\n- 1 cup beer (lager or ale works best)\n- 2 cups shredded cheddar cheese\n- 1 cup shredded mozzarella cheese\n- 1 cup cream cheese, softened\n- 1/2 cup grated Parmesan cheese\n- 1/2 cup milk\n- 2 tablespoons all-purpose flour\n- 1 tablespoon Dijon mustard\n- 1 teaspoon garlic powder\n- 1/2 teaspoon onion powder\n- Salt and black pepper, to taste\n- Tortilla chips or pretzels, for serving\n\n## Instructions\n1. In a large skillet, cook the Italian sausage over medium heat until browned and cooked through, breaking it into crumbles as it cooks. Drain excess fat and set aside.\n2. In a medium saucepan, heat the beer over medium heat. Gradually whisk in the cream cheese until smooth and melted.\n3. Add the cheddar, mozzarella, and Parmesan cheeses, stirring constantly until fully melted and smooth.\n4. Stir in the milk, flour, Dijon mustard, garlic powder, onion powder, salt, and pepper. Continue cooking, stirring occasionally, until the mixture thickens and is heated through.\n5. Add the cooked sausage to the cheese mixture and stir until well combined.\n6. Transfer to a serving dish and serve warm with tortilla chips or pretzels.\n\n## Notes\nFor a milder dip, use mild sausage instead of hot. Chicken broth can substitute for the beer for a non-alcoholic version. Add the beer to the cheese mixture gradually and stir continuously while melting to prevent curdling or lumps; avoid high heat, which can cause the cheese to separate. Variations: smoked sausage for a smokier flavor; gouda or pepper jack instead of cheddar; diced jalapeños, onions, or bell peppers for texture; cayenne, smoked paprika, or cumin for extra spice. Store leftovers in an airtight container in the fridge up to 3 days, or freeze up to 2 months (thaw overnight before reheating). Reheat gently on the stovetop or microwave, stirring frequently. Nutrition (per serving): 250 kcal, 5g carbs, 12g protein, 20g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "bcybvubx3wwxgj7ieoxznkqhrm", "title": "How to Make a Week of Steel-Cut Oats in 5 Jars", "ainfo": "How to Make a Week of Steel-Cut Oats in 5 Jars", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Collect your jars and other equipment. Pint-sized jars work well since they allow room for adding nuts, raisins, and milk later, but half-pint jars work too.", "notes": "# How to Make a Week of Steel-Cut Oats in 5 Jars\n\nSource: http://www.thekitchn.com/how-to-make-steel-cut-oatmeal-in-jars-one-week-of-breakfast-in-5-minutes-cooking-lessons-from-the-kitchn-143623\n\nBy Faith Durand, The Kitchn. Serves: 5\n\n## Ingredients\n- 1 2/3 cups steel-cut oats\n- 4 cups water\n- 1/4 teaspoon salt\n\n### Optional mix-ins\n- Milk or soy milk\n- Cinnamon or other spices\n- Raisins or other dried fruit\n- Fresh berries\n- Nuts or seeds\n- Jam\n- Honey\n\n### Equipment\n- 5 pint-sized Mason jars with lids\n- Large saucepan\n- Ladle\n\n## Instructions\n1. Collect your jars and other equipment. Pint-sized jars work well since they allow room for adding nuts, raisins, and milk later, but half-pint jars work too.\n2. Cook the oats for 3 minutes: Bring the oats, water, and salt to a boil. Simmer for about 3 minutes then turn off the heat.\n3. Let the jars stand at room temperature, then refrigerate: Divide the oatmeal among the jars. Let stand, uncovered, at room temperature for about an hour or until cool to the touch, then cap and refrigerate.\n4. Reheat the oatmeal in the microwave: Take the cap off one jar and stir up the oatmeal inside. Microwave for 2 to 3 minutes, or until quite hot. Add milk, raisins, or other mix-ins.\n\n## Notes\nYou can add raisins, cinnamon, or other mix-ins to the jars before refrigerating, so all you have to do is grab one on your way out the door.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wrfdbjr6kuuy765fubqjdjv4vm", "title": "Korean Corn Dog", "ainfo": "Korean Corn Dog", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Skewer the hot dogs and cheese on sticks, hot dogs on the bottom and cheese on top. Place in the fridge to keep cold.", "notes": "# Korean Corn Dog\n\nSource: https://iamafoodblog.com/korean-corn-dog/\n\ni am a food blog. Prep: 10 min | Cook: 10 min | Total: 20 min\n\n## Ingredients\n- 3 hot dogs, cut in half\n- 6 sticks low-moisture fresh mozzarella cheese\n- 1 1/4 cups all-purpose flour\n- 2 tbsp sugar, plus extra to finish\n- 1/4 tsp salt\n- 2 tsp baking powder\n- 1 large egg\n- 3/4 cups milk\n- 2 cups panko\n- High heat oil, for deep frying\n- Mustard, as needed, optional\n- Ketchup, as needed, optional\n\n## Instructions\n1. Skewer the hot dogs and cheese on sticks, hot dogs on the bottom and cheese on top. Place in the fridge to keep cold.\n2. In a bowl, whisk together the flour, salt, sugar, and baking powder. Mix in the egg and milk until thick and smooth. Pour into a tall cup and place in the fridge. Pour the panko onto a shallow plate for rolling.\n3. In a deep fryer or deep wide pot, heat oil (enough for the hot dog to float) over medium-high to medium heat until it reaches 350°F. When nearly at temp, take the skewered dogs from the fridge and dip into the batter, making sure they're completely coated.\n4. Roll the coated corn dog in panko, pressing gently with your hands to coat all the batter.\n5. Carefully add to the oil and fry 3-4 minutes, until golden and crispy, turning as needed. Remove and let rest on a wire rack.\n6. Roll or sprinkle the corn dog with sugar and drizzle with mustard and ketchup. Enjoy hot!", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "5ngqmh2koomawbhg3av4ctigdm", "title": "Lamb & Beef Meatballs", "ainfo": "Lamb & Beef Meatballs", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 400°F and line a baking sheet with parchment paper.", "notes": "# Lamb & Beef Meatballs\n\nSource: https://www.bakedbymelissa.com/blog/savory-recipes/lamb-beef-meatballs\n\nBy Melissa Ben-Ishay, Baked by Melissa. Total time: under 30 minutes. Category: Savory Recipes.\n\n## Ingredients\n- 1 yellow onion, cut into large 2\" pieces\n- 5 garlic cloves, peeled\n- 2 tablespoons olive oil, divided\n- 1 lb ground beef (85/15)\n- 1 lb ground lamb\n- 1 large egg\n- 1 teaspoon salt\n- 1 teaspoon sweet paprika\n- 1 teaspoon garlic powder\n- 1 teaspoon dried oregano\n- 1/4 teaspoon black pepper\n- 1 tablespoon Dijon mustard\n- 1/3 cup breadcrumbs\n- 1/2 teaspoon baking soda\n\n## Instructions\n1. Preheat the oven to 400°F and line a baking sheet with parchment paper.\n2. Add the onion and garlic to a food processor and pulse until finely chopped. Pour in 1 tablespoon olive oil and stir to create a paste consistency.\n3. Place the ground beef and lamb in a large bowl.\n4. In a small bowl, whisk together the egg, salt, paprika, garlic powder, oregano, and black pepper.\n5. Pour the egg mixture over the ground meat and add the garlic/onion paste, the remaining olive oil, mustard, and breadcrumbs. Use your hand to combine, adding the baking soda along the way, until everything is fully incorporated.\n6. Roll the mixture into 1-inch balls and place on the prepared baking sheet (it's fine for them to be close together).\n7. Bake for 15-20 minutes, until the meatballs are seared brown on top and cooked through.\n8. Serve with pasta, rice, or in a bowl.\n\n## Notes\nThe extra olive oil and the juices that render out while baking keep these meatballs moist despite being baked rather than fried. The garlic/onion paste ensures every bite has flavor. Rolling the balls is the most time-consuming step — an extra pair of hands speeds things up considerably.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "rjnwshtbufqmrsmikezczh4yp4", "title": "Lamb or Beef Shakshuka", "ainfo": "Lamb or Beef Shakshuka", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 375 F.", "notes": "# Lamb or Beef Shakshuka\n\nSource: https://www.foodnetwork.com/recipes/rachael-ray/lamb-or-beef-shakshuka-5639034\n\nRecipe courtesy of Rachael Ray. Level: Easy. Total: 30 min | Active: 30 min. Yield: 4 servings.\n\n## Ingredients\n- EVOO\n- 1 pound ground lamb or beef\n- 1 onion\n- 2 red finger chili peppers or 1 large jalapeno pepper\n- 4 large cloves garlic\n- 1 teaspoon (1/3 palm full) cumin seed\n- 1 teaspoon caraway seed\n- 1 teaspoon pimenton or paprika\n- A little freshly grated nutmeg, about 1/8 teaspoon\n- Salt and pepper\n- 1 can (7 ounces) chipotle in adobo\n- 1 can (14 ounces) crushed or diced fire-roasted tomatoes\n- 1 can (14 ounces) tomato sauce or 2 cups passata\n- A drizzle of honey, optional\n- 3/4 pound brick feta in water\n- 4 to 6 large eggs\n\nTo Serve:\n- Garlic naan bread\n- 2 tablespoons butter, melted\n- Greek yogurt, optional\n- Cilantro leaves, picked\n- 2 to 3 scallions, finely chopped\n\n## Instructions\n1. Preheat oven to 375 F.\n2. Heat a large cast-iron skillet over medium-high heat. Add EVOO to the pan, 2 turns of the pan. Add ground meat, crumble and cook until the pink color goes away and meat is lightly browned.\n3. Peel and chop onion, seed and finely chop the peppers, and chop or slice the garlic. Add onions and peppers to the meat and stir to soften a few minutes. Add seeds, spices, and garlic; stir.\n4. Puree a can of chipotle in adobo in a food processor. Add 2 tablespoons to the pan and freeze/store the rest for another use.\n5. Add tomatoes, honey if using, and feta, and stir. Make 4 to 6 nests in the meat sauce using the back of a wooden spoon and drop eggs into them. Transfer the pan to the oven for 8 to 10 minutes, until eggs set.\n6. For the naan, heat a griddle over high heat. Scatter a little water onto the skillet/griddle and griddle the bread to blister, then flip. Brush bread with melted butter and cut into pieces/wide strips.\n7. Garnish eggs with dollops of yogurt if using, cilantro leaves, and scallions.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "3ojh5aei2xtu3kqn6y7ukoxpcq", "title": "Leftover Turkey Noodle Soup", "ainfo": "Leftover Turkey Noodle Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large pot or Dutch oven, heat olive oil over medium-high heat until shimmering. Add onion, carrots, and celery and cook until softened, about 5 minutes.", "notes": "# Leftover Turkey Noodle Soup\n\nSource: https://www.culinaryhill.com/leftover-turkey-noodle-soup/\n\nBy Meggan Hill, Culinary Hill. Prep: 10 min | Cook: 25 min | Total: 35 min. Servings: 8 (2 cups each). Course: Main Course, Soup. Cuisine: American.\n\n## Ingredients\n- 2 tablespoons olive oil or butter\n- 1 onion, peeled and finely chopped\n- 1 carrot, peeled and chopped\n- 1 celery rib, chopped\n- 8 cups (2 quarts) chicken broth or turkey broth\n- 3 cups cooked turkey, chopped or shredded\n- 2 teaspoons minced fresh thyme (or 1/2 teaspoon dried)\n- 1 bay leaf\n- 8 ounces wide egg noodles\n- Salt and freshly ground black pepper\n- Minced fresh parsley, for garnish\n\n## Instructions\n1. In a large pot or Dutch oven, heat olive oil over medium-high heat until shimmering. Add onion, carrots, and celery and cook until softened, about 5 minutes.\n2. Stir in broth, turkey, thyme, and bay leaf. Bring to a simmer and cook until vegetables are tender, about 15 minutes.\n3. Stir in noodles and cook until tender, about 5 minutes longer. Remove from heat, season to taste with salt and pepper, and garnish with fresh parsley.\n\n## Notes\nWorks with either chicken or turkey broth. Slow cooker option: add broth, turkey, carrots, celery, onion, bay leaves, and thyme to the slow cooker; cover and cook on HIGH 3 hours or LOW 6 hours, then stir in egg noodles and cook 15 minutes longer on HIGH until tender. Don't add too many noodles or they'll soak up all the broth and turn mushy. Refrigerate up to 4 days, or freeze up to 3 months. Nutrition (per 2-cup serving): 222 kcal, 23g carbs, 18g protein, 6g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "h3yga42eo53nxp2wajb5zophwy", "title": "Leftover Turkey Soup", "ainfo": "Leftover Turkey Soup", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Sauté the chopped onion, celery, carrots, and garlic with the thyme leaves in the oil and butter over low heat for 5 minutes.", "notes": "# Leftover Turkey Soup\n\nSource: https://vikalinka.com/leftover-turkey-soup-recipe/\n\nBy Julia Frey, Vikalinka. Prep: 10 min | Cook: 25 min | Total: 35 min. Servings: 6.\n\n## Ingredients\n- 1 tablespoon olive oil\n- 1 tablespoon butter\n- 1 onion (or 2 shallots)\n- 1 large carrot\n- 2 stalks celery\n- 1 clove garlic\n- 4 sprigs thyme (or 1/2 teaspoon dried thyme)\n- 1 1/2 liters (6 cups) turkey or chicken stock\n- 75 g (1/2 cup) giant/pearl (Israeli) couscous\n- 250 g (2 cups) cooked turkey or chicken\n- 2 bay leaves\n- Salt and pepper, to taste\n- 1 tablespoon parsley, chopped\n\n## Instructions\n1. Sauté the chopped onion, celery, carrots, and garlic with the thyme leaves in the oil and butter over low heat for 5 minutes.\n2. Add the stock, cooked turkey, and bay leaves; bring to a boil. Season with salt and pepper.\n3. Add the giant couscous and cook for 10 minutes over medium heat until tender. Sprinkle with chopped parsley and serve.\n\n## Notes\nHomemade or store-bought stock both work well. Regular noodles, orzo, macaroni, or gnocchi can substitute for the couscous; for gluten-free, use white or brown rice, or wild rice for a nuttier flavor. Leftover roasted vegetables from the turkey dinner can be diced and added in the last 5 minutes of cooking. Works equally well with leftover roast chicken instead of turkey. Store leftovers in an airtight container in the fridge 3-4 days, or freeze up to 3 months; reheat on the stovetop with the lid on to retain moisture, and only reheat once. Nutrition (per serving): 142 kcal, 13g carbs, 9g protein, 6g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "227hvqqzlar56edgmaf667ofpy", "title": "Lemon-Blueberry Yogurt Toast", "ainfo": "Lemon-Blueberry Yogurt Toast", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 375°F. Line a baking sheet with parchment paper. Whisk together the egg, yogurt, maple syrup, lemon zest, lemon juice, and salt in a small bowl.", "notes": "# Lemon-Blueberry Yogurt Toast\n\nSource: https://www.eatingwell.com/recipe/7945123/lemon-blueberry-yogurt-toast/\n\nRecipe developed by Marianne Williams for EatingWell. Active: 5 min | Total: 20 min. Servings: 2.\n\n## Ingredients\n- 1 large egg\n- 3 tablespoons plain whole-milk strained yogurt (such as Greek-style)\n- 1 tablespoon pure maple syrup\n- 1 teaspoon lemon zest\n- 1 teaspoon lemon juice\n- pinch of salt\n- 2 slices whole-wheat bread, 1/2 inch thick\n- 1/4 cup fresh blueberries\n\n## Instructions\nOven method:\n1. Preheat oven to 375°F. Line a baking sheet with parchment paper. Whisk together the egg, yogurt, maple syrup, lemon zest, lemon juice, and salt in a small bowl.\n2. Place the bread on the baking sheet. Using your fingers or the back of a spoon, press down on the center of each slice to make a large indentation, leaving a 1/2-inch border around the crust. Spoon the yogurt mixture into the indentation and spread evenly. Top with blueberries.\n3. Bake until the yogurt mixture is set and the blueberries have started to burst, 8 to 10 minutes. Let cool slightly, about 5 minutes.\n\nAir fryer method:\n1. Line the bottom and 2 inches up the sides of the air fryer basket with foil (the sides act as handles for removal). Preheat the air fryer to 360°F for 5 minutes.\n2. While preheating, whisk together the egg, yogurt, maple syrup, lemon zest, lemon juice, and salt. Press indentations into the bread slices as above, fill with the yogurt mixture, and top with blueberries.\n3. Carefully place the bread on top of the foil in the basket. Cook until the yogurt mixture is set and blueberries have started to burst, 6 to 8 minutes. Use the foil to lift the toasts out and let cool slightly, about 5 minutes.\n\n## Notes\nThe yogurt-egg mixture bakes up custardy, similar to a cheese Danish. Whole-wheat bread adds fiber for sustained energy. If the filling tends to run out of the bread, baking it in a small preheated tart or mini pie tin can help contain it. Other berries (strawberries) work too, though blueberries add a distinct sweetness compared to blackberries or raspberries. Nutrition per serving: 167 kcal, 5g fat, 23g carbs, 9g protein.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "vwre4q3l2pzoikedwepv5tb4ra", "title": "Linguine with Shrimp Scampi", "ainfo": "Linguine with Shrimp Scampi", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Drizzle some oil in a large pot of boiling salted water, add 1 tablespoon of salt and the linguine, and cook for 7 to 10 minutes, or according to package directions.", "notes": "# Linguine with Shrimp Scampi\n\nSource: http://www.foodnetwork.com/recipes/ina-garten/linguine-with-shrimp-scampi-recipe3.html\n\nRecipe courtesy of Ina Garten, from Barefoot Contessa Family Style. Level: Easy | Prep: 10 min | Cook: 15 min | Total: 25 min | Yield: 3 servings\n\n## Ingredients\n- Vegetable oil\n- 1 tablespoon kosher salt, plus 1 1/2 teaspoons\n- 3/4 pound linguine\n- 3 tablespoons unsalted butter\n- 2 1/2 tablespoons good olive oil\n- 1 1/2 tablespoons minced garlic (4 cloves)\n- 1 pound large shrimp (about 16 shrimp), peeled and deveined\n- 1/4 teaspoon freshly ground black pepper\n- 1/3 cup chopped fresh parsley leaves\n- 1/2 lemon, zest grated\n- 1/4 cup freshly squeezed lemon juice (2 lemons)\n- 1/4 lemon, thinly sliced in half-rounds\n- 1/8 teaspoon hot red pepper flakes\n\n## Instructions\n1. Drizzle some oil in a large pot of boiling salted water, add 1 tablespoon of salt and the linguine, and cook for 7 to 10 minutes, or according to package directions.\n2. Meanwhile, in a large (12-inch), heavy-bottomed pan, melt the butter and olive oil over medium-low heat. Add the garlic. Saute for 1 minute (careful, the garlic burns easily!). Add the shrimp, 1 1/2 teaspoons of salt, and the pepper and saute until the shrimp have just turned pink, about 5 minutes, stirring often. Remove from the heat, add the parsley, lemon zest, lemon juice, lemon slices, and red pepper flakes. Toss to combine.\n3. When the pasta is done, drain the cooked linguine and put it back in the pot. Immediately add the shrimp and sauce, toss well, and serve.\n\n## Notes\nReprinted from Barefoot Contessa Family Style, Copyright 2002 by Ina Garten, Clarkson Potter/Publisher.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "duxhzahc4hnais3j6o5kwj5lma", "title": "Lobster Artichoke Dip", "ainfo": "Lobster Artichoke Dip", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F (175°C).", "notes": "# Lobster Artichoke Dip\n\nSource: https://bakeitwithlove.com/lobster-artichoke-dip/\n\nBy Angela Latimer, Bake It With Love. Servings: 8 | Prep: 5 min | Cook: 25 min | Total: 30 min | Course: Appetizers, Dips | Cuisine: American\n\n## Ingredients\n- 8 oz cream cheese, softened\n- 1 cup mayonnaise\n- 14 oz artichoke hearts (1 can), quartered, sliced, or chopped\n- 1 tablespoon garlic, minced\n- 3/4 cup Parmesan cheese (reserve about 2 tablespoons for topping)\n- 1/4 cup Romano cheese\n- 1 cup lobster meat, cooked and chopped\n- 1/2 teaspoon smoked paprika\n- Salt and pepper, to taste\n\n## Instructions\n1. Preheat oven to 350°F (175°C).\n2. In a medium mixing bowl, break up the cream cheese and stir until smooth and creamy.\n3. Add mayonnaise and stir until well blended. Add the artichoke hearts, garlic, Parmesan, and Romano cheeses, and season with salt and pepper. Stir to combine.\n4. Fold in the lobster meat, just enough to distribute it without breaking up the chunks.\n5. Transfer to a small casserole dish, sprinkle with smoked paprika, and bake 20-25 minutes, until edges bubble lightly and the top browns slightly.\n6. Remove from oven and let cool about 5 minutes before serving warm.\n\n## Notes\nCan be made with langostino instead of lobster for a similar but more affordable flavor. Fun served in a bread bowl. Leftovers keep refrigerated in an airtight container 3-4 days; reheat at 250°F (120°C) for about 5 minutes for a small portion — no need to wait for it to bubble or brown again.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "l5qbixtmm7coe2vx262avsfqre", "title": "Louisiana Style Red Beans and Rice with Sausage", "ainfo": "Louisiana Style Red Beans and Rice with Sausage", "category": "sides", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "The night before, soak the dry beans in a large bowl with double their volume in water, in the refrigerator, overnight.", "notes": "# Louisiana Style Red Beans and Rice with Sausage\n\nSource: https://www.budgetbytes.com/louisiana-red-beans-rice/\n\nBy Beth Moncel, Budget Bytes. Prep: 15 minutes | Cook: 2 hours | Soaking: 8 hours | Total: 10 hr 15 min | Servings: 6 (1.5 cups red beans each)\n\n## Ingredients\n- 1 lb. dry red beans\n- 2 Tbsp cooking oil\n- 14 oz. Andouille sausage\n- 1 yellow onion\n- 1 green bell pepper\n- 3 ribs celery\n- 4 cloves garlic\n- 2 tsp smoked paprika\n- 1 tsp dried oregano\n- 1 tsp dried thyme\n- 1/2 tsp garlic powder\n- 1/2 tsp onion powder\n- 1/4 tsp cayenne pepper\n- 1/4 tsp freshly cracked black pepper\n- 2 bay leaves\n- 6 cups water\n- 1/4 cup chopped parsley\n- 1 Tbsp salt, or to taste\n- 1.5 cups long grain white rice, uncooked\n- 3 green onions\n\n## Instructions\n1. The night before, soak the dry beans in a large bowl with double their volume in water, in the refrigerator, overnight.\n2. Slice the sausage into rounds. Add cooking oil and sausage to a large pot and cook over medium until browned. Remove with a slotted spoon and refrigerate while you prepare the rest.\n3. While the sausage cooks, dice the onion, bell pepper, and celery, and mince the garlic.\n4. Add the onion, bell pepper, celery, and garlic to the pot. Sauté over medium heat until the onions are soft, letting the vegetable moisture dissolve the browned bits from the bottom of the pot.\n5. Add the smoked paprika, oregano, thyme, garlic powder, onion powder, cayenne, black pepper, and bay leaves. Stir and cook 1 minute more.\n6. Drain and rinse the soaked beans. Add to the pot with 6 cups water and stir to combine.\n7. Cover, bring to a boil over medium-high heat, then reduce to medium-low and simmer for 1 hour, stirring occasionally (replace the lid each time).\n8. After 1 hour, begin smashing the beans against the side of the pot with a spoon. Continue smashing and simmer uncovered for 30 more minutes to thicken.\n9. While the beans finish their final 30-minute simmer, cook the rice: combine rice and 3 cups water in a sauce pot, cover, bring to a boil, then reduce heat to low and simmer 15 minutes. Turn off heat and let rest 5 minutes covered, then fluff with a fork.\n10. Once the beans have thickened, stir in the cooked sausage and 1/4 cup chopped parsley. Taste and add salt to your liking (start with 1 tsp, up to about 1 Tbsp total).\n11. Serve red beans in a bowl topped with a scoop of rice and sliced green onions.\n\n## Notes\nAndouille is traditional; any smoked pork or beef sausage works as a substitute. Red beans and kidney beans are different but interchangeable in this recipe. Refrigerate 3-4 days or freeze up to about 3 months — chill quickly in single portions after cooking. Brown rice can substitute for white rice; follow package instructions for timing/water.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "u5r74n2hinnemakmionogxczgi", "title": "Mac n Cheese", "ainfo": "Mac n Cheese", "category": "pasta", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 375°F, and get out a large casserole dish to combine everything in at the end.", "notes": "# Mac n Cheese\n\nSource: Google Keep note\n\n## Ingredients\n- 1 lb pasta of your choice (not long noodles)\n- 4 Tbsp butter (you might not use all of it)\n- 1 Polska kielbasa (approx. 14 oz — a mixed meat one is tastier, but up to your taste), chopped into 1/4\" pieces (cut the rounds into quarters)\n- 4-6 large garlic cloves, chopped as fine as you like\n- 3/4 of a large red onion, chopped medium-small (not much bigger than the meat pieces)\n- 3 Tbsp flour\n- 1 tall can (24 oz) lager or hefeweizen, room temperature\n- 2 1/2 cups milk (pour and set aside at the start so it's not cold when added)\n- 4-6 cups shredded cheddar cheese (avoid pre-shredded — it's full of cornstarch); can also mix in Monterey Jack\n- 2 Tbsp strong (Dijon) mustard\n- 2 eggs\n- Salt, pepper, and nutmeg, to taste\n\n## Instructions\n1. Preheat the oven to 375°F, and get out a large casserole dish to combine everything in at the end.\n2. Start a pot of water boiling for your pasta.\n3. Heat a large saucepan to just below medium heat (4 1/2 on an electric range) with 2 Tbsp of the butter, and add the sausage. Cook it pretty hard, then remove from heat, leaving most of the fat behind in the pan. Carefully remove as much fat as you'd like with a paper towel — this can be replaced with the remaining butter or a tiny drizzle of olive oil (or you can remove all the fat and just use the butter/oil; the flavor is already there from the sausage).\n4. Cook the onions in the pan for about 3-5 minutes — the sizzling should be pretty loud by this point. Add the garlic and cook another 2 minutes, stirring constantly.\n5. Add the flour. This makes a fairly thick paste — make sure to incorporate it all into the fat; any lumps not from the onions will smooth out once the beer is poured in.\n6. Pour in the entire beer. It doesn't matter how frothy it gets, it will calm down.\n7. While the bubbles are settling, add the mustard. Start gently mixing everything together (a whisk can help here). Do the initial seasoning with salt, pepper, and nutmeg (fresh grated nutmeg is best, but powdered is fine), then slowly add the milk.\n8. Once all the milk is added, slowly whisk in at least 3 1/2 cups of the cheese (if using the full 6 cups, put in 5). Taste and add more seasoning to your liking.\n9. Boil the pasta if you haven't already. Remove the sauce from the heat and let it sit while you finish the noodles.\n10. Drain the noodles and put them in a large bowl. Add the sausage to the sauce, then pour all of it carefully into the bowl, scraping the bottom of the pan for all the best bits. Add the eggs directly into the mix and stir well.\n11. Pour into the casserole dish and top with the remaining cheese.\n12. Bake for 35 minutes if you like it loose, or 45 minutes if you like it kinda crispy. Serve with green onions if you're feeling fancy.\n\n## Notes\nTastes even better the next day, served cold, according to the family.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "riucgh7v4xlpyv3vlb3b6skawi", "title": "Marry Me Chicken", "ainfo": "Marry Me Chicken", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix all the chicken seasoning ingredients in a small bowl and season the chicken on both sides. Dredge the chicken in flour and shake off any excess.", "notes": "# Marry Me Chicken\n\nSource: https://gypsyplate.com/marry-me-chicken/\n\nBy Alpana, GypsyPlate. Prep: 10 min | Cook: 45 min | Total: 55 min. Yield: 5-6 servings.\n\n## Ingredients\nChicken seasoning:\n- 5-6 bone-in, skin-on chicken thighs or boneless skinless breasts (see note)\n- 1 tsp paprika\n- 1 tsp dried parsley\n- 1/2 tsp salt\n- 1/2 tsp pepper\n- 1/4 cup flour, for dredging\n- 2 Tbsp butter\n\nMarry Me Chicken Sauce:\n- 1 large shallot, diced small\n- 4 garlic cloves, finely chopped\n- 1 tsp red chili flakes\n- 1 tsp thyme\n- 1 tsp oregano\n- 1/3 cup sun-dried tomatoes, strips or chopped (see note)\n- 1 cup heavy cream\n- 1/2 cup chicken stock\n- 3/4 cup Parmesan cheese\n- 1/4 cup basil leaves, more for garnishing\n\n## Instructions\n1. Mix all the chicken seasoning ingredients in a small bowl and season the chicken on both sides. Dredge the chicken in flour and shake off any excess.\n2. In a large skillet, melt the butter on medium heat. Brown the chicken, skin side first, for 6-7 minutes on each side, or until golden brown. Transfer onto a plate and set aside.\n3. In the same pan, add a little more butter if needed and sauté the chopped shallot for a minute. Add garlic and cook for a minute, or until fragrant. Add red chili flakes, thyme, and oregano and mix well. Add the sun-dried tomatoes and cook for 2-3 minutes.\n4. Adjust the heat to medium-low, and add the heavy cream, chicken stock, and Parmesan cheese to the skillet. Mix and stir well until the cheese melts, and simmer for 4-5 minutes.\n5. Mix in basil leaves and place the chicken thighs in skin side up. Adjust the heat to medium-low, cover, and cook until the chicken is cooked through, stirring the sauce occasionally. Bone-in thighs should reach an internal temperature of 180-190°F for fall-off-the-bone, juicy meat; chicken breast should reach 165°F.\n6. Garnish with more basil leaves and serve immediately.\n\n## Notes\nYou can use boneless, skinless breasts instead of thighs; if very large, cut them in half or flatten with a meat mallet to tenderize and speed cooking. Bone-in, skin-on thighs are the preferred cut for the juiciest, fall-off-the-bone result, though boneless skinless thighs also work well. For the sun-dried tomatoes, oil-packed are preferred — add a little of the tomato oil while sautéing for extra flavor — but dry-packed can be substituted if that's what's available.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "v5c4krlxju67qby2aygzbbncmu", "title": "Masterchef Australia Fresh Mayonnaise", "ainfo": "Masterchef Australia Fresh Mayonnaise", "category": "sauces", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Mix the eggs, mustard, and white balsamic vinegar in a medium mixing bowl. Whisk until the mixture is smooth and pale yellow.", "notes": "# Masterchef Australia — Fresh Mayonnaise Recipe\n\nSource: https://medium.com/@andrej_45385/masterchef-australia-fresh-mayonaise-recipe-c744495d2e58\n\nBy Andrej The Chef.\n\n## Ingredients\n- 2 eggs\n- 1 teaspoon mustard\n- 1 teaspoon white balsamic vinegar\n- 1 cup (240ml) olive oil\n- salt and pepper, to taste\n\n## Instructions\n1. Mix the eggs, mustard, and white balsamic vinegar in a medium mixing bowl. Whisk until the mixture is smooth and pale yellow.\n2. Using a blending machine (immersion/stick blender), add the olive oil to the egg mixture and mix for 10 seconds at a time. Because of the machine, it's not important to slowly add the oil to ensure the mayonnaise emulsifies properly — the machine does it for you.\n3. Once about half of the oil has been incorporated, the mixture should begin to thicken and become more opaque. At this point, you can start adding the oil a bit more quickly.\n4. Once all of the oil has been added and the mayonnaise is thick and creamy, add salt and pepper to taste. Other seasonings like herbs or garlic can also be added.\n5. Transfer the mayonnaise to an airtight container and store in the refrigerator for up to one week.\n\n## Notes\nUses raw eggs in the emulsion — the recipe as published does not include a cooking or pasteurization step. Can be used as a spread, salad dressing, or dip; makes a good base for flavored mayo variations. For best results, use fresh, clean ingredients and a steady hand while whisking in the oil.\n", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "5weyqhtymhzmigly2nasphdvuq", "title": "Mediterranean Braised Lamb Shoulder Chops", "ainfo": "Mediterranean Braised Lamb Shoulder Chops", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large skillet, preferably cast-iron, heat 1 tablespoon of the olive oil over medium-high heat. Add the onion, carrots, and garlic, and season with salt and pepper. Sauté until everything is tender and starting to brown, about 5 minutes. Scrape the mixture into a small bowl.", "notes": "# Mediterranean Braised Lamb Shoulder Chops\n\nSource: https://themom100.com/recipe/mediterranean-braised-lamb-shoulder-chops/\n\nBy Katie Workman, The Mom 100. Prep: 20 min | Cook: 2 hrs 30 min | Total: 2 hrs 50 min. Servings: 4.\n\n## Ingredients\n- 3 tablespoons olive oil, divided\n- 1 medium onion, roughly chopped\n- 4 large carrots, roughly chopped\n- 3 large garlic cloves, minced\n- Kosher salt and freshly ground black pepper, to taste\n- 2 (1-inch thick) lamb shoulder chops (about 2 pounds total)\n- 2 cups sliced mushrooms (such as button, cremini, or shiitake)\n- 1 cup diced zucchini or summer squash\n- 1/2 teaspoon dried thyme\n- 2 teaspoons dried rosemary, crushed\n- 1 cup red wine\n- 1/2 cup tomato sauce or pureed tomatoes\n- Water or chicken broth, as needed\n- 1/4 cup chopped fresh parsley\n\n## Instructions\n1. In a large skillet, preferably cast-iron, heat 1 tablespoon of the olive oil over medium-high heat. Add the onion, carrots, and garlic, and season with salt and pepper. Sauté until everything is tender and starting to brown, about 5 minutes. Scrape the mixture into a small bowl.\n2. Season the lamb with salt and pepper on both sides. Wipe the skillet with a paper towel and return to the heat. Add 1 more tablespoon of olive oil; once the pan is very hot, add the chops and sear about 4 minutes on each side until browned on both sides. Transfer the chops to a plate.\n3. Add the remaining tablespoon of olive oil to the pan, then the mushrooms, zucchini, thyme, and rosemary. Sauté until the mushrooms give up their liquid, that liquid evaporates, and the vegetables become tender and slightly golden, about 7 minutes.\n4. Stir in the carrot and onion mixture. Add the red wine, stir to release any brown bits from the bottom, and let it reduce for about 2 minutes, then stir in the tomato sauce and tuck the browned chops into the mixture. Cover the pan, lower the heat to medium-low, and let it gently simmer for 2 hours, until the meat is very tender, almost falling apart. Check periodically to ensure there is still liquid, adding water or broth if necessary.\n5. Sprinkle the finished dish with parsley. Serve the lamb chops with the pan sauce over your choice of starch (mashed potatoes, egg noodles, polenta, or rice pilaf).\n\n## Notes\nVariation: substitute sweet potatoes for the zucchini and mushrooms. Can also be finished braising in a 300°F oven for 2 hours instead of on the stovetop. For the wine, use a dry, medium-bodied red you'd want to drink — Côtes du Rhône, Grenache, Tempranillo, Sangiovese (Chianti), or a softer Merlot all work well; avoid anything overly oaky or aggressively bold.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "azohzlg26ua7zl7gnwvevhxo6q", "title": "Mexican Street Tacos", "ainfo": "Mexican Street Tacos", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a medium bowl, combine soy sauce, lime juice, 1 tablespoon canola oil, garlic, chili powder, cumin, and oregano.", "notes": "# Mexican Street Tacos\n\nSource: https://damndelicious.net/2019/04/18/mexican-street-tacos/\n\nBy Chungah Rhee, Damn Delicious. Prep: 15 min | Cook: 15 min | Total: 1 hr 30 min. Yield: 6 servings. Course: Main Course. Cuisine: Mexican.\n\n## Ingredients\n- 2 tablespoons reduced sodium soy sauce\n- 2 tablespoons freshly squeezed lime juice\n- 2 tablespoons canola oil, divided\n- 3 cloves garlic, minced\n- 2 teaspoons chili powder\n- 1 teaspoon ground cumin\n- 1 teaspoon dried oregano\n- 1 1/2 pounds skirt steak, cut into 1/2-inch pieces\n- 12 mini corn or flour tortillas, warmed\n- 3/4 cup diced red onion\n- 1/2 cup chopped fresh cilantro leaves\n- 1 lime, cut into wedges\n\n## Instructions\n1. In a medium bowl, combine soy sauce, lime juice, 1 tablespoon canola oil, garlic, chili powder, cumin, and oregano.\n2. In a gallon-size Ziploc bag or large bowl, combine the marinade and steak; marinate for at least 1 hour, up to 4 hours, turning occasionally.\n3. Heat the remaining 1 tablespoon canola oil in a large cast iron skillet over medium-high heat. Add the steak and marinade, and cook, stirring often, until the steak has browned and the marinade has reduced, about 5-6 minutes, or until desired doneness.\n4. Serve the steak in tortillas, topped with onion, cilantro, and lime.\n\n## Notes\nSkirt steak is the preferred cut for its quick cooking time and rich, marbled flavor; flank steak (sliced thinly against the grain after cooking) or sirloin are good substitutes. Cut the steak into pieces before marinating, not after cooking, for better marinade coverage and searing. Don't marinate longer than 4 hours — the lime juice's acidity can start breaking down the meat too much. A cast iron skillet gives the most authentic street-food-style sear. Traditionally served on two stacked tortillas (\"la copia\") to prevent the filling from spilling if the first one tears. Additional toppings: cotija cheese, salsa verde, guacamole, or salsa. Leftover steak keeps in the fridge 2-3 days, or freezes (cooled completely, portioned into freezer bags with air removed) up to 2 months — thaw overnight and reheat gently over low heat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "2nivxzxcwfr6kvapisix66vtsa", "title": "Moist Chocolate Cookies with Cocoa Powder", "ainfo": "Moist Chocolate Cookies with Cocoa Powder", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat the oven to 350°F (177°C). Line a baking sheet with parchment paper or a silicone baking mat. Set aside.", "notes": "# Moist Chocolate Cookies with Cocoa Powder\n\nSource: https://pastryandbeyond.com/moist-crispy-chocolate-cookies/\n\nBy Meymi, Pastry & Beyond. Course: Cookies. Prep: 10 min | Cook: 8 min | Total: 18 min. Servings: 10 cookies.\n\n## Ingredients\n- 140 g (1 cup) all-purpose flour (dip and sweep)\n- 50 g (1/2 cup) cocoa powder\n- 1/2 teaspoon baking soda\n- 150 g (2/3 cup) unsalted butter\n- 175 g (1/2 cup and 1/3 cup) granulated sugar\n- 1 teaspoon pure vanilla extract\n- 1 large egg\n\n## Instructions\n1. Preheat the oven to 350°F (177°C). Line a baking sheet with parchment paper or a silicone baking mat. Set aside.\n2. Put the flour, cocoa powder, and baking soda in a medium bowl and mix well. Set aside.\n3. Melt the butter in a small pan over medium heat until halfway melted. Remove from heat and stir until fully melted. Set aside to cool.\n4. Place the sugar in a big bowl and add the cooled butter; mix well. Add the egg and vanilla, and stir until combined.\n5. Add the flour mixture in 2 batches, stirring until fully combined.\n6. Roll the dough into 52-53 gram (2 1/2 tablespoon) balls and place on the baking sheet (or divide the dough equally into 10 pieces and roll each into a ball).\n7. Bake for 8-11 minutes, until the cookies are slightly set. The top shouldn't be wet but should be soft — they'll be too soft to handle right away. Remove from the oven to preserve moistness, and let cool on the baking sheet for 10 minutes, until the bottoms are firm enough. The cookies will look a little puffy; slightly press them with the back of a spoon for shape.\n\n## Notes\nMake sure the melted butter has cooled before mixing so it doesn't cook the egg. If the dough is too soft to roll into balls, chill it briefly. Don't overbake — the cookies finish firming up as they cool on the sheet. Crispy at the edges, moist in the middle, almost souffle-like when warm.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "klnmm56v3qlhv6u732qvugbtie", "title": "Most Amazing (Addicting) Macaroni Salad", "ainfo": "Most Amazing (Addicting) Macaroni Salad", "category": "salads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Bring a large pot of generously salted water to a boil. Cook the pasta according to package directions. Drain and rinse under cold running water, then transfer to a large bowl and refrigerate to cool for about 30 minutes (or half that time in the freezer). Chop the vegetables and make the dressing while the pasta cools.", "notes": "# Most Amazing (Addicting) Macaroni Salad\n\nSource: https://littlespicejar.com/most-addicting-macaroni-salad/\n\nBy Marzia, Little Spice Jar. Prep: 13 min | Cook: 7 min | Total: 1 hr 50 min. Servings: 6.\n\n## Ingredients\nSalad:\n- 8 oz dry elbow macaroni\n- 1 (4-oz) jar diced pimientos, drained\n- 1/4 cup finely shredded carrot\n- 1/2 cup sweet onions, finely chopped\n- 1/2 cup celery, finely chopped\n\nDressing:\n- 1/2 cup mayonnaise\n- 3 tablespoons sweet relish\n- 2 tablespoons sugar (more or less to taste)\n- 2 tablespoons white vinegar\n- 1 tablespoon yellow mustard\n- 1/2 teaspoon garlic powder\n- 1/2 teaspoon celery salt\n- Dash of cayenne pepper, optional\n\n## Instructions\n1. Bring a large pot of generously salted water to a boil. Cook the pasta according to package directions. Drain and rinse under cold running water, then transfer to a large bowl and refrigerate to cool for about 30 minutes (or half that time in the freezer). Chop the vegetables and make the dressing while the pasta cools.\n2. Whisk the dressing ingredients together in a small bowl until the sugar dissolves and the dressing is smooth. Taste and adjust salt, pepper, or sugar as desired.\n3. Add the chopped vegetables to the cooled pasta, then stir in the dressing until well combined. Cover and refrigerate at least 1 hour — it tastes better the longer it sits.\n\n## Notes\nAny small pasta shape works (ditalini, cavatappi, cavatelli, shells, farfalle). Fresh finely chopped red bell pepper or jarred fire-roasted peppers can substitute for pimientos. Use full-fat mayonnaise for the best flavor and texture — low-fat versions are more acidic and may need extra sugar to balance; Miracle Whip is sweeter, so reduce added sugar if substituting. Apple cider vinegar can substitute for white vinegar; Dijon can substitute for yellow mustard for a milder flavor. Rinsing the pasta after cooking stops it from overcooking and removes excess starch that causes sticking. Can be made up to 1 day ahead, though vegetables lose some crunch after that; leftovers keep 3-5 days refrigerated. The dressing amount is intentionally light — multiply by 1.5 for a more heavily dressed salad.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "udw2pf5shfmrczocdqcefobt54", "title": "New Orleans Gumbo with Shrimp and Sausage", "ainfo": "New Orleans Gumbo with Shrimp and Sausage", "category": "soups", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Roux: Heat the oil in a large dutch oven or heavy bottom pot over medium-high heat. Whisk in the flour until smooth. Switch to a wooden spoon and stir continuously for 15-22 minutes, until the roux darkens to just past a deep peanut butter color. Take your time — don't crank up the heat or let it burn (if it burns, you must throw it out and start over).", "notes": "# New Orleans Gumbo with Shrimp and Sausage\n\nSource: http://littlespicejar.com/new-orleans-gumbo-shrimp-sausage/\n\nBy Marzia, Little Spice Jar. Prep: 20 minutes | Cook: 1 hr 10 minutes | Total: 1 hr 30 minutes | Servings: 6 | Equipment: Dutch oven\n\n## Ingredients\n### For the Roux\n- 1/2 cup high heat oil (avocado, canola, corn, or vegetable)\n- 1/2 cup all purpose flour\n\n### For the Gumbo\n- 1 medium onion, diced\n- 2 bell peppers, any color, diced\n- 3 stalks celery, diced\n- 6 garlic cloves, minced\n- 3 bay leaves\n- 8 ounces andouille sausage, sliced\n- 2 tablespoons cajun seasoning\n- 2 tablespoons tabasco sauce, more or less to taste\n- 1 tablespoon cayenne (omit for mild)\n- 4 cups low sodium chicken broth\n- 1 (14.5 ounce) can stewed tomatoes (optional)\n- 1 1/2 pounds raw shrimp\n- 2 teaspoons gumbo filé\n- Sliced scallions + white rice or quinoa, for serving\n\n## Instructions\n1. Roux: Heat the oil in a large dutch oven or heavy bottom pot over medium-high heat. Whisk in the flour until smooth. Switch to a wooden spoon and stir continuously for 15-22 minutes, until the roux darkens to just past a deep peanut butter color. Take your time — don't crank up the heat or let it burn (if it burns, you must throw it out and start over).\n2. Saute: Once the roux is a deep rich brown, stir in the onions, bell peppers, and celery. Cook, stirring as needed, about 8-10 minutes until the veggies soften. Add the garlic, andouille sausage, and bay leaves. Cook 1-2 more minutes until the garlic is fragrant.\n3. Season: Add the cajun seasoning, tabasco sauce, and cayenne along with the chicken broth and stewed tomatoes (if using). Bring to a high simmer, then lower heat to medium-low, cover, and simmer 15-20 minutes.\n4. Add protein: Add the shrimp (and sausage if you held it back) to the gumbo, stir, and simmer an additional 10-15 minutes until the shrimp is opaque and veggies have softened. Taste and season with salt and pepper. Stir in the gumbo filé. Remove bay leaves before serving.\n5. Serve warm over white rice or quinoa, topped with sliced scallions.\n\n## Notes\nGet all ingredients prepped before starting the roux — no multitasking while it cooks. Use a dutch oven or heavy-bottom pot, not a thin stockpot, to avoid burning the roux. Tomatoes are optional; 1 can diced tomatoes can substitute for stewed tomatoes (add a splash more broth if omitting tomatoes altogether). For okra, slice 4 oz, fry in a tablespoon of oil first (to avoid sliminess), then add with the shrimp. Chicken thighs can substitute for sausage, added in step 2.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "teorgdvw65eahsrkjx3zj35fe4", "title": "No-Bake Peanut Butter Protein Balls", "ainfo": "No-Bake Peanut Butter Protein Balls", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a large bowl, mix together the peanut butter, honey, and vanilla.", "notes": "# No-Bake Peanut Butter Protein Balls\n\nSource: https://marshasbakingaddiction.com/no-bake-peanut-butter-protein-balls/ (site now redirects to https://simplybakeblog.com/no-bake-peanut-butter-protein-balls/)\n\nBy Marsha. Prep: 20 min | Total: 20 min. Yields: 16-18 balls.\n\n## Ingredients\n- 1 cup (250g) smooth peanut butter\n- 3 tablespoons (63g) honey, maple syrup, or agave\n- 1 teaspoon vanilla extract\n- 1 1/2 cups (135g) rolled oats\n- 1/4 cup (45g) chocolate chips\n\n## Instructions\n1. In a large bowl, mix together the peanut butter, honey, and vanilla.\n2. Add the oats and chocolate chips, and fold in until completely combined. If needed, use your hands to bring everything together.\n3. If the mixture is too crumbly to roll into balls, add milk (1 tablespoon at a time) until it becomes more manageable.\n4. Roll the mixture into 1-oz balls.\n\n## Notes\nCan use crunchy peanut butter for added crunch; quick porridge oats work too; milk, dark, or semi-sweet chocolate chips all work. For best results, use gram measurements with a digital scale rather than cups, since cup measurements can be inaccurate for peanut butter or oats. Store in an airtight container at room temperature or in the fridge for up to 1 week. Freezes well for up to 3 months; thaw overnight in the fridge before serving. Nutrition per ball: 135 kcal, 13g carbs, 4g protein, 8g fat, 5g sugar.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "gcf3u3lfm4ja7e5i4khlmp4pg4", "title": "Oatmeal Butterscotch Cookies", "ainfo": "Oatmeal Butterscotch Cookies", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 350°F and line two baking sheets with parchment paper.", "notes": "# Oatmeal Butterscotch Cookies (Oatmeal Scotchies)\n\nSource: https://www.thereciperebel.com/oatmeal-butterscotch-cookies/\n\nBy Ashley Fehr, The Recipe Rebel. Prep: 10 minutes | Cook: 9 minutes | Total: 19 minutes | Course: Dessert | Servings: 24\n\n## Ingredients\n- 3/4 cup unsalted butter, room temperature\n- 1 cup brown sugar, packed (about 200 grams)\n- 1 egg\n- 1 teaspoon vanilla extract\n- 1 1/2 cups large rolled oats\n- 1 1/4 cups all purpose flour (about 160 grams)\n- 1/2 teaspoon ground cinnamon\n- 1/2 teaspoon baking powder\n- 1/2 teaspoon baking soda\n- 1/4 teaspoon salt\n- 1 1/4 cups butterscotch chips (about 210 grams)\n\n## Instructions\n1. Preheat oven to 350°F and line two baking sheets with parchment paper.\n2. In a large bowl with an electric mixer, beat butter and sugar until light and fluffy, about 3-4 minutes.\n3. Add egg and vanilla and beat until smooth.\n4. Add oats, flour, cinnamon, baking powder, baking soda and salt and stir until completely combined. Stir in butterscotch chips.\n5. Drop by heaping tablespoonfuls (or a 2 Tbsp cookie scoop) onto parchment paper 2 inches apart (about 12 per pan). For thinner, chewier cookies, press down slightly (optional).\n6. Bake at 350°F for 8-9 minutes (longer for larger cookies), until edges begin to brown and centers are almost set (a bit of glossiness in the center is fine — they continue to set on the hot pan).\n7. Let sit for 5 minutes before removing from the pan to cool completely.\n\n## Notes\nStore in an airtight container up to 1 week, or freeze up to 3 months. Swap the butterscotch chips for white chocolate chips with macadamia nuts or dried cranberries, or for chocolate chips or raisins.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "zbox42b5uy2uk6ooemmqesufoq", "title": "Olive Bruschetta", "ainfo": "Olive Bruschetta", "category": "appetizers", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In the bowl of a food processor, add the olives, roasted red pepper, shallot, capers, garlic, vinegar, oregano, basil, parsley, and olive oil. Give it a few pulses until the mixture is chunky. Season to taste with kosher salt and freshly ground black pepper. Let it sit at room temperature for at least 30 minutes while you prepare the baguette.", "notes": "# Olive Bruschetta\n\nSource: https://kitchenconfidante.com/olive-bruschetta\n\nBy Liren Baker, Kitchen Confidante. Prep: 15 min | Cook: 5 min | Total: 20 min. Servings: 8. Calories: 207 kcal. Course: Appetizer. Cuisine: Mediterranean.\n\n## Ingredients\nFor the tapenade:\n- 1 cup Castelvetrano olives, drained\n- 3/4 cup Kalamata olives, drained\n- 2 tablespoons small diced roasted red pepper\n- 1 tablespoon minced shallot\n- 1 1/2 teaspoons capers\n- 1 clove garlic, minced\n- 1 tablespoon sherry vinegar\n- 1 teaspoon fresh oregano\n- 2 fresh basil leaves\n- 2 tablespoons flat leaf parsley\n- 1/3 cup extra virgin olive oil, plus more for the baguette and drizzling\n- kosher salt\n- freshly ground black pepper\n\nFor the bruschetta:\n- 1 baguette, sliced into 24 1/4-inch rounds\n- 1 clove garlic, halved\n- 2 tablespoons finely diced feta cheese (optional)\n\n## Instructions\n1. In the bowl of a food processor, add the olives, roasted red pepper, shallot, capers, garlic, vinegar, oregano, basil, parsley, and olive oil. Give it a few pulses until the mixture is chunky. Season to taste with kosher salt and freshly ground black pepper. Let it sit at room temperature for at least 30 minutes while you prepare the baguette.\n2. Brush the slices of bread with olive oil and rub with garlic. Place on a baking tray and toast under a broiler or on a grill pan until golden.\n3. Top each piece of toast with about 1 tablespoon of the olive tapenade. Garnish with feta cheese, if desired. Enjoy!\n\n## Notes\nMake it vegan: Omit the feta cheese for a vegan-friendly appetizer.\n\nMake it ahead: The olive topping and bruschetta toast can both be prepared ahead of time. Store the olive topping in an airtight container in the refrigerator. Before serving, allow it to come to room temperature — the olive oil will \"melt\" back to its normal liquid state at room temperature. Store the fully cooled toasts in an airtight container to keep them crisp and fresh.\n\nNutrition per serving: Calories 207, Carbohydrates 17g, Protein 3g, Fat 14g, Saturated Fat 2g, Polyunsaturated Fat 2g, Monounsaturated Fat 10g, Sodium 716mg, Potassium 74mg, Fiber 2g, Sugar 2g, Vitamin A 230IU, Vitamin C 3mg, Calcium 57mg, Iron 2mg.\n\nSubstitution tip: if you don't have sherry vinegar, red wine vinegar gives a similar flavor profile; in a pinch, any vinegar or even lemon/lime juice works fine since only 1 tbsp is needed — it's mainly there for a pop of acidity.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "yzfwjtbgni6ixsgo2g5a5xdbki", "title": "Oohey Gooey S'mores Dippers", "ainfo": "Oohey Gooey S'mores Dippers", "category": "desserts", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Pour the sweetened condensed milk into the bottom of a cast iron skillet. Sprinkle the semi-sweet chocolate chips on top. Stand the marshmallows up on end and tuck them into the pan atop the chocolate chips.", "notes": "# Oohey Gooey S'mores Dippers\n\nSource: https://www.fornobravo.com/blog/recipe/oohey-gooey-smores/\n\nCourse: Dessert | Cuisine: American | Prep: 10 minutes | Cook: 6 minutes | Total: 16 minutes | Servings: 6\n\n## Ingredients\n- 1 can sweetened condensed milk\n- 12 ounces semi-sweet chocolate chips\n- 1 bag Jet Puffed marshmallows\n- 1 sleeve graham crackers\n- 8 each Nutter Butter cookies\n- 8 each shortbread cookies\n- 8 each fresh strawberries, cut in half\n\n## Instructions\n1. Pour the sweetened condensed milk into the bottom of a cast iron skillet. Sprinkle the semi-sweet chocolate chips on top. Stand the marshmallows up on end and tuck them into the pan atop the chocolate chips.\n2. Before putting the pan in the oven, arrange your cookies and strawberries for dipping — split dippers between two plates if serving a crowd.\n3. Place the loaded skillet directly in the middle of a wood-fired oven for approximately 6 minutes, or until the marshmallows puff up and turn golden brown. (A conventional oven at high heat/broil works too — watch closely.)\n4. Place the skillet on a heat-safe trivet in the center of the table and start scooping while it's molten hot.\n\n## Notes\nThis is a fondue-style dessert best eaten immediately while hot. Great with graham crackers or any favorite cookie for dipping.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "ff2gbizcihk6vne2eofxlywrea", "title": "Oven-Baked Pistachio Falafels", "ainfo": "Oven-Baked Pistachio Falafels", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat oven to 400°F (200°C). Line a baking sheet with parchment paper.", "notes": "# Oven-Baked Pistachio Falafels\n\nSource: https://foodnouveau.com/oven-baked-pistachio-falafels/\n\nBy Marie Asselin, FoodNouveau.com. Prep: 25 min | Cook: 15 min | Total: 40 min. Dairy-free, vegan, gluten-free (with substitution).\n\n## Ingredients\n- 1 (19 oz/540 ml) can chickpeas, preferably no salt added, rinsed, drained, and patted dry\n- 1/2 cup (125 ml) unsalted shelled pistachios\n- 1/2 cup (125 ml) almond flour (finely ground almonds, also called almond meal)\n- 1/4 cup (60 ml) fresh mint leaves\n- 1/4 cup (60 ml) flat-leaf parsley leaves and thin stems\n- 1 shallot, minced\n- 2 cloves garlic, peeled\n- 1 tsp (5 ml) finely grated lemon zest (about 1/2 lemon)\n- 2 tbsp (30 ml) freshly squeezed lemon juice (about 1/2 lemon)\n- 3 tbsp (45 ml) extra-virgin olive oil\n- 1 tbsp (15 ml) all-purpose flour\n- 1 tsp (5 ml) ground cardamom\n- 1 tsp (5 ml) baking soda\n- 1 tsp (5 ml) kosher salt, or fine sea salt\n- Freshly ground black pepper to taste\n\n## Instructions\n1. Preheat oven to 400°F (200°C). Line a baking sheet with parchment paper.\n2. To the bowl of a food processor, add the chickpeas, pistachios, almond flour, mint, parsley, shallot, and garlic, and pulse 7 to 10 times, until you reach a coarse but uniform texture. Add the remaining ingredients, then pulse, frequently scraping down the sides of the bowl, until the mixture comes together in a coarse paste.\n3. Remove the bowl from the processor and pull out the blade. Using a 2 tsp (10 ml) capacity cookie scoop or your hands, roll the falafel mixture into balls and set onto the baking sheet. Bake for 15 to 18 minutes, or until the falafel are lightly golden and firm to the touch. Let cool for 10 minutes before serving; this allows the falafel to firm up and reach their ideal texture.\n\n## Notes\nServing: warm or room temperature as a bite with hummus or Greek yogurt + lemon juice; in a pita with lettuce, tomatoes, cucumber, and hummus/yogurt for lunch; or over rice and veggies with a hummus-citrus sauce for dinner. Storage: airtight container in the fridge up to 5 days, or freeze on a baking sheet then transfer to an airtight container; reheat from frozen at 325°F (160°C) for 10 minutes. Gluten-free: substitute a gluten-free all-purpose flour mix for the tablespoon of regular flour. No pistachios? Substitute almonds, walnuts, or hazelnuts.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "yjgczvftcybcg2npdshug672g4", "title": "Oxtail Pho", "ainfo": "Oxtail Pho", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "In a stock pot, cover oxtail and brisket with cold water and bring to a boil; drain and discard the water.", "notes": "# Oxtail Pho\n\nSource: https://more.ctv.ca/food/recipes/oxtail-pho.html (original page removed; retrieved via web.archive.org)\n\nBy Craig Wong, CTV Life. Serves 4.\n\n## Ingredients\n### Oxtail Pho\n- 5 pounds (2.27 kg) oxtail\n- 1 pound (454 g) beef brisket\n- 12 ounces (340 g) ginger, halved lengthwise\n- 1 head large garlic, halved crosswise\n- 4 pounds (1.8 kg) medium yellow onions, halved lengthwise\n- 3 sticks cinnamon\n- 1/4 cup (60 ml) whole black peppercorns\n- 5 pods whole star anise\n- 1/4 cup (60 ml) fish sauce\n- 1-inch piece yellow rock sugar\n- 1/2 pound (227 g) boneless sirloin steak\n- 1 pound (454 g) flat rice noodles, cooked to package instructions\n\n### To Serve (optional)\n- 2 cups (470 ml) fresh mung bean sprouts\n- 1 small red onion, very thinly sliced lengthwise\n- 1 jalapeño pepper, sliced into thin rounds\n- 1 large bunch fresh Thai basil\n- 2 limes, cut into wedges\n- Hoisin sauce\n- Sriracha sauce\n\n## Instructions\n1. In a stock pot, cover oxtail and brisket with cold water and bring to a boil; drain and discard the water.\n2. Repeat once more, then rinse the meats and return to the clean pot; add ginger, garlic, and onions.\n3. In a cast iron pan, combine cinnamon sticks, black peppercorns, and star anise and toast over high heat, shaking occasionally, until fragrant. Add spices to the stock pot.\n4. Fill the pot with about 5 quarts (liters) cold water, enough to cover everything by 1 inch.\n5. Bring to a simmer over high heat, then reduce heat to low and simmer (do not boil) until the brisket is tender, about 2-3 hours. Skim off and discard any scum or fat as needed.\n6. When the brisket is tender, remove it and set aside to cool completely.\n7. Continue to simmer the broth and oxtail for 4 more hours, until the oxtail meat is tender and falling from the bone.\n8. Strain and separate the solids from the broth. Reserve the broth in a clean pot over medium to medium-high heat. Separate the meat from the oxtail and reserve; discard bones and aromatics.\n9. Skim any remaining fat from the broth, then stir in the fish sauce and yellow rock sugar.\n10. Thinly slice the chilled cooked brisket and the raw sirloin.\n11. Divide the noodles among 6-8 large bowls, top with the brisket, sirloin, and oxtail meat.\n12. Ladle the very hot broth over the noodles and meat and serve immediately with optional garnishes: bean sprouts, onion, jalapeño, Thai basil, lime wedges, hoisin sauce, and Sriracha.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "vvi4fjukr534xtt6anrrigwpde", "title": "Paella", "ainfo": "Paella", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prepare oven according to Mugnaini's High Roasting Environment, 625-675°F. Have all ingredients ready (mise en place) — the oven temp will settle to about 550°F once the large cooking vessel is in.", "notes": "# Paella\n\nSource: https://www.mugnaini.com/recipes/paella/\n\nMugnaini Wood and Gas Fired Pizza Ovens. Cooked in a wood-fired oven at high roasting temperature (625-675°F, settling to 550°F).\n\n## Ingredients\n- 4-5 cups low sodium chicken stock\n- 2 cloves chopped garlic\n- 1 teaspoon turmeric\n- 1 teaspoon chili flakes\n- Pinch saffron\n- 2 teaspoons kosher salt\n- 4 tablespoons unsalted butter, softened\n- 4 tablespoons tomato paste\n- 1/2 cup chopped parsley\n- 2 tablespoons extra virgin olive oil\n- 3/4 pounds Spanish chorizo, 3/4-inch dice\n- 1 cup carrots (about 3), 1/2-inch dice\n- 1 1/2 cups onions (about 1 onion), 1/2-inch dice\n- 1 cup white wine\n- 3 cups paella rice\n- 2 pounds clams, scrubbed\n- 1 1/2 pounds shrimp (16-20 count), shelled and deveined, shells reserved for stock\n- 2 cups chopped roma tomatoes (or 1 cup good-quality diced canned tomatoes)\n- 2 cups frozen petite peas, thawed\n- 2 branches rosemary, 12 inches each\n\n## Instructions\n1. Prepare oven according to Mugnaini's High Roasting Environment, 625-675°F. Have all ingredients ready (mise en place) — the oven temp will settle to about 550°F once the large cooking vessel is in.\n2. Place 4 cups of the stock in a large saucepan and add the shrimp shells. Cook 15 minutes, strain and discard shells. Return stock to the pan and add garlic, turmeric, chili flakes, saffron, and salt — it should taste over-seasoned. Simmer while the paella cooks. When ready to use, measure into a 4-cup measuring cup, topping up with more stock if needed.\n3. Place softened butter in a small bowl, add tomato paste and parsley, and stir to combine. Set aside.\n4. Place a 15-inch stainless steel paella pan in the oven for 5 minutes. Add oil and chorizo. Cook, stirring occasionally, until the meat begins to brown, 8-10 minutes.\n5. Add carrots and onion and continue cooking 8-10 minutes until vegetables begin to soften, stirring occasionally.\n6. Deglaze with the wine and cook until reduced by half, 4-5 minutes.\n7. Add the butter mixture and stir to incorporate. Add the stock and return to oven until it begins to simmer, about 2 minutes. Be careful sliding the pan in and out due to the large amount of liquid.\n8. Remove pan from oven and sprinkle the rice evenly over the top, gently pressing into an even layer where rice is above the stock.\n9. Cover with foil and cook 15 minutes, turning the pan occasionally.\n10. Remove pan from oven — rice will look dry but shellfish will add moisture. Do not stir. Add clams, pushing down into the rice. Cover and cook 10 more minutes.\n11. Remove pan again and add shrimp, tomatoes, peas, and rosemary branches. Clams should be beginning to open. Cover and cook 40 more minutes, rotating the pan every 15 minutes. Done when clams are fully opened, shrimp are pink, and rice is tender; if not, recover and cook 5 more minutes.\n12. Remove from oven and rest 10-15 minutes before serving.", "updatedAt": "2026-08-16T01:00:03Z"}, {"uuid": "44vzwvuxyf6pan2pjbsgpwzx4a", "title": "Pan-Seared Lamb Chops with Mustard-Thyme Sauce", "ainfo": "Pan-Seared Lamb Chops with Mustard-Thyme Sauce", "category": "mains", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Marinate: Combine the olive oil, lemon juice, thyme, cracked pepper, sea salt, and minced garlic in a medium bowl. Arrange the lamb chops on a plate and pour the marinade over, coating all sides. Let sit at room temperature 30 minutes.", "notes": "# Pan-Seared Lamb Chops with Mustard-Thyme Sauce\n\nSource: https://juliasalbum.com/lamb-chops-with-mustard-thyme-sauce/\n\nBy Julia, Julia's Album. Prep: 10 min | Cook: 20 min | Total: 30 min. Servings: 4. Course: Main Course. Cuisine: Mediterranean.\n\n## Ingredients\nMarinade:\n- 2 tablespoons olive oil\n- 2 tablespoons lemon juice\n- 2 tablespoons snipped fresh thyme, no stems\n- 1/4 teaspoon black pepper, cracked\n- 1/4 teaspoon sea salt\n- 3 cloves garlic, minced (or 1 teaspoon garlic powder)\n\nLamb Chops:\n- 1 tablespoon olive oil\n- 4 lamb chops\n\nSauce:\n- 1 cup white wine (or red wine)\n- 1/4 cup Dijon mustard\n- 1 teaspoon fresh thyme\n- 1 clove garlic, minced\n- 2 tablespoons heavy cream\n\n## Instructions\n1. Marinate: Combine the olive oil, lemon juice, thyme, cracked pepper, sea salt, and minced garlic in a medium bowl. Arrange the lamb chops on a plate and pour the marinade over, coating all sides. Let sit at room temperature 30 minutes.\n2. Sear: Heat 1 tablespoon olive oil over medium heat in a large skillet. Add the lamb chops and cook about 4 minutes per side. Remove from the skillet.\n3. Sauce: Add the wine to the same skillet and bring to a boil. Add the mustard, fresh thyme, and minced garlic. Boil to reduce and thicken the sauce, a couple of minutes. Stir in the heavy cream (optional, to mellow the strong flavors — add more to taste).\n4. Return the lamb chops to the skillet and simmer on low-medium heat to heat through. Season with salt and pepper if needed.\n5. If the chops aren't cooked to medium yet, cover and cook a couple more minutes in the sauce, then remove from heat and let rest, covered, until done.\n6. Spoon the sauce over the lamb chops and sprinkle with more fresh thyme to serve.\n\n## Notes\nCan be pan-seared in a stainless steel or cast iron skillet. Red wine can substitute for white wine in the sauce. Lamb pairs well with thyme, rosemary, parsley, sage, and oregano; for extra seasoning consider cumin, coriander, red pepper flakes, paprika, curry powder, or mint. Good sides: roasted potatoes, sautéed spinach, roasted broccoli or butternut squash, or a tomato-cucumber-avocado salad. Nutrition (per serving): 449 kcal, 4g carbs, 43g protein, 23g fat.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "pcysgazuo7kberp746vnxcgtwu", "title": "Pan-Seared Sesame Crusted Ahi with Soy Ginger Lime Sauce", "ainfo": "Pan-Seared Sesame Crusted Ahi with Soy Ginger Lime Sauce", "category": "asian", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Prepare oven according to Mugnaini's Pizza Oven Environment, 650-750°F.", "notes": "# Pan-Seared Sesame Crusted Ahi with Soy Ginger Lime Sauce\n\nSource: https://www.mugnaini.com/recipes/pan-seared-sesame-crusted-ahi-with-soy-ginger-lime-sauce/\n\nMugnaini Wood and Gas Fired Pizza Ovens. Cooked in a wood-fired oven, Pizza Oven Environment 650-750°F.\n\n## Ingredients\n### Ahi Tuna\n- 6 (1-inch-thick) ahi steaks, about 6 ounces each\n- 3 teaspoons sesame oil, divided\n- 1 tablespoon black sesame seeds\n- 1 tablespoon white sesame seeds\n\n### Soy Ginger Lime Sauce\n- 2 teaspoons minced ginger\n- 6 tablespoons lime juice\n- 4 tablespoons soy sauce (plus 2 more teaspoons)\n- 1 teaspoon sesame oil\n- 2 tablespoons honey\n- 2 teaspoons water\n- 1/2 teaspoon red chili flakes\n\n## Instructions\n1. Prepare oven according to Mugnaini's Pizza Oven Environment, 650-750°F.\n2. Place a sauté pan large enough to hold all the ahi steaks in one layer into the oven and heat well for about 5 minutes.\n3. While the pan heats, lightly brush the steaks with 2 teaspoons sesame oil. Combine the sesame seeds on a plate. Press the steaks onto the seeds, turning to coat both sides.\n4. Add the remaining sesame oil to the hot pan, heat well, and add the steaks. Cook 45 seconds, turn over, and cook 45 seconds more. Remove and slice thinly to serve.\n\n## Notes\nFor the Soy Ginger Lime Sauce, whisk all sauce ingredients together and serve alongside the sliced ahi (the source page lists sauce ingredients but does not give separate mixing directions beyond combining them).", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "jkgr3oa5mlzhhbwlc5ixthx3lu", "title": "Passover Beef Brisket", "ainfo": "Passover Beef Brisket", "category": "smoked", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Two days prior to serving: Trim excess fat off the brisket and put in a large baking dish or roasting pan. Combine all other ingredients and pour over the brisket. Cover tightly with foil and refrigerate overnight.", "notes": "# Passover Beef Brisket\n\nSource: http://thepioneerwoman.com/cooking/passover-brisket-i-think/ (original page removed; recipe reproduced via partiesandpearls.blogspot.com)\n\nBy Ree Drummond (The Pioneer Woman)\n\n## Ingredients\n- 1 beef brisket (about 5 1/2 lb)\n- 1 packet onion soup mix\n- 1 cup water\n- 1 24oz bottle ketchup\n\n## Instructions\n1. Two days prior to serving: Trim excess fat off the brisket and put in a large baking dish or roasting pan. Combine all other ingredients and pour over the brisket. Cover tightly with foil and refrigerate overnight.\n2. One day prior to serving: Preheat oven to 275°F and bake for 6-8 hours, depending on the size of the brisket (may be done in as little as 5.5 hours). The brisket is done when the meat flakes easily with a
