should brown slightly.\n6. Remove from the oven and allow to cool slightly, about 5 minutes, before serving warm.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "lyiujeexujb2lhwkhswc4tlyoi", "title": "Maple Roasted Carrots with Rosemary", "ainfo": "Maple Roasted Carrots with Rosemary", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Serves 4 as a side", "notes": "# Maple Roasted Carrots with Rosemary\n\n### Ingredients\n* Serves 4 as a side\n* Olive oil\n* 10oz (300g) carrots, cleaned, trimmed & halved lengthwise\n* 3 sprigs rosemary\n* 3 tbsp maple syrup\n* Sea salt\n\n### Method\n1. Fire up your Ooni pizza oven. Aim for 390°F (200°C) on the stone baking board inside.\n2. Add a little olive oil and one sprig of rosemary to your Sizzler and place inside the oven to warm up.\n3. Once the pan is warm, add the carrots and the remaining rosemary, and drizzle with a little more olive oil. Return the pan to the oven and cook for 10 minutes, or until the carrots are golden brown and softened.\n4. Drizzle the maple syrup over the carrots and continue cooking for another 2-3 minutes, or until the carrots are caramelized.\n5. Remove the pan from the oven and sprinkle the carrots generously with the sea salt. The carrots can be served right from the pan.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "pl2i5452m6cbvcxmusv2kqaxtq", "title": "Moser Sweet Pickle ", "ainfo": "Moser Sweet Pickle ", "category": "rubs", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Sliced dill pickles (buy the sliced if available, if not they will need to be sliced)", "notes": "# Grandma's Pickle Recipe\n\n### For 1 Gallon Jar of Pickles\n\n#### Ingredients\n* Sliced dill pickles (buy the sliced if available, if not they will need to be sliced)\n* **4 lbs** of Sugar\n* **7** Cinnamon Sticks, medium to long length\n* **2-3 tbs** of Mustard Seeds\n* **1 tsp** heaping of Celery Seed\n* **1 small jar (8 oz)** of minced garlic, drain juice and add\n\n#### Instructions\n1. Drain pickle juice out of 1 gallon jar.\n2. Add all ingredients and stir. \n3. Give it at least one day but stir it a few times.\n\n### For 1 Quart Jar of Pickles\n\n#### Ingredients\n* Sliced dill pickles (buy the sliced if available, if not they will need to be sliced)\n* **1 lb** of Sugar\n* **3** Cinnamon Sticks, medium to long length\n* **1 tbs** of Mustard Seeds or more if you like\n* **¼ tsp** heaping of Celery Seed\n* **¼ small jar** of minced garlic (from an 8 oz jar), drain juice and add, more or less depending on taste\n\n#### Instructions\n1. Drain pickle juice out of 1 quart jar.\n2. Add all ingredients and stir. \n3. Give it at least one day but stir it a few times.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "6itwwes5vcbuyaudqpjlezn4ia", "title": "Moser's Carolina Sauce", "ainfo": "Moser's Carolina Sauce", "category": "sauces", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "¾ cup yellow mustard", "notes": "# Moser's Carolina Sauce\n\n### Ingredients\n* **¾ cup** yellow mustard\n* **½ cup** apple cider vinegar\n* **½ cup** honey\n* **1 tsp** Worcestershire sauce\n* **2 tbsp** ketchup\n* **1 tsp** garlic powder\n* **1 tbsp** red pepper flakes\n* **½ tsp** salt\n* **2 tbsp** brown sugar\n\n### Instructions\n1. Combine all ingredients in a saucepan. \n2. Cook over medium heat for 7 minutes, stirring occasionally.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "vyb3fkqyypxyk3qqntmumhdgvy", "title": "Naan", "ainfo": "Naan", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Warm water", "notes": "# Homemade Naan (Urban Farmie Version)\n\n### Ingredients\n* Sugar\n* Warm water\n* Yeast (Active dry or Instant)\n* Flour\n* Baking powder\n* Salt\n* Yogurt (Plain or Vegan)\n* Oil\n* Additional water (for brushing)\n* Melted butter, minced garlic, and chopped cilantro (optional, for serving)\n\n---\n\n### Instructions\n\n1. **Activate the Yeast:** Mix the sugar, warm water, and yeast together in a bowl. Let it sit in a warm place for about **10 minutes** until it becomes frothy. *(Note: If using instant yeast, you can skip this step and add it straight to the dry ingredients).*\n2. **Whisk Dry Ingredients:** In a separate bowl, add the salt and baking powder to your flour and give it a good whisk.\n3. **Form the Dough:** Add the yogurt and oil to the frothy yeast mixture, mixing with a fork first. Pour this liquid mixture into the flour. Use your hands or a food processor to combine everything until it forms a soft, pliable, and slightly sticky dough ball. **Do not overwork it!**\n4. **Let it Rise:** Place the dough ball inside a lightly oiled mixing bowl that is at least twice its size. Cover with a damp towel or plastic wrap and let it sit in a warm location to rise for **at least 1 hour** (it should roughly double in size). For even softer and fluffier naan, you can leave it out for up to **4 hours**.\n5. **Divide the Dough:** Once fully risen, gently divide the dough into **6 equal portions** (each should be roughly the size of a lemon).\n6. **Preheat the Skillet:** Heat a cast-iron skillet over medium-high heat. Let it get very warm—almost near smoking—while you begin rolling out your first piece of dough.\n7. **Roll the Naan:** Dust a dough ball with a little flour and roll it into a flatbread shape roughly **¼-inch thick**. Roll them out **one at a time** right before cooking rather than all at once. Limit yourself to one or two good rolls in each direction so you don't over-roll. If the dough sticks to your rolling pin, dust the pin and dough with a bit more flour.\n8. **Season and Prep:** Pat any excess flour off the rolled dough. If you are adding seasonings like garlic or sesame seeds, press them firmly into one side using your hand. Turn the dough over and brush the non-seasoned side with a **thin film of water**.\n9. **Cook in Skillet:** Place the watered side of the naan directly onto the hot cast-iron skillet. Let it cook uncovered for about **5 seconds** until you see small bubbles appearing on the surface. Immediately cover the skillet with a lid and let it cook for **45 seconds**.\n10. **Garnish and Serve:** Remove the naan from the skillet and immediately brush with a thin layer of plain melted butter, or butter mixed with garlic and cilantro. Serve hot!\n\n---\n\n### Recipe Modifications & Substitutions\n\n* **For Yeast-Free Naan:** Skip the yeast activation step entirely. Use self-raising flour and yogurt, or add 1 teaspoon of baking powder and ½ teaspoon of baking soda directly into regular flour. Follow the remaining steps as written.\n* **For Vegan Naan:** Simply substitute the traditional dairy yogurt and butter with your favorite plain vegan yogurt and plant-based butter alternatives.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "etvcal4bhly5yjnpis43numdzy", "title": "Neapolitan Pizza Dough (12h Poolish Version)", "ainfo": "Neapolitan Pizza Dough (12h Poolish Version)", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Dough Balls: 10", "notes": "# Neapolitan Pizza Dough (12h Poolish Version)\n\n### Total Recipe Parameters\n* **Dough Balls:** 10\n* **Ball Weight:** 225g\n* **Water Hydration:** 70%\n* **Salt:** 3%\n* **Leavening:** 12 hours total at Room Temperature (78°F)\n* **Poolish Leavening:** 8 hours\n* **Poolish Flour Ratio:** 68%\n* **Yeast Type:** Active Dry Yeast (ADY)\n\n### Poolish Doses (1,772 g total)\n* **Flour:** 884 g\n* **Water:** 884 g\n* **Yeast:** 2.96 g\n\n### Main Dough Doses (478 g total)\n* **Flour:** 416 g\n* **Water:** 26 g\n* **Salt:** 39 g\n* **Yeast:** 0 g", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "erxugfv6tbw4gg3dfpgjzhxcci", "title": "Neapolitan Pizza Dough (20h 70% Biga Version)", "ainfo": "Neapolitan Pizza Dough (20h 70% Biga Version)", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Dough Balls: 10", "notes": "# Neapolitan Pizza Dough (20h 70% Biga Version)\n\n### Total Recipe Parameters\n* **Dough Balls:** 10\n* **Ball Weight:** 225g\n* **Water Hydration:** 70%\n* **Salt:** 3%\n* **Leavening:** 20 hours at Room Temperature (78°F)\n* **Yeast Type:** Active Dry Yeast (ADY)\n* **Biga Flour Ratio:** 70%\n\n### Biga Doses (1,325 g total)\n* **Flour:** 910 g\n* **Water:** 410 g\n* **Yeast:** 4.92 g\n\n### Main Dough Doses (925 g total)\n* **Flour:** 390 g\n* **Water:** 501 g\n* **Salt:** 39 g\n* **Yeast:** 0 g", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "uwazrj2wsrbz4aiv3ucl4z75gy", "title": "Neapolitan Pizza Dough (20h Biga Version)", "ainfo": "Neapolitan Pizza Dough (20h Biga Version)", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Dough Balls: 5", "notes": "# Neapolitan Pizza Dough (20h Biga Version)\n\n### Total Recipe Parameters\n* **Dough Balls:** 5\n* **Ball Weight:** 225g\n* **Water Hydration:** 80%\n* **Salt:** 3%\n* **Leavening:** 20 hours at Room Temperature (80°F)\n* **Yeast Type:** Active Dry Yeast (ADY)\n* **Biga Flour:** 100%\n\n### Biga Doses (895 g total)\n* **Flour:** 615 g\n* **Water:** 277 g\n* **Yeast:** 3.32 g\n\n### Main Dough Doses (230 g total)\n* **Flour:** 0 g\n* **Water:** 215 g\n* **Salt:** 18 g\n* **Yeast:** 0 g", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "e7x4gtqmarhbvpix4fswqmq65y", "title": "Neapolitan Pizza Dough (48h Biga Version)", "ainfo": "Neapolitan Pizza Dough (48h Biga Version)", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Dough Balls: 5", "notes": "# Neapolitan Pizza Dough (48h Biga Version)\n\n### Total Recipe Parameters\n* **Dough Balls:** 5\n* **Ball Weight:** 225g\n* **Water Hydration:** 78%\n* **Salt:** 3%\n* **Leavening:** 48 hours at Room Temperature (80°F)\n* **Yeast Type:** Active Dry Yeast (ADY)\n* **Biga Flour:** 100%\n\n### Biga Doses (905 g total)\n* **Flour:** 622 g\n* **Water:** 280 g\n* **Yeast:** 3.36 g\n\n### Main Dough Doses (220 g total)\n* **Flour:** 0 g\n* **Water:** 205 g\n* **Salt:** 19 g\n* **Yeast:** 0 g", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "og2rfu3oceitzkqe7qey3asgyu", "title": "No Mayo Cabbage Slaw", "ainfo": "No Mayo Cabbage Slaw", "category": "salads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "½ cup apple cider vinegar", "notes": "# No Mayo Cabbage Slaw\n\n### Ingredients\n\n#### No Mayo Dressing\n* **½ cup** apple cider vinegar\n* **¾ cup** extra virgin olive oil\n* **2 tablespoons** honey\n* **2 teaspoons** whole celery seeds\n* **1 teaspoon** kosher salt\n* **1 teaspoon** black cracked pepper\n\n#### Slaw Mix\n* **2 cups** carrots (2 large carrots, shredded)\n* **2 cups** green cabbage, thinly sliced\n* **2 cups** purple cabbage, thinly sliced", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "ffgwy2rmwuktb5oqvxvjp7mwm4", "title": "Oven fries", "ainfo": "Oven fries", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 russet potatoes, cut in ½ lengthwise, halves cut lengthwise into fourths to make 16 big, fat wedges", "notes": "# Oven fries\n\n### Ingredients\n* 2 russet potatoes, cut in ½ lengthwise, halves cut lengthwise into fourths to make 16 big, fat wedges\n* ¼ cup extra-virgin olive oil\n* ¾t Kosher salt\n* 2 tablespoons chopped parsley leaves\n* ¼ cup freshly grated Parmigiano-Reggiano\n\n### Instructions\n1. Preheat the oven to 425 degrees F.\n2. Preheat a baking sheet in the hot oven for at least 5 minutes.\n3. While the baking sheet is heating, toss the potatoes with the olive oil and 3/4 teaspoon salt in a large bowl.\n4. Then dump the potatoes out onto a baking sheet, spreading to a single layer.\n5. Roast for 30 to 35 minutes, shaking the pan every now and then, until the potatoes are cooked through, brown and crispy.\n6. Toss the fries in a big bowl with the parsley and cheese.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "ttw6e27dhifpm3m22fsz7iwqti", "title": "Patchoulie Ginger Tea", "ainfo": "Patchoulie Ginger Tea", "category": "mains", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1L of water", "notes": "# Philippines Ginger Lemon Tea\n\n### Ingredients\n* 1L of water\n* 5T of ginger punch\n* 1 whole lemon\n* 1 lemon grass broken\n* 4T honey\n\n### Instructions\n1. Take it to boil. \n2. Longer the better. \n3. Can reboil.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "3xah4pw4igpwxvs53dgte55pvm", "title": "Peri Peri Chicken", "ainfo": "Peri Peri Chicken", "category": "mains", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "6 bone-in chicken thighs", "notes": "# Peri Peri Chicken\n\n### Ingredients\n* **6** bone-in chicken thighs\n* **2 tablespoons** olive oil\n* **1/2** lemon, juiced\n* **3 cloves** garlic, minced\n* **1 small** red chili, finely chopped\n* **1 tablespoon** brown sugar\n* **1 teaspoon** dried oregano\n* **1 teaspoon** sweet paprika\n* **1/4 teaspoon** cayenne pepper\n* **1/4 teaspoon** salt\n\n### Instructions\n1. In a food processor, add the olive oil, lemon juice, garlic, red chili, brown sugar, dried oregano, sweet paprika, cayenne pepper, and salt, and blend until smooth.\n2. Place the chicken to a bowl and cover with the marinade. Marinate for at least 10 minutes or overnight.\n3. Lightly oil a grill pan or preheat a charcoal grill to medium. Add the chicken and cook for 12 minutes, turning regularly, until it reaches an internal temperature of 165°F. \n4. *Alternative method:* Place the marinated chicken in a baking dish and bake for 30 minutes or until it reaches an internal temperature of 165°F.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "7enaci7m2xygjipomk73k6qki4", "title": "Pina Colada", "ainfo": "Pina Colada", "category": "mains", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 ounces light rum", "notes": "# Pina Colada\n\n### Ingredients\n* **2 ounces** light rum\n* **1 ½ ounces** cream of coconut\n* **1 ½ ounces** pineapple juice\n* **½ ounce** lime juice, freshly squeezed\n* **Garnish:** pineapple wedge\n* **Garnish:** pineapple leaf\n\n### Steps\n1. Add the rum, cream of coconut and pineapple and lime juices to a shaker with ice and shake vigorously for 20 to 30 seconds.\n2. Strain into a chilled Hurricane glass over pebble ice.\n3. Garnish with a pineapple wedge and pineapple leaf.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "34pck3ouuxpaodqtv2qt67pkke", "title": "Pizza Sauce", "ainfo": "Pizza Sauce", "category": "sauces", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 tbsp olive oil", "notes": "# Pizza Sauce (Ooni Version)\n\n### Ingredients\n* **2 tbsp** olive oil\n* **2** garlic cloves, crushed or finely chopped\n* **4 cups** (800g) canned whole plum tomatoes (preferably San Marzano)\n* **2 heaped tsp** sugar\n* **1 tsp** salt\n* **Handful** of basil leaves, roughly chopped\n* **Pinch** of freshly ground black pepper\n\n### Instructions\n1. Place the oil in a pan over a medium heat. When warm, add the garlic and fry until softened but not brown.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "x6afqlfwbrfku43xlk526idzde", "title": "Pork Tenderloin", "ainfo": "Pork Tenderloin", "category": "mains", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 pork tenderloins", "notes": "# Juicy and Tender Pork Tenderloin Roast\n\n### Ingredients\n* **2** pork tenderloins\n* **2 tablespoons** olive oil, divided\n* **1 teaspoon** sweet paprika\n* **1 teaspoon** garlic powder\n* **½ teaspoon** onion powder\n* **½ teaspoon** dried thyme\n* **½ teaspoon** dried rosemary\n* **Salt and fresh ground pepper**, to taste\n* **4 cloves** garlic, minced\n* **¼ cup** honey (omit if keto)\n* **1 tablespoon** Sriracha (or any hot sauce you like)\n* **3 tablespoons** low-sodium soy sauce (or coconut aminos for paleo)\n* **1 tablespoon** dijon mustard\n\n### Instructions\n1. Preheat your oven to 375°F (190°C). Line a baking dish with aluminum foil or parchment paper and set it aside. Pat dry the pork tenderloins with paper towels.\n2. In a small mixing bowl, combine paprika, garlic powder, onion powder, thyme, rosemary, salt, and pepper. Rub this spice mix all over the pork tenderloins.\n3. In a skillet, heat 1 tablespoon of olive oil over medium heat and sear the pork tenderloins until browned on all sides, about 3 to 5 minutes per side. Transfer the pork tenderloins to the prepared baking dish.\n4. In a bowl, combine the minced garlic, honey, soy sauce, mustard, Sriracha, and the remaining 1 tablespoon of olive oil; whisk until well combined. Brush this mixture over the pork tenderloins. Keep some of the mixture for serving. \n5. Roast the pork tenderloins for 15 minutes, then remove them from the oven.\n6. Tent a piece of foil over the pork tenderloins so the top doesn't burn, but the inside continues to cook. Put back in the oven and continue to cook for 15 more minutes, or until the internal temperature of the pork loin reaches 145°F (62°C). Use an Instant Read Thermometer to check for doneness.\n7. Remove the baking dish from the oven and loosely cover the meat with foil; allow to rest for 10 minutes. Slice the roasted pork tenderloins and serve, garnished with rosemary, orange slices, and the reserved glaze on the side.", "updatedAt": "2026-08-16T01:00:28Z", "photos": ["pork-tenderloin.jpg"], "photo": "pork-tenderloin.jpg"}, {"uuid": "mh5hgxgony6hl6mvq7oitvv2ha", "title": "Potato Casserole", "ainfo": "Potato Casserole", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 lbs. frozen hash brown (1/8-inch-thick – little cubes) – THAW", "notes": "# Potato Casserole\n\n### Ingredients\n* **2 lbs.** frozen hash brown (1/8-inch-thick – little cubes) – THAW\n* **1 stick** of butter\n* **1 teaspoon** of salt\n* **1 teaspoon** of pepper\n* **1 teaspoon** of garlic powder\n* **16 oz.** of sour cream\n* **1 can** of CONDENSED cream of chicken soup\n* **1 cup** of dry onion (more or less per personal taste)\n* **2 cups** of grated cheese (could use Mexican three cheese mix)\n* **3 or 4 cups** of Corn Flakes (or as much as you can cover the top) – CRUSH by hands\n* 9 x 13 non-stick baking pan or spray pan\n\n### Instructions\n1. Melt the butter in the microwave.\n2. Mix together well: melt butter, salt, pepper, garlic powder, sour cream, condensed cream of chicken soup, dry onion, cheese.\n3. Then mix hash browns in with the batch.\n4. Put in the 9 x 13 non-stick (or spray) baking pan.\n5. Melt ¼ stick of butter and pour over the top.\n6. Crush by hand the Corn Flakes and spread on top.\n7. Bake 350°F for 45 minutes to 1 hour (UNCOVERED) – **Do not cover while baking**.\n\n**Option:** Before eating, you can broil a few minutes to brown the top and for crunchier top.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "qiqgozftsjedloz2jrso5pw2ja", "title": "Potato Stacks (Potato Pavé)", "ainfo": "Potato Stacks (Potato Pavé)", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "3 peeled russet potatoes", "notes": "# Potato Stacks (Potato Pavé)\n\n### Ingredients\n\n#### First Stage (Bake & Press)\n* **3** peeled russet potatoes\n* **¾ cup** heavy cream\n* **Nutmeg** (to taste)\n* **Clarified butter**\n* **Salt and finely ground black pepper**\n\n#### Second Stage (Sauté)\n* **2 tablespoons** vegetable oil\n* **3 tablespoons** butter\n* **Some sprigs** of thyme\n* **4 cloves** of garlic\n* **Salt and pepper**\n* **Chopped thyme**\n\n### Instructions\n1. **First Stage:** Cut the potatoes extremely thin. Layer them in a dish with the cream, nutmeg, clarified butter, salt, and black pepper (similar to a potato gratin). Bake at 350°F / 180°C for 90 minutes. Once baked, weight the dish down to compress it and let it cool in the refrigerator overnight.\n2. **Second Stage:** Cut the compressed potato terrine into uniform squares or slices. Sauté the squares in vegetable oil and butter along with sprigs of thyme and garlic cloves. Season with additional salt, pepper, and chopped thyme as desired until crisp and golden brown on all sides.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "bqq7wpmnba6da6ooh7qv3vnpiq", "title": "Restaurant-Style Spanish Rice", "ainfo": "Restaurant-Style Spanish Rice", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 tablespoons vegetable oil", "notes": "# Restaurant-Style Spanish Rice\n\n### Ingredients\n* **2 tablespoons** vegetable oil\n* **2 cups** long-grain white rice\n* **1 cube** chicken-flavored bouillon\n* **4 cups** water (or 4 cups lower-sodium chicken broth, omitting the bouillon)\n* **1 (8-ounce) can** tomato sauce\n* **1 teaspoon** minced garlic\n* **1 teaspoon** salt\n* **1 teaspoon** ground cumin\n* **Dash** garlic pepper\n* **Chopped fresh cilantro** (optional, for topping)\n\n### Instructions\n1. Heat oil in a large frying pan over medium heat.\n2. Add rice and cook, stirring until golden brown, about 5 minutes.\n3. Combine bouillon and water in a microwave-safe container and microwave for 3 minutes.\n4. When rice is brown, add bouillon mixture, tomato sauce, salt, garlic, cumin, and garlic pepper to the pan.\n5. Stir and cover the pan. Let simmer for 30–40 minutes, stirring occasionally, or until all is cooked and there is no liquid left[cite: 14]. Fluff before serving and top with cilantro if desired.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "uqfibxhee4nrnju7qlgbayhl4i", "title": "Roasted Balsamic Baby Carrots", "ainfo": "Roasted Balsamic Baby Carrots", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1/4 c. balsamic vinegar", "notes": "# Roasted Balsamic Baby Carrots\n\n### Ingredients\n* **1/4 c.** balsamic vinegar\n* **1/4 c.** extra-virgin olive oil\n* **2 tbsp.** maple syrup\n* **1/2 tsp.** crushed red pepper flakes\n* **1 1/2 lb.** baby carrots\n* Kosher salt\n* Freshly ground black pepper\n* Freshly chopped parsley, for serving\n\n### Instructions\n\n#### Step 1\nPreheat oven to 400°. In a large bowl, combine vinegar, oil, syrup, and red pepper flakes. Add carrots, season with salt and pepper and toss to coat. Place carrots on a large baking sheet, being to sure not to overcrowd.\n\n#### Step 2\nRoast until carrots are fork-tender and slightly charred, 30 minutes.\n\n#### Step 3\nGarnish with parsley to serve.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "4przp7nzxpkoyxxzps5asqflxi", "title": "Sesame Crusted Tuna Steak", "ainfo": "Sesame Crusted Tuna Steak", "category": "asian", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 Tablespoons soy sauce", "notes": "# Sesame Crusted Tuna Steak\n\n### Ingredients\n\n#### Grilled Tuna Steak Marinade\n* **2 Tablespoons** soy sauce\n* **1 Tablespoon** rice wine mirin\n* **1 Tablespoon** honey\n* Juice and zest of **1** lime\n* **1 teaspoon** sesame oil\n* **½ teaspoon** cayenne pepper\n* Tuna steaks\n\n#### Sesame Crust\n* **¼ cup** white sesame seeds\n* **¼ cup** black sesame seeds\n\n#### Dipping Sauce\n* **3 tablespoons** soy sauce\n* **1 tablespoon** unseasoned rice vinegar\n* **1 teaspoon** honey\n* **1 tablespoon** toasted sesame oil\n* **2 teaspoons** finely grated fresh ginger\n* **1 teaspoon** minced fresh garlic\n\n### Instructions\n1. Whisk together all the marinade ingredients in a dish, add the tuna steaks, and let marinate.\n2. Combine the white and black sesame seeds on a plate. Remove the tuna from the marinade and press firmly into the seeds to create an even crust on all sides.\n3. Sear or grill the tuna steaks quickly to your desired doneness.\n4. Whisk together all dipping sauce ingredients in a small bowl and serve alongside the sliced tuna.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "fzcurcgsjteofnw5dlt2jxnude", "title": "Shredded Red Chili Chicken (Liz)", "ainfo": "Shredded Red Chili Chicken (Liz)", "category": "mains", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Garlic (for boiling)", "notes": "# Shredded Red Chili Chicken\n\n### Ingredients\n* Chicken\n* Water\n* Garlic (for boiling)\n* Salt (for boiling)\n* Chili powder\n* Cumin (optional, to taste)\n* Oil\n* Flour\n\n### Instructions\n1. Boil the chicken in water with garlic and salt. \n2. When the chicken is done, remove it and save the chicken broth. Shred the chicken meat.\n3. In a bowl, combine the chili powder with some of the chicken broth. If using cumin, add a little to the chili powder mixture.\n4. In a separate pan, combine oil and flour to create a thickening base. \n5. Pour the chili powder and broth mixture into the pan with the flour and oil, stirring continuously until the sauce thickens up.\n6. Place the shredded chicken inside the red chili sauce and mix until combined.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "boeavtakerxz6fubf7zre5q3sq", "title": "Smoked Beef Ribs", "ainfo": "Smoked Beef Ribs", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Olive oil (used as a binder)", "notes": "# Smoked Beef Ribs\n\n### Ingredients\n* Ribs\n* Salt\n* Pepper\n* Garlic\n* Paprika\n* Olive oil (used as a binder)\n* BBQ Sauce\n\n### Instructions\n1. Apply olive oil to the ribs as a binder, then season with salt, pepper, garlic, and paprika.\n2. Smoke at 275°F for 2.5 hours.\n3. Wrap the ribs in butcher paper and cook for another 0.5 hours.\n4. Unwrap the ribs, apply BBQ sauce, and cook for a final 0.5 hours.\n5. Pull the ribs when they pass the bend test (approximately 199°F internal temperature).", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "skferjipakc4qwlsailvfqtrxq", "title": "Smoked Brisket ", "ainfo": "Smoked Brisket ", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Rub", "notes": "# Smoked Brisket\n\n**Rub**\n* 3T sea salt\n* 6T coarse black pepper\n* 2T garlic powder\n* 2t Onion powder\n* 1t White pepper\n* 1T smoked paprika\n* 1t sweet paprika \n* 1t cayenne\n* ½t ground cumin\n* 1t cinnamon\n* ½t oregano and Thyme\n* 8T brown sugar \n\n**Trim**\n* Remove meat less than width of thumb on flat\n* Trim the hard fat\n* Trim fat cap to ½ inch\n* Trim any fly away pieces \n\n**Apply Rub**\n* At least 2 hours before cook, preferably longer\n* Use 1t of olive oil per side as a binder. Sprinkle rub liberally\n* Place back in fridge \n\n**Cook**\n* Preheat smoker to 180-225\n* Place fat side up\n* Smoke until fat starts to render/doesn't bounce, dark bark is set (~170-180 IT/~9-10 hrs)\n* Foil boat fat side down with a thin layer of wagyu tallow on bottom\n* Increase temp to 225 or 250\n* Wait for 198 IT on flat and check for probe tender\n* Continue smoking until probe tender (~202-204 IT)\n* Pull and rest in cooler, loose foil top, for 4 hours or more\n\n\n", "updatedAt": "2026-08-16T01:00:28Z", "photos": ["smoked-brisket-3.jpg", "smoked-brisket.jpg", "smoked-brisket-2.jpg"], "photo": "smoked-brisket-3.jpg"}, {"uuid": "ugkdaffp6ztg7ffg6coua7du74", "title": "Smoked Burgers", "ainfo": "Smoked Burgers", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Olive oil", "notes": "# Smoked Burgers\n\n### Ingredients\n* Olive oil\n* Garlic\n* Holy Cow seasoning\n* 80/20 ground chuck\n\n### Instructions\n1. Make the 80/20 ground chuck into patties and season with Holy Cow seasoning.\n2. Heat the smoker to 225°F.\n3. Cook the patties for 45 minutes, or until the internal temperature (IT) reaches 135°F (approximately 1 hour total).\n4. Pull the patties off and heat the smoker up to 400°F, opening the burn plate.\n5. Sear the patties for 2 minutes on each side.", "updatedAt": "2026-08-16T01:00:27Z", "photos": ["smoked-burgers.jpg"], "photo": "smoked-burgers.jpg"}, {"uuid": "qyppkx65pra7lxiur7smnwds7e", "title": "Smoked Chicken with Alabama White Sauce", "ainfo": "Smoked Chicken with Alabama White Sauce", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "4 cups mayo", "notes": "# Smoked Chicken with Alabama White Sauce\n\n### Ingredients\n\n#### White Alabama Sauce\n* **4 cups** mayo\n* **3** lemons\n* **4T** Worcestershire\n* **2T** white vinegar\n* **3T** hot sauce\n* **2T** salt\n* **4T** Dijon mustard\n* **4T** brown sugar\n* **1T** onion powder\n* **1T** black pepper\n* **3T** Honey\n\n#### For the Chicken\n* Chicken\n* Salt (for dry brine)\n* BBQ rub\n\n### Instructions\n1. Spatchcock the chicken and dry brine it with salt overnight in the refrigerator.\n2. Apply your BBQ rub liberally over the chicken.\n3. Smoke at 375°F until the internal temperature reaches 160°F.\n4. Remove the chicken and dunk it completely in the Alabama white sauce before serving.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "c6my3ajoikjbb6kfgsscf4ougi", "title": "Smoked Chuck Roast pulled beef", "ainfo": "Smoked Chuck Roast pulled beef", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Chuck Roast", "notes": "# Smoked Chuck Roast pulled beef\n\n### Ingredients\n* Chuck Roast\n* 1 onion sliced\n* 1 onion diced\n* 1 carrot sliced\n* 3 small peppers sliced\n* 4 cups beef stock\n* SPG seasoning\n* Wagyu tallow\n\n### Instructions\n1. Apply seasoning night before.\n2. Preheat smoker to 225, place fat side up for 3 hours. Spritz with beef stock every hour. Put 3 scoops of tallow to smoke. Include smoke tube.\n3. Place veggies in a bottom of the pan, add 2-3 cups of broth. Place roast on top. Increase temp to 250.\n4. Smoke for ~3 more hours (165 IT) then pour tallow over then wrap with aluminum foil over the top of aluminum pan. Increase temp to 265.\n5. Cook until 202 IT or probe tender. Rest for 15m.\n6. Pour juice into fat separator. Shred meat outside of pan. Place shredded meat back into pan and pour separated fat over the top.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "enlnup6khf6n3fzeatdznlvsfm", "title": "Smoked pineapple", "ainfo": "Smoked pineapple", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 whole pineapple (smell for sweet bottom)", "notes": "# Smoked pineapple\n\n### Ingredients\n* **1** whole pineapple (smell for sweet bottom)\n* **1t** cinnamon\n* **1t** brown sugar (optional)\n\n### Instructions\n1. Preheat to 225. Cut pineapple in half lengthwise including leaves and apply cinnamon on top.\n2. Place face down 30m and flip.\n3. Cook for another 30-45m.\n4. Pull and let cool. Cut into watermelon slices.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "5hozobanp6djhrjlt4mjwc4ree", "title": "Smoked Pulled Pork", "ainfo": "Smoked Pulled Pork", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Pork butt", "notes": "# Smoked Pork Butt\n\n### Ingredients\n* Pork butt\n* Salt (for prepping)\n* Apple cider vinegar (for spraying)\n* Honey Hog Hot rub\n* **4 fat slices** of butter\n* Brown sugar\n\n#### Rub\n* **6T** Brown sugar\n* **3T** Black pepper\n* **2T** garlic powder\n* **2T** paprika\n* **1T** Onion powder\n\n### Instructions\n1. **Prep:** Score the fat side of the pork butt and sprinkle it with salt. Mix your rub ingredients and apply the rub generously to all sides.\n2. **Cook:** Place on the smoker at 225-250°F, fat side up (or down, depending on preference). \n3. Once the bark sets, spray the meat only with apple cider vinegar.\n4. When it reaches wrapping temperature (around 170°F and the fat is starting to render), pull it from the smoker. Sprinkle Honey Hog Hot rub on top, then layer on 4 fat slices of butter and a handful of brown sugar.\n5. Place the pork butt into an aluminum pan, foil tightly over the top, and return to the smoker.\n6. Pull from the smoker when it is probe tender (around 202°F) and let it rest.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "uj5qxhctuesjzofrw3kvxqtace", "title": "Smoked Roaster Chicken", "ainfo": "Smoked Roaster Chicken", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "5 lb roaster chicken, giblets removed", "notes": "# Smoked Roaster Chicken\n\n### Ingredients\n* **5 lb** roaster chicken, giblets removed\n\n#### Seasoning Rub:\n* **1 tbsp** brown sugar\n* **1 tbsp** black pepper\n* **1 tbsp** garlic powder\n* **1 tbsp** paprika\n* **1 tbsp** onion powder\n* **2 tsp** sea salt\n* **½ tsp** cayenne pepper\n\n### Instructions\n1. Pre-heat smoker to 225°F.\n2. Remove giblets from inside of roaster chicken and rinse bird with fresh water.\n3. With breast side down, cut on each side of backbone with poultry shears to remove the backbone.\n4. Turn chicken over, breast side up, and push down on the breasts with the palm of your hand firmly. This should break the breast bone allowing chicken to lay flat. Using your fingers, loosen the skin from the breast meat.\n5. Dry chicken with paper towels and then coat with olive oil. Make sure to get both sides of the bird and underneath the loosened skin. *(Note: Instructions cut off on image).*", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "kq5llmh5uu2vkcvpub6j77nqdi", "title": "Smoked Salmon", "ainfo": "Smoked Salmon", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Salt (for dry brine)", "notes": "# Smoked Salmon\n\n### Ingredients\n* Salmon\n* Salt (for dry brine)\n* Pepper\n* Irish butter (1-2T)\n\n### Instructions\n1. Dry brine the salmon with salt.\n2. Preheat the smoker to 200°F.\n3. Dust the salmon with pepper, applying it to the top last.\n4. Cook for 1 to 1.5 hours until nicely browned.\n5. Increase the smoker temperature to 275°F.\n6. Wrap each piece of salmon in aluminum foil (grill side flip) and place 1-2T of Irish butter on top.\n7. Cook until the internal temperature reaches 155°F.\n8. Once the temperature is reached, leave it in the smoker for 1 minute.\n9. Pull and serve.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "qgmvio4m5hcloyejkudjx3lnmu", "title": "Smoked Salsa", "ainfo": "Smoked Salsa", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 pound steak tomatoes, cut into wedges with the middle stem removed", "notes": "# Smoked Salsa\n\n### Ingredients\n* **1 pound** steak tomatoes, cut into wedges with the middle stem removed\n* **¼ cup** red onion, cut into a wedge\n* **1** jalapeño, cut in half\n* **4 cloves** garlic\n* **1 cup** fresh cilantro leaves\n* Juice of **1** lime\n* Salt to taste\n\n### Instructions\n1. Smoke the garlic, tomatoes, onion, and jalapeños for 90 minutes at 225°F.\n2. Add the smoked ingredients to a blender.\n3. Add the cilantro, lime juice, and **1t** of salt.\n4. Blend until desired consistency is reached, then serve.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "cggpjyzc5hlsphnypuh3twcfei", "title": "Smoked Santa Maria Tri-tip or Ribeyes", "ainfo": "Smoked Santa Maria Tri-tip or Ribeyes", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1T sea salt (apply to meat separately and rest in fridge for 30m)", "notes": "# Smoked Santa Maria Tri-tip or Ribeyes\n\n### Ingredients\n\n#### Rub\n* **1T** sea salt (apply to meat separately and rest in fridge for 30m)\n* **1T** black pepper\n* **1T** paprika\n* **1T** fresh rosemary (minced)\n* **1t** garlic powder\n* **1-2 clove** of minced garlic\n* **2t** onion powder\n* **1t** cayenne pepper\n* **1t** chipotle chili pepper\n\n### Instructions\n1. Set smoker to 225, pull at 115-120 IT (~1.5h).\n2. Reverse sear with butter and rosemary.\n3. Rest for 15m.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "fsef5hlgtd63vxgxw4exjegmaq", "title": "Smoked Spatchcock Chicken", "ainfo": "Smoked Spatchcock Chicken", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 tablespoon brown sugar", "notes": "# Smoked Spatchcock Chicken\n\n### Ingredients\n\n#### Seasoning Rub\n* 1 tablespoon brown sugar\n* 1 tbsp black pepper\n* 1 tablespoon garlic powder\n* 1 tablespoon paprika\n* 1 tablespoon onion powder\n* 2 teaspoon sea salt\n* ½ teaspoon cayenne pepper\n\n#### Dry Rub\n* ⅓ cup brown sugar\n* 1 teaspoon Kosher salt\n* 1 teaspoon onion powder\n* 1 teaspoon paprika\n* 1 teaspoon onion salt\n* ½ teaspoon garlic powder\n* ¼ teaspoon freshly ground black pepper\n* ¼ teaspoon cumin\n* ¼ teaspoon cinnamon\n* ¼ teaspoon cayenne\n\n### Instructions\n1. Preheat to 225.\n2. Cook for 45m then increase to 400-425.\n3. Pull at 160 IT and rest for 15m with a loose foil tent.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "zoj5m3ybq5ho7tw5ynrqhiuphu", "title": "Smoked St Louis Ribs", "ainfo": "Smoked St Louis Ribs", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Rib racks", "notes": "# Smoked St Louis Ribs\n\n### Ingredients\n* Rib racks\n* Salt and pepper seasoning\n* Lard (3 heaps total / 1.5 per rack)\n* 50/50 apple cider vinegar and water solution (for spritzing)\n\n### Instructions\n1. Season the ribs with salt and pepper, score the membrane on the back, and trim any flyaways or loose pieces of meat.\n2. Place 3 heaps of lard (1.5 per rib rack) into an aluminum pan to melt and smoke.\n3. Preheat the smoker to 225°F. Place the lard pan and the ribs (meat side up) in the smoker for 3 hours.\n4. After 2 hours (or when the meat turns a deep red color and starts to dry out), begin spritzing with the 50/50 apple cider vinegar and water solution every 15-20 minutes.\n5. Increase the smoker temperature to 275°F for 1 hour to achieve pullback, continuing to spritz every 15-20 minutes.\n6. Wrap the ribs in butcher paper, pouring the smoked liquid lard over them. Lay them meat side down for 30 minutes.\n7. Pull the ribs when they hit 207°F internal temperature, feel probe tender, or pass the bend test.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "77e3xmfnsquioy72tmf4alxmj4", "title": "Smoked Wings", "ainfo": "Smoked Wings", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Chicken wings", "notes": "# Smoked Wings\n\n### Ingredients\n* Chicken wings\n* Cooking spray or oil binder\n\n#### Wing Rub\n* **2 Tablespoons** brown sugar\n* **1 Tablespoon** baking powder\n* **1 Tablespoon** smoked paprika\n* **1 teaspoon** chili powder\n* **1 teaspoon** chipotle chili powder\n* **1 teaspoon** garlic powder\n* **1 teaspoon** onion powder\n* **1 teaspoon** kosher salt\n* **1 teaspoon** black pepper\n\n#### Buffalo Sauce\n* **8T (1 stick)** of butter\n* **6T** Frank's RedHot\n* **½t** of Worcestershire sauce\n* **½t** of cayenne pepper\n\n#### Valentina's Honey Hot Sauce\n* **8T (1 stick)** of butter\n* **6T** Valentina's Very Hot sauce\n* **2T** honey\n\n### Instructions\n1. Pat the chicken wings completely dry with paper towels.\n2. Dust the wings evenly with the dry wing rub.\n3. Heat your smoker to 325°F.\n4. Place the wings skin side down and cook for 15 minutes.\n5. Flip the wings and cook for another 15 minutes.\n6. Flip one more time and cook for another 15 minutes.\n7. Pull the wings from the smoker and toss them thoroughly in either the Buffalo or Valentina's Honey Hot sauce.\n8. Place the sauced wings back into the smoker for 5 final minutes to lock in the sauce.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "6ea3bbv7vt2r6n4n5lv7blyctm", "title": "Sourdough Proofing Times based on Temp", "ainfo": "Sourdough Proofing Times based on Temp", "category": "reference", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "", "notes": "", "updatedAt": "2026-08-16T01:00:28Z", "image": "fermentation-guide.png"}, {"uuid": "btmtaeqkpkunqepu3qqv3q2woi", "title": "Sourdough Baguettes", "ainfo": "Sourdough Baguettes", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1.8oz (50g) mature sourdough starter", "notes": "# Sourdough Baguettes\n\n### Ingredients\n\n#### For Levain Build:\n* **1.8oz (50g)** mature sourdough starter\n* **1 tbsp (25g)** organic whole wheat flour\n* **2.6oz (75g)** organic bread flour\n* **2.5oz (70g)** warm water\n\n#### For the Final Mix:\n* **17.6oz (500g)** all purpose flour\n* **2tsp (10g)** kosher salt\n* **3.5oz (100g)** levain (from build above)\n* **Up to 13.2oz (375g)** warm water\n\n### Instructions\n1. Build your levain by mixing all the levain ingredients together in a large bowl. Let it rest at an ambient temperature of 72–75°F (22–23°C) for 3–4 hours. It is ready when you pull it and see a web-like structure.\n2. Add 10.5oz (300g) of your warm water to your developed levain and mix to dissolve.\n3. Add 17.6oz (500g) of your all-purpose flour to the liquid and mix until no dry flour is left. Let the dough rest for 30 minutes.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "vlb2hxohmtsip632monnwtyfte", "title": "Sourdough Bread", "ainfo": "Sourdough Bread", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Total Dough Weight: 800 g", "notes": "# Sourdough Bread\n\n### Parameters\n* **Total Dough Weight:** 800 g\n\n### Ingredients\n* **Bread Flour (55%):** 217.8 g\n* **Whole Wheat Flour (45%):** 178.2 g\n* **Water (80%):** 316.8 g\n* **Sourdough Starter (20%):** 79.2 g\n* **Salt (2%):** 7.9 g", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "jr4qt275vcxok5dgnybmhaqtei", "title": "Sourdough Chocolate Chip Cookies", "ainfo": "Sourdough Chocolate Chip Cookies", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 sticks butter", "notes": "# Sourdough Chocolate Chip Cookies\n\n### Ingredients\n* **2 sticks** butter\n* **½ cup** granulated sugar\n* **½ cup** brown sugar\n* **1** egg\n* **¾ cup** sourdough starter\n* **2 teaspoons** vanilla extract\n* **2 cups** all-purpose flour\n* **1 teaspoon** salt\n* **½ teaspoon** baking soda\n* **¼ teaspoon** baking powder\n* **2 cups** chocolate chunks\n\n### Instructions\n\n#### For Quick Version:\n1. Preheat oven to 350 degrees.\n2. In a stand mixer with paddle attachment, cream butter and sugar together for a few minutes until light and fluffy.\n3. Add egg and mix until well incorporated.\n4. Add vanilla and sourdough starter and mix until just combined.\n5. In a separate bowl, mix dry ingredients together.\n6. Add the dry ingredients to the wet ingredients about ⅓ at a time, and mix until just incorporated.\n7. Add chocolate and gently combine.\n8. Place on a parchment lined baking sheet and bake for 10 minutes or until the edges begin to turn golden.\n\n#### Long Fermented Version:\n1. The night before, mix together melted butter, sourdough starter and flour in a stand mixer bowl and cover. Allow the grains to ferment for 8–24 hours.\n2. The next day, preheat oven to 350.\n3. Add egg and vanilla to the sourdough starter mixture, and mix together well.\n4. Sprinkle the remaining dry ingredients into the bowl and stir.\n5. Fold in chocolate chunks.\n6. For best results, refrigerate dough for at least one hour prior to baking.\n7. Bake for 10 minutes or until the edges start to turn golden brown.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "s5fkaphbyvngdqspvqxc72f3ou", "title": "Sourdough Discard", "ainfo": "Sourdough Discard", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "7 grams of commercial yeast (one packet) is roughly equivalent to 100 grams (about 1/2 cup) of sourdough starter.", "notes": "# How to Add Sourdough Discard to Any Recipe\n\n### Substitution Ratio\n* 7 grams of commercial yeast (one packet) is roughly equivalent to 100 grams (about 1/2 cup) of sourdough starter.\n\n### Adjusting Yeast-Based Recipes\nTo substitute discard or active starter in recipes calling for commercial yeast:\n* Omit the yeast.\n* Subtract 50 grams of flour (a scant 1/2 cup) and 50 grams of liquid (about 3 tablespoons) from the recipe.\n* Add 100 grams (about 1/2 cup) of sourdough starter.\n\n### Adjusting Non-Yeasted Recipes\nIn recipes that don't call for yeast, like banana bread or pancakes:\n* Subtract 50 grams of flour (a scant 1/2 cup) and 50 grams of liquid (about 3 tablespoons).\n* Add 100 grams of starter or discard (about 1/2 cup).\n\n### Adjusting Low or No Liquid Recipes\nFor recipes like chocolate chip cookies that don't contain a lot of liquid:\n* Get creative by eliminating water by browning the butter.\n* Alternatively, consider using only egg yolks instead of egg whites to reduce the water even further.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "ecb2d7brxoasvzylfknjuyvkbe", "title": "Sourdough Discard Boule / Dough", "ainfo": "Sourdough Discard Boule / Dough", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "100g Cold, refrigerated discard", "notes": "# Sourdough Discard Boule / Dough\n\n### Ingredients\n* **100g** Cold, refrigerated discard\n* **330g** Filtered room temp water\n* **500g** AP flour (unbleached, preferably Costco green/white bag)\n* **10g** Salt\n* **30g** Filtered room temp water (for mixing/fraisage)", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "kf3o6wwnr32bjzooyaj65nevoe", "title": "Sourdough Discard Cinnamon Rolls", "ainfo": "Sourdough Discard Cinnamon Rolls", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "4 tbsp butter, softened", "notes": "# Sourdough Discard Cinnamon Rolls\n\n### Ingredients\n\n#### For the Dough:\n* **4 tbsp** butter, softened\n* **¾ cup** sourdough starter discard\n* **2 tbsp** honey\n* **3 cups** flour (all purpose or whole wheat pastry flour)\n* **1 tsp** fine sea salt\n* **1 large** egg\n* **1 tsp** yeast\n* **⅔ cup** milk, warmed (but not hot)\n\n#### For the Filling:\n* **½ cup** brown sugar\n* **2 tbsp** honey\n* **2 tbsp** butter, melted\n* **½ tsp** vanilla extract\n* **1 tsp** cinnamon\n\n#### For the Frosting:\n* **4 oz** cream cheese, softened\n* **1 tbsp** butter, softened\n* **3 tbsp** powdered sugar\n* **½ tsp** vanilla extract\n* **1 tbsp** milk\n\n### Instructions\n1. In the bowl of a stand mixer, or in a large bowl, mix all of the dough ingredients until a dough starts to form. Use the dough hook (or your hands) to knead the dough until you have a smooth dough, about 2–3 minutes.\n2. Cover the bowl and let the dough rise at room temperature for 2–3 hours, or until puffy and doubled in size.\n3. Gently turn the dough out onto a lightly floured surface and roll into a ¼\" thick rectangle. I like to roll it on a piece of parchment or silicone baking mat to make it easier to roll up later.\n4. Mix the brown sugar, honey, butter, vanilla, and cinnamon for the filling in a small bowl. Spread the filling mixture evenly over the dough, leaving about an inch bare on one of the long edges.\n5. Roll the dough up starting on the long edge that has filling all the way to the edge. Use a bench scraper to help if the dough is sticking a little bit.\n6. Cut the dough into 12 even rolls. Place them in a baking dish that has been greased or lined with parchment paper.\n7. Cover the dish and let the rolls rise for 1.5 to 2 hours at room temperature, or place them in the refrigerator for an extended rise time overnight. At the end of the rise, rolls should look puffy but may not have doubled in size.\n8. If your rolls are room temperature, heat the oven to 400°F. Uncover and bake 16–20 minutes. If they are coming from the refrigerator, heat the oven to 375°F. Uncover the rolls and bake 20–25 minutes.\n9. While rolls are baking, make the icing. Whisk softened cream cheese, butter and powdered sugar until no lumps remain. Add vanilla and milk and whisk until smooth.\n10. Remove rolls from the oven and frost while warm, or frost individually as you eat them if you plan to save some for later.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "2ur6cdchobx6mrp555e42v6idm", "title": "Sourdough Discard Lemon Shortbread Cookies", "ainfo": "Sourdough Discard Lemon Shortbread Cookies", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "½ cup sourdough discard", "notes": "# Sourdough Discard Lemon Shortbread Cookies\n\n### Ingredients\n* **½ cup** sourdough discard\n* **1 cup** unsalted butter, softened\n* **½ cup** powdered sugar\n* **1 tbsp** lemon zest\n* **2 tbsp** fresh lemon juice\n* **2 cups** all-purpose flour\n* **¼ tsp** salt\n* **¼ cup** granulated sugar (for rolling)\n\n#### For the Glaze:\n* **1 cup** powdered sugar\n* **2 tbsp** fresh lemon juice\n* **½ tsp** vanilla extract\n\n### Instructions\n1. **Cream Butter and Sugar:** In a mixing bowl, beat butter and powdered sugar until light and fluffy.\n2. **Add Lemon & Sourdough:** Mix in sourdough discard, lemon zest, and lemon juice until fully combined.\n3. **Incorporate Dry Ingredients:** Stir in flour and salt until a dough forms.\n4. **Shape and Chill:** Roll the dough into a log, wrap in plastic wrap, and chill for at least 2 hours.\n5. **Slice and Bake:** Preheat oven to 350°F (175°C). Slice dough into ¼-inch rounds, roll edges in granulated sugar, and place on a lined baking sheet. Bake for 12–15 minutes until edges are lightly golden. Cool completely.\n6. **Prepare the Glaze:** Whisk powdered sugar, lemon juice, and vanilla extract until smooth.\n7. **Glaze:** Dip or drizzle cookies with glaze, then let set before serving.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "vd24j55frqmwmpgdgzkjcmruqi", "title": "Sourdough Discard Pretzel Bites", "ainfo": "Sourdough Discard Pretzel Bites", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 cup + 2 Tablespoons warm water", "notes": "# Sourdough Discard Pretzel Bites\n\n### Ingredients\n\n#### For the Dough\n* **1 cup + 2 Tablespoons** warm water\n* **1 Tablespoon** dark brown sugar\n* **2 teaspoons** kosher salt\n* **1 ¼ teaspoons** active dry yeast\n* **200 grams (about ¾ cup)** sourdough discard unfed, at room temperature\n* **567 grams (about 4 cups)** all-purpose flour\n* **4 Tablespoons** unsalted butter, melted\n\n#### For Boiling\n* **10 cups** water\n* **⅔ cup** baking soda\n\n#### For Topping\n* **1 egg yolk** beaten with 1 Tablespoon water (to make an egg wash)\n* flaky sea salt\n* everything bagel seasoning\n\n### Instructions\n\n1. Combine the warm water, dark brown sugar, and kosher salt in the bowl of a stand mixer. Sprinkle the yeast on top and let sit for 5 minutes or until the yeast begins to foam. If the yeast does not foam, your yeast is dead and you'll need to start again with fresh yeast.\n2. Add the sourdough discard, flour, and melted butter and mix using the dough hook attachment until well-combined. If needed, add more flour or water (1 Tablespoon at a time) to reach your desired dough consistency. Change to medium speed or knead by hand for 4-5 minutes until a smooth dough forms. The dough should not be sticky.\n3. Shape the dough into a ball and transfer to a large, oiled bowl. Cover with plastic wrap and let rise for about 1 hour, or until doubled in size.\n4. Preheat the oven to 450°F. Line 2 half-sheet baking trays with parchment paper and set aside. Bring 10 cups of water and ⅔ cup baking soda to a boil in a large pot.\n5. In the meantime, turn the dough out onto a smooth, dry work surface (no need to flour or oil). Divide into 8 equal-sized pieces. Roll each piece into a 12-14 inch rope. Cut the rope into bite-size pieces about 1 ½-inches long. Roll each piece of dough into a ball (roughly the size of a quarter) and place on the prepared baking pan.\n6. Place the pretzel bites in the boiling water mixture for about 30 seconds. Remove using a slotted spatula or spoon and spread on the baking sheet so they're not touching and have room to expand. The bites will be easier to spread while they're still wet; they'll become stickier as they dry.\n7. Lightly brush each pretzel bite with egg wash and sprinkle with your chosen toppings (flaky sea salt, everything bagel seasoning, etc.)\n8. Bake until golden brown, approximately 13-15 minutes. Transfer to a cooling rack to cool fully. Serve with a mustard or your favorite dipping sauce.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "lok4uifevjqhg2uf5inlzu5dmi", "title": "Sourdough English Muffins (Overnight)", "ainfo": "Sourdough English Muffins (Overnight)", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "245g (1 cup plus 1 tsp) milk, whole or 2%[cite: 12]", "notes": "# Sourdough English Muffins (Overnight)\n\n### Ingredients\n* **245g** (1 cup plus 1 tsp) milk, whole or 2%[cite: 12]\n* **120g** (½ cup) water[cite: 12]\n* **56g** (4 tbsp) unsalted butter, cubed[cite: 12]\n* **75g** (heaped ⅓ cup) active sourdough starter[cite: 12]\n* **24g** (2 tbsp) sugar[cite: 12]\n* **500g** (4 cups plus 2 tbsp) all-purpose flour[cite: 12]\n* **9g** (1 ½ tsp) fine sea salt[cite: 12]\n* **Cornmeal or semolina flour**, for dusting[cite: 12]\n\n### Instructions\n1. **Make the Dough:** In a small saucepan, warm the milk, water, and butter together[cite: 12]. Cool slightly before adding to the dough[cite: 12]. In a large bowl, add the sourdough starter and sugar[cite: 12]. Pour in the warm milk mixture while whisking to combine[cite: 12]. Add the flour and salt[cite: 12]. Mix with a fork to form a rough dough, and then finish by hand to fully incorporate the flour[cite: 12]. Cover with a damp towel and let rest at room temperature for 30 minutes[cite: 12].\n2. **Smooth the Dough:** After the dough has rested, return to the bowl and work the dough into a semi-smooth ball[cite: 12].\n3. **Bulk Rise:** Cover the bowl with lightly oiled plastic wrap[cite: 12]. Let rise at room temperature defined as 70°F (21°C) until double in size, about 8–10+ hours[cite: 12]. Once risen, chill overnight in the fridge[cite: 12].\n4. **Shape:** In the morning, remove the cold dough onto a floured work surface[cite: 12]. Rest for 10 minutes[cite: 12]. Line a sheet pan with parchment paper; sprinkle generously with cornmeal to prevent sticking[cite: 12]. With floured hands, pat the dough into a rectangular shape, about ½-inch (1.25 cm) thick[cite: 12]. Cut into 10–12 rounds using the rim of a 3 or 5 inch drinking glass, large jar, or biscuit cutter[cite: 12]. Place the rounds onto your sheet pan and dust the tops with cornmeal[cite: 12].\n5. **Second Rise:** Cover the dough with a damp towel or inverted rimmed sheet pan[cite: 12]. Let rest at room temperature until noticeably puffy, about 1 hour or more depending on temperature[cite: 12].\n6. **Cook:** Warm a large, non-stick skillet over low heat[cite: 12]. Do a test batch: place one round of dough into the pan[cite: 12]. Cover with a lid[cite: 12]. Cook on one side for 8–10 minutes, checking at the halfway mark for even browning[cite: 12]. Lower the heat if necessary[cite: 12]. Flip the dough over, cover, and cook the other side for 8–10 minutes[cite: 12]. Repeat to cook the rest of the dough[cite: 12]. When the English muffins are ready, they should feel lightweight and the sides should spring back when pressed gently[cite: 12].\n\n*Note: If the flame is too high, the muffins will brown too quickly on the outside leaving the center undercooked. If this happens, finish baking the muffins in a low-heat oven about 250°F (130°C) until cooked through.*[cite: 12]", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "a46x5xhwl3hchjidmq3w6gm5yy", "title": "Sourdough Oatmeal Cookies", "ainfo": "Sourdough Oatmeal Cookies", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 cup unsalted butter, softened", "notes": "# Sourdough Oatmeal Cookies\n\n### Ingredients\n* **1 cup** unsalted butter, softened\n* **¾ cup** brown sugar\n* **½ cup** granulated sugar\n* **2** eggs\n* **2 teaspoons** vanilla\n* **½ cup** sourdough discard\n* **3 cups** oats\n* **2 cups** all purpose flour\n* **1 teaspoon** baking soda\n* **½ teaspoon** baking powder\n* **2 teaspoons** cinnamon\n* **1 teaspoon** salt\n* **1 cup** raisins (can also sub chocolate chips)\n* **Optional:** ½ cup walnuts\n\n### Instructions\n1. Preheat to 350 degrees.\n2. In a stand mixer with paddle attachment, cream butter, brown sugar and granulated sugar together for a few minutes until light and fluffy. Scrape down the sides on occasion to fully incorporate all ingredients.\n3. Add the eggs in one at a time and mix until well incorporated.\n4. Add vanilla and sourdough discard and mix until just combined.\n5. In a separate bowl, combine the oats, flour, baking soda, baking powder, cinnamon and salt.\n6. Add the dry ingredients to the wet ingredients about ⅓ at a time, then mix until just incorporated.\n7. Fold in raisins and gently combine them into the dough.\n8. Spoon onto a parchment lined baking sheet and bake for 10 minutes or until the edges begin to turn golden.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "kskc5acsbizilmov2vnw7b5t3m", "title": "Sourdough Zucchini Bread", "ainfo": "Sourdough Zucchini Bread", "category": "sourdough", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Yield: one 9\" x 5\" loaf or 12\" tea loaf", "notes": "# Sourdough Zucchini Bread\n\n**Yield:** one 9\" x 5\" loaf or 12\" tea loaf\n\n### Ingredients\n* 3/4 cup (170g) sourdough starter, fed (ripe) or unfed (discard)\n* 1/2 cup (99g) granulated sugar\n* 1/4 cup (85g) honey\n* 6 tablespoons (75g) vegetable oil\n* 2 large eggs\n* 1/4 teaspoon nutmeg\n* 1 1/2 teaspoons lemon zest (grated rind)\n* 1 1/2 teaspoons vanilla extract\n* 1 cup (113g) King Arthur White Whole Wheat Flour\n* 3/4 cup (90g) King Arthur Unbleached All-Purpose Flour\n* 1/2 teaspoon baking soda\n* 1 teaspoon baking powder\n* 1 teaspoon salt\n* 2 cups (242g to 300g) grated zucchini, somewhere between firmly and lightly packed\n* 3/4 cup (85g) chopped walnuts, lightly toasted\n* 3/4 cup (128g) raisins, currants, or dried cranberries\n\n### Instructions\n1. Preheat the oven to 350°F. Lightly grease a 9\" x 5\" quick bread pan or 12\" x 4\" tea loaf pan.\n2. In a large bowl, stir together the starter, sugar, honey, oil, eggs, nutmeg, lemon zest, and vanilla until thoroughly combined.\n3. In a separate medium bowl, whisk together the flours, baking soda, baking powder, and salt; stir into the wet ingredients.\n4. Stir in the grated zucchini, then the nuts and fruit. Transfer the batter to the prepared pan, smoothing the top.\n5. Bake the bread in the 9\" x 5\" pan for 45 minutes. Tent with foil and bake for an additional 20 minutes, until a thin paring knife inserted in the center comes out clean. For bread in a tea loaf pan, bake for 40 minutes before tenting, then bake for another 20 minutes, or until the loaf tests done.\n6. Remove the bread from the oven and cool in the pan on a rack.\n7. Store bread, well wrapped, at room temperature for up to three days; freeze for longer storage.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "xoerps6wgrszoo7gsxf4uy7prq", "title": "Spanish Rice (Marina Version)", "ainfo": "Spanish Rice (Marina Version)", "category": "sides", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 ½ cups of rice", "notes": "# Spanish Rice (Marina Version)\n\n### Ingredients\n* **1 ½ cups** of rice\n* **3 cups** water\n* **½ can** tomato sauce\n* Onion\n* Garlic powder\n* Salt\n\n### Instructions\n1. Brown rice in oil and add onion.\n2. After rice is a little brown, add tomato sauce & water.\n3. Add garlic powder & salt.\n4. Let boil for a minute.\n5. Then put lid on top.\n6. Turn down to lowest setting; should be done in 20 minutes.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "nf5kwevd6q5amkf2qx3w7ffnra", "title": "Sugar Cookies", "ainfo": "Sugar Cookies", "category": "desserts", "tags": ["Gruenberg Recipes"], "cookbook": true, "attribution": "Miranda", "preview": "Miranda's Recipe", "notes": "## Sugar Cookies\n*Miranda's Recipe*\n\n### Things You Need\n\n#### Cookies\n* 1 package Betty Crocker Sugar Cookie Mix\n* 7/8 tbsp of soft/melted butter\n* 1 tbsp cream cheese\n* 1 egg\n* 1/4 tsp almond extract\n* 3 tbsp flour\n\n#### Frosting\n* 2 cups powdered sugar\n* 1/4 tsp almond extract\n* 1/2 tsp vanilla extract\n* 2 tsp meringue powder\n* 1 tbsp corn syrup\n* 1 tsp glycerin\n* 1 tbsp milk\n* 1 tbsp butter (warmed with 1/4 cup water, add to thin to desired consistency)\n\n### Directions\n1. Mix the cookie ingredients together.\n2. Roll out the dough to 3/8 inch thickness.\n3. Bake at 350°F for 6–7 minutes.\n4. Prepare frosting by mixing the ingredients and adjust consistency with the warmed butter-water mixture. Frost cookies once cooled.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "4qedjlneyqvnwkxdhfukk5doca", "title": "Sweet and Spicy Suka Sawasawan", "ainfo": "Sweet and Spicy Suka Sawasawan", "category": "asian", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "2 cups cane vinegar", "notes": "# Sweet and Spicy Suka Sawasawan\n\n### Ingredients\n* **2 cups** cane vinegar\n* **1 large** red onion, chopped\n* **6 cloves** garlic, pounded\n* **1 tbsp** black pepper\n* **1 tbsp** white pepper\n* **10** Thai chilies, cut in half\n* **3 tbsp** brown sugar\n* **½ tsp** Himalayan salt\n\n### Instructions\n1. Mix all ingredients in a bowl.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "bwuwelfj7fgn2sk5hbf43uln6m", "title": "Sweet Pepper Pickle/Relish Base", "ainfo": "Sweet Pepper Pickle/Relish Base", "category": "rubs", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "4 Garlic cloves", "notes": "# Sweet Pepper Pickle/Relish Base\n\n### Ingredients\n* **4** Garlic cloves\n* **2 cups** Sweet peppers\n* **2 tsp** Salt\n* **2 tbsp** Sugar\n* **¼ cup** Rice vinegar\n* **¾ cup** Water", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "d5ab337agdxoywhrfagnye627m", "title": "Tamale Masa (The Spruce Eats)", "ainfo": "Tamale Masa (The Spruce Eats)", "category": "tacos", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "6 cups masa harina", "notes": "# Tamale Masa (The Spruce Eats)\n\n### Ingredients\n* **6 cups** masa harina\n* **5 cups** warm water (or low-sodium chicken broth)\n* **2 cups** pork lard\n* **2 teaspoons** salt\n* **3 tablespoons** onion powder (optional)\n* **3 tablespoons** chili powder (optional)\n* **2 tablespoons** ground cumin (optional)", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "tp4o5irlu6jxsl25hvle5zgjsu", "title": "Thai Curry", "ainfo": "Thai Curry", "category": "asian", "tags": ["Gruenberg Recipes"], "cookbook": true, "attribution": "Thu", "preview": "Thu's Recipe", "notes": "## Thai Curry\n*Thu's Recipe*\n\n### Things You Need\n* Chicken stock base\n* Sweet onions\n* Carrots\n* Medium golden curry\n* Boiled chicken breast\n* Potatoes\n* Green onions / cilantro\n* Jasmine rice (for serving)", "updatedAt": "2026-08-16T01:00:28Z", "photos": ["thai-curry.jpg"], "photo": "thai-curry.jpg"}, {"uuid": "kg4klcehepu373f2pnobfltorm", "title": "Tomahawk + Compound Garlic Herb Butter", "ainfo": "Tomahawk + Compound Garlic Herb Butter", "category": "smoked", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Olive oil", "notes": "# Tomahawk\n\n### Ingredients\n\n#### Roasted Garlic\n* Olive oil\n\n#### Compound Garlic Herb Butter\n* 8 oz (2 sticks) unsalted butter, softened to room temperature\n* 1 whole head garlic, roasted and cloves squeezed out\n* 1 teaspoon fresh thyme, finely chopped\n* 1 teaspoon fresh rosemary, finely chopped\n* 1 teaspoon fresh parsley, finely chopped\n* 1 teaspoon red chili flakes\n* ½ teaspoon kosher salt\n* ¼ teaspoon black pepper\n\n#### Steak\n* Tomahawk steak\n* Salt, pepper, garlic and avocado oil\n* Chunks of butter\n\n### Instructions\n\n#### Roasted Garlic\n1. Preheat oven to 400°.\n2. Cut off the top ¼ and dowse in olive oil so it seeps through.\n3. Cover completely in foil.\n4. Place in oven for 40m.\n5. Let cool then squeeze out the garlic.\n\n#### Compound Garlic Herb Butter\n1. Roast the garlic then mix it all in a bowl. \n2. Wrap as a log and place in the fridge to harden.\n\n#### Tomahawk Cooking\n1. Pull from fridge.\n2. Apply salt, pepper, garlic and avocado oil.\n3. Let it sit to room temp for 45m.\n4. Target fire temp 300-350 (over coals/small flame).\n5. Pull when IT 115.\n6. Place unmelted chunks of butter and let rest for 15m.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "zmyatphbq6w6xwd7enqd2cgziq", "title": "Traditional Chicken Adobo (Reddit Version 2)", "ainfo": "Traditional Chicken Adobo (Reddit Version 2)", "category": "asian", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1 (3-pound) chicken, cut into serving pieces", "notes": "# Traditional Chicken Adobo (Reddit Version 2)\n\n### Ingredients\n* **1 (3-pound)** chicken, cut into serving pieces\n* **¾ cup** white vinegar\n* **½ cup** soy sauce\n* **1 or 2 heads** of garlic, crushed\n* **2** bay leaves\n* **½ tablespoon** peppercorns\n* **Salt** (optional)\n\n### Instructions\n1. **Simmer:** Place chicken, vinegar, soy sauce, garlic, bay leaves, and peppercorns in a pot; heat to a boil. Reduce heat; simmer 30 minutes.\n2. **Broil:** Heat broiler. Transfer chicken pieces from pot to a broiler pan; broil until browned on each side, turning once, 10 minutes. Remove to a platter.\n3. **Reduce Sauce:** Meanwhile, heat the sauce in the pot to a boil; boil until it is reduced by half, about 10 minutes. Add salt to taste if needed. Cover broiled chicken pieces with the sauce.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "e2uvfptp3u3mumkqauig7ke5iu", "title": "Turkey Chili", "ainfo": "Turkey Chili", "category": "soups", "tags": ["Gruenberg Recipes"], "cookbook": true, "attribution": "Miranda", "preview": "Miranda's Recipe", "notes": "## Turkey Chili\n*Miranda's Recipe*\n\n### Details\n* **Tip:** Best prepared the night before or slow-cooked all day for depth of flavor.\n\n### Things You Need\n* Olive oil (to fry ingredients)\n* 1 lb ground turkey\n* 1 chopped sweet onion\n* 1 chopped red onion\n* 2 cups chicken stock\n* 1 (28 oz) can crushed tomatoes\n* 1 (16 oz) can dark kidney beans (partially crushed)\n* 1 tbsp minced garlic\n* 2 tbsp chili powder (adjust up or down for desired spice level)\n* 1/2 tsp paprika\n* 1/2 tsp oregano\n* 1/2 tsp cayenne pepper (adjust up or down for spice)\n* 1/2 tsp ground cumin\n* 1/2 tsp salt\n* 1/2 tsp pepper\n\n#### Add-ons (Optional Vegetables/Spices)\n* Red bell pepper\n* Celery\n* Shredded carrots\n* Jalapenos / Habanero\n* Dash of cinnamon / nutmeg\n\n#### Toppings\n* Sour cream\n* Cheese\n* Chives\n\n### Directions\n1. Heat olive oil in a pan or pot and thoroughly brown the ground turkey and chopped onions.\n2. Mix the browned meat and onions with all other primary ingredients (chicken stock, crushed tomatoes, kidney beans, garlic, and spices) inside a slow cooker or large pot.\n3. Slow cook all day for best results. Top with sour cream, cheese, and chives upon serving.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "4kgrsgzlheqpxvdmwbgr2z4cyi", "title": "Various Vinaigrette Recipes", "ainfo": "Various Vinaigrette Recipes", "category": "salads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Add all the ingredients to the Measure, Mix & Pour, twist on the lid, and shake until combined.", "notes": "# 3 Simple Dressings\n\n### Instructions\n1. Add all the ingredients to the Measure, Mix & Pour, twist on the lid, and shake until combined.\n\n### Vinaigrette Ingredients\n* **½ cup + 2 tbsp (155 mL)** white wine vinegar\n* **¾ cup + 2 tbsp (205 mL)** olive oil\n* **1 tbsp (15 mL)** honey\n* **1 tbsp (15 mL)** Dijon mustard\n* **½ tsp (2 mL)** salt\n* **¼ tsp (1 mL)** black pepper\n\n### Asian Vinaigrette Ingredients\n* **¼ cup + 2 tbsp (90 mL)** rice vinegar\n* **¾ cup (175 mL)** vegetable oil\n* **2 tbsp (30 mL)** sesame oil\n* **¼ cup (60 mL)** low-sodium soy sauce\n* **1 tbsp (15 mL)** honey\n* **1 tsp (5 mL)** sesame seeds\n* **½ tsp (2 mL)** ground ginger\n* **¼ tsp (1 mL)** black pepper\n* **1** garlic clove, pressed\n\n### Balsamic Vinaigrette Ingredients\n* **½ cup + 2 tbsp (155 mL)** balsamic vinegar\n* **¾ cup + 2 tbsp (205 mL)** olive oil\n* **1 tbsp (15 mL)** honey\n* **1 tbsp (15 mL)** Dijon mustard\n* **½ tsp (2 mL)** salt\n* **¼ tsp (1 mL)** black pepper\n* **1** garlic clove, pressed", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "fg3avjeheuxkeaxwvjrn7nwy5m", "title": "Vietnamese Egg Rolls", "ainfo": "Vietnamese Egg Rolls", "category": "asian", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "1.7 lb ground turkey", "notes": "# Vietnamese Egg Rolls\n\n### Ingredients\n* **1.7 lb** ground turkey\n* **1** yellow onion, diced\n* **1/2** sweet onion\n* **4 cloves** of garlic\n* **2-3** carrots, grated\n* **1 tablespoon** chicken bouillon (Better Than Bouillon recommended)\n* **3 bundles** of mung bean noodles\n* **1** egg (yolk in mix, white reserved for sealing)\n* **1 tbs** vegetarian seasoning\n* Salt, pepper, white pepper\n* **1 tsp** garlic salt\n* **1 tsp** onion powder\n* Cilantro/green onion, chopped\n* TYJ spring roll pastry wrap\n* **3.5 L** vegetable oil (for frying)\n\n### Instructions\n1. Let the mung bean noodles soften in hot tap water for 10 minutes, then rinse and cut.\n2. Combine the ground turkey, diced onions, garlic, grated carrots, chicken bouillon, prepared noodles, egg yolk, vegetarian seasoning, garlic salt, onion powder, chopped cilantro, green onion, and a pinch of salt, pepper, and white pepper together thoroughly.\n3. Wrap the mixture tightly using the TYJ spring roll pastry wraps, brushing the edges with the reserved egg white to seal them closed.\n4. Heat the vegetable oil to 350°F.\n5. Fry the egg rolls in the hot oil for 14-16 minutes until crispy and golden brown.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "cfoc554puvnomsaaz64sytpscy", "title": "Vinaigrette Dressing", "ainfo": "Vinaigrette Dressing", "category": "salads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "½ cup extra virgin olive oil", "notes": "# Vinaigrette Dressing\n\n### Ingredients\n* **½ cup** extra virgin olive oil\n* **½ cup** red wine vinegar\n* **4 teaspoons** granulated sugar\n* **4 teaspoons** dijon mustard\n* **6 cloves** garlic, minced\n* **1 teaspoon** salt (more or less to taste)", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "z5r2j4oobpfhro5r7r4km25ali", "title": "Watermelon, Cherry & Feta Salad", "ainfo": "Watermelon, Cherry & Feta Salad", "category": "salads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "Makes 4 Servings", "notes": "# Watermelon, Cherry & Feta Salad\n\n**Makes 4 Servings**\n\n### Ingredients\n* ¼ of a large watermelon, rind removed\n* 1 cup ripe cherries, halved and pitted\n* ¼ cup crumbled feta\n* A couple fresh basil leaves, torn into pieces (or just super small leaves like here)\n* Juice of 1 lemon\n* Olive oil\n\n### Directions\nCut the melon into bite-sized chunks. Top or mix with the cherries, feta, and basil leaves. Drizzle with the lemon juice and olive oil.", "updatedAt": "2026-08-16T01:00:27Z"}, {"uuid": "5iqaxay3y57zzik3s3abnw42oy", "title": "Yeast Bread/Dough Base (The Kitchen Whisperer)", "ainfo": "Yeast Bread/Dough Base (The Kitchen Whisperer)", "category": "breads", "tags": ["Gruenberg Recipes"], "cookbook": false, "attribution": "", "preview": "3 ½ – 4 cups (448–512 grams) bread flour", "notes": "# Yeast Bread/Dough Base (The Kitchen Whisperer)\n\n### Ingredients\n* **3 ½ – 4 cups** (448–512 grams) bread flour\n* **1 ¼ cups plus 2 Tbl – 1 ½ cups** (308–355 grams) warm water (110–115°F)\n* **2 Tbl** sugar\n* **1 packet** instant yeast (2 ¼ tsp)\n* **1 tsp** kosher salt\n* **4 Tbl** cold butter, cubed\n\n### Instructions\n1. **Proofing (If using Active Dry Yeast instead of Instant):** Add the active dry yeast, sugar, and ¼ cup plus 2 Tbl warm water in the bowl of a stand mixer.\n2. **Rest:** Using a whisk or spoon, mix and set aside for 5–10 minutes or until the yeast has bubbled quite a bit.\n3. **Mix:** In the bowl of a stand mixer fitted with the dough hook, add in 2 cups of flour and the remaining cup of water.", "updatedAt": "2026-08-16T01:00:28Z"}, {"uuid": "l2amnhta53oyeh5k6ls2xxdvfe", "title": "100% Biga Pizza Dough", "ainfo": "100% Biga Pizza Dough", "category": "breads", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Dissolve the yeast in the jug of water.", "notes": "# 100% Biga Pizza Dough\n\nSource: https://ooni.com/blogs/recipes/100-biga\n\nOoni USA. Makes about seven 250-gram dough balls (12-inch pizzas). Baked in an Ooni pizza oven at 950°F (500°C).\n\n## Ingredients\n### For the Biga\n- 2 1/4 cups (540 g) lukewarm water\n- 1 1/4 teaspoon (4 g) fresh yeast, or 1/2 teaspoon (2 g) active dried yeast, or 1/4 teaspoon (1.3 g) instant dried yeast\n- 35.3 ounces (1000 g) bread flour or \"00\" pizza flour\n\n### For the Dough\n- 1 1/2 tablespoons (22 g) sea salt\n- 1/2 cup (100 g) water, room temperature\n- 1 1/2 tablespoons (22 g) diastatic malt powder — optional, promotes a strong rise, nice texture, and brown crust (if omitted, add 22 g more flour to keep hydration the same)\n- 1/3 cup (80 g) iced water\n- Flour or semolina, for dusting\n\n## Instructions\n1. Dissolve the yeast in the jug of water.\n2. Place the flour in the bowl of a stand or spiral mixer and pour the water/yeast mixture on top. Use a metal spoon to roughly mix, then use your hands to firmly squeeze, pull, and tear until all the flour is combined.\n3. Transfer the mix to an airtight container, scraping down the sides with your hands. The dough should feel dryish and scraggy.\n4. Cover and let rest 16 hours at room temperature to ferment. After 16 hours, the biga should be soft and stretchy with a complex gluten structure. Don't over-ferment it.\n5. Dissolve the salt into the room-temperature water and set aside. Place the spiral dough hook on your mixer, transfer the biga to the mixer bowl, and mix on low.\n6. Slowly drip in the salted water, stopping each time the bottom of the mixer looks wet. Takes 5-10 minutes as the flour absorbs the water.\n7. If using diastatic malt, keep the mixer on and slowly sprinkle it in — it feeds the yeast, lightening the dough and adding malty flavor.\n8. Slowly pour in the iced water: for 65% hydration use 2 teaspoons (10 g); for 72% hydration use the full 1/3 cup (80 g). Stop when the dough turns silky and stretchy, then mix 5 more minutes.\n9. Wet your hands, pull and gather the dough from the bowl, place it in an airtight container, and let rest 2 hours at room temperature, then move to the refrigerator for another 2 hours.\n10. Transfer the dough to a floured surface (it should be easier to work with now) and divide into roughly seven 250-gram portions with a bench scraper.\n11. Fold and shape each portion into a ball, pinching the edges into the center, then flip and pull the dough inward to smooth the bottom.\n12. Let the dough balls proof 4 hours at room temperature, or overnight in the refrigerator.\n13. Fire up your oven and aim for 950°F (500°C) on the stone baking board (check with an infrared thermometer).\n14. Generously dust your work surface with flour or semolina, place a dough ball on top, and stretch into a 12-inch base. Add toppings, then drag onto your peel with both hands and launch into the oven.\n15. Cook 60 to 90 seconds, rotating every 20 seconds for an even bake. Remove, slice, and serve.", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "7no237j76lsujnyyenh2vf7vya", "title": "A Simple Sourdough Focaccia", "ainfo": "A Simple Sourdough Focaccia", "category": "sourdough", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "This dough can be mixed by hand or with a stand mixer. In the bowl of a stand mixer fitted with the dough hook, add both flours, water, salt, and ripe sourdough starter (hold back the olive oil for now). Mix on speed 1 for 1-2 minutes until incorporated, then speed 2 for 5 minutes until the dough strengthens and clumps around the hook. Let the dough rest in the bowl for 10 minutes.", "notes": "# A Simple Sourdough Focaccia\n\nSource: https://www.theperfectloaf.com/a-simple-focaccia/\n\nBy Maurizio Leo, The Perfect Loaf. Prep: 6 hours | Cook: 30 minutes | Total: 6 hours 30 minutes. Yield: 1 focaccia. Cuisine: Italian.\n\n## Ingredients\n- 423g all-purpose flour\n- 181g high-protein bread flour\n- 12g extra virgin olive oil\n- 459g water\n- 11g salt\n- 115g ripe sourdough starter\n\n## Instructions\nMix (9:00 a.m.):\n1. This dough can be mixed by hand or with a stand mixer. In the bowl of a stand mixer fitted with the dough hook, add both flours, water, salt, and ripe sourdough starter (hold back the olive oil for now). Mix on speed 1 for 1-2 minutes until incorporated, then speed 2 for 5 minutes until the dough strengthens and clumps around the hook. Let the dough rest in the bowl for 10 minutes.\n2. Turn the mixer to speed 1 and slowly drizzle in the olive oil while mixing. Once absorbed, mix on speed 2 for 1-2 minutes until the dough comes back together. Transfer to a bulk fermentation container and cover.\n\nBulk fermentation (9:15 a.m. to 11:15 a.m.):\n3. Give the dough 4 sets of stretch and folds at 30-minute intervals, the first starting 30 minutes into bulk fermentation.\n\nProof (11:15 a.m. to 3:15 p.m.):\n4. Liberally oil a 9x13\" rectangular pan (or two 10\" circular pans). Scrape the dough directly into the pan (or divide in two for circular pans).\n5. Proof in the pan for 4 hours. Every 30 minutes for the first hour, uncover and gently stretch the dough with wet hands to the pan's edges (the dough spreads naturally, so don't force it). Once mostly spread, cover and let it proof for the remainder of the 4 hours.\n6. About 30 minutes before the end of the proof, preheat the oven to 450°F (230°C) with an empty rack in the bottom third.\n\nTop & Bake (3:15 p.m.):\n7. When the oven is preheated, dimple the top of the dough all over with wet fingers. Drizzle liberally with olive oil to cover the surface. Spread on chopped herbs and coarse sea salt.\n8. Bake until golden on top and bottom, about 30 minutes. Let cool in the pan, then transfer to a cooling rack. Best the day it's baked.\n\n## Notes\nOvernight proof option: mid-way through the 4-hour proof, refrigerate the covered pan overnight. The next day, bring the dough to room temperature, finish proofing until well-risen and bubbly, then continue with the Top & Bake step. Top with tomatoes, olives, rosemary, coarse sea salt, or whatever fresh ingredients you have.\n", "updatedAt": "2026-08-16T01:00:04Z"}, {"uuid": "wwubbwt572thbdjwymswlgkore", "title": "Air Fryer Baked Eggs", "ainfo": "Air Fryer Baked Eggs", "category": "breakfast", "tags": ["Moser Recipes"], "cookbook": false, "attribution": "", "preview": "Preheat air fryer to 350°F. Spray two ramekins with nonstick spray.", "notes": "# Air Fryer Baked Eggs\n\nSource: https://leaf.nutrisystem.com/recipes/air-fryer-baked-eggs/\n\nBy Nutrisystem. Servings: 2. Calories per serving: 81. Counts as 1 PowerFuel on Nutrisystem.\n\n## Ingredients\n- 2 large eggs\n- handful of spinach, chopped thinly\n- 1/4 onion, diced\n- 1/4 teaspoon rosemary\n- 1/4 tsp. thyme\n- 1/4 tsp. parsley\n- pepper, to taste\n\n## Instructions\n1. Preheat air fryer to 350°F. Spray two ramekins with nonstick spray.\n2. Combine herbs and seasoning in a small bowl.\n3. Crack an egg into each ramekin. Sprinkle spinach, onion, and the seasoning mix
